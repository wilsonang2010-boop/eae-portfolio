"7. Kinetic Particle Model of Matter": {
  diagram:{ type:"particles", caption:"Solid: fixed regular positions, vibrating. Liquid: close but disordered, sliding. Gas: far apart, fast and random." },
  practice:[
    { level:"Easy", q:"State and explain, using the kinetic particle model, why a gas can be compressed easily but a solid cannot.",
      steps:["In a gas the particles are very far apart with large spaces between them.","Applying pressure pushes the particles closer, so the volume falls — the gas is easily compressed.","In a solid the particles are already touching in a regular packed arrangement, with almost no space between them."],
      ans:"A gas compresses easily because its particles are far apart with space to close up; a solid cannot, because its particles are already closely packed with negligible spaces." },
    { level:"Medium", q:"Explain, in terms of particles, why the pressure of a fixed mass of gas in a sealed container increases when it is heated.",
      steps:["Heating increases the average kinetic energy of the gas particles, so they move faster.","Faster particles collide with the container walls more frequently.","Each collision also exerts a greater force, because the particles have greater momentum.","Pressure is the total force per unit area on the walls, so both effects raise the pressure."],
      ans:"The particles move faster, hitting the walls more often and harder, so the total force per unit area — the pressure — increases." },
    { level:"O-Level standard", q:"A smoke cell is viewed under a microscope and bright specks are seen moving in a random, jerky way. (a) Name this effect. (b) Explain what causes the motion. (c) State and explain what is observed if the cell is warmed.",
      steps:["(a) This is Brownian motion.","(b) The bright specks are smoke particles, which are much larger than the surrounding air molecules.","Air molecules move rapidly and randomly, and bombard each smoke particle unevenly from all sides. At any instant the bombardment is unbalanced, so the smoke particle is pushed in a random direction — giving jerky motion.","(c) Warming increases the average kinetic energy of the air molecules, so they move faster and collide harder and more often."],
      ans:"(a) Brownian motion. (b) Uneven bombardment of large smoke particles by fast, randomly moving air molecules. (c) The specks move faster and more erratically, because the air molecules have greater kinetic energy." },
  ]},
"8. Thermal Processes": {
  diagram:{ type:"flow", alt:"Three methods of thermal energy transfer", w:360, h:190,
    boxes:[{x:14,y:24,w:104,h:52,text:"CONDUCTION|solids · vibration|+ free electrons",color:'#3B82F6'},
           {x:128,y:24,w:104,h:52,text:"CONVECTION|fluids · density|differences",color:'#34D399'},
           {x:242,y:24,w:104,h:52,text:"RADIATION|no medium needed|infrared waves",color:'#FB7185'}],
    arrows:[{x1:180,y1:88,x2:180,y2:120,label:'',dy:0}],
    caption:"Energy always flows from hotter to colder, until both reach the same temperature (thermal equilibrium)." },
  practice:[
    { level:"Easy", q:"State which method of thermal energy transfer does not require a medium, and explain why.",
      steps:["Conduction needs particles to vibrate and pass energy on; convection needs a fluid to flow.","Radiation transfers energy as electromagnetic (infrared) waves."],
      ans:"Radiation — it travels as electromagnetic waves, which can pass through a vacuum, so no particles are needed." },
    { level:"Medium", q:"Explain, in terms of particles, why metals are much better conductors of heat than non-metals.",
      steps:["In all solids, heating makes particles vibrate more vigorously, and they pass energy to neighbouring particles by collisions.","Metals additionally contain free (delocalised) electrons that are able to move throughout the structure.","These free electrons gain kinetic energy at the hot end, move rapidly through the metal, and transfer energy to particles at the cold end."],
      ans:"Metals conduct far better because, as well as lattice vibration, they have free electrons that carry energy quickly through the whole structure — non-metals have no free electrons." },
    { level:"O-Level standard", q:"A vacuum flask keeps a drink hot. Explain how each feature reduces energy transfer: (a) the vacuum between the double walls, (b) the silvered surfaces, (c) the insulating plastic stopper.",
      steps:["(a) A vacuum contains almost no particles.","Conduction needs particles to collide and pass energy on, and convection needs a fluid to circulate — neither can occur, so both are essentially eliminated.","(b) Shiny silver surfaces are poor emitters and poor absorbers of infrared radiation.","The inner silvered surface reflects radiation back into the drink, reducing radiation losses.","(c) Plastic is a poor conductor and the stopper seals the flask, preventing hot liquid and vapour escaping by convection."],
      ans:"(a) The vacuum stops conduction and convection, as both need particles. (b) Silvering reflects infrared back and emits poorly, cutting radiation losses. (c) The stopper conducts poorly and blocks convection currents carrying hot vapour away." },
  ]},
"9. Thermal Properties of Matter": {
  diagram:{ type:"axes", alt:"Heating curve", xlabel:"time", ylabel:"temperature / °C", xmax:10, ymax:10, grid:false,
    xticks:[], yticks:[{v:2,t:'0'},{v:7,t:'100'}],
    series:[{pts:[[0,0.6],[1.6,2],[4,2],[5.4,7],[7.6,7],[9.6,9.2]],color:'#FB7185'}],
    notes:[{x:2.8,y:1.1,text:'melting',color:'#93C5FD'},{x:5.9,y:6.1,text:'boiling',color:'#93C5FD'},{x:8.9,y:8.2,text:'gas',color:'#94A3B8'},{x:0.9,y:0.2,text:'solid',color:'#94A3B8'}],
    caption:"Flat sections are changes of state: energy goes into breaking forces between particles, not into raising the temperature." },
  practice:[
    { level:"Easy", q:"Calculate the thermal energy needed to raise the temperature of 2.0 kg of water by 30 °C. The specific heat capacity of water is 4200 J/(kg·K).",
      steps:["E = mcΔθ.","= 2.0 × 4200 × 30 = 252 000 J."],
      ans:"252 000 J (2.52 × 10⁵ J)." },
    { level:"Medium", q:"A 0.50 kg block of metal is heated by a 100 W heater for 2.0 minutes and its temperature rises by 48 °C. Assuming no energy is lost, calculate the specific heat capacity of the metal.",
      steps:["Energy supplied = power × time = 100 × (2.0 × 60) = 12 000 J.","Rearranging E = mcΔθ gives c = E ÷ (mΔθ).","c = 12 000 ÷ (0.50 × 48) = 12 000 ÷ 24 = 500 J/(kg·K)."],
      ans:"500 J/(kg·K)." },
    { level:"O-Level standard", q:"Ice at 0 °C is heated until it becomes water at 20 °C. Given specific latent heat of fusion of ice = 3.4 × 10⁵ J/kg and specific heat capacity of water = 4200 J/(kg·K), calculate the total energy needed for 0.30 kg of ice. Explain why the temperature stays at 0 °C during melting.",
      steps:["Stage 1 — melting the ice at 0 °C: E = ml = 0.30 × 3.4 × 10⁵ = 102 000 J.","Stage 2 — heating the water from 0 °C to 20 °C: E = mcΔθ = 0.30 × 4200 × 20 = 25 200 J.","Total = 102 000 + 25 200 = 127 200 J ≈ 1.27 × 10⁵ J.","During melting, the energy supplied is used to overcome and break the forces of attraction between the particles.","This increases the potential energy of the particles but not their average kinetic energy — and temperature depends only on average kinetic energy."],
      ans:"1.27 × 10⁵ J. The temperature stays constant because the energy increases the particles' potential energy by breaking bonds, not their average kinetic energy." },
  ]},
"10. General Properties of Waves": {
  diagram:{ type:"wave", caption:"A transverse wave: amplitude is measured from the rest position, wavelength from one point to the next in phase." },
  practice:[
    { level:"Easy", q:"A wave has a frequency of 50 Hz and a wavelength of 6.0 m. Calculate its speed.",
      steps:["v = fλ.","= 50 × 6.0 = 300 m/s."],
      ans:"300 m/s." },
    { level:"Medium", q:"A wave of speed 320 m/s has a period of 0.0040 s. Calculate (a) its frequency, (b) its wavelength.",
      steps:["(a) f = 1 ÷ T = 1 ÷ 0.0040 = 250 Hz.","(b) Rearranging v = fλ gives λ = v ÷ f.","λ = 320 ÷ 250 = 1.28 m."],
      ans:"(a) 250 Hz. (b) 1.28 m." },
    { level:"O-Level standard", q:"Water waves in a ripple tank pass from deep water into shallow water, where they slow down. (a) State what happens to the frequency. (b) Deduce what happens to the wavelength, with reasoning. (c) State the type of wave, and how it differs from a longitudinal wave.",
      steps:["(a) The frequency is set by the source (the vibrating dipper), so it does not change when the wave enters a new medium.","(b) From v = fλ, if v decreases while f stays constant, then λ must decrease.","(c) Water waves are transverse."],
      ans:"(a) Frequency stays the same. (b) Wavelength decreases, since v = fλ and v falls while f is constant. (c) Transverse — particles vibrate perpendicular to the direction of energy transfer, whereas in a longitudinal wave they vibrate parallel to it." },
  ]},
"11. Sound": {
  diagram:{ type:"wave", mode:"longitudinal", caption:"Sound travels as compressions (particles bunched, high pressure) and rarefactions (particles spread, low pressure)." },
  practice:[
    { level:"Easy", q:"Explain why sound cannot travel through a vacuum.",
      steps:["Sound is a longitudinal wave that travels by the vibration of particles passing energy to neighbouring particles.","A vacuum contains no particles."],
      ans:"There are no particles in a vacuum to vibrate and pass the energy on, so sound cannot be transmitted." },
    { level:"Medium", q:"A person shouts at a cliff and hears the echo 1.6 s later. Taking the speed of sound as 330 m/s, calculate the distance to the cliff.",
      steps:["The sound travels to the cliff and back, so the total path = speed × time = 330 × 1.6 = 528 m.","The distance to the cliff is half of this total path.","528 ÷ 2 = 264 m."],
      ans:"264 m." },
    { level:"O-Level standard", q:"A ship uses sonar to find the depth of the sea bed. An ultrasound pulse returns after 0.090 s, and the speed of sound in water is 1500 m/s. (a) Define ultrasound. (b) Calculate the depth. (c) Explain how the trace on an oscilloscope would change if the same note were played more loudly, and at a higher pitch.",
      steps:["(a) Ultrasound is sound with a frequency above the upper limit of human hearing, that is above 20 000 Hz.","(b) Total distance travelled = 1500 × 0.090 = 135 m.","This is down to the sea bed and back, so the depth = 135 ÷ 2 = 67.5 m.","(c) Loudness depends on amplitude, and pitch depends on frequency."],
      ans:"(a) Sound above 20 000 Hz. (b) 67.5 m. (c) Louder → larger amplitude (taller trace); higher pitch → higher frequency, so more waves in the same width (waves closer together)." },
  ]},
"12. Electromagnetic Spectrum": {
  diagram:{ type:"spectrum", caption:"Learn the order — it is asked for directly, and the uses and hazards follow the same sequence." },
  practice:[
    { level:"Easy", q:"List the seven regions of the electromagnetic spectrum in order of increasing frequency.",
      steps:["Frequency increases as wavelength decreases.","Start from the longest wavelength (radio) and work to the shortest (gamma)."],
      ans:"Radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays." },
    { level:"Medium", q:"State one use for each of: (a) infrared, (b) ultraviolet, (c) X-rays, (d) microwaves. For each, briefly say why that region is suited to the job.",
      steps:["Match the property of the radiation to the task required."],
      ans:"(a) Infrared — remote controllers and thermal imaging, since warm objects emit infrared. (b) Ultraviolet — authenticating banknotes and disinfecting water, since UV causes fluorescence and kills bacteria. (c) X-rays — medical radiology and security screening, since they pass through soft tissue but are absorbed by bone and metal. (d) Microwaves — mobile phone and satellite communication, since they pass through the atmosphere." },
    { level:"O-Level standard", q:"(a) State two properties common to all electromagnetic waves. (b) Explain why ultraviolet, X-rays and gamma rays are classed as more hazardous than radio waves. (c) A radio station broadcasts at 90 MHz. Calculate the wavelength, taking c = 3.0 × 10⁸ m/s.",
      steps:["(a) All electromagnetic waves are transverse, and all travel at 3.0 × 10⁸ m/s in a vacuum. (They also all transfer energy and can travel through a vacuum.)","(b) These three have the highest frequencies and therefore carry the most energy per wave.","They are ionising: they can knock electrons out of atoms in living cells, damaging or killing the cell and causing mutations that may lead to cancer. Radio waves have far too little energy to ionise.","(c) λ = c ÷ f = (3.0 × 10⁸) ÷ (90 × 10⁶) = 3.3 m."],
      ans:"(a) Transverse, and all travel at 3.0 × 10⁸ m/s in a vacuum. (b) They are ionising — high enough energy to remove electrons from atoms, damaging cells and causing mutation/cancer. (c) 3.3 m." },
  ]},
"13. Light": {
  diagram:{ type:"ray", mode:"refraction", caption:"Entering a denser medium the ray slows and bends towards the normal, so the angle of refraction is smaller than the angle of incidence." },
  practice:[
    { level:"Easy", q:"A ray of light strikes a plane mirror at an angle of incidence of 35°. State the angle of reflection, and name the line from which both angles are measured.",
      steps:["By the law of reflection, the angle of incidence equals the angle of reflection.","Both angles are measured from the normal — the line perpendicular to the mirror at the point of incidence."],
      ans:"35°, measured from the normal." },
    { level:"Medium", q:"Light passes from air into glass of refractive index 1.5, with an angle of incidence of 40°. Calculate the angle of refraction.",
      steps:["n = sin i ÷ sin r, so sin r = sin i ÷ n.","sin r = sin 40° ÷ 1.5 = 0.6428 ÷ 1.5 = 0.4285.","r = sin⁻¹(0.4285) = 25.4°."],
      ans:"25.4° (to 1 d.p.)." },
    { level:"O-Level standard", q:"A glass block has a refractive index of 1.5. (a) Calculate the critical angle. (b) State the two conditions required for total internal reflection. (c) Explain how optical fibres use this effect, and give one advantage over copper cable.",
      steps:["(a) At the critical angle c, the angle of refraction is 90°, so n = sin 90° ÷ sin c = 1 ÷ sin c.","sin c = 1 ÷ 1.5 = 0.6667, so c = sin⁻¹(0.6667) = 41.8°.","(b) Light must travel from a denser to a less dense medium, and the angle of incidence must be greater than the critical angle.","(c) Light entering the fibre strikes the boundary at an angle greater than the critical angle, so it totally internally reflects repeatedly and is guided along the fibre with very little loss."],
      ans:"(a) 41.8°. (b) Light going from denser to less dense medium, and angle of incidence greater than the critical angle. (c) Repeated total internal reflection guides the light along the fibre; advantages include far greater data capacity, lower signal loss and no electrical interference." },
  ]},
"14. Static Electricity": {
  diagram:{ type:"field", mode:"charges", caption:"Electric field lines run from positive to negative and show the direction of the force on a positive test charge." },
  practice:[
    { level:"Easy", q:"A polythene rod is rubbed with a cloth and becomes negatively charged. State which particle has moved and in which direction.",
      steps:["Protons are fixed in the nuclei of atoms and cannot move between objects.","Only electrons can be transferred by rubbing.","The rod became negative, so it gained electrons."],
      ans:"Electrons moved from the cloth to the rod. (The cloth is left positively charged.)" },
    { level:"Medium", q:"Explain why a charged balloon sticks to a neutral wall.",
      steps:["The charged balloon is brought close to the wall.","Its charge repels like charges in the wall's surface atoms and attracts unlike charges, so the near surface of the wall gains an induced opposite charge.","The opposite charges on the balloon and the wall's near surface attract each other.","This attraction is stronger than the repulsion from the like charges, because those have been pushed further away."],
      ans:"The balloon induces an opposite charge on the wall's surface, and the attraction between the balloon and this induced charge holds it in place." },
    { level:"O-Level standard", q:"(a) Explain why a fuel tanker is earthed by a metal chain or wire before fuel is transferred. (b) Describe how an electrostatic precipitator removes smoke particles from waste gases.",
      steps:["(a) Fuel flowing through pipes rubs against them, transferring electrons and causing charge to build up on the tanker.","If enough charge accumulates, the potential difference becomes large enough to cause a spark. A spark near flammable fuel vapour could ignite it and cause an explosion.","Earthing provides a conducting path for the excess charge to flow safely to the ground, so no dangerous build-up occurs.","(b) Waste gas passes a charged metal grid, which transfers charge to the smoke and dust particles so they all become charged.","The charged particles are then attracted to plates carrying the opposite charge, where they stick and collect, and can be removed periodically."],
      ans:"(a) To let charge built up by friction flow safely to earth, preventing a spark that could ignite fuel vapour. (b) Particles are charged by a grid, then attracted to and collected on oppositely charged plates." },
  ]},
"15. Current of Electricity": {
  diagram:{ type:"axes", alt:"I-V characteristic graphs", xlabel:"potential difference V", ylabel:"current I", xmax:10, ymax:10, grid:false,
    xticks:[{v:0,t:'0'}], yticks:[],
    series:[{pts:[[0,0],[9,9]],color:'#34D399'},{pts:[[0,0],[1.5,2.4],[3.5,4.2],[6,5.4],[9,6.2]],color:'#FCD34D'}],
    notes:[{x:8.4,y:9.6,text:'ohmic (metal)',color:'#34D399',anchor:'end'},{x:9.2,y:5.1,text:'filament lamp',color:'#FCD34D',anchor:'end'}],
    caption:"A metal at constant temperature gives a straight line through the origin. A filament lamp curves as it heats and its resistance rises." },
  practice:[
    { level:"Easy", q:"A current of 0.25 A flows for 40 s. Calculate the charge that passes.",
      steps:["Q = It.","= 0.25 × 40 = 10 C."],
      ans:"10 C." },
    { level:"Medium", q:"A 12 V supply drives a current of 0.40 A through a resistor. Calculate (a) its resistance, (b) the power dissipated.",
      steps:["(a) R = V ÷ I = 12 ÷ 0.40 = 30 Ω.","(b) P = VI = 12 × 0.40 = 4.8 W."],
      ans:"(a) 30 Ω. (b) 4.8 W." },
    { level:"O-Level standard", q:"(a) Sketch and describe the I–V graph for a filament lamp. (b) Explain its shape in terms of particles. (c) A wire is replaced by one of the same material but twice the length and half the cross-sectional area. State the effect on its resistance.",
      steps:["(a) The graph is a curve through the origin that becomes progressively shallower as V increases — the current rises less and less steeply.","(b) A shallower gradient means the resistance is increasing.","As current increases the filament gets hotter, so the metal lattice ions vibrate more vigorously and obstruct the flow of electrons more, raising the resistance.","(c) Resistance is proportional to length: doubling the length doubles R.","Resistance is inversely proportional to cross-sectional area: halving the area doubles R again."],
      ans:"(a) A curve through the origin, flattening as V rises. (b) The filament heats up, lattice ions vibrate more and impede electron flow, so resistance increases. (c) Resistance becomes 2 × 2 = 4 times greater." },
  ]},
"16. D.C. Circuits": {
  diagram:{ type:"circuit", mode:"parallel", caption:"In parallel: the p.d. across each branch is the same, and the branch currents add up to the supply current." },
  practice:[
    { level:"Easy", q:"Two resistors of 4.0 Ω and 6.0 Ω are connected in series. Calculate the effective resistance.",
      steps:["In series, resistances simply add.","R = 4.0 + 6.0 = 10 Ω."],
      ans:"10 Ω." },
    { level:"Medium", q:"The same 4.0 Ω and 6.0 Ω resistors are now connected in parallel. Calculate the effective resistance.",
      steps:["In parallel: 1/R = 1/R₁ + 1/R₂.","1/R = 1/4.0 + 1/6.0 = 0.25 + 0.1667 = 0.4167.","R = 1 ÷ 0.4167 = 2.4 Ω.","Note the answer is smaller than the smallest individual resistor — always check this."],
      ans:"2.4 Ω." },
    { level:"O-Level standard", q:"A 12 V supply is connected to a 3000 Ω fixed resistor in series with a light-dependent resistor (LDR), forming a potential divider. The output is taken across the fixed resistor. (a) In darkness the LDR has a resistance of 9000 Ω — calculate the output p.d. (b) State and explain what happens to the output as light intensity increases.",
      steps:["(a) Total resistance = 3000 + 9000 = 12 000 Ω.","Current = V ÷ R = 12 ÷ 12 000 = 0.0010 A.","Output p.d. across the fixed resistor = IR = 0.0010 × 3000 = 3.0 V.","(b) As light intensity increases, the resistance of the LDR decreases.","The LDR then takes a smaller share of the total p.d., so a larger share appears across the fixed resistor."],
      ans:"(a) 3.0 V. (b) The output p.d. increases, because the LDR's resistance falls so it takes a smaller share of the supply voltage — this is how an automatic light-sensing circuit is triggered." },
  ]},
"17. Practical Electricity": {
  diagram:{ type:"plug", caption:"Brown = live, blue = neutral, green/yellow = earth. The fuse always sits in the live wire." },
  practice:[
    { level:"Easy", q:"An appliance is rated 240 V, 1500 W. Calculate the current it draws, and state which fuse you would fit: 3 A, 5 A or 13 A.",
      steps:["P = VI, so I = P ÷ V.","I = 1500 ÷ 240 = 6.25 A.","Choose the smallest standard fuse that is above the normal operating current."],
      ans:"6.25 A, so fit a 13 A fuse (a 5 A fuse would blow in normal use)." },
    { level:"Medium", q:"A 2.0 kW heater runs for 3.0 hours. Electricity costs 25 cents per kW h. Calculate the cost.",
      steps:["Energy in kW h = power in kW × time in hours.","= 2.0 × 3.0 = 6.0 kW h.","Cost = 6.0 × 25 = 150 cents."],
      ans:"150 cents ($1.50)." },
    { level:"O-Level standard", q:"(a) Explain the purpose of the earth wire in an appliance with a metal casing. (b) Explain why the fuse and switch must be placed in the live wire. (c) State why a double-insulated appliance needs no earth wire.",
      steps:["(a) If a fault lets the live wire touch the metal casing, the casing becomes live and would give a fatal shock to anyone touching it.","The earth wire provides a low-resistance path from the casing to the ground, so a very large current flows, which blows the fuse and disconnects the appliance, making the casing safe.","(b) The live wire carries the high voltage from the supply. If the fuse or switch were in the neutral wire, then when they operated the appliance would be disconnected from earth but still connected to the live supply.","The appliance would remain at a dangerous high potential even when switched off or after the fuse blew.","(c) A double-insulated appliance has a non-conducting plastic casing, so no exposed metal part can ever become live."],
      ans:"(a) It gives fault current a safe low-resistance path to ground, blowing the fuse and making the casing safe. (b) So operating them isolates the appliance from the high voltage — otherwise it would stay live and dangerous. (c) Its casing is non-conducting plastic, so it cannot become live." },
  ]},
"18. Magnetism": {
  diagram:{ type:"field", mode:"magnet", caption:"Field lines leave the north pole and enter the south pole, never cross, and are closest together where the field is strongest." },
  practice:[
    { level:"Easy", q:"State the only reliable test to show that a bar of metal is a magnet rather than just a magnetic material.",
      steps:["A magnetic material such as iron is always attracted to a magnet, whichever pole is used.","Only a magnet can be repelled."],
      ans:"Repulsion — bring a known magnet's pole near it; if it is repelled, it must be a magnet." },
    { level:"Medium", q:"Explain the difference between a soft and a hard magnetic material, and state a use for each.",
      steps:["Soft magnetic materials, such as iron, magnetise easily but also lose their magnetism easily.","Hard magnetic materials, such as steel, are harder to magnetise but retain their magnetism."],
      ans:"Soft (iron) — temporary magnetism, used for electromagnet cores so the magnetism can be switched off. Hard (steel) — permanent magnets, used for compass needles and fridge magnets." },
    { level:"O-Level standard", q:"An unmagnetised iron nail is brought close to the north pole of a strong magnet and is attracted. (a) Name the effect responsible. (b) State which pole is induced at the near end of the nail, and explain why this causes attraction. (c) State what happens when the magnet is removed, and how the answer would differ for a steel nail.",
      steps:["(a) This is induced magnetism.","(b) The magnet's north pole induces a south pole at the near end of the nail (and a north pole at the far end).","Unlike poles attract, so the induced south pole is attracted to the magnet's north pole — and this attraction is stronger than the repulsion from the more distant induced north pole.","(c) Iron is a soft magnetic material, so it loses its induced magnetism almost immediately once the magnet is removed."],
      ans:"(a) Induced magnetism. (b) A south pole, which is attracted to the magnet's north pole since unlike poles attract. (c) The iron nail loses its magnetism at once; a steel nail is hard magnetic and would keep much of its magnetism, becoming a permanent magnet." },
  ]},
"19. Electromagnetism": {
  diagram:{ type:"fleming", caption:"A current-carrying conductor at right angles to a magnetic field experiences a force. Use the left hand to find its direction." },
  practice:[
    { level:"Easy", q:"State the three quantities represented by the thumb, first finger and second finger in Fleming's left-hand rule.",
      steps:["Use the mnemonic built into the words: First = Field, seCond = Current, thuMb = Motion."],
      ans:"First finger = magnetic Field, second finger = Current, thumb = Motion (the force)." },
    { level:"Medium", q:"State three ways to increase the strength of an electromagnet.",
      steps:["The magnetic field of a solenoid depends on the current, the number of turns, and the core material."],
      ans:"Increase the current; increase the number of turns on the coil; use a soft-iron core (or wind the turns more closely)." },
    { level:"O-Level standard", q:"A simple d.c. motor consists of a coil in a magnetic field connected to a supply through a split-ring commutator. (a) Explain why the coil experiences a turning effect. (b) Explain the purpose of the split-ring commutator. (c) State two ways to make the coil turn faster.",
      steps:["(a) Current flows in opposite directions along the two sides of the coil.","Since the two sides carry current in opposite directions in the same magnetic field, the forces on them act in opposite directions — one side is pushed up and the other down.","This pair of opposite forces produces a turning effect (a moment) about the axis, so the coil rotates.","(b) Without it, the coil would stop after half a turn as the forces would then oppose the rotation.","The split-ring commutator reverses the direction of the current in the coil every half turn, so the force on each side always acts to keep the coil turning the same way.","(c) Increase the current, or increase the number of turns on the coil (a stronger magnet or a soft-iron core also works)."],
      ans:"(a) The two sides carry current in opposite directions, so the forces on them are opposite, creating a turning moment. (b) It reverses the current every half turn so rotation continues in one direction instead of stopping. (c) Increase the current; increase the number of turns (or use a stronger magnet)." },
  ]},
"20. Electromagnetic Induction": {
  diagram:{ type:"transformer", caption:"An alternating current in the primary creates a changing field in the core, inducing an alternating e.m.f. in the secondary." },
  practice:[
    { level:"Easy", q:"State three ways to increase the size of the e.m.f. induced when a magnet is moved into a coil.",
      steps:["The induced e.m.f. depends on how fast the field linking the coil changes."],
      ans:"Move the magnet faster; use more turns on the coil; use a stronger magnet." },
    { level:"Medium", q:"A transformer has 200 turns on the primary and 1200 turns on the secondary. The primary is connected to a 240 V a.c. supply. (a) Calculate the secondary voltage. (b) State whether it is a step-up or step-down transformer.",
      steps:["(a) Vₚ/Vₛ = Nₚ/Nₛ, so Vₛ = Vₚ × (Nₛ ÷ Nₚ).","Vₛ = 240 × (1200 ÷ 200) = 240 × 6 = 1440 V.","(b) The secondary voltage is higher than the primary."],
      ans:"(a) 1440 V. (b) Step-up." },
    { level:"O-Level standard", q:"(a) Explain why a transformer will not work with a direct current supply. (b) Explain why electrical power is transmitted across the country at very high voltage. (c) An ideal transformer has an input of 240 V, 5.0 A and an output of 12 V. Calculate the output current.",
      steps:["(a) A transformer works by electromagnetic induction, which needs the magnetic field linking the secondary coil to be continuously changing.","A steady direct current produces a constant magnetic field, so there is no change in flux linkage and therefore no induced e.m.f. in the secondary (except momentarily at switch-on and switch-off).","(b) Power transmitted = VI, so for a given power a higher voltage means a smaller current.","Energy wasted heating the cables is given by I²R, so reducing the current greatly reduces the energy lost — the loss depends on the square of the current.","(c) For an ideal transformer, input power = output power: VₚIₚ = VₛIₛ.","240 × 5.0 = 12 × Iₛ, so 1200 = 12Iₛ and Iₛ = 100 A."],
      ans:"(a) A steady d.c. gives a constant magnetic field, so there is no changing flux linkage and no induced e.m.f. (b) High voltage means low current, and power loss in cables is I²R, so losses fall sharply. (c) 100 A." },
  ]},
"21. Radioactivity": {
  diagram:{ type:"penetration", caption:"Penetrating power: α stopped by paper, β by a few mm of aluminium, γ only reduced by thick lead." },
  practice:[
    { level:"Easy", q:"A radioactive source has a half-life of 6 hours and an initial count rate of 800 counts per minute. What is the count rate after 18 hours?",
      steps:["18 hours ÷ 6 hours = 3 half-lives.","After each half-life the count rate halves: 800 → 400 → 200 → 100."],
      ans:"100 counts per minute." },
    { level:"Medium", q:"A nucleus of radium-226 (proton number 88) emits an alpha particle. State the nucleon number and proton number of the nucleus formed, and explain your reasoning.",
      steps:["An alpha particle is a helium nucleus containing 2 protons and 2 neutrons, so it has nucleon number 4 and proton number 2.","Nucleon number of the new nucleus = 226 − 4 = 222.","Proton number of the new nucleus = 88 − 2 = 86."],
      ans:"Nucleon number 222, proton number 86." },
    { level:"O-Level standard", q:"A detector reads 520 counts/min next to a source. With no source present it reads 20 counts/min. (a) Explain the 20 counts/min and name two sources of it. (b) Calculate the corrected count rate. (c) The corrected rate falls to 125 counts/min after 24 days — calculate the half-life. (d) Suggest, with a reason, which type of radiation is best for a medical tracer injected into a patient.",
      steps:["(a) This is background radiation — the low-level ionising radiation always present in the environment. Natural sources include rocks (radon gas), cosmic rays and food; artificial sources include medical X-rays.","(b) Corrected count rate = 520 − 20 = 500 counts/min.","(c) 500 → 250 → 125 is 2 half-lives, and this took 24 days.","Half-life = 24 ÷ 2 = 12 days.","(d) Alpha is too strongly ionising and would be absorbed inside the body, damaging tissue; it also could not escape to be detected."],
      ans:"(a) Background radiation, from e.g. rocks/radon and cosmic rays. (b) 500 counts/min. (c) 12 days. (d) Gamma — it is weakly ionising so does least tissue damage, yet penetrating enough to escape the body and be detected outside." },
  ]},

chemistry: {
"1. Experimental Chemistry": {
  diagram:{ type:"apparatus", mode:"distillation", caption:"Simple distillation: the solvent evaporates, condenses in the cooled condenser, and is collected as pure distillate." },
  practice:[
    { level:"Easy", q:"Name the method you would use to separate (a) sand from water, (b) pure water from sea water, (c) different coloured dyes in an ink.",
      steps:["Sand is insoluble in water, so it can be trapped by filter paper.","Pure water is the solvent, so evaporate and condense it.","Dyes have different solubilities, so they travel different distances up paper."],
      ans:"(a) Filtration. (b) Simple distillation. (c) Paper chromatography." },
    { level:"Medium", q:"In a chromatogram, the solvent front travels 8.0 cm and a spot travels 3.0 cm. (a) Calculate the Rf value. (b) State why Rf values are useful. (c) Explain why the starting line must be drawn in pencil.",
      steps:["(a) Rf = distance moved by spot ÷ distance moved by solvent front = 3.0 ÷ 8.0 = 0.375.","(b) Rf is constant for a given substance in a given solvent.","(c) Pencil is made of graphite, which is insoluble in the solvent."],
      ans:"(a) 0.375. (b) It is constant for a given substance in a given solvent, so it can be used to identify unknown components. (c) Pencil does not dissolve and travel up the paper, whereas ink would separate and ruin the result." },
    { level:"O-Level standard", q:"A student has a mixture of solid ammonium chloride, sand and sodium chloride. Describe how to obtain a pure, dry sample of each component, explaining the property used at each stage.",
      steps:["Step 1 — Heat the mixture gently. Ammonium chloride sublimes: it turns directly from solid to vapour, which can be cooled on a cold surface to re-form pure solid ammonium chloride. Sand and sodium chloride do not sublime.","Step 2 — Add water to the remaining solid and stir. Sodium chloride is soluble and dissolves; sand is insoluble and does not.","Step 3 — Filter the mixture. The sand is trapped as residue in the filter paper; wash it with distilled water and dry it in an oven.","Step 4 — The filtrate is sodium chloride solution. Heat it to evaporate some water until saturated, then leave it to cool so crystals form (crystallisation).","Step 5 — Filter off the crystals and dry them between filter paper."],
      ans:"Sublimation removes the ammonium chloride; filtration separates the insoluble sand from the dissolved sodium chloride; crystallisation of the filtrate recovers the sodium chloride." },
  ]},
"2. The Particulate Nature of Matter": {
  diagram:{ type:"atom", shells:[2,8,1], sym:"Na", caption:"Sodium: 11 protons, electronic configuration 2, 8, 1 — the single outer electron is why it is a very reactive Group 1 metal." },
  practice:[
    { level:"Easy", q:"An atom has a proton number of 17 and a nucleon number of 35. State the number of protons, neutrons and electrons, and write its electronic configuration.",
      steps:["Protons = proton number = 17. In a neutral atom, electrons = protons = 17.","Neutrons = nucleon number − proton number = 35 − 17 = 18.","Fill the shells 2, then 8, then 8: 2 + 8 + 7 = 17."],
      ans:"17 protons, 18 neutrons, 17 electrons; configuration 2, 8, 7 (chlorine)." },
    { level:"Medium", q:"Chlorine has two isotopes, ³⁵Cl and ³⁷Cl. (a) Define isotopes. (b) Explain why they have identical chemical properties. (c) State one physical property that differs.",
      steps:["(a) Isotopes are atoms of the same element with the same proton number but different numbers of neutrons, and so different nucleon numbers.","(b) Chemical properties are determined by the number and arrangement of electrons.","Both isotopes have 17 protons and therefore 17 electrons, with the same configuration 2,8,7 — so they react identically.","(c) They have different masses, since they contain different numbers of neutrons."],
      ans:"(a) Same proton number, different numbers of neutrons. (b) They have identical electronic configurations, and chemistry is determined by electrons. (c) Density/mass — ³⁷Cl atoms are heavier, so it also diffuses slightly more slowly." },
    { level:"O-Level standard", q:"Cotton wool soaked in concentrated ammonia solution is put at one end of a long glass tube, and cotton wool soaked in concentrated hydrochloric acid at the other. A white ring of ammonium chloride forms nearer the hydrochloric acid end. (a) Name the process. (b) Explain why the ring forms nearer the acid end. (c) State what happens if the tube is warmed.",
      steps:["(a) Diffusion — the net movement of particles from high to low concentration due to their random motion.","(b) Ammonia (Mr = 17) has a smaller relative molecular mass than hydrogen chloride (Mr = 36.5).","At the same temperature, lighter particles move faster, so ammonia diffuses more quickly along the tube.","The ammonia therefore travels further before the two gases meet, so the white ring forms closer to the slower-moving hydrogen chloride.","(c) Warming gives all particles more kinetic energy, so they move faster."],
      ans:"(a) Diffusion. (b) Ammonia has the smaller Mr so it diffuses faster and travels further before meeting the HCl. (c) Both gases diffuse faster, so the ring forms sooner (in roughly the same position)." },
  ]},
"3. Chemical Bonding and Structure": {
  diagram:{ type:"dotcross", a:"H", aN:1, b:"Cl", bN:7, caption2:"HCl — one shared pair gives hydrogen 2 electrons and chlorine 8", caption:"A covalent bond is one shared pair of electrons; dots and crosses just show which atom each electron came from." },
  practice:[
    { level:"Easy", q:"State the type of bonding in (a) magnesium oxide, (b) carbon dioxide, (c) copper.",
      steps:["Metal + non-metal → electrons transferred → ionic.","Non-metal + non-metal → electrons shared → covalent.","Metal only → lattice of positive ions in a sea of delocalised electrons → metallic."],
      ans:"(a) Ionic. (b) Covalent. (c) Metallic." },
    { level:"Medium", q:"Explain why sodium chloride has a high melting point and conducts electricity when molten but not when solid.",
      steps:["Sodium chloride has a giant ionic lattice of Na⁺ and Cl⁻ ions held by strong electrostatic forces of attraction.","A large amount of energy is needed to overcome these strong forces, so the melting point is high.","To conduct electricity, charged particles must be free to move.","When solid, the ions are held in fixed positions in the lattice, so they cannot move and it does not conduct.","When molten, the lattice breaks down and the ions become free to move and carry charge."],
      ans:"High melting point because strong electrostatic attraction between oppositely charged ions must be overcome. It conducts only when molten because only then are the ions free to move and carry charge." },
    { level:"O-Level standard", q:"Diamond and graphite are both forms of carbon. (a) State the type of structure both have. (b) Explain why diamond is extremely hard while graphite is soft and slippery. (c) Explain why graphite conducts electricity but diamond does not.",
      steps:["(a) Both have a giant covalent (macromolecular) structure.","(b) In diamond, each carbon atom forms four strong covalent bonds in a rigid three-dimensional tetrahedral lattice, so the structure cannot be distorted — it is very hard.","In graphite, each carbon forms only three covalent bonds, giving flat layers of hexagons. The layers are held to each other by weak forces only, so they slide over one another easily — making it soft and a good lubricant.","(c) In diamond all four outer electrons of every carbon atom are used in covalent bonding, so there are no free electrons to carry charge.","In graphite each carbon uses only three of its four outer electrons in bonding, leaving one delocalised electron per atom free to move along the layers."],
      ans:"(a) Giant covalent (macromolecular). (b) Diamond has four bonds per atom in a rigid 3D lattice; graphite has three bonds per atom in layers held by weak forces, which slide. (c) Graphite has one delocalised electron per carbon atom free to move; in diamond all four outer electrons are locked in bonds." },
  ]},
"4. Chemical Calculations": {
  diagram:{ type:"flow", alt:"Mole calculation map", w:360, h:210,
    boxes:[{x:130,y:84,w:100,h:44,text:"MOLES|n",color:'#F59E0B'},
           {x:14,y:14,w:96,h:40,text:"mass (g)",color:'#3B82F6'},
           {x:250,y:14,w:96,h:40,text:"volume of gas|(dm³)",color:'#34D399'},
           {x:14,y:158,w:96,h:40,text:"concentration|× volume",color:'#A78BFA'},
           {x:250,y:158,w:96,h:40,text:"number of|particles",color:'#FB7185'}],
    arrows:[{x1:110,y1:44,x2:140,y2:82,label:'÷ Mr',dx:-16,dy:2},
            {x1:250,y1:44,x2:220,y2:82,label:'÷ 24',dx:16,dy:2},
            {x1:110,y1:172,x2:140,y2:130,label:'× vol',dx:-16,dy:6},
            {x1:250,y1:172,x2:220,y2:130,label:'÷ 6.02e23',dx:24,dy:6}],
    caption:"Everything routes through moles — convert to moles first, use the equation ratio, then convert back." },
  practice:[
    { level:"Easy", q:"Calculate the number of moles in 8.0 g of methane, CH₄. (Ar: C = 12, H = 1)",
      steps:["Mr of CH₄ = 12 + (4 × 1) = 16.","moles = mass ÷ Mr = 8.0 ÷ 16 = 0.50 mol."],
      ans:"0.50 mol." },
    { level:"Medium", q:"25.0 cm³ of 0.100 mol/dm³ sodium hydroxide is exactly neutralised by hydrochloric acid: NaOH + HCl → NaCl + H₂O. If 20.0 cm³ of acid was used, calculate its concentration.",
      steps:["moles of NaOH = concentration × volume in dm³ = 0.100 × (25.0 ÷ 1000) = 0.00250 mol.","From the equation, NaOH : HCl is 1 : 1, so moles of HCl = 0.00250 mol.","concentration of HCl = moles ÷ volume in dm³ = 0.00250 ÷ (20.0 ÷ 1000).","= 0.00250 ÷ 0.0200 = 0.125 mol/dm³."],
      ans:"0.125 mol/dm³." },
    { level:"O-Level standard", q:"Calcium carbonate decomposes: CaCO₃ → CaO + CO₂. 25.0 g of impure limestone produces 4.80 dm³ of carbon dioxide at r.t.p. (Ar: Ca = 40, C = 12, O = 16; molar gas volume = 24 dm³/mol.) Calculate (a) the moles of CO₂, (b) the mass of pure CaCO₃, (c) the percentage purity of the limestone.",
      steps:["(a) moles of CO₂ = volume ÷ 24 = 4.80 ÷ 24 = 0.200 mol.","(b) From the equation, CaCO₃ : CO₂ is 1 : 1, so moles of CaCO₃ = 0.200 mol.","Mr of CaCO₃ = 40 + 12 + (3 × 16) = 100.","mass = moles × Mr = 0.200 × 100 = 20.0 g.","(c) percentage purity = (mass of pure substance ÷ total mass) × 100% = (20.0 ÷ 25.0) × 100% = 80.0%."],
      ans:"(a) 0.200 mol. (b) 20.0 g. (c) 80.0%." },
  ]},
"5. Acid-Base Chemistry": {
  diagram:{ type:"phscale", caption:"Below 7 acidic (more H⁺), 7 neutral, above 7 alkaline (more OH⁻)." },
  practice:[
    { level:"Easy", q:"Complete the three reactions of dilute hydrochloric acid with (a) magnesium, (b) copper(II) oxide, (c) sodium carbonate — naming the products in each case.",
      steps:["Acid + metal → salt + hydrogen.","Acid + base (metal oxide) → salt + water.","Acid + carbonate → salt + water + carbon dioxide."],
      ans:"(a) Magnesium chloride + hydrogen. (b) Copper(II) chloride + water. (c) Sodium chloride + water + carbon dioxide." },
    { level:"Medium", q:"Explain the difference between a strong acid and a weak acid, and between a concentrated acid and a dilute acid. Give an example of each type of acid.",
      steps:["Strong and weak describe the extent of ionisation in water — a chemical property.","A strong acid, e.g. hydrochloric acid, is completely ionised in water, producing the maximum number of H⁺ ions.","A weak acid, e.g. ethanoic acid, is only partially ionised, so far fewer H⁺ ions are released.","Concentrated and dilute describe how much acid is dissolved in a given volume of water — nothing to do with ionisation."],
      ans:"Strong vs weak = fully vs partially ionised in water (HCl vs ethanoic acid). Concentrated vs dilute = amount of acid per unit volume of solution. A weak acid can be concentrated, and a strong acid can be dilute." },
    { level:"O-Level standard", q:"Describe how you would prepare a pure, dry sample of copper(II) sulfate crystals from copper(II) oxide and dilute sulfuric acid, explaining why an excess of copper(II) oxide is used.",
      steps:["Warm some dilute sulfuric acid in a beaker.","Add copper(II) oxide a little at a time, stirring, until no more dissolves and some solid remains at the bottom — this excess guarantees all the acid has reacted.","Filter the mixture to remove the unreacted copper(II) oxide, leaving copper(II) sulfate solution as the filtrate.","Heat the filtrate to evaporate some of the water until a saturated solution forms (test with a glass rod — crystals form on cooling).","Leave the solution to cool slowly so that crystals form.","Filter off the crystals and dry them between sheets of filter paper.","Excess is used because copper(II) oxide is insoluble, so any unreacted excess can simply be filtered off — leaving no acid impurity in the product."],
      ans:"React warm dilute sulfuric acid with excess copper(II) oxide, filter off the excess, then crystallise the filtrate and dry the crystals. The excess ensures no unreacted acid remains, and being insoluble it is easily filtered out." },
  ]},
"6. Qualitative Analysis — Cations": {
  diagram:{ type:"table", caption:"Learn this grid — the pattern of 'soluble in excess' is what separates the look-alikes.",
    head:["Cation","+ aqueous NaOH","+ aqueous NH₃"],
    rows:[["Aluminium, Al³⁺","White ppt, <b>soluble in excess</b>","White ppt, insoluble in excess"],
          ["Ammonium, NH₄⁺","No ppt; NH₃ gas on warming","—"],
          ["Calcium, Ca²⁺","White ppt, insoluble in excess","<b>No ppt</b>"],
          ["Copper(II), Cu²⁺","Light blue ppt, insoluble","Light blue ppt, <b>soluble giving dark blue</b>"],
          ["Iron(II), Fe²⁺","Green ppt, insoluble","Green ppt, insoluble"],
          ["Iron(III), Fe³⁺","Red-brown ppt, insoluble","Red-brown ppt, insoluble"],
          ["Zinc, Zn²⁺","White ppt, soluble in excess","White ppt, <b>soluble in excess</b>"]] },
  practice:[
    { level:"Easy", q:"A solution gives a red-brown precipitate with aqueous sodium hydroxide, which does not dissolve in excess. Identify the cation.",
      steps:["Red-brown precipitates are characteristic of iron(III).","Iron(II) would give a green precipitate."],
      ans:"Iron(III), Fe³⁺." },
    { level:"Medium", q:"Two colourless solutions both give a white precipitate with aqueous sodium hydroxide that dissolves in excess. Describe one further test to tell them apart, giving the expected results.",
      steps:["Both aluminium and zinc give a white precipitate with NaOH that dissolves in excess, so NaOH alone cannot distinguish them.","Test with aqueous ammonia instead, adding it drop by drop and then in excess."],
      ans:"Add aqueous ammonia: aluminium gives a white precipitate that is insoluble in excess, whereas zinc gives a white precipitate that dissolves in excess to give a colourless solution." },
    { level:"O-Level standard", q:"A student has an unknown solution X. Adding aqueous sodium hydroxide and warming produces a gas that turns damp red litmus paper blue. Adding aqueous silver nitrate (after acidifying with dilute nitric acid) gives a yellow precipitate. (a) Identify the cation and the anion. (b) Name compound X. (c) Explain why the nitric acid must be added before the silver nitrate.",
      steps:["(a) A gas that turns damp red litmus blue is ammonia, which is only released when a cation reacts with NaOH — so the cation is ammonium, NH₄⁺.","A yellow precipitate with acidified silver nitrate indicates iodide, I⁻ (a chloride would give white).","(b) Combining the two ions gives ammonium iodide.","(c) Carbonate ions, if present, would also react with silver nitrate to give a white precipitate of silver carbonate, giving a false positive."],
      ans:"(a) Ammonium (NH₄⁺) and iodide (I⁻). (b) Ammonium iodide, NH₄I. (c) The dilute nitric acid reacts with and removes any carbonate ions, which would otherwise form their own precipitate and give a misleading result." },
  ]},
"7. Qualitative Analysis — Anions & Gases": {
  diagram:{ type:"table", caption:"Anion tests (top) and gas tests (bottom) — both are guaranteed marks if learned exactly.",
    head:["Test for","Method","Positive result"],
    rows:[["Carbonate, CO₃²⁻","Add dilute acid","Effervescence; gas turns limewater milky"],
          ["Chloride, Cl⁻","Acidify with dilute HNO₃, add AgNO₃","<b>White</b> precipitate"],
          ["Iodide, I⁻","Acidify with dilute HNO₃, add AgNO₃","<b>Yellow</b> precipitate"],
          ["Nitrate, NO₃⁻","Add NaOH + aluminium foil, warm","Ammonia gas — damp red litmus turns blue"],
          ["Sulfate, SO₄²⁻","Acidify with dilute HNO₃, add Ba(NO₃)₂","White precipitate"],
          ["Ammonia, NH₃","Damp red litmus paper","Turns blue"],
          ["Carbon dioxide, CO₂","Bubble through limewater","Turns milky"],
          ["Chlorine, Cl₂","Damp litmus paper","Bleached"],
          ["Hydrogen, H₂","Lighted splint","Pops"],
          ["Oxygen, O₂","Glowing splint","Relights"],
          ["Sulfur dioxide, SO₂","Acidified KMnO₄","Purple → colourless"]] },
  practice:[
    { level:"Easy", q:"A gas relights a glowing splint. Identify it, and state the test and result for hydrogen.",
      steps:["Only oxygen relights a glowing splint, since it supports combustion.","Hydrogen is tested with a lighted splint."],
      ans:"Oxygen. Hydrogen 'pops' with a lighted splint." },
    { level:"Medium", q:"Describe how you would test a solution for sulfate ions, and explain each step.",
      steps:["First add dilute nitric acid to the solution.","This removes any carbonate ions present, which would otherwise form a white precipitate and be mistaken for sulfate.","Then add aqueous barium nitrate.","A white precipitate of barium sulfate confirms sulfate ions are present."],
      ans:"Acidify with dilute nitric acid (to destroy any carbonate), then add aqueous barium nitrate — a white precipitate confirms sulfate." },
    { level:"O-Level standard", q:"A white solid Y is added to dilute hydrochloric acid and effervesces, giving a gas that turns limewater milky. The resulting solution gives a white precipitate with aqueous sodium hydroxide that is insoluble in excess, and no precipitate with aqueous ammonia. (a) Identify the anion and cation. (b) Name Y. (c) Write a word equation for the reaction with hydrochloric acid.",
      steps:["(a) Effervescence with acid, giving a gas that turns limewater milky, shows the gas is carbon dioxide — so the anion is carbonate, CO₃²⁻.","A white precipitate with NaOH insoluble in excess, and no precipitate at all with aqueous ammonia, is the unique signature of calcium, Ca²⁺.","(b) The compound is therefore calcium carbonate.","(c) Acid + carbonate → salt + water + carbon dioxide."],
      ans:"(a) Carbonate (CO₃²⁻) and calcium (Ca²⁺). (b) Calcium carbonate, CaCO₃. (c) Calcium carbonate + hydrochloric acid → calcium chloride + water + carbon dioxide." },
  ]},
"8. Redox Chemistry": {
  diagram:{ type:"apparatus", mode:"electrolysis", caption:"Cathode is negative and attracts cations (reduction); anode is positive and attracts anions (oxidation)." },
  practice:[
    { level:"Easy", q:"In the reaction Zn + CuSO₄ → ZnSO₄ + Cu, state which species is oxidised and which is reduced, in terms of electrons.",
      steps:["Zinc starts as a neutral atom and ends as Zn²⁺ in zinc sulfate, so it has lost 2 electrons.","Copper starts as Cu²⁺ and ends as neutral Cu metal, so it has gained 2 electrons.","OIL RIG: Oxidation Is Loss, Reduction Is Gain."],
      ans:"Zinc is oxidised (loses electrons); copper(II) ions are reduced (gain electrons). Zinc is the reducing agent and Cu²⁺ is the oxidising agent." },
    { level:"Medium", q:"Concentrated aqueous sodium chloride is electrolysed with inert electrodes. State the products at each electrode and explain the choice at the anode.",
      steps:["At the cathode, the cations present are Na⁺ and H⁺. The ion of the less reactive element is discharged, and hydrogen is less reactive than sodium, so hydrogen gas is produced.","At the anode, the anions present are Cl⁻ and OH⁻.","Because the solution is concentrated, the halide is discharged in preference to hydroxide, so chlorine gas is produced.","(If it were dilute, oxygen would be produced instead.)"],
      ans:"Cathode: hydrogen. Anode: chlorine — because the chloride solution is concentrated, the halide is discharged in preference to hydroxide." },
    { level:"O-Level standard", q:"Impure copper is purified by electrolysis of aqueous copper(II) sulfate. (a) State what each electrode is made of. (b) Write the half-equation at each electrode. (c) Explain what happens to the impurities and to the concentration of the electrolyte.",
      steps:["(a) The anode is made of the impure copper, and the cathode is a thin sheet of pure copper.","(b) At the anode, copper atoms lose electrons and dissolve into solution: Cu → Cu²⁺ + 2e⁻ (oxidation).","At the cathode, copper ions gain electrons and are deposited as pure copper: Cu²⁺ + 2e⁻ → Cu (reduction).","(c) Impurities in the anode are usually less reactive metals that do not dissolve; they fall to the bottom of the cell as anode sludge.","Copper ions enter solution at the anode at the same rate as they are removed at the cathode."],
      ans:"(a) Anode = impure copper, cathode = pure copper. (b) Anode: Cu → Cu²⁺ + 2e⁻; cathode: Cu²⁺ + 2e⁻ → Cu. (c) Impurities collect below the anode as sludge, and the electrolyte concentration stays constant since copper dissolves as fast as it is deposited." },
  ]},
"9. Patterns in the Periodic Table": {
  diagram:{ type:"ladder", alt:"Reactivity series",
    items:[{t:"potassium  K"},{t:"sodium  Na"},{t:"calcium  Ca"},{t:"magnesium  Mg"},{t:"zinc  Zn"},{t:"iron  Fe"},{t:"lead  Pb"},{t:"(hydrogen)  H",hi:true},{t:"copper  Cu"},{t:"silver  Ag"}],
    caption:"The syllabus list — note it includes lead and hydrogen, but not aluminium or gold." },
  practice:[
    { level:"Easy", q:"An element is in Group 2 and Period 3 of the Periodic Table. State its number of outer electrons, its number of electron shells, and whether it is a metal.",
      steps:["The group number gives the number of outer (valence) electrons: 2.","The period number gives the number of occupied electron shells: 3.","Groups 1 and 2 are on the left-hand side of the table."],
      ans:"2 outer electrons, 3 shells, and it is a metal (magnesium)." },
    { level:"Medium", q:"Chlorine water is added to potassium iodide solution and the mixture turns brown. (a) Explain what has happened. (b) Predict and explain what happens if bromine water is added to potassium chloride solution.",
      steps:["(a) Chlorine is above iodine in Group 17, so chlorine is the more reactive halogen.","A more reactive halogen displaces a less reactive one from its halide solution, so chlorine displaces iodine: Cl₂ + 2KI → 2KCl + I₂.","The brown colour is the iodine that has been displaced.","(b) Bromine is below chlorine in Group 17, so bromine is less reactive than chlorine."],
      ans:"(a) Chlorine, being more reactive, displaces iodine from potassium iodide; the brown colour is displaced iodine. (b) No reaction — bromine is less reactive than chlorine and cannot displace it from a chloride." },
    { level:"O-Level standard", q:"An iron ship's hull is protected by bolting on blocks of magnesium. (a) Name this method. (b) Explain in terms of reactivity why it protects the iron. (c) State the two substances required for iron to rust, and name one other prevention method.",
      steps:["(a) This is sacrificial protection.","(b) Magnesium is higher than iron in the reactivity series, so it loses electrons more readily than iron does.","The magnesium therefore corrodes preferentially, oxidising in place of the iron, and must be replaced periodically. The iron is left unreacted.","(c) Rusting requires both oxygen and water."],
      ans:"(a) Sacrificial protection. (b) Magnesium is more reactive than iron, so it loses electrons and corrodes preferentially, leaving the iron protected. (c) Oxygen and water; also prevented by barrier methods such as painting, greasing or galvanising." },
  ]},
"10. Chemical Energetics": {
  diagram:{ type:"energyprofile", mode:"exo", caption:"Exothermic: products end lower than reactants, so energy is released and ΔH is negative. Eₐ is the hump that must be climbed first." },
  practice:[
    { level:"Easy", q:"A reaction causes the temperature of the surroundings to fall. State whether it is exothermic or endothermic and give the sign of ΔH.",
      steps:["A temperature fall means the reaction has taken in energy from the surroundings.","Energy absorbed means the products store more energy than the reactants."],
      ans:"Endothermic, and ΔH is positive." },
    { level:"Medium", q:"State whether bond breaking and bond making are exothermic or endothermic, and explain how this determines whether a reaction is exothermic overall.",
      steps:["Breaking bonds requires energy to be supplied to overcome the attraction holding atoms together, so bond breaking is always endothermic.","Making bonds releases energy as new attractions form, so bond making is always exothermic.","Compare the two totals for the reaction."],
      ans:"Bond breaking is endothermic; bond making is exothermic. If more energy is released making bonds than is absorbed breaking them, the reaction is exothermic overall (ΔH negative); if less, it is endothermic." },
    { level:"O-Level standard", q:"Sketch and label an energy profile diagram for an exothermic reaction, marking the activation energy and ΔH. Then explain how adding a catalyst changes the diagram, and whether it changes ΔH.",
      steps:["Draw energy on the vertical axis and progress of reaction on the horizontal axis.","Reactants start at a higher energy level; the curve rises to a peak, then falls to the products at a lower energy level.","The activation energy Eₐ is measured from the reactants' level up to the peak.","ΔH is measured from the reactants' level down to the products' level, and is negative for an exothermic reaction.","A catalyst provides an alternative reaction pathway with a lower activation energy, so the peak of the curve is lower.","The catalyst does not change the energy of the reactants or of the products, only the height of the barrier between them."],
      ans:"Reactants high, curve peaks, products lower; Eₐ from reactants to peak, ΔH (negative) from reactants down to products. A catalyst lowers the peak (smaller Eₐ) but ΔH is unchanged, since the reactant and product energy levels are unaffected." },
  ]},

function svgBoxplot(p){
  const W=440,H=150, x0=44,x1=410;
  const scale=(x1-x0)/(p.axisMax-p.axisMin);
  const X=v=> x0+(v-p.axisMin)*scale;
  const ticks=[]; const step=(p.axisMax-p.axisMin)/5;
  for(let i=0;i<=5;i++){ const v=p.axisMin+step*i; ticks.push(`<line x1="${X(v)}" y1="108" x2="${X(v)}" y2="113" stroke="#475569" stroke-width="1"/><text x="${X(v)}" y="126" font-size="10.5" fill="#64748B" text-anchor="middle">${Math.round(v*10)/10}</text>`); }
  const dashed=[p.min,p.q1,p.med,p.q3,p.max].map(v=>`<line x1="${X(v)}" y1="55" x2="${X(v)}" y2="108" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>`).join('');
  const lbl=[[p.min,'min'],[p.q1,'Q1'],[p.med,'med'],[p.q3,'Q3'],[p.max,'max']];
  const labels = lbl.map(([v,n],i)=>{
    const anchor = i===0?'start':(i===4?'end':'middle');
    return `<text x="${X(v)}" y="140" font-size="10.5" fill="#94A3B8" text-anchor="${anchor}">${n}=${v}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Box and whisker plot">
    <line x1="${X(p.axisMin)}" y1="110" x2="${X(p.axisMax)}" y2="110" stroke="#334155" stroke-width="1.5"/>
    ${ticks.join('')}
    ${dashed}
    <line x1="${X(p.min)}" y1="75" x2="${X(p.q1)}" y2="75" stroke="#94A3B8" stroke-width="2"/>
    <line x1="${X(p.q3)}" y1="75" x2="${X(p.max)}" y2="75" stroke="#94A3B8" stroke-width="2"/>
    <line x1="${X(p.min)}" y1="60" x2="${X(p.min)}" y2="90" stroke="#94A3B8" stroke-width="2"/>
    <line x1="${X(p.max)}" y1="60" x2="${X(p.max)}" y2="90" stroke="#94A3B8" stroke-width="2"/>
    <rect x="${X(p.q1)}" y="55" width="${Math.max(2,X(p.q3)-X(p.q1))}" height="40" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
    <line x1="${X(p.med)}" y1="55" x2="${X(p.med)}" y2="95" stroke="#F59E0B" stroke-width="2.5"/>
    ${labels}
  </svg>`;
}

function svgVectorGrid(p){
  SVGUID++;
  const uid='vg'+SVGUID;
  const size=300, pad=26;
  const range=p.gridMax-p.gridMin;
  const scale=(size-2*pad)/range;
  const X=x=> pad+(x-p.gridMin)*scale;
  const Y=y=> size-pad-(y-p.gridMin)*scale;
  let grid='';
  for(let i=Math.ceil(p.gridMin); i<=Math.floor(p.gridMax); i++){
    grid += `<line x1="${X(i)}" y1="${pad}" x2="${X(i)}" y2="${size-pad}" stroke="#1E293B" stroke-width="1"/>`;
    grid += `<line x1="${pad}" y1="${Y(i)}" x2="${size-pad}" y2="${Y(i)}" stroke="#1E293B" stroke-width="1"/>`;
  }
  let axes='';
  if(p.gridMin<=0 && p.gridMax>=0){
    axes += `<line x1="${X(0)}" y1="${pad}" x2="${X(0)}" y2="${size-pad}" stroke="#475569" stroke-width="1.5"/>`;
    axes += `<line x1="${pad}" y1="${Y(0)}" x2="${size-pad}" y2="${Y(0)}" stroke="#475569" stroke-width="1.5"/>`;
  }
  const colors=[...new Set((p.arrows||[]).map(a=>a.color||'#3B82F6'))];
  const defs='<defs>'+colors.map((c,i)=>`<marker id="${uid}-a${i}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${c}"/></marker>`).join('')+'</defs>';
  const arrows=(p.arrows||[]).map(a=>{
    const c=a.color||'#3B82F6', idx=colors.indexOf(c);
    const midX=(X(a.x1)+X(a.x2))/2, midY=(Y(a.y1)+Y(a.y2))/2;
    return `<line x1="${X(a.x1)}" y1="${Y(a.y1)}" x2="${X(a.x2)}" y2="${Y(a.y2)}" stroke="${c}" stroke-width="2.5" marker-end="url(#${uid}-a${idx})"/>
      <text x="${midX+8}" y="${midY-6}" font-size="13" font-weight="700" fill="${c}">${esc(a.label||'')}</text>`;
  }).join('');
  const points=(p.points||[]).map(pt=>`<circle cx="${X(pt.x)}" cy="${Y(pt.y)}" r="3.5" fill="#F8FAFC"/><text x="${X(pt.x)+7}" y="${Y(pt.y)-8}" font-size="12" fill="#CBD5E1">${esc(pt.label||'')}</text>`).join('');
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vector diagram">
    ${defs}<rect x="0" y="0" width="${size}" height="${size}" fill="#0B1120"/>${grid}${axes}${arrows}${points}
  </svg>`;
}

function svgBearing(p){
  const W=260,H=260, cx=130, cy=145, len=90;
  const rad=p.angle*Math.PI/180;
  const px=cx+len*Math.sin(rad), py=cy-len*Math.cos(rad);
  const arcR=34;
  const nx=cx, ny=cy-arcR;
  const bx=cx+arcR*Math.sin(rad), by=cy-arcR*Math.cos(rad);
  const largeArc=p.angle>180?1:0;
  const labelAnchor = px >= cx ? 'start' : 'end';
  const labelDx = px >= cx ? 10 : -10;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bearing diagram">
    <line x1="${cx}" y1="${cy}" x2="${cx}" y2="20" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="${cx-5}" y="14" font-size="13" fill="#94A3B8">N</text>
    <line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M ${nx} ${ny} A ${arcR} ${arcR} 0 ${largeArc} 1 ${bx} ${by}" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#F8FAFC"/>
    <circle cx="${px}" cy="${py}" r="4" fill="#F8FAFC"/>
    <text x="${cx-16}" y="${cy+18}" font-size="13" fill="#F8FAFC">${esc(p.origin||'O')}</text>
    <text x="${px+labelDx}" y="${py-8}" font-size="13" fill="#F8FAFC" text-anchor="${labelAnchor}">${esc(p.label||'P')}</text>
    <text x="${cx+(p.angle<=180?16:-38)}" y="${cy-42}" font-size="12" fill="#FCD34D">${p.angle}°</text>
  </svg>`;
}

function renderDiagram(d){
  if(!d) return '';
  const cap = d.caption ? `<div class="diagram-cap">${esc(d.caption)}</div>` : '';
  if(d.type==='table'){
    return `<div class="diagram-wrap dg-table"><table class="dtable">
      <thead><tr>${(d.head||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${(d.rows||[]).map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="dt-key"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>${cap}</div>`;
  }
  const fn = DIAGRAM_BUILDERS[d.type];
  if(!fn) return '';
  return `<div class="diagram-wrap">${fn(d)}${cap}</div>`;
}

function renderSection(s){
  if(s.type==='text'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4>${s.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
  }
  if(s.type==='bullets'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><ul class="bullets">${s.body.map(li=>`<li>${li}</li>`).join('')}</ul></div>`;
  }
  if(s.type==='formulas'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="formula-list">${s.body.map(f=>
      `<div class="formula-row"><div class="f-expr">${f.f}</div><div class="f-desc">${esc(f.d)}</div></div>`
    ).join('')}</div></div>`;
  }
  if(s.type==='terms'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="keyterms">${s.body.map(t=>`<span class="keyterm">${esc(t)}</span>`).join('')}</div></div>`;
  }
  if(s.type==='timeline'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="timeline">${s.body.map(e=>`<div class="tl-item"><div class="tl-date">${esc(e.d)}</div><div class="tl-text">${esc(e.t)}</div></div>`).join('')}</div></div>`;
  }
  if(s.type==='diagram'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4>${renderDiagram(s.body)}</div>`;
  }
  if(s.type==='html'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4>${s.body}</div>`;
  }
  if(s.type==='examples'){
    const lvlClass = { 'Easy':'lvl-easy', 'Medium':'lvl-medium', 'O-Level standard':'lvl-olevel' };
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="example-set">${s.body.map(ex=>`
      <div class="example-card">
        <span class="example-level ${lvlClass[ex.level]||'lvl-easy'}">${esc(ex.level)}</span>
        <div class="example-q">${ex.q}</div>
        ${ex.diagram ? renderDiagram(ex.diagram) : ''}
        <ol class="step-list">${ex.steps.map(st=>`<li>${st}</li>`).join('')}</ol>
        <div class="example-ans"><b>Answer:</b> ${ex.ans}</div>
      </div>`).join('')}</div></div>`;
  }
  return '';
}

function footerHTML(){
  return `
  <div class="foot">
    <div class="note">
      <b>Check before you trust it:</b> Definitions follow the Singapore O-Level 2026 syllabuses (Pure Physics 6091, Pure Chemistry 6092, Elective History — Express) and are phrased the way examiners award marks — but cross-check them against your own school notes and the official SEAB syllabus.
      <div style="margin-top:9px;">The exam dates here were taken from your brief, not from an official source. <b>Confirm every date against the official SEAB / MOE examination timetable</b> before planning around it.</div>
    </div>
    <p style="margin-top:22px;">Personal study tool · Plan · Error log · Physics · Chemistry · History</p>
    <p>Your schedule, error log and "learnt" progress are saved in this browser only — clearing site data will erase them.</p>
  </div>`;
}

render();
</script>
