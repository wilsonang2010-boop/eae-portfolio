<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>O-Level Study Deck | Physics · Chemistry · History</title>
<meta name="description" content="A study app for Singapore O-Level Pure Physics and Pure Chemistry definitions (2026 syllabus) and Elective History (Express) chapters and key events." />
<meta name="theme-color" content="#0B1120" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1120;
  --bg-alt:#0D1424;
  --card:#111827;
  --card-hover:#141d30;
  --border:rgba(148,163,184,0.14);
  --border-strong:rgba(148,163,184,0.26);
  --blue:#2563EB;
  --blue-bright:#3B82F6;
  --blue-soft:rgba(37,99,235,0.12);
  --green:#22C55E;
  --green-soft:rgba(34,197,94,0.12);
  --amber:#F59E0B;
  --white:#F8FAFC;
  --slate-100:#E2E8F0;
  --slate-300:#CBD5E1;
  --slate-400:#94A3B8;
  --slate-500:#64748B;
  --font:ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;
  --font-display:'Newsreader',ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;
  --container:1080px;
  --radius:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--slate-300);
  font-family:var(--font); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
ul{list-style:none;}
input,textarea{font-family:inherit;}
h1,h2,h3,h4{color:var(--white); font-weight:600; line-height:1.2; letter-spacing:-0.005em; font-family:var(--font-display);}
.container{max-width:var(--container); margin:0 auto; padding:0 20px;}
@media(min-width:768px){.container{padding:0 32px;}}

/* Header */
header{
  position:sticky; top:0; z-index:50; background:rgba(11,17,32,0.86);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.head-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:38px; height:38px; border-radius:10px; background:var(--blue-soft);
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--blue-bright); font-family:var(--font-display); font-weight:700; font-size:18px;
}
.brand h1{font-size:1.02rem; letter-spacing:-0.01em;}
.brand span{display:block; font-size:12px; color:var(--slate-500); font-family:var(--font); font-weight:400;}
.home-link{font-size:13px; color:var(--slate-400); border:1px solid var(--border); padding:8px 14px; border-radius:9px; transition:.25s var(--ease);}
.home-link:hover{color:var(--white); border-color:var(--border-strong);}

/* Subject tabs */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0; border-bottom:1px solid var(--border); -ms-overflow-style:none; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  font-size:14px; font-weight:500; padding:10px 18px; border-radius:10px;
  color:var(--slate-400); border:1px solid transparent; transition:.25s var(--ease);
}
.tab:hover{color:var(--white); background:var(--card);}
.tab.active{color:var(--white); background:var(--blue-soft); border-color:var(--border-strong);}
.tab .dot{width:8px; height:8px; border-radius:50%;}
.tab-plan .dot{background:#3B82F6;}
.tab-log .dot{background:#FB7185;}
.tab-emath .dot{background:#818CF8;}
.tab-amath .dot{background:#6366F1;}
.tab-phys .dot{background:#38BDF8;}
.tab-chem .dot{background:#34D399;}
.tab-hist .dot{background:#A78BFA;}
.tab-phylesson .dot{background:#22D3EE;}
.tab-chemlesson .dot{background:#A3E635;}

/* Hero intro per subject */
.subject-hero{padding:40px 0 8px;}
.eyebrow{display:inline-block; font-size:12px; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--blue-bright); margin-bottom:12px;}
.subject-hero h2{font-size:clamp(1.7rem,4vw,2.4rem);}
.subject-hero p{margin-top:12px; max-width:640px; color:var(--slate-400);}

/* Controls bar */
.controls{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  margin:28px 0 8px; padding:14px; background:var(--card);
  border:1px solid var(--border); border-radius:12px;
}
.search{flex:1; min-width:180px; position:relative;}
.search input{
  width:100%; background:var(--bg); border:1px solid var(--border);
  color:var(--white); padding:11px 14px 11px 38px; border-radius:10px; font-size:14px;
}
.search input::placeholder{color:var(--slate-500);}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--slate-500);}
.seg{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:3px;}
.seg button{font-size:13px; font-weight:500; padding:8px 14px; border-radius:8px; color:var(--slate-400); transition:.2s var(--ease);}
.seg button.on{background:var(--blue); color:#fff;}
.stat{font-size:13px; color:var(--slate-400); white-space:nowrap;}
.stat b{color:var(--white); font-weight:600;}

/* Topic pills */
.topic-nav{display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 6px;}
.topic-pill{
  font-size:13px; padding:7px 14px; border-radius:20px; border:1px solid var(--border);
  color:var(--slate-400); transition:.2s var(--ease);
}
.topic-pill:hover{color:var(--white); border-color:var(--border-strong);}
.topic-pill.active{background:var(--blue-soft); color:var(--blue-bright); border-color:var(--border-strong);}

/* Definition cards grid */
.topic-block{margin-top:36px;}
.topic-block h3{font-size:1.35rem; margin-bottom:4px;}
.topic-block .topic-sub{font-size:13px; color:var(--slate-500); margin-bottom:20px;}
.card-grid{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:640px){.card-grid{grid-template-columns:1fr 1fr;}}

.flash{
  position:relative; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:20px; min-height:132px; cursor:pointer;
  transition:border-color .25s var(--ease), transform .25s var(--ease), background .25s var(--ease);
}
.flash:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.flash.known{border-color:rgba(34,197,94,0.4); background:rgba(34,197,94,0.04);}
.flash .term{font-family:var(--font-display); color:var(--white); font-size:1.12rem; font-weight:600; padding-right:34px;}
.flash .prompt{margin-top:10px; font-size:13px; color:var(--slate-500); font-style:italic;}
.flash .def{margin-top:12px; color:var(--slate-300); font-size:15px; line-height:1.6;}
.flash .def.hidden{display:none;}
.flash .extra{margin-top:10px; font-size:13px; color:var(--slate-400); border-top:1px solid var(--border); padding-top:10px;}
.flash .extra.hidden{display:none;}
.flash .mark{
  position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--slate-500); transition:.2s var(--ease); font-size:14px;
}
.flash .mark:hover{color:var(--white); border-color:var(--slate-400);}
.flash.known .mark{background:var(--green); color:#04140a; border-color:var(--green);}

/* Quiz mode reveal button */
.reveal-hint{margin-top:14px; font-size:12px; color:var(--blue-bright); letter-spacing:.03em;}

/* History */
.hist-intro{display:grid; gap:14px; grid-template-columns:1fr; margin-top:24px;}
@media(min-width:720px){.hist-intro{grid-template-columns:1fr 1fr 1fr;}}
.mini-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px;}
.mini-card h4{font-size:1rem; margin-bottom:6px;}
.mini-card p{font-size:13px; color:var(--slate-400);}

.chapter{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-top:16px; overflow:hidden;}
.chapter-head{display:flex; align-items:flex-start; gap:16px; padding:22px; cursor:pointer; transition:background .2s var(--ease);}
.chapter-head:hover{background:var(--card-hover);}
.chapter-num{
  flex-shrink:0; width:44px; height:44px; border-radius:11px; background:var(--blue-soft);
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--blue-bright); font-family:var(--font-display); font-weight:700; font-size:19px;
}
.chapter-head .ch-title{flex:1;}
.chapter-head h3{font-size:1.22rem;}
.chapter-head .ch-q{font-size:13px; color:var(--slate-500); margin-top:4px; font-style:italic;}
.chapter-head .chev{flex-shrink:0; color:var(--slate-500); transition:transform .3s var(--ease); margin-top:8px;}
.chapter.open .chev{transform:rotate(180deg);}
.chapter-body{display:none; padding:0 22px 26px; border-top:1px solid var(--border);}
.chapter.open .chapter-body{display:block;}

.ch-section{margin-top:24px;}
.ch-section h4{font-size:1.02rem; color:var(--blue-bright); margin-bottom:10px; letter-spacing:.01em;}
.ch-section p{margin-bottom:12px; color:var(--slate-300);}
.ch-section ul.bullets{margin:0 0 12px; padding-left:2px;}
.ch-section ul.bullets li{position:relative; padding-left:20px; margin-bottom:8px; color:var(--slate-300);}
.ch-section ul.bullets li:before{content:"—"; position:absolute; left:0; color:var(--blue-bright);}
.ch-section li b{color:var(--white); font-weight:600;}

/* Timeline */
.timeline{margin-top:12px; border-left:2px solid var(--border-strong); padding-left:22px;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item:before{content:""; position:absolute; left:-29px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--blue); border:2px solid var(--bg);}
.tl-date{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:15px;}
.tl-text{font-size:14px; color:var(--slate-400); margin-top:2px;}

.keyterms{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.keyterm{font-size:12.5px; padding:6px 12px; border-radius:8px; background:var(--blue-soft); color:var(--slate-100); border:1px solid var(--border);}

/* Formula blocks — E-Math / A-Math */
.formula-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.formula-row{background:var(--bg); border:1px solid var(--border); border-left:3px solid var(--blue); border-radius:8px; padding:12px 15px;}
.f-expr{font-family:'Courier New',ui-monospace,monospace; font-size:14.5px; color:var(--white); letter-spacing:.01em;}
.f-desc{font-size:13px; color:var(--slate-400); margin-top:5px; line-height:1.5;}

/* ── Worked examples (Easy / Medium / O-Level tiers) ─────────── */
.example-set{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
.example-card{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:19px 21px;}
.example-level{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; border-radius:6px; margin-bottom:12px;}
.lvl-easy{background:rgba(52,211,153,.15); color:#6EE7B7;}
.lvl-medium{background:rgba(245,158,11,.15); color:#FCD34D;}
.lvl-olevel{background:rgba(251,113,133,.15); color:#FDA4AF;}
.example-q{color:var(--white); font-size:15px; line-height:1.65; font-weight:500; font-family:var(--font-display);}
.step-list{counter-reset:step; margin-top:15px;}
.step-list li{counter-increment:step; position:relative; padding-left:36px; margin-bottom:11px; color:var(--slate-300); font-size:14px; line-height:1.6;}
.step-list li:last-child{margin-bottom:0;}
.step-list li:before{content:counter(step); position:absolute; left:0; top:-1px; width:24px; height:24px; border-radius:50%; background:var(--blue-soft); color:var(--blue-bright); font-size:11.5px; font-weight:700; display:grid; place-items:center;}
.example-ans{margin-top:15px; padding:11px 15px; border-radius:8px; background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.3); color:var(--white); font-size:14px; font-weight:600; line-height:1.55;}
.example-ans b{color:#6EE7B7;}

/* ── Diagrams (SVG, generated at render time) ────────────────── */
.diagram-wrap{margin:16px 0; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; overflow-x:auto;}
.diagram-wrap svg{max-width:100%; height:auto; width:340px;}
.diagram-cap{margin-top:10px; font-size:12.5px; color:var(--slate-500);}
.example-card .diagram-wrap{margin:14px 0 4px;}

/* ── Per-topic extras: diagram + practice questions ──────────── */
.topic-extras{margin-top:8px; padding-top:4px; border-top:1px solid var(--border);}
.topic-extras .ch-section h4{font-size:.98rem;}
.dg-table{text-align:left; padding:0;}
.dtable{width:100%; border-collapse:collapse; font-size:13.5px;}
.dtable th{text-align:left; padding:10px 13px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--slate-500); border-bottom:1px solid var(--border-strong); white-space:nowrap;}
.dtable td{padding:10px 13px; border-bottom:1px solid var(--border); color:var(--slate-300); vertical-align:top; line-height:1.5;}
.dtable tr:last-child td{border-bottom:none;}
.dtable .dt-key{color:var(--white); font-weight:600; white-space:nowrap;}
.dtable td b{color:var(--white);}
.dg-table .diagram-cap{padding:11px 13px 13px; text-align:left; margin-top:0; border-top:1px solid var(--border);}

/* ── Matrix multiplication visual ─────────────────────────────── */
.mvz{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:18px 0; font-family:'Courier New',ui-monospace,monospace;}
.mvz-mat{display:grid; border-left:2px solid var(--slate-500); border-right:2px solid var(--slate-500); padding:10px 14px; gap:8px 20px;}
.mvz-cell{font-size:16px; color:var(--slate-100); text-align:center; min-width:28px;}
.mvz-cell.hi-row{background:rgba(59,130,246,.2); color:#93C5FD; border-radius:4px; font-weight:700;}
.mvz-cell.hi-col{background:rgba(245,158,11,.2); color:#FCD34D; border-radius:4px; font-weight:700;}
.mvz-op{font-size:22px; color:var(--slate-500); font-weight:300;}
.mvz-cap{text-align:center; color:var(--slate-400); font-size:13px; margin-top:-6px;}

/* Empty state */
.empty{text-align:center; padding:60px 20px; color:var(--slate-500);}

/* Footer note */
.foot{border-top:1px solid var(--border); margin-top:70px; padding:30px 0 50px; color:var(--slate-500); font-size:13px;}
.foot p{margin-bottom:8px;}
.note{background:var(--blue-soft); border:1px solid var(--border-strong); border-radius:12px; padding:16px 18px; margin-top:26px; font-size:13.5px; color:var(--slate-300);}
.note b{color:var(--white);}

/* ── Syllabus flags (struck-out / caveated cards) ───────────── */
.flash.struck{opacity:.62; border-color:rgba(251,113,133,.34); background:rgba(251,113,133,.04);}
.flash.struck .term{text-decoration:line-through; text-decoration-color:rgba(251,113,133,.75); text-decoration-thickness:2px;}
.flash.struck .def{color:var(--slate-500);}
.flash.caveat{border-color:rgba(245,158,11,.34);}
.syl-flag{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:5px; margin-top:9px;}
.flag-excluded{background:rgba(251,113,133,.16); color:#FDA4AF; border:1px solid rgba(251,113,133,.4);}
.flag-caveat{background:rgba(245,158,11,.15); color:#FCD34D; border:1px solid rgba(245,158,11,.4);}
.syl-why{margin-top:8px; font-size:12.5px; line-height:1.55; color:var(--slate-400); border-top:1px solid var(--border); padding-top:8px;}
.syl-why b{color:var(--slate-300);}
.audit{background:var(--card); border:1px solid var(--border); border-left:3px solid var(--blue); border-radius:12px; padding:18px 20px; margin-top:22px;}
.audit h4{font-size:1rem; margin-bottom:9px;}
.audit p{font-size:13.5px; color:var(--slate-400); line-height:1.6; margin-bottom:8px;}
.audit ul{margin:10px 0 4px; padding-left:2px;}
.audit li{position:relative; padding-left:19px; margin-bottom:7px; font-size:13.5px; color:var(--slate-300); line-height:1.55;}
.audit li:before{content:"—"; position:absolute; left:0; color:var(--blue-bright);}
.audit .src{font-size:12px; color:var(--slate-500); margin-top:12px;}
.toggle-btn{font-size:13px; font-weight:500; padding:9px 14px; border-radius:9px; border:1px solid var(--border); color:var(--slate-400); transition:.2s var(--ease); white-space:nowrap;}
.toggle-btn:hover{color:var(--white); border-color:var(--border-strong);}
.toggle-btn.on{background:var(--blue-soft); color:var(--blue-bright); border-color:var(--border-strong);}

/* ── Planner: phase banner ─────────────────────────────────── */
.phase-banner{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin-top:26px; padding:15px 18px; border-radius:12px;
  background:var(--blue-soft); border:1px solid var(--border-strong);
}
.ph-label{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--blue-bright); font-weight:700;}
.ph-name{font-family:var(--font-display); color:var(--white); font-size:1.06rem; font-weight:600;}
.ph-note{font-size:13px; color:var(--slate-400);}

/* ── Planner: countdown hero ───────────────────────────────── */
.countdown{margin-top:14px; padding:26px 20px; border-radius:14px; background:var(--card); border:1px solid var(--border); text-align:center;}
.cd-label{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.cd-row{display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
.cd-unit{min-width:76px; padding:12px 10px; border-radius:11px; background:var(--bg); border:1px solid var(--border);}
.cd-num{font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--white); line-height:1; font-variant-numeric:tabular-nums;}
.cd-cap{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--slate-500); margin-top:7px;}
.cd-sub{margin-top:16px; font-size:13px; color:var(--slate-400);}

/* ── Planner: stat tiles + meter ───────────────────────────── */
.stat-row{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
@media(min-width:620px){.stat-row{grid-template-columns:1fr 1fr;}}
@media(min-width:940px){.stat-row{grid-template-columns:repeat(3,1fr);}}
.tile{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px;}
.t-label{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.t-value{font-family:var(--font-display); font-size:1.85rem; font-weight:700; color:var(--white); margin-top:7px; line-height:1; font-variant-numeric:tabular-nums;}
.t-sub{font-size:13px; color:var(--slate-400); margin-top:7px;}
.meter{margin-top:13px; height:8px; border-radius:4px; background:var(--bg); overflow:hidden;}
.meter-fill{height:100%; border-radius:4px; background:var(--blue-bright); transition:width .45s var(--ease);}
.meter-fill.hit{background:var(--green);}

/* ── Planner: week navigation ──────────────────────────────── */
.week-nav{display:flex; align-items:center; gap:12px; margin-top:32px; flex-wrap:wrap;}
.wk-title{font-family:var(--font-display); color:var(--white); font-size:1.1rem; font-weight:600;}
.wk-sub{font-size:12.5px; color:var(--slate-500); margin-top:2px;}
.nav-btn{width:38px; height:38px; flex-shrink:0; border-radius:10px; border:1px solid var(--border); color:var(--slate-300); display:grid; place-items:center; transition:.2s var(--ease);}
.nav-btn:hover:not(:disabled){border-color:var(--slate-400); color:var(--white);}
.nav-btn:disabled{opacity:.3; cursor:not-allowed;}
.today-btn{font-size:12.5px; padding:9px 14px; border-radius:9px; border:1px solid var(--border); color:var(--slate-300); margin-left:auto;}
.today-btn:hover{color:var(--white); border-color:var(--border-strong);}

/* ── Planner: day + session rows ───────────────────────────── */
.day{background:var(--card); border:1px solid var(--border); border-radius:12px; margin-top:12px; overflow:hidden;}
.day.is-today{border-color:var(--blue);}
.day-head{display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.day-dow{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:1rem;}
.day-date{font-size:12.5px; color:var(--slate-500);}
.day-badge{margin-left:auto; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; font-weight:700;}
.badge-today{background:var(--blue); color:#fff;}
.badge-rest{background:rgba(148,163,184,.15); color:var(--slate-300);}
.sess{display:flex; align-items:flex-start; gap:13px; padding:14px 18px; border-bottom:1px solid var(--border);}
.sess:last-child{border-bottom:none;}
.sess-rest{padding:16px 18px; color:var(--slate-500); font-size:14px; font-style:italic;}
.cbx{flex-shrink:0; width:24px; height:24px; border-radius:7px; margin-top:1px; border:1.5px solid var(--border-strong); display:grid; place-items:center; color:transparent; font-size:13px; transition:.2s var(--ease);}
.cbx:hover{border-color:var(--slate-400);}
.sess.done .cbx{background:var(--green); border-color:var(--green); color:#04140a;}
.sess-body{flex:1; min-width:0;}
.sess-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sess-subj{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:3px 8px; border-radius:5px;}
.sj-math{background:rgba(59,130,246,.18); color:#93C5FD;}
.sj-phys{background:rgba(56,189,248,.15); color:#7DD3FC;}
.sj-chem{background:rgba(52,211,153,.15); color:#6EE7B7;}
.sj-eng{background:rgba(167,139,250,.18); color:#C4B5FD;}
.sj-paper{background:rgba(251,113,133,.15); color:#FDA4AF;}
.sj-hw{background:rgba(245,158,11,.15); color:#FCD34D;}
.sess-mins{font-size:12px; color:var(--slate-500); font-variant-numeric:tabular-nums;}
.sess-topic{margin-top:5px; color:var(--slate-100); font-size:14.5px; line-height:1.5;}
.sess.done .sess-topic{color:var(--slate-500); text-decoration:line-through;}
.sess-note{font-size:12.5px; color:var(--slate-500); margin-top:3px;}

/* ── Error log ─────────────────────────────────────────────── */
.log-form{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-top:22px;}
.fld{margin-bottom:13px;}
.fld label{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate-500); font-weight:700; margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--white); padding:10px 12px; border-radius:9px; font-size:14px;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue); outline-offset:1px;}
.fld textarea{resize:vertical; min-height:62px; line-height:1.55;}
.fld-row{display:grid; grid-template-columns:1fr; gap:0 13px;}
@media(min-width:620px){.fld-row{grid-template-columns:1fr 1fr;}}
.btn-solid{background:var(--blue); color:#fff; font-size:14px; font-weight:600; padding:11px 20px; border-radius:10px;}
.btn-solid:hover{background:var(--blue-bright);}
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:26px;}
.entry{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-top:12px;}
.entry.is-due{border-color:rgba(251,113,133,.45);}
.entry-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px;}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; border:1px solid transparent;}
.chip-due{background:rgba(251,113,133,.16); color:#FDA4AF; border-color:rgba(251,113,133,.4);}
.chip-sched{background:rgba(148,163,184,.12); color:var(--slate-400); border-color:var(--border);}
.entry-topic{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:1.04rem;}
.entry-field{margin-top:10px;}
.ef-label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.entry-field p{font-size:14px; color:var(--slate-300); margin-top:3px; line-height:1.55;}
.entry-actions{margin-top:13px; display:flex; gap:9px; flex-wrap:wrap;}
.mini-btn{font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid var(--border); color:var(--slate-300); transition:.2s var(--ease);}
.mini-btn:hover{border-color:var(--slate-400); color:var(--white);}
.mini-btn.danger:hover{border-color:rgba(251,113,133,.6); color:#FDA4AF;}
.tl-item.passed .tl-date,.tl-item.passed .tl-text{opacity:.45;}
.tl-item.target:before{background:var(--green);}

.hidden{display:none !important;}
.reset-btn{font-size:12px; color:var(--slate-500); text-decoration:underline; text-underline-offset:3px;}
.reset-btn:hover{color:var(--slate-300);}

<script>
/* ============================================================
   DATA — Singapore O-Level (2026). Definitions written in the
   phrasing examiners look for. Verify against the official SEAB
   syllabus & your school notes before your exam.
   ============================================================ */

const PHYSICS = {
  intro: "Every definition and recall point in the Pure Physics 6091 (2026) syllabus, organised by the syllabus's own 20 topics. Nothing here is off-syllabus — anything the syllabus excludes has been removed.",
  topics: [
    { name:"1. Physical Quantities, Units & Measurement", cards:[
      { t:"Scalar quantity", d:"A physical quantity that has magnitude only.", x:"e.g. distance, speed, mass, time, energy." },
      { t:"Vector quantity", d:"A physical quantity that has both magnitude and direction.", x:"e.g. displacement, velocity, acceleration, force. LO 1(g): add two vectors to find a resultant by a <b>graphical</b> method (tip-to-tail or parallelogram)." },
      { t:"SI base quantities", d:"The six base quantities and their units: mass (kg), length (m), time (s), current (A), temperature (K), amount of substance (mol).", x:"LO 1(b) — these six are named explicitly and must be recalled." },
      { t:"SI prefixes", d:"nano (n) 10⁻⁹, micro (µ) 10⁻⁶, milli (m) 10⁻³, centi (c) 10⁻², deci (d) 10⁻¹, kilo (k) 10³, mega (M) 10⁶, giga (G) 10⁹, tera (T) 10¹².", x:"LO 1(c) — exactly these nine prefixes are listed in the syllabus." },
    ]},
    { name:"2. Kinematics", cards:[
      { t:"Speed", d:"The distance travelled per unit time.", x:"Average speed = distance travelled ÷ time taken." },
      { t:"Velocity", d:"The rate of change of displacement — that is, speed in a stated direction." },
      { t:"Acceleration", d:"The rate of change of velocity.", x:"Uniform acceleration = change in velocity ÷ time taken." },
      { t:"Displacement–time graph", d:"The gradient gives the velocity. A horizontal line means the body is at rest; a straight slope means uniform velocity; a curve means non-uniform velocity.", x:"LO 2(f)." },
      { t:"Velocity–time graph", d:"The gradient gives the acceleration, and the area under the graph gives the displacement.", x:"LO 2(g),(h). Horizontal = uniform velocity; straight slope = uniform acceleration; curve = non-uniform acceleration." },
      { t:"Acceleration of free fall", d:"Constant for a body near the Earth and approximately 10 m/s².", x:"LO 2(i) — the syllabus value is <b>10 m/s²</b>, not 9.8." },
    ]},
    { name:"3. Dynamics", cards:[
      { t:"Contact and non-contact forces", d:"Contact forces act only by touching: friction, air resistance, tension, normal force. Non-contact forces act at a distance: gravitational, electrostatic and magnetic forces.", x:"LO 3(a)." },
      { t:"Balanced and unbalanced forces", d:"Balanced forces give zero resultant force, so a body stays at rest or keeps moving at constant velocity. Unbalanced forces give a resultant force, which accelerates the body in the direction of that force.", x:"LO 3(g)(i). This is what the syllabus asks for — reciting Newton's Laws is explicitly not required." },
      { t:"Resultant force and acceleration", d:"Resultant force = mass × acceleration, and the acceleration acts in the direction of the resultant force.", x:"LO 3(j) — F = ma is the examinable relationship." },
      { t:"Action–reaction pairs", d:"When body A exerts a force on body B, body B exerts an equal and opposite force on body A. The two forces act on different bodies, which is why they never cancel each other out.", x:"LO 3(g)(iii) — identifying the pair is examinable." },
      { t:"Free body diagram", d:"A diagram of a single body showing every force acting on it, drawn as labelled arrows.", x:"LO 3(h) — for forces in at most two dimensions." },
      { t:"Inertia", d:"The property of a body that resists a change in its motion. Mass is the measure of inertia.", x:"LO 3(k)." },
      { t:"Friction", d:"A force that opposes the relative motion, or the tendency to move, between two surfaces in contact.", x:"LO 3(l)." },
      { t:"Terminal velocity", d:"The constant maximum velocity of a falling body, reached when the upward air resistance has grown equal to its weight, so the resultant force and the acceleration are both zero.", x:"LO 3(m)." },
      { t:"Mass", d:"A measure of the amount of matter in a body.", x:"Syllabus wording, LO 3(b) — say <b>matter</b>, not substance. SI unit: kilogram (kg)." },
      { t:"Weight", d:"The gravitational force acting on an object.", x:"W = mg. SI unit: newton (N). Weight changes with location; mass does not." },
      { t:"Gravitational field", d:"A region in which a mass experiences a force due to gravitational attraction.", x:"LO 3(c)." },
      { t:"Gravitational field strength (g)", d:"The gravitational force acting per unit mass placed at that point.", x:"LO 3(d). g ≈ 10 N/kg on Earth, numerically equal to the acceleration of free fall." },
    ]},
    { name:"4. Turning Effects of Forces", cards:[
      { t:"Moment of a force", d:"The product of the force and the perpendicular distance from the pivot to the line of action of the force.", x:"Moment = F × d. SI unit: newton metre (N m)." },
      { t:"Principle of moments", d:"When a body is in equilibrium, the sum of the clockwise moments about a pivot equals the sum of the anticlockwise moments about the same pivot.", x:"LO 4(c) — stating this principle IS required." },
      { t:"Centre of gravity", d:"The single point through which the whole weight of a body may be taken to act.", x:"LO 4(e)." },
      { t:"Stability", d:"How well an object resists toppling. An object is more stable when its centre of gravity is lower and its base is wider.", x:"LO 4(f) — qualitative treatment only." },
    ]},
    { name:"5. Pressure", cards:[
      { t:"Pressure", d:"The force acting per unit area, applied perpendicular to the surface.", x:"p = F/A. SI unit: pascal (Pa) = N/m²." },
      { t:"Density", d:"The mass per unit volume of a substance.", x:"ρ = m/V. Units: kg/m³ or g/cm³." },
      { t:"Pressure due to a liquid column", d:"Pressure = height of column × density of the liquid × gravitational field strength.", x:"p = hρg. It increases with depth and does not depend on the cross-sectional area." },
      { t:"Hydraulic press", d:"Pressure applied to an enclosed liquid is transmitted equally throughout it. A small force on a small piston therefore produces a much larger force on a large piston, because pressure is the same but area is greater.", x:"LO 5(c) — liquids are effectively incompressible." },
      { t:"Measuring atmospheric pressure", d:"A column of liquid (e.g. mercury in a barometer) is supported by atmospheric pressure; the vertical height of that column is a measure of the atmospheric pressure.", x:"LO 5(f)." },
      { t:"Manometer", d:"A U-tube of liquid used to measure a pressure difference. The difference in the liquid levels in the two arms gives the pressure difference.", x:"LO 5(g)." },
    ]},
    { name:"6. Energy", cards:[
      { t:"Energy stores", d:"Energy is held in stores: kinetic, potential (gravitational, chemical, elastic), nuclear and internal.", x:"LO 6(a) — the 2026 syllabus uses the language of <b>stores and transfers</b>, not 'the capacity to do work'." },
      { t:"Energy transfers", d:"Energy moves between stores in four ways: mechanically (a force acting over a distance), electrically (by an electric current), by heating (due to a temperature difference), and by waves (electromagnetic or mechanical).", x:"LO 6(a)(i)–(iv)." },
      { t:"Kinetic energy", d:"The energy in the kinetic store of a body due to its motion.", x:"Eₖ = ½mv²." },
      { t:"Gravitational potential energy", d:"The energy in the gravitational potential store of a body due to its height above a reference level.", x:"Eₚ = mgh." },
      { t:"Principle of conservation of energy", d:"Energy cannot be created or destroyed; it can only be transferred from one store to another, and the total energy of an isolated system stays constant.", x:"LO 6(c) — stating this principle IS required." },
      { t:"Work done", d:"The product of the force and the distance moved in the direction of the force.", x:"W = F × d. SI unit: joule (J)." },
      { t:"Power", d:"The rate of energy transfer, or the rate of doing work.", x:"P = energy transfer ÷ time taken. SI unit: watt (W)." },
      { t:"Efficiency", d:"The ratio of the useful energy output to the total energy input.", x:"Efficiency = (useful energy output ÷ total energy input) × 100%." },
      { t:"Energy resources", d:"Non-renewable: fossil fuels and nuclear fuel. Renewable: biofuel, wind, tides, hydropower, geothermal and solar.", x:"LO 6(g) — compare on efficiency, cost, reliability and environmental impact." },
    ]},
    { name:"7. Kinetic Particle Model of Matter", cards:[
      { t:"Kinetic particle model — solids", d:"Particles are closely packed in a regular arrangement, vibrating about fixed positions with strong forces between them. A solid has fixed shape and fixed volume.", x:"LO 7(b)." },
      { t:"Kinetic particle model — liquids", d:"Particles are close together but irregularly arranged, able to slide past one another, with weaker forces than in a solid. A liquid has fixed volume but takes the shape of its container.", x:"LO 7(b)." },
      { t:"Kinetic particle model — gases", d:"Particles are far apart in random rapid motion with negligible forces between them. A gas has neither fixed shape nor fixed volume, and is easily compressed.", x:"LO 7(b)." },
      { t:"Brownian motion", d:"The random, jerky movement of small visible particles (e.g. smoke particles) caused by uneven bombardment by the much smaller, fast-moving, randomly-moving molecules of the surrounding fluid.", x:"LO 7(c) — evidence for the random motion of molecules. Required in <b>Physics</b> (though not in Chemistry)." },
      { t:"Temperature and kinetic energy", d:"A rise in the temperature of a body corresponds to an increase in the average kinetic energy of all its particles.", x:"LO 7(d)." },
      { t:"Pressure of a gas", d:"Gas particles move randomly and collide with the container walls. Each collision exerts a small force; the total force per unit area over all collisions is the gas pressure.", x:"LO 7(e)." },
    ]},
    { name:"8. Thermal Processes", cards:[
      { t:"Thermal equilibrium", d:"Energy is transferred by heating from a region of higher temperature to a region of lower temperature, until both regions reach the same temperature and net transfer stops.", x:"LO 8(a)." },
      { t:"Conduction", d:"The transfer of thermal energy through a material without any flow of the material itself, by the vibration of atoms/molecules and, in metals, by the movement of free electrons.", x:"LO 8(b) — metals conduct best because of their free electrons." },
      { t:"Convection", d:"The transfer of thermal energy through a fluid by convection currents: heated fluid expands, becomes less dense and rises, while cooler denser fluid sinks to take its place.", x:"LO 8(c) — explain in terms of density changes." },
      { t:"Radiation", d:"The transfer of thermal energy as electromagnetic waves (infrared), which requires no material medium and can travel through a vacuum.", x:"LO 8(d)." },
      { t:"Factors affecting radiation", d:"The rate of energy transfer by radiation to or from a body depends on its surface colour and texture (dull black is best at emitting and absorbing; shiny silver is worst), its surface temperature, and its surface area.", x:"LO 8(d)(i)–(iii)." },
    ]},
    { name:"9. Thermal Properties of Matter", cards:[
      { t:"Internal energy", d:"An energy store made up of the total kinetic energy of the randomly moving particles plus the total potential energy between those particles.", x:"LO 9(a)." },
      { t:"Heat capacity", d:"The amount of thermal energy required to raise the temperature of a body by 1 K (or 1 °C).", x:"Units: J/K or J/°C." },
      { t:"Specific heat capacity", d:"The amount of thermal energy required to raise the temperature of a unit mass of a substance by 1 K.", x:"E = mcΔθ. Units: J/(kg·K) or J/(g·°C)." },
      { t:"Latent heat", d:"The thermal energy absorbed or released during a change of state, with no change in temperature.", x:"LO 9(f)." },
      { t:"Specific latent heat", d:"The amount of thermal energy required to change the state of a unit mass of a substance without any change in temperature.", x:"E = ml. Fusion = solid ⇄ liquid; vaporisation = liquid ⇄ gas." },
      { t:"Latent heat in terms of particles", d:"During a change of state the energy supplied does not raise the average kinetic energy, so temperature stays constant. Instead it increases the potential energy of the particles by weakening or breaking the forces between them.", x:"LO 9(h) — this explains why the temperature plateaus." },
      { t:"Boiling", d:"A change from liquid to gas that occurs throughout the whole liquid, at one fixed temperature (the boiling point), with bubbles forming inside the liquid.", x:"LO 9(e)." },
      { t:"Evaporation", d:"A change from liquid to gas that happens only at the surface of the liquid, at any temperature below the boiling point, as the fastest molecules escape.", x:"LO 9(e) — evaporation cools the remaining liquid." },
      { t:"Cooling curve", d:"A graph of temperature against time as a substance cools. Sloping sections show the substance cooling in one state; horizontal plateaus show a change of state, where latent heat is released without a temperature change.", x:"LO 9(i) — you must be able to sketch and interpret one." },
    ]},
    { name:"10. General Properties of Waves", cards:[
      { t:"Wave motion", d:"A wave transfers energy from one place to another without transferring the medium itself.", x:"LO 10(a),(b). A wavefront is a line joining all points on a wave that are in phase." },
      { t:"Transverse wave", d:"A wave in which the particles of the medium vibrate perpendicular to the direction of energy transfer.", x:"e.g. light, water waves, all electromagnetic waves." },
      { t:"Longitudinal wave", d:"A wave in which the particles of the medium vibrate parallel to the direction of energy transfer.", x:"e.g. sound waves." },
      { t:"Amplitude", d:"The maximum displacement of a particle from its rest position." },
      { t:"Wavelength", d:"The distance between two successive points in phase, for example crest to crest.", x:"Symbol λ. Unit: metre." },
      { t:"Period", d:"The time taken for one complete oscillation, or for one complete wave to pass a point.", x:"T = 1/f. Unit: second." },
      { t:"Frequency", d:"The number of complete waves produced, or passing a point, per unit time.", x:"f = 1/T. Unit: hertz (Hz)." },
      { t:"Wave speed", d:"The distance moved by a wavefront per unit time.", x:"v = fλ." },
    ]},
    { name:"11. Sound", cards:[
      { t:"Production of sound", d:"Sound is produced by a vibrating source, and a material medium is required to transmit it. Sound cannot travel through a vacuum.", x:"LO 10(f)." },
      { t:"Longitudinal nature of sound", d:"Sound travels as a series of compressions (regions where particles are pushed close together, at higher pressure) and rarefactions (regions where particles are spread apart, at lower pressure).", x:"LO 10(g)." },
      { t:"Loudness and pitch", d:"Loudness depends on the amplitude of the sound wave — larger amplitude means louder. Pitch depends on the frequency — higher frequency means higher pitch.", x:"LO 10(h)." },
      { t:"Echo", d:"A sound heard again after it reflects off a hard surface. Distance is found from speed = distance ÷ time, remembering the sound travels to the surface and back, so the distance to the surface is half the total.", x:"LO 10(i)." },
      { t:"Ultrasound", d:"Sound of frequency above the human hearing range (above 20 000 Hz). It is used in sonar to measure the depth of water and locate objects, and in medical scanning to image soft tissue such as a foetus without using ionising radiation.", x:"LO 10(j)." },
    ]},
    { name:"12. Electromagnetic Spectrum", cards:[
      { t:"Properties of electromagnetic waves", d:"All electromagnetic waves are transverse and all travel at the same speed in a vacuum (3 × 10⁸ m/s).", x:"LO 11(a)." },
      { t:"Order of the spectrum", d:"Radio waves → microwaves → infrared → visible light → ultraviolet → X-rays → gamma rays.", x:"LO 11(b) — wavelength decreases and frequency increases from left to right." },
      { t:"Uses of the EM spectrum", d:"Radio: radio and TV communication, astronomy, RFID tags. Microwaves: mobile phones, microwave ovens, satellite TV. Infrared: remote controllers, intruder alarms, thermal imaging. Visible: photography, optical fibres. Ultraviolet: sunbeds, banknote authentication, disinfecting water. X-rays: medical radiology, security screening, detecting defects. Gamma: sterilising food, detecting and treating cancer.", x:"LO 11(c) — these exact examples are listed in the syllabus." },
      { t:"Hazards of electromagnetic waves", d:"Over-exposure damages living cells and tissue, through heating effects (e.g. microwaves, infrared) and ionising effects (ultraviolet, X-rays and gamma rays), which can cause cell mutation and cancer.", x:"LO 11(d)." },
    ]},
    { name:"13. Light", cards:[
      { t:"Law of reflection", d:"The angle of incidence is equal to the angle of reflection, both measured from the normal.", x:"LO 12(b)." },
      { t:"Refraction", d:"The change in direction of light as it passes from one medium into another, caused by a change in its speed.", x:"Towards the normal entering a denser medium; away from the normal on leaving it." },
      { t:"Refractive index", d:"The ratio of the speed of light in a vacuum to the speed of light in the medium.", x:"LO 12(d),(e): n = sin i / sin r, and this ratio is a constant for a given medium." },
      { t:"Critical angle", d:"The angle of incidence, in the optically denser medium, for which the angle of refraction in the less dense medium is exactly 90°.", x:"LO 12(f)." },
      { t:"Total internal reflection", d:"The complete reflection of light back inside the denser medium. It occurs when light travels from a denser to a less dense medium and the angle of incidence is greater than the critical angle.", x:"LO 12(f) — both conditions are needed." },
      { t:"Optical fibres", d:"Light is carried along a fibre by repeated total internal reflection. Used in telecommunications (large data capacity, low signal loss, no electrical interference) and in medicine, e.g. endoscopes to see inside the body.", x:"LO 12(g)." },
      { t:"Converging lens and focal length", d:"A thin converging lens brings a beam of light parallel to the principal axis to a point called the principal focus. The focal length is the distance between the optical centre of the lens and the principal focus.", x:"LO 12(h),(i)." },
      { t:"Image characteristics (converging lens)", d:"Describe every image by three things: real or virtual, magnified or diminished, and upright or inverted. Beyond 2F the image is real, diminished and inverted; between F and 2F it is real, magnified and inverted; inside F it is virtual, magnified and upright (a magnifying glass).", x:"LO 12(j),(k) — you must be able to draw the ray diagrams too." },
    ]},
    { name:"14. Static Electricity", cards:[
      { t:"Electric charge", d:"There are positive and negative charges. Like charges repel and unlike charges attract. Charge is measured in coulombs (C).", x:"LO 13(a),(b)." },
      { t:"Electric field", d:"A region in which an electric charge experiences a force.", x:"LO 13(c). The direction of a field line is the direction of the force on a positive test charge." },
      { t:"Charging by rubbing", d:"Rubbing transfers electrons from one material to the other. The material that gains electrons becomes negatively charged; the one that loses electrons becomes positively charged. Only electrons move — never protons.", x:"LO 13(f)." },
      { t:"Charging by induction", d:"A charged object brought near an uncharged conductor attracts opposite charge to the near side and repels like charge to the far side. Earthing the conductor lets the repelled charge escape; removing the earth, then the charged object, leaves the conductor charged oppositely.", x:"LO 13(g)." },
      { t:"Hazards of electrostatic charging", d:"Charge building up on fuel tankers or in dusty or flammable environments can cause a spark, which may ignite vapour or dust and cause an explosion. This is prevented by earthing.", x:"LO 13(h)." },
      { t:"Electrostatic precipitator", d:"A device that removes smoke and dust from waste gases. Particles are given a charge as they pass a charged grid, then attracted to oppositely charged plates where they collect and can be removed.", x:"LO 13(i)." },
    ]},
    { name:"15. Current of Electricity", cards:[
      { t:"Electric current", d:"The rate of flow of electric charge.", x:"I = Q/t, so charge = current × time. Unit: ampere (A)." },
      { t:"Conventional current vs electron flow", d:"Conventional current is taken to flow from the positive terminal to the negative terminal of a supply. Electrons actually flow the opposite way, from negative to positive.", x:"LO 14(b)." },
      { t:"Electromotive force (e.m.f.)", d:"The work done per unit charge by a source in driving charge around a complete circuit.", x:"Unit: volt (V). Cells in series: add their e.m.f.s." },
      { t:"Potential difference (p.d.)", d:"The work done per unit charge in driving charge through a component.", x:"V = W/Q. Unit: volt (V)." },
      { t:"Resistance", d:"The ratio of the potential difference across a component to the current flowing through it.", x:"R = V/I. Unit: ohm (Ω)." },

      { t:"Nucleon (mass) number, A", d:"The total number of protons and neutrons in the nucleus." },

      { t:"Nuclide notation", d:"A nuclide is a particular kind of nucleus. It is written with the nucleon number A above and the proton number Z below the element symbol.", x:"LO 20(c) — you must use this notation in decay equations." },

          "For a <b>cone</b>, distinguish the <b>slant height l</b> from the <b>vertical height h</b>: l² = r² + h².",
          "Read whether the solid is <b>open or closed</b> — that decides if the base circle is included.",
          "A <b>hemisphere</b> has curved area 2πr²; add πr² if the flat face is included.",
          "For composite solids, break the shape into standard parts and add or subtract.",
          "In radians: <b>s = rθ</b> and <b>A = ½r²θ</b>, with θ in radians, not degrees.",
        ]},
        { h:"Formulas", type:"formulas", body:[
          { f:"Arc length = (θ/360) × 2πr        Sector area = (θ/360) × πr²", d:"θ in degrees." },
          { f:"Sphere:  V = ⁴⁄₃πr³        Surface area = 4πr²", d:"Both given in the formula sheet, but know them cold." },
          { f:"Cone:  V = ⅓πr²h        Curved surface = πrl", d:"l is the slant height, not the vertical height." },
          { f:"Pyramid:  V = ⅓ × base area × height", d:"Any pyramid, whatever the base shape." },
          { f:"Cylinder:  V = πr²h        Curved surface = 2πrh", d:"Add 2πr² for a closed cylinder." },
        ]},
        { h:"Traps that cost marks", type:"bullets", body:[
          "Substituting the <b>vertical height into πrl</b> instead of the slant height.",
          "Including or omitting a base face when the question says open or closed.",
          "Mixing units — convert everything to the same unit <b>before</b> calculating.",
          "Rounding π too early. Use the calculator's π and round only at the end.",
        ]},
        { h:"r, h and l on a cone", type:"diagram", body:{ type:"cone", rLabel:"r", hLabel:"h", lLabel:"l", caption:"h is the vertical height (dashed, to the centre of the base); l is the slant height (along the surface). l² = r² + h²." } },
        { h:"Worked examples", type:"examples", body:[
          { level:"Easy",
            q:"Find the volume of a cylinder with radius 7 cm and height 10 cm, giving your answer to 3 significant figures.",
            steps:[
              "V = πr²h.",
              "= π × 7² × 10 = π × 49 × 10 = 490π.",
              "= 1539.38… cm³.",
            ],
            ans:"1540 cm³ (3 s.f.)." },
          { level:"Medium",
            q:"A cone has base radius 6 cm and vertical height 8 cm. Find (a) the slant height, (b) the curved surface area, giving your answer to 3 significant figures.",
            diagram:{ type:"cone", rLabel:"r = 6 cm", hLabel:"h = 8 cm", lLabel:"l = ?", caption:"Find l first from r and h before using πrl." },
            steps:[
              "l² = r² + h² = 6² + 8² = 36 + 64 = 100.",
              "l = √100 = 10 cm.",
              "Curved surface area = πrl = π × 6 × 10 = 60π.",
              "= 188.49… cm².",
            ],
            ans:"(a) l = 10 cm. (b) Curved surface area ≈ 188 cm² (3 s.f.)." },
          { level:"O-Level standard",
            q:"A solid consists of a cone of base radius 6 cm and height 8 cm mounted on a hemisphere of the same radius, joined base to base. Find (a) the total volume, (b) the total surface area of the solid, each to 3 significant figures.",
            steps:[
              "Volume of cone = (1/3)πr²h = (1/3) × π × 36 × 8 = 96π.",
              "Volume of hemisphere = (2/3)πr³ = (2/3) × π × 216 = 144π.",
              "Total volume = 96π + 144π = 240π = 754 cm³ (3 s.f.).",
              "The flat circular faces are joined together (hidden inside), so the outer surface is just the cone's curved surface plus the hemisphere's curved surface.",
              "Slant height of the cone: l² = 6²+8² = 100, l = 10 cm (as in the previous example).",
              "Curved surface of cone = πrl = π × 6 × 10 = 60π. Curved surface of hemisphere = 2πr² = 2π × 36 = 72π.",
              "Total surface area = 60π + 72π = 132π = 415 cm² (3 s.f.).",
            ],
            ans:"(a) 754 cm³. (b) 415 cm²." },
        ]},
      ]},
    { n:7, title:"Trigonometry — Applications", q:"Sine rule, cosine rule, bearings and 3D problems.",
      sections:[
        { h:"What you must know", type:"bullets", body:[
          "Use the <b>sine rule</b> when you have a matching side–angle pair. Use the <b>cosine rule</b> for three sides, or two sides and the included angle.",
          "<b>Bearings</b> are measured clockwise from North and always written with <b>three figures</b> — 045°, not 45°.",
          "<b>Angle of elevation</b> is measured up from the horizontal; <b>depression</b> is measured down from it.",
          "For <b>3D problems</b>, identify and redraw the single right-angled triangle you need as a flat 2D sketch.",
          "The <b>ambiguous case</b>: when finding an angle with the sine rule, the obtuse angle 180° − θ may also be valid.",
        ]},
        { h:"Formulas", type:"formulas", body:[
          { f:"a ÷ sin A = b ÷ sin B = c ÷ sin C", d:"Sine rule — needs a matching side and opposite angle." },
          { f:"a² = b² + c² − 2bc cos A", d:"Cosine rule — for SSS or SAS." },
          { f:"Area of triangle = ½ ab sin C", d:"C is the angle between sides a and b." },
        ]},
        { h:"Traps that cost marks", type:"bullets", body:[
          "Writing a bearing without padding it to <b>three figures</b>.",
          "Missing the <b>obtuse solution</b> in the ambiguous case of the sine rule.",
          "Using the area formula with an angle that is <b>not</b> between the two sides.",
          "Leaving the calculator in radian mode — check it shows DEG.",
        ]},
        { h:"Reading a bearing", type:"diagram", body:{ type:"bearing", angle:70, label:"B", origin:"A", caption:"A bearing of 070° from A: measured clockwise from North, always written with three figures." } },
        { h:"Worked examples", type:"examples", body:[
          { level:"Easy",
            q:"In triangle ABC, angle A = 40°, angle B = 65°, and side a (opposite A) = 8 cm. Find side b (opposite B), to 3 significant figures.",
            steps:[
              "Use the sine rule: a/sinA = b/sinB.",
              "b = a × sinB ÷ sinA = 8 × sin65° ÷ sin40°.",
              "= 8 × 0.9063 ÷ 0.6428 = 11.28…",
            ],
            ans:"b = 11.3 cm (3 s.f.)." },
          { level:"Medium",
            q:"In triangle PQR, PQ = 7 cm, QR = 9 cm, PR = 13 cm. Find angle Q (between PQ and QR), to 1 decimal place.",
            steps:[
              "Angle Q is opposite side PR = 13 cm; the two sides enclosing it are PQ = 7 and QR = 9.",
              "Cosine rule: cos Q = (PQ² + QR² − PR²) ÷ (2 × PQ × QR).",
              "= (7² + 9² − 13²) ÷ (2×7×9) = (49+81−169) ÷ 126 = −39 ÷ 126 = −0.3095.",
              "Q = cos⁻¹(−0.3095) = 108.0° (1 d.p.).",

            ans:"Angle Q ≈ 108.0°." },
          { level:"O-Level standard",
            q:"A ship sails from port A to port B, a distance of 15 km, on a bearing of 070°. It then sails from B to port C, a distance of 22 km, on a bearing of 160°. (a) Show that angle ABC = 90°. (b) Find the distance AC. (c) Find the bearing of A from C.",
            diagram:{ type:"bearing", angle:160, label:"C", origin:"B", caption:"At B, the ship turns onto a bearing of 160° for the second leg." },
            steps:[
              "(a) The reverse of leg A→B (bearing 070°) is B→A, on bearing 070°+180°=250°. Leg B→C is on bearing 160°. Angle ABC = 250° − 160° = 90°.",
              "(b) Since angle B = 90°, use Pythagoras: AC² = AB² + BC² = 15² + 22² = 225+484 = 709, so AC = √709 = 26.6 km (3 s.f.).",
              "(c) In right-angled triangle ABC, tan(∠ACB) = AB ÷ BC = 15/22 (opposite over adjacent to the right angle at B).",
              "∠ACB = tan⁻¹(15/22) = 34.3° (1 d.p.).",
              "The bearing of B from C is the reverse of the B→C leg: 160°+180° = 340°.",
              "A lies on the west (anticlockwise) side of CB as seen from C, so the bearing of A from C = 340° − 34.3° = 305.7° ≈ 306° (nearest degree).",
            ],
            ans:"(a) ∠ABC = 90°. (b) AC = 26.6 km. (c) Bearing of A from C ≈ 306°." },
        ]},
      ]},
    { n:8, title:"Coordinate Geometry and Graphs", q:"Straight lines, curves, and graphical solutions.",
      sections:[
        { h:"What you must know", type:"bullets", body:[
          "<b>y = mx + c</b>: m is the gradient, c the y-intercept. <b>Parallel lines have equal gradients.</b>",
          "Recognise the shapes: quadratic (parabola), cubic, reciprocal y = a/x (hyperbola), and exponential y = kaˣ.",
          "To <b>solve an equation graphically</b>, rearrange it so one side matches the drawn curve; the other side becomes a straight line to draw. The x-coordinates of the intersections are the solutions.",
          "The <b>gradient of a curve at a point</b> is found by drawing a tangent there and using rise ÷ run.",
        ]},
        { h:"Formulas", type:"formulas", body:[
          { f:"Gradient  m = (y₂ − y₁) ÷ (x₂ − x₁)", d:"Rise over run — keep the order consistent." },
          { f:"Midpoint = ( (x₁+x₂)/2 , (y₁+y₂)/2 )", d:"The average of the coordinates." },
          { f:"Distance = √( (x₂−x₁)² + (y₂−y₁)² )", d:"Pythagoras applied to the coordinate grid." },
        ]},
        { h:"Traps that cost marks", type:"bullets", body:[
          "Misreading the <b>scale</b> on the axes — check how much one small square is worth.",
          "Drawing a chord instead of a <b>tangent</b> when finding the gradient of a curve.",
          "Using too small a triangle for the gradient — make it span most of the tangent.",
          "Not plotting points accurately, or joining a smooth curve with straight segments.",
        ]},
        { h:"Worked examples", type:"examples", body:[
          { level:"Easy",
            q:"Points A(2,3) and B(8,11). Find (a) the gradient of AB, (b) the midpoint of AB, (c) the length AB.",
            steps:[
              "Gradient = (y₂−y₁)/(x₂−x₁) = (11−3)/(8−2) = 8/6 = 4/3.",
              "Midpoint = ((2+8)/2, (3+11)/2) = (5,7).",
              "Distance = √((8−2)² + (11−3)²) = √(36+64) = √100 = 10.",
            ],
            ans:"Gradient = 4/3; midpoint = (5,7); length = 10 units." },
          { level:"Medium",
            q:"Find the equation of the line passing through P(1,4) and Q(5,−4). Hence find the coordinates of the point where the line crosses the x-axis.",
            steps:[
              "Gradient m = (−4−4)/(5−1) = −8/4 = −2.",
              "Using point P(1,4): y − 4 = −2(x−1).",
              "y = −2x + 2 + 4 = −2x + 6.",
              "On the x-axis, y = 0: 0 = −2x+6 → x = 3.",
            ],
            ans:"Equation: y = −2x + 6. It crosses the x-axis at (3, 0)." },
          { level:"O-Level standard",
            q:"The graph of y = x³ − 4x has already been plotted. By drawing a suitable straight line on the same axes, explain how to solve the equation x³ − 6x + 3 = 0, stating the equation of the line to draw.",
            steps:[
              "The curve already drawn is y = x³ − 4x, so the target equation must be rearranged until one side is exactly x³ − 4x.",
              "Start: x³ − 6x + 3 = 0.",
              "Split −6x into −4x and −2x: x³ − 4x − 2x + 3 = 0.",
              "Move everything except x³−4x to the other side: x³ − 4x = 2x − 3.",
              "The line to draw is y = 2x − 3 (gradient 2, y-intercept −3).",
              "The x-coordinates where this line crosses the plotted curve are the solutions (roots) of the original equation.",
            ],
            ans:"Draw the line y = 2x − 3; its intersections with y = x³ − 4x give the solutions to x³ − 6x + 3 = 0." },
        ]},
      ]},
    { n:9, title:"Graphs in Practical Situations", q:"Distance–time and speed–time graphs.",
      sections:[
        { h:"What you must know", type:"bullets", body:[
          "On a <b>distance–time</b> graph, the <b>gradient is the speed</b>. A horizontal line means stationary.",
          "On a <b>speed–time</b> graph, the <b>gradient is the acceleration</b> and the <b>area under the graph is the distance</b>.",
          "A negative gradient on a speed–time graph is <b>deceleration</b>.",
          "Find the area by splitting the shape into triangles, rectangles and trapeziums.",
        ]},
        { h:"Formulas", type:"formulas", body:[
          { f:"Speed = distance ÷ time", d:"The gradient of a distance–time graph." },
          { f:"Acceleration = change in speed ÷ time", d:"The gradient of a speed–time graph." },
          { f:"Distance = area under a speed–time graph", d:"Split into triangles and trapeziums." },
          { f:"Area of trapezium = ½(a + b) × h", d:"a and b are the parallel sides." },
        ]},
        { h:"Traps that cost marks", type:"bullets", body:[
          "Confusing the two graph types — always read the <b>y-axis label</b> first.",
          "Taking the gradient of a speed–time graph when the question wants <b>distance</b> (the area).",
          "Forgetting to convert between km/h and m/s. Multiply by 1000 ÷ 3600 to go from km/h to m/s.",
          "Omitting units in the final answer.",
        ]},
        { h:"Worked examples", type:"examples", body:[
          { level:"Easy",
            q:"A car travels at a constant speed and covers 150 km in 2.5 hours. Find its speed in km/h, then convert this to m/s (3 s.f.).",
            steps:[
              "Speed = distance ÷ time = 150 ÷ 2.5 = 60 km/h.",
              "Convert km/h to m/s: multiply by 1000 ÷ 3600.",
              "60 × 1000 ÷ 3600 = 60000/3600 = 16.7 m/s (3 s.f.).",
            ],
            ans:"60 km/h = 16.7 m/s." },
          { level:"Medium",
            q:"A particle accelerates uniformly from rest to 12 m/s in 6 s, travels at a constant 12 m/s for the next 10 s, then decelerates uniformly to rest in 4 s. Find (a) the total distance travelled, (b) the average speed for the whole journey.",
            steps:[
              "Split the speed–time graph into three regions and find the area (= distance) of each.",
              "Acceleration phase (triangle): ½ × 6 × 12 = 36 m.",
              "Constant speed phase (rectangle): 12 × 10 = 120 m.",
              "Deceleration phase (triangle): ½ × 4 × 12 = 24 m.",
              "Total distance = 36 + 120 + 24 = 180 m. Total time = 6+10+4 = 20 s.",
              "Average speed = total distance ÷ total time = 180 ÷ 20 = 9 m/s.",

            ans:"(a) 180 m. (b) 9 m/s." },
          { level:"O-Level standard",
            q:"A particle starts at 5 m/s and accelerates uniformly to 17 m/s in 8 seconds. It then travels at this constant speed for T seconds, before decelerating uniformly to rest in 6 seconds. Given that the total distance travelled is 258 m, find (a) the acceleration during the first 8 seconds, (b) the value of T, (c) the total time for the journey.",
            steps:[
              "Acceleration = change in speed ÷ time = (17−5) ÷ 8 = 12/8 = 1.5 m/s².",
              "Distance in phase 1 (trapezium, 5→17 over 8 s) = average speed × time = ((5+17)/2) × 8 = 11×8 = 88 m.",
              "Distance in phase 3 (17→0 over 6 s) = ((17+0)/2) × 6 = 8.5×6 = 51 m.",
              "Distance in phase 2 (constant 17 m/s for T seconds) = 17T.",
              "Total distance: 88 + 17T + 51 = 258 → 17T = 258−139 = 119 → T = 7 s.",
              "Total time = 8 + T + 6 = 8+7+6 = 21 s.",

    { n:10, title:"Matrices", q:"Order, addition, multiplication, and how to 'divide' by a matrix.",
      sections:[
        { h:"What you must know", type:"bullets", body:[
          "Throughout this chapter, a matrix is written as its rows in brackets: <b>[[2,3],[1,2]]</b> means the matrix with top row (2,3) and bottom row (1,2).",
          "The <b>order</b> of a matrix is (number of rows) × (number of columns) — a 2×3 matrix has 2 rows and 3 columns. Order is always rows first, then columns.",
          "Two matrices are <b>equal</b> only if they have the same order <i>and</i> every corresponding entry is equal.",
          "<b>Addition and subtraction</b> only work between matrices of the <i>same order</i> — add or subtract corresponding entries.",
          "<b>Scalar multiplication</b> multiplies <i>every</i> entry by that scalar.",
          "<b>Matrix multiplication</b> only works when the number of columns of the first matrix equals the number of rows of the second. The result has (rows of first) × (columns of second).",
          "Matrix multiplication is <b>not commutative</b>: AB ≠ BA in general — order matters, unlike ordinary numbers.",
          "You cannot 'divide' by a matrix. Instead, to undo a matrix you <b>multiply by its inverse</b> — exactly like how dividing by 5 is the same as multiplying by 1/5.",
        ]},
        { h:"Adding, subtracting and scaling — the easy part", type:"bullets", body:[
          "Line the two matrices up and combine entry-by-entry, in the same position.",
          "If the orders don't match, addition and subtraction are simply <b>not defined</b> — don't force it.",
          "For kA (a scalar k times a matrix A), multiply every single entry of A by k, including entries that are already negative.",
        ]},
        { h:"How to multiply two matrices — step by step", type:"html", body:`
          <p>Multiplying matrices is not \"multiply matching positions\" — it's <b>row of the first, dotted with column of the second</b>. For A = [[2,3],[1,−4]] and B = [[5,0],[−2,6]], here's how the top-left entry of AB is built:</p>
          <div class="mvz">
            <div class="mvz-mat" style="grid-template-columns:repeat(2,1fr);">
              <div class="mvz-cell hi-row">2</div><div class="mvz-cell hi-row">3</div>
              <div class="mvz-cell">1</div><div class="mvz-cell">−4</div>
            </div>
            <div class="mvz-op">×</div>
            <div class="mvz-mat" style="grid-template-columns:repeat(2,1fr);">
              <div class="mvz-cell hi-col">5</div><div class="mvz-cell">0</div>
              <div class="mvz-cell hi-col">−2</div><div class="mvz-cell">6</div>
            </div>
            <div class="mvz-op">=</div>
            <div class="mvz-mat" style="grid-template-columns:repeat(2,1fr);">
              <div class="mvz-cell" style="color:#FCD34D;font-weight:700;">4</div><div class="mvz-cell">?</div>
              <div class="mvz-cell">?</div><div class="mvz-cell">?</div>
            </div>
          </div>
          <p class="mvz-cap">Row 1 of A (blue) pairs with column 1 of B (amber): 2×5 + 3×(−2) = 10 − 6 = <b style="color:#FCD34D;">4</b>. Every other entry of the answer is built the same way — its own row from A, dotted with its own column from B.</p>`
        },
        { h:"The full multiplication, entry by entry", type:"formulas", body:[
          { f:"(row 1, col 1):  2×5 + 3×(−2) = 10 − 6 = 4", d:"Row 1 of A with column 1 of B." },
          { f:"(row 1, col 2):  2×0 + 3×6 = 0 + 18 = 18", d:"Row 1 of A with column 2 of B." },
          { f:"(row 2, col 1):  1×5 + (−4)×(−2) = 5 + 8 = 13", d:"Row 2 of A with column 1 of B." },
          { f:"(row 2, col 2):  1×0 + (−4)×6 = 0 − 24 = −24", d:"Row 2 of A with column 2 of B." },
        ]},
        { h:"Matrices don't 'divide' — full explanation", type:"text", body:[
          "There is no such thing as A ÷ B for matrices. What you do instead is find the <b>inverse</b> of B (written B⁻¹) and <b>multiply</b> by it — the matrix equivalent of how 6 ÷ 2 gives the same answer as 6 × ½, because ½ is the 'inverse' of 2.",
          "Only <b>square</b> matrices (same number of rows and columns) can have an inverse, and even then, not always.",
          "For a 2×2 matrix A = [[a,b],[c,d]], first find the <b>determinant</b>: det A = ad − bc, a single number. If det A = 0, A is called <b>singular</b> and has <i>no</i> inverse — dividing by it is simply not possible, exactly like dividing by zero.",
          "If det A ≠ 0, the inverse is A⁻¹ = (1/det A) × [[d,−b],[−c,a]] — swap the two entries on the leading diagonal (a and d), negate the other two (b and c), then multiply everything by 1/det A.",
        ]},
        { h:"Determinant and inverse of a 2×2 matrix", type:"formulas", body:[
          { f:"det A = ad − bc,  for A = [[a,b],[c,d]]", d:"A single number. If det A = 0, A is singular — no inverse exists." },
          { f:"A⁻¹ = (1/det A) × [[d,−b],[−c,a]]", d:"Swap a and d, negate b and c, then scale every entry by 1/det A." },
          { f:"A A⁻¹ = A⁻¹ A = I = [[1,0],[0,1]]", d:"Multiplying a matrix by its inverse, in either order, gives the identity matrix — worth checking your inverse this way." },
        ]},
        { h:"Using the inverse to solve simultaneous equations", type:"text", body:[
          "A pair of simultaneous equations ax+by=e and cx+dy=f can be written as one matrix equation: [[a,b],[c,d]] [[x],[y]] = [[e],[f]], i.e. <b>MX = B</b>.",
          "Multiplying both sides on the left by M⁻¹ gives <b>X = M⁻¹B</b> — this hands you x and y directly, with no elimination or substitution needed.",
        ]},
        { h:"Formula", type:"formulas", body:[
          { f:"MX = B   ⟹   X = M⁻¹B", d:"Pre-multiply both sides by M⁻¹ — always multiply on the same side you'd need to cancel M from." },
        ]},
        { h:"Traps that cost marks", type:"bullets", body:[
          "Trying to add or multiply matrices of <b>incompatible order</b> — always check the orders line up before doing any arithmetic.",
          "Multiplying 'straight across' (row×row or position-by-position) instead of <b>row of the first, column of the second</b>.",
          "Assuming AB = BA. In general it doesn't — and sometimes only one of AB or BA is even defined.",
          "Forgetting to <b>swap</b> a and d (not just negate b and c) when writing out the inverse.",
          "Forgetting the <b>1/det A</b> scaling factor in front of the inverse matrix — it multiplies every entry, not just one.",
          "Not checking det A ≠ 0 before claiming an inverse exists.",
        ]},
        { h:"Worked examples", type:"examples", body:[
          { level:"Easy",
            q:"Given A = [[2,−1],[3,4]] and B = [[5,0],[−2,1]], find (a) A+B, (b) A−B, (c) 3A.",
            steps:[
              "Both matrices are 2×2, so addition and subtraction are defined.",
              "A+B: add corresponding entries → [[2+5, −1+0], [3+(−2), 4+1]] = [[7,−1],[1,5]].",
              "A−B: subtract corresponding entries → [[2−5, −1−0], [3−(−2), 4−1]] = [[−3,−1],[5,3]].",
              "3A: multiply every entry of A by 3 → [[3×2,3×(−1)],[3×3,3×4]] = [[6,−3],[9,12]].",
            ],
            ans:"A+B = [[7,−1],[1,5]];  A−B = [[−3,−1],[5,3]];  3A = [[6,−3],[9,12]]." },
          { level:"Medium",
            q:"A shop sells pens and rulers. On Monday it sells 8 pens and 5 rulers; on Tuesday it sells 6 pens and 9 rulers. A pen costs $2 and a ruler costs $3. Write the sales as a 2×2 matrix S (rows = days, columns = pens/rulers) and the prices as a column matrix P, then evaluate SP and explain what the result represents.",
            steps:[
              "S = [[8,5],[6,9]] (Monday: 8 pens, 5 rulers; Tuesday: 6 pens, 9 rulers). P = [[2],[3]] (pen price, ruler price).",
              "S is 2×2 and P is 2×1 — the columns of S (2) match the rows of P (2), so SP is defined and will be 2×1.",
              "Row 1 (Monday) with the column of P: 8×2 + 5×3 = 16+15 = 31.",
              "Row 2 (Tuesday) with the column of P: 6×2 + 9×3 = 12+27 = 39.",
            ],
            ans:"SP = [[31],[39]] — Monday's total takings were $31, Tuesday's were $39." },
          { level:"O-Level standard",
            q:"(a) Find the inverse of the matrix M = [[2,3],[1,2]]. (b) Hence solve the simultaneous equations 2x+3y=8 and x+2y=5.",
            steps:[
              "det M = (2×2) − (3×1) = 4 − 3 = 1.",
              "Since det M ≠ 0, M has an inverse. Swap the leading diagonal (2 and 2 — no visible change here since they're equal), negate the other diagonal (3→−3, 1→−1), then divide by det M = 1.",
              "M⁻¹ = (1/1) × [[2,−3],[−1,2]] = [[2,−3],[−1,2]].",
              "Write the equations as MX = B: [[2,3],[1,2]] [[x],[y]] = [[8],[5]].",
              "Multiply both sides by M⁻¹ on the left: X = M⁻¹B.",
              "X = [[2,−3],[−1,2]] × [[8],[5]] = [[2×8 + (−3)×5], [(−1)×8 + 2×5]] = [[16−15],[−8+10]] = [[1],[2]].",
              "So x=1 and y=2. Check: 2(1)+3(2)=8 ✓ and 1+2(2)=5 ✓.",
            ],
            ans:"M⁻¹ = [[2,−3],[−1,2]];  x = 1, y = 2." },
        ]},
      ]},
  ]
};
