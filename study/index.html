            boxes:[{x:130,y:84,w:100,h:44,text:"MOLES|n",color:'#F59E0B'},
                   {x:14,y:14,w:96,h:40,text:"mass (g)",color:'#3B82F6'},
                   {x:250,y:14,w:96,h:40,text:"volume of gas|(dm³)",color:'#34D399'},
                   {x:14,y:158,w:96,h:40,text:"concentration|× volume",color:'#A78BFA'},
                   {x:250,y:158,w:96,h:40,text:"number of|particles",color:'#FB7185'}],
            arrows:[{x1:110,y1:44,x2:140,y2:82,label:'÷ Mr',dx:-16,dy:2},
                    {x1:250,y1:44,x2:220,y2:82,label:'÷ 24',dx:16,dy:2},
                    {x1:110,y1:172,x2:140,y2:130,label:'× vol',dx:-16,dy:6},
                    {x1:250,y1:172,x2:220,y2:130,label:'÷ 6.02e23',dx:24,dy:6}],
            caption:"Everything routes through moles — never convert directly between the outer boxes." } },
        { h:"The three conversions", type:"formulas", body:[
          { f:"moles = mass ÷ Mr", d:"For solids and liquids of known formula." },
          { f:"moles of gas = volume in dm³ ÷ 24", d:"At room temperature and pressure. 1000 cm³ = 1 dm³." },
          { f:"moles = concentration × volume in dm³", d:"For solutions. Divide cm³ by 1000 first." },
        ]},
        { h:"Limiting reactants", type:"text", body:[
          "When both reactant quantities are given, one runs out first — the <b>limiting reactant</b> — and it alone determines how much product forms. The other is in excess and some is left over.",
          "The method: convert both to moles, divide each by its coefficient in the balanced equation, and whichever gives the smaller number is limiting. Work the rest of the question from that one only.",
        ]},
        { h:"Yield and purity", type:"text", body:[
          "<b>Percentage yield</b> compares what you actually got with the theoretical maximum. It is below 100% because of losses in transfer, incomplete reactions and side reactions.",
          "<b>Percentage purity</b> compares the mass of the desired substance with the total sample mass. Do not confuse the two — they answer different questions.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Write the balanced equation first, always. Without it the ratio step is guesswork.",
          "Convert cm³ to dm³ by dividing by 1000. This single slip causes more lost marks than any other in the topic.",
          "Carry full accuracy through and round only at the very end, to 3 significant figures.",
        ]},
      ]},
    { n:5, title:"Acid-Base Chemistry", q:"H⁺ and OH⁻, and how to make any salt you are asked for.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "An acid produces <b>H⁺ ions</b> in water; an alkali produces <b>OH⁻ ions</b>. Everything else in this topic — pH, neutralisation, salt preparation — follows from those two ions.",
        ]},
        { h:"Strong versus weak, concentrated versus dilute", type:"text", body:[
          "These are two completely different ideas, and mixing them up is a guaranteed lost mark.",
          "<b>Strong or weak</b> is about <i>ionisation</i>: a strong acid is completely ionised in water so it releases the maximum H⁺; a weak acid is only partially ionised, so far fewer H⁺ ions are present. It is a fixed chemical property.",
          "<b>Concentrated or dilute</b> is about <i>how much acid is dissolved per unit volume</i>. You can have a concentrated weak acid or a dilute strong acid — the two scales are independent.",
        ]},
        { h:"The pH scale", type:"diagram", body:{ type:"phscale", caption:"Below 7 more H⁺, 7 neutral, above 7 more OH⁻." } },
        { h:"The three acid reactions", type:"formulas", body:[
          { f:"acid + metal → salt + hydrogen", d:"Only for metals above hydrogen in the reactivity series." },
          { f:"acid + base → salt + water", d:"Base = metal oxide or hydroxide. This is neutralisation." },
          { f:"acid + carbonate → salt + water + carbon dioxide", d:"The effervescence and limewater test identify the carbonate." },
        ]},
        { h:"Neutralisation", type:"text", body:[
          "Strip away the spectator ions and every neutralisation is the same single reaction: H⁺ + OH⁻ → H₂O. That is why acids and alkalis cancel each other out regardless of which particular acid and alkali are involved.",
          "The practical application worth knowing is soil: excess acidity harms crops and is treated by adding calcium hydroxide (slaked lime).",
        ]},
        { h:"Making salts — pick the right route", type:"text", body:[
          "Which method you use depends entirely on <b>solubility</b>, so learn the solubility rules first: all nitrates and all Group 1 and ammonium salts are soluble; most chlorides are soluble except silver and lead; most sulfates are soluble except barium, calcium and lead; most carbonates and hydroxides are insoluble except Group 1 and ammonium.",
          "<b>Soluble salt from an insoluble base:</b> add the base, metal or carbonate in <i>excess</i> to warm acid, filter off what is left over, then crystallise. The excess guarantees all the acid is used up, and being insoluble it filters out cleanly.",
          "<b>Soluble salt from a soluble base (alkali):</b> you cannot filter off an excess, so use <b>titration</b> to find the exact volumes, then repeat without indicator.",
          "<b>Insoluble salt:</b> mix two solutions containing the required ions so it precipitates, then filter, wash and dry.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Salt-preparation answers must name the method <b>and</b> justify it from solubility.",
          "Explaining the 'excess' step is worth a mark: it ensures no unreacted acid remains, and the excess can be filtered out because it is insoluble.",
        ]},
      ]},
    { n:6, title:"Qualitative Analysis", q:"Identifying unknowns — the topic that decides your practical mark.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Qualitative analysis is pure pattern recognition. There is no derivation and no shortcut: you learn the grid, then read the observations carefully. It is heavily weighted in Paper 3, and it is the most reliably scored topic in the whole syllabus — provided you have memorised the table.",
        ]},
        { h:"Cation tests", type:"diagram", body:{ type:"table", caption:"The 'soluble in excess' column is what separates the look-alikes.",
            head:["Cation","+ aqueous NaOH","+ aqueous NH₃"],
            rows:[["Aluminium, Al³⁺","White ppt, <b>soluble in excess</b>","White ppt, insoluble in excess"],
                  ["Ammonium, NH₄⁺","No ppt; NH₃ gas on warming","—"],
                  ["Calcium, Ca²⁺","White ppt, insoluble in excess","<b>No ppt</b>"],
                  ["Copper(II), Cu²⁺","Light blue ppt, insoluble","Light blue ppt, <b>soluble giving dark blue</b>"],
                  ["Iron(II), Fe²⁺","Green ppt, insoluble","Green ppt, insoluble"],
                  ["Iron(III), Fe³⁺","Red-brown ppt, insoluble","Red-brown ppt, insoluble"],
                  ["Zinc, Zn²⁺","White ppt, soluble in excess","White ppt, <b>soluble in excess</b>"]] } },
        { h:"Telling the white precipitates apart", type:"text", body:[
          "Three cations give a white precipitate with sodium hydroxide — aluminium, calcium and zinc — so NaOH alone can never identify them. Aqueous ammonia is what separates them.",
          "<b>Calcium</b> gives no precipitate at all with ammonia. <b>Zinc</b> gives a white precipitate that dissolves in excess ammonia. <b>Aluminium</b> gives a white precipitate that does <i>not</i> dissolve in excess ammonia. Learn those three lines and the hardest part of the topic is done.",
        ]},
        { h:"Anion and gas tests", type:"diagram", body:{ type:"table", caption:"Note that three of the anion tests begin by acidifying with dilute nitric acid.",
            head:["Test for","Method","Positive result"],
            rows:[["Carbonate, CO₃²⁻","Add dilute acid","Effervescence; gas turns limewater milky"],
                  ["Chloride, Cl⁻","Acidify with HNO₃, add AgNO₃","<b>White</b> precipitate"],
                  ["Iodide, I⁻","Acidify with HNO₃, add AgNO₃","<b>Yellow</b> precipitate"],
                  ["Nitrate, NO₃⁻","Add NaOH + aluminium foil, warm","Ammonia — damp red litmus turns blue"],
                  ["Sulfate, SO₄²⁻","Acidify with HNO₃, add Ba(NO₃)₂","White precipitate"],
                  ["Ammonia, NH₃","Damp red litmus","Turns blue"],
                  ["Carbon dioxide, CO₂","Limewater","Turns milky"],
                  ["Chlorine, Cl₂","Damp litmus","Bleached"],
                  ["Hydrogen, H₂","Lighted splint","Pops"],
                  ["Oxygen, O₂","Glowing splint","Relights"],
                  ["Sulfur dioxide, SO₂","Acidified KMnO₄","Purple → colourless"]] } },
        { h:"Why you acidify first", type:"text", body:[
          "Before testing for chloride, iodide or sulfate you add dilute <b>nitric acid</b>. This is not a ritual — carbonate ions would also give a white precipitate with silver nitrate or barium nitrate, producing a false positive.",
          "The nitric acid destroys any carbonate present (fizzing it off as carbon dioxide) so that whatever precipitate you then see must be genuine. Explaining this correctly is a standard exam mark.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Report exactly what you see — colour, and whether a precipitate forms and whether it redissolves. Never write conclusions in the observation column.",
          "Add reagents <b>drop by drop first, then in excess</b>: the whole diagnosis often depends on what happens in excess.",
          "'Soluble in excess NaOH' narrows it to aluminium or zinc; ammonia then decides between them.",
        ]},
      ]},
    { n:7, title:"Redox Chemistry and Electrolysis", q:"Electron transfer, and using electricity to force reactions.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Redox is about <b>electron transfer</b>. Oxidation is loss of electrons, reduction is gain — <b>OIL RIG</b>. The two always happen together, because electrons lost by one species must be gained by another.",
          "The older definitions in terms of oxygen and hydrogen still work, but the electron definition is the one that covers every case and the one examiners want.",
        ]},
        { h:"Agents", type:"text", body:[
          "The naming trips people up because it is deliberately counter-intuitive. An <b>oxidising agent</b> oxidises something else, and is therefore itself <i>reduced</i> — it gains electrons. A <b>reducing agent</b> reduces something else, so it is itself <i>oxidised</i> — it loses electrons.",
          "The agent always does the opposite to itself of what its name suggests it does to others.",
        ]},
        { h:"Electrolysis", type:"text", body:[
          "Electrolysis uses electrical energy to force a decomposition that would not happen spontaneously. It only works when ions are <b>free to move</b> — so the compound must be molten or dissolved. A solid ionic compound has its ions locked in the lattice and does not conduct.",
          "The <b>cathode</b> is negative, so it attracts positive cations, which gain electrons — <b>reduction</b> at the cathode. The <b>anode</b> is positive, attracting anions, which lose electrons — oxidation at the anode.",
        ]},
        { h:"An electrolysis cell", type:"diagram", body:{ type:"apparatus", mode:"electrolysis", caption:"Reduction at the cathode (negative), oxidation at the anode (positive)." } },
        { h:"Selective discharge", type:"text", body:[
          "In aqueous solution, water supplies H⁺ and OH⁻ alongside the salt's own ions, so there is a competition at each electrode.",
          "At the <b>cathode</b>, the ion of the <b>less reactive</b> element is discharged. So in sodium chloride solution, hydrogen is produced rather than sodium.",
          "At the <b>anode</b>, concentration decides. In a <b>concentrated</b> halide solution the halide wins and chlorine is released. In a <b>dilute</b> solution, or with sulfates, hydroxide wins and oxygen is released.",
          "This is why concentrated brine gives chlorine but dilute brine gives oxygen — same solution, different concentration, different product.",
        ]},
        { h:"Applications", type:"text", body:[
          "<b>Purifying copper:</b> the impure copper is the anode and dissolves (Cu → Cu²⁺ + 2e⁻); pure copper deposits on the cathode (Cu²⁺ + 2e⁻ → Cu). Impurities, being less reactive, fall below as anode sludge. The electrolyte concentration stays constant because copper enters solution as fast as it leaves.",
          "<b>Electroplating:</b> make the object the cathode in a solution of the plating metal's ions, to improve appearance or resist corrosion.",
          "<b>Simple cells:</b> two different metals in an electrolyte generate a voltage, and the bigger the reactivity difference the bigger the voltage. The more reactive metal is the negative electrode.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Half-equations must balance for both atoms and charge. Electrons go on the left for reduction, the right for oxidation.",
          "For anode products in solution, state whether it is concentrated or dilute — that is the deciding factor.",
        ]},
      ]},
    { n:8, title:"Patterns in the Periodic Table", q:"Why the table's shape predicts chemical behaviour.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "The elements are arranged by increasing proton number, and that arrangement puts elements with the same number of outer electrons in the same <b>group</b>. Since chemistry is governed by outer electrons, elements in a group behave alike — the table is a predictive tool, not a list.",
          "The group number gives the outer electrons; the period number gives the number of shells.",
        ]},
        { h:"Group 1 — alkali metals", type:"text", body:[
          "Lithium, sodium and potassium: soft, low-density metals with one outer electron they lose easily. Going <b>down</b> the group reactivity <b>increases</b>, because the outer electron is further from the nucleus and more shielded, so it is lost more readily.",
          "Melting point decreases down the group, and all react vigorously with water to give hydrogen and an alkaline hydroxide.",
        ]},
        { h:"Group 17 — halogens", type:"text", body:[
          "Chlorine, bromine and iodine: diatomic non-metals needing one electron to complete their shell. Going down the group they get darker and change gas → liquid → solid, and reactivity <b>decreases</b> — the opposite trend to Group 1, and for the same underlying reason: the outer shell is further from the nucleus, so it attracts an extra electron less strongly.",
          "A more reactive halogen <b>displaces</b> a less reactive one from its halide solution. Chlorine displaces iodine from potassium iodide, turning the solution brown; bromine cannot displace chlorine from a chloride.",
        ]},
        { h:"Group 18 and transition elements", type:"text", body:[
          "<b>Noble gases</b> are monatomic and unreactive because their outer shell is already full — which is exactly why they are used where an inert atmosphere is needed, such as argon in light bulbs and in steel making.",
          "<b>Transition elements</b> sit in the middle block: high melting points and densities, <b>variable oxidation states</b>, and <b>coloured compounds</b>. They and their compounds are widely used as catalysts.",
        ]},
        { h:"The reactivity series", type:"diagram", body:{ type:"ladder", alt:"Reactivity series",
            items:[{t:"potassium  K"},{t:"sodium  Na"},{t:"calcium  Ca"},{t:"magnesium  Mg"},{t:"zinc  Zn"},{t:"iron  Fe"},{t:"lead  Pb"},{t:"(hydrogen)  H",hi:true},{t:"copper  Cu"},{t:"silver  Ag"}],
            caption:"The syllabus list. Hydrogen is the dividing line for acid + metal reactions." } },
        { h:"Metals and corrosion", type:"text", body:[
          "The reactivity series predicts displacement, how a metal reacts with acid and water, and how its ore must be extracted: the most reactive metals need electrolysis, moderately reactive ones can be reduced by carbon, and unreactive ones like silver occur native. The more reactive the metal, the more stable its carbonate is to heat.",
          "<b>Rusting</b> needs both oxygen and water. Barrier methods — painting, greasing, galvanising — keep them out. <b>Sacrificial protection</b> works differently: attach a more reactive metal such as magnesium or zinc, and it corrodes preferentially, protecting the iron until it is used up and replaced.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Explain group trends using <b>distance from the nucleus and shielding</b>, not just 'it gets more reactive'.",
          "Remember the two trends run opposite ways: Group 1 more reactive down, Group 17 less reactive down.",
        ]},
      ]},
    { n:9, title:"Chemical Energetics", q:"Where the heat comes from — bonds breaking and bonds forming.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Every reaction breaks some bonds and makes others. <b>Breaking bonds always absorbs energy</b>; <b>making bonds always releases energy</b>. Which of those two totals is bigger decides whether the reaction warms or cools its surroundings.",
        ]},
        { h:"Exothermic and endothermic", type:"text", body:[
          "If more energy is released making bonds than was absorbed breaking them, there is energy left over — it escapes to the surroundings, the temperature rises, and the reaction is <b>exothermic</b> with a negative ΔH. Combustion, neutralisation and respiration are all exothermic.",
          "If breaking costs more than making returns, the shortfall is taken from the surroundings, which cool. That is <b>endothermic</b>, with a positive ΔH — thermal decomposition and photosynthesis are examples.",
          "Be careful with the sign convention: energy released <i>by the reaction</i> means the products store less energy than the reactants, so ΔH is negative even though the surroundings get hotter.",
        ]},
        { h:"Energy profile", type:"diagram", body:{ type:"energyprofile", mode:"exo", caption:"Exothermic: products lower than reactants, ΔH negative. Eₐ is the barrier that must be climbed first." } },
        { h:"Activation energy", type:"text", body:[
          "Even a strongly exothermic reaction needs a push to start, because bonds must be broken before new ones can form. That initial barrier is the <b>activation energy</b> — the minimum energy colliding particles must have to react.",
          "It explains why petrol does not spontaneously ignite: the energy released is huge, but the barrier still has to be crossed first by a spark.",
          "A <b>catalyst</b> lowers this barrier by providing an alternative pathway. It changes the <i>height of the hump</i>, not the levels of reactants or products — so ΔH is completely unchanged.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Label energy profiles fully: reactants, products, Eₐ from reactants to the peak, and ΔH from reactants to products.",
          "State clearly that a catalyst lowers Eₐ but leaves ΔH unchanged — that contrast is the marked point.",
        ]},
      ]},
    { n:10, title:"Rate of Reactions", q:"Collision theory, and the four ways to make a reaction go faster.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Particles must <b>collide</b> to react, and the collision must have at least the activation energy. So anything that makes collisions more frequent, or more energetic, speeds the reaction up. Every rate factor is one of those two effects — say which one when you explain.",
        ]},
        { h:"The four factors", type:"bullets", body:[
          "<b>Concentration (or gas pressure):</b> more particles in the same volume means collisions are more frequent.",
          "<b>Surface area:</b> smaller pieces expose more surface, so more particles are available to be hit — powder reacts far faster than lumps.",
          "<b>Temperature:</b> the only factor with <i>two</i> effects. Particles move faster, so collide more often, <b>and</b> a greater proportion of collisions have energy above the activation energy. The second effect is the larger one — say both.",
          "<b>Catalyst:</b> provides an alternative pathway of lower activation energy, so a greater proportion of existing collisions are successful. It is not used up.",
        ]},
        { h:"Reading rate graphs", type:"diagram", body:{ type:"axes", alt:"Rate of reaction curves", xlabel:"time", ylabel:"volume of gas", xmax:10, ymax:10, grid:false,
            xticks:[{v:0,t:'0'}], yticks:[],
            series:[{pts:[[0,0],[1,4.4],[2,6.6],[3.2,7.8],[5,8.4],[8,8.6],[10,8.6]],color:'#FB7185'},
                    {pts:[[0,0],[2,3.2],[4,5.4],[6,7],[8,8.1],[10,8.6]],color:'#3B82F6'}],
            notes:[{x:5.4,y:9.4,text:'faster',color:'#FB7185'},{x:9.6,y:6.2,text:'slower',color:'#93C5FD',anchor:'end'}],
            caption:"Steeper start = faster rate. Same final height = same amount of limiting reactant." } },
        { h:"Why curves flatten", type:"text", body:[
          "A rate curve is always steepest at the start and gradually flattens. That is because the reactants are being used up, so their concentration falls, collisions become less frequent, and the rate drops. The curve goes horizontal when the limiting reactant is completely used up and the reaction has stopped.",
          "The final <b>height</b> depends only on how much limiting reactant there was — not on how fast it reacted. So changing temperature or particle size changes the steepness but <i>not</i> the final volume. That distinction is a very common exam question.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Temperature answers need <b>both</b> effects: more frequent collisions and a greater proportion exceeding the activation energy.",
          "If the amount of limiting reactant is unchanged, both curves must end at the same height — check your sketch.",
        ]},
      ]},
    { n:11, title:"Organic Chemistry", q:"Carbon chains, functional groups and polymers.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Carbon forms four bonds and chains with itself endlessly, so organic compounds are vast in number but highly organised. They group into <b>homologous series</b>: families sharing a general formula and a <b>functional group</b>, where each member differs from the next by –CH₂–.",
          "That means you never learn compounds individually. Learn the functional group and you know the chemistry of the whole family.",
        ]},
        { h:"The four series", type:"diagram", body:{ type:"table", caption:"Learn the functional group and general formula together.",
            head:["Series","Functional group","General formula","Example"],
            rows:[["Alkanes","only C–C single bonds","CₙH₂ₙ₊₂","methane, CH₄"],
                  ["Alkenes","C=C double bond","CₙH₂ₙ","ethene, C₂H₄"],
                  ["Alcohols","–OH","CₙH₂ₙ₊₁OH","ethanol, C₂H₅OH"],
                  ["Carboxylic acids","–CO₂H","CₙH₂ₙ₊₁CO₂H","ethanoic acid, CH₃CO₂H"]] } },
        { h:"Saturated and unsaturated", type:"text", body:[
          "<b>Alkanes</b> are saturated — only single C–C bonds — and are fairly unreactive apart from burning and substitution with chlorine.",
          "<b>Alkenes</b> contain a C=C double bond and are unsaturated, which makes them much more reactive: the double bond can open up and add atoms across it. That is why alkenes undergo addition with bromine, with steam (to make alcohols) and with hydrogen.",
          "The test follows directly: shake with <b>aqueous bromine</b>. An alkene decolourises it from orange to colourless by addition; an alkane leaves it unchanged.",
        ]},
        { h:"Crude oil and cracking", type:"text", body:[
          "Crude oil is a mixture of hydrocarbons separated by fractional distillation into fractions with different boiling ranges. Larger molecules have stronger intermolecular forces, so they boil at higher temperatures and are more viscous.",
          "The problem is that distillation gives too much of the heavy, less useful fractions and not enough petrol. <b>Cracking</b> solves this by breaking large molecules into smaller, more useful ones — producing alkenes and hydrogen as a bonus, which then feed the polymer industry.",
        ]},
        { h:"Alcohols, acids and esters", type:"text", body:[
          "<b>Ethanol</b> is made two ways: adding steam to ethene with a catalyst, or fermenting glucose with yeast at 30–40 °C without air.",
          "Oxidising ethanol — by air or by acidified potassium manganate(VII) — gives <b>ethanoic acid</b>, a weak carboxylic acid that behaves like any acid with carbonates, bases and metals.",
          "A carboxylic acid plus an alcohol gives an <b>ester</b> (plus water). Esters are named alcohol-part first: ethanol + ethanoic acid → ethyl ethanoate.",
        ]},
        { h:"Polymers", type:"text", body:[
          "<b>Addition polymerisation</b> joins many unsaturated monomers into one long chain, with <i>no other product</i> — ethene becomes poly(ethene).",
          "<b>Condensation polymerisation</b> joins monomers while eliminating a small molecule such as water each time — this gives nylon (a polyamide) and Terylene (a polyester).",
          "Most plastics are non-biodegradable, so they persist in landfill, and burning them can release toxic gases. Recycling is either physical (melt into pellets) or chemical (<b>depolymerisation</b> and cracking back into feedstock and fuel).",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "State the bromine water result precisely: <b>orange to colourless</b> — 'clear' is not a colour and scores nothing.",
          "Addition polymers form with no other product; condensation polymers eliminate a small molecule. Questions often hinge on that difference.",
        ]},
      ]},
    { n:12, title:"Maintaining Air Quality", q:"Pollutants, where they come from, and how we clean them up.",
      sections:[
        { h:"The big idea", type:"text", body:[
          "Clean dry air is roughly 78% nitrogen, 21% oxygen, and the rest noble gases (mainly argon) plus carbon dioxide. Pollution is what we add to that, and every pollutant question follows the same three-part structure: source, effect, and remedy.",
        ]},
        { h:"The pollutants and their sources", type:"bullets", body:[
          "<b>Carbon monoxide</b> — incomplete combustion of carbon-containing fuels, where there is not enough oxygen.",
          "<b>Oxides of nitrogen</b> — lightning, and internal combustion engines, where the very high temperature makes nitrogen and oxygen from the air react together.",
          "<b>Sulfur dioxide</b> — volcanoes, and burning fossil fuels that contain sulfur impurities.",
          "<b>Methane</b>, <b>ozone</b> and <b>unburnt hydrocarbons</b> complete the syllabus list of six.",
        ]},
        { h:"Their effects", type:"text", body:[
          "<b>Carbon monoxide</b> is toxic because it binds to haemoglobin in place of oxygen, so the blood can no longer carry oxygen properly — and it is odourless, which is what makes it so dangerous.",
          "<b>Sulfur dioxide and nitrogen dioxide</b> dissolve in rain water to form <b>acid rain</b>, which corrodes limestone buildings and statues, damages plants, and acidifies lakes so that aquatic life dies.",
        ]},
        { h:"Cleaning up", type:"text", body:[
          "A <b>catalytic converter</b> in a car exhaust uses redox reactions over a large catalyst surface: carbon monoxide is oxidised to carbon dioxide, and oxides of nitrogen are reduced to nitrogen.",
          "<b>Calcium carbonate</b> is used both to neutralise acidified lakes and soils, and in flue gas desulfurisation to strip sulfur dioxide out of power station emissions before release.",
        ]},
        { h:"The carbon cycle", type:"diagram", body:{ type:"flow", alt:"The carbon cycle", w:360, h:220,
            boxes:[{x:118,y:14,w:124,h:44,text:"CO₂ in the|atmosphere",color:'#94A3B8'},
                   {x:12,y:150,w:120,h:52,text:"plants|(photosynthesis|removes CO₂)",color:'#34D399'},
                   {x:228,y:150,w:120,h:52,text:"combustion &|respiration|(add CO₂)",color:'#FB7185'}],
            arrows:[{x1:116,y1:52,x2:74,y2:146,label:'removed',dx:-26,dy:0},
                    {x1:246,y1:146,x2:236,y2:56,label:'released',dx:30,dy:0}],
            caption:"Photosynthesis removes CO₂; respiration and combustion return it. Fossil fuels tip the balance." } },
        { h:"Ozone and greenhouse gases", type:"text", body:[
          "High in the atmosphere, <b>ozone</b> absorbs harmful ultraviolet radiation. <b>CFCs</b> release chlorine-containing compounds that react with and destroy ozone, thinning the layer and letting more UV through — raising skin cancer risk.",
          "Separately, <b>carbon dioxide and methane</b> are greenhouse gases that may contribute to global warming, bringing more extreme weather and melting polar ice. Keep the two issues distinct: ozone depletion and global warming are different problems with different causes, and confusing them is a common error.",
        ]},
        { h:"Exam technique", type:"bullets", body:[
          "Answer pollutant questions in the order <b>source → effect → remedy</b>; questions are usually structured that way.",
          "Do not mix up the ozone layer with the greenhouse effect — different gases, different mechanisms, different consequences.",
        ]},
      ]},
  ]
};

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=midnight(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(d){ return d.getDate()+' '+MON[d.getMonth()]; }

/* Plan anchor — set once on first visit so week numbers stay stable. */
function planStart(){
  let s = localStorage.getItem('osp-start');
  if(!s){
    const t = midnight(new Date());
    const dow = (t.getDay()+6)%7;                 // Mon=0 … Sun=6
    const m = mondayOf(t);
    s = ymd(dow >= 4 ? addDays(m,7) : m);         // Fri/Sat/Sun → begin next Monday
    localStorage.setItem('osp-start', s);
  }
  return parseYmd(s);
}
function restDay(){ const v = localStorage.getItem('osp-rest'); return v===null ? 0 : +v; }  // 0 = Sunday
function gymOrder(){ // weekday numbers Mon→Sun, minus the rest day
  return [1,2,3,4,5,6,0].filter(d=>d!==restDay());
}
function weekIndexOf(monday){ return Math.round((monday - planStart())/(7*864e5)) + 1; }

function mathBlockFor(weekIdx, gi){
  if(weekIdx <= 3){
    return { subject:'A-Math', cls:'sj-math', topic: ALGEBRA[((weekIdx-1)*6+gi) % ALGEBRA.length], note:'Algebra at A-Math depth — your weak area' };
  }
  if(weekIdx <= 6){
    return { subject:'A-Math', cls:'sj-math', topic: TRIG[((weekIdx-4)*6+gi) % TRIG.length], note:'Trigonometry & mensuration — your weak area' };
  }
  const em = (weekIdx % 2 === 1);
  return { subject: em?'E-Math':'A-Math', cls:'sj-math', topic: PAPER_CYCLE[gi % PAPER_CYCLE.length], note:(em?'E-Math':'A-Math')+' week — alternating' };
}

/* All sessions for a given date. Homework is on every day, including the rest day. */
function hwMins(){ const v = localStorage.getItem('osp-hw'); return v===null ? 45 : +v; }

function sessionsFor(date){
  const wk = weekIndexOf(mondayOf(date));
  const dow = date.getDay();
  const rest = (dow === restDay());
  const out = [];
  if(!rest){
    const order = gymOrder();
    const gi = order.indexOf(dow);
    const m = mathBlockFor(wk, gi);
    out.push({ key:'math', subject:'Post-gym · '+m.subject, cls:m.cls, topic:m.topic, note:m.note, mins:45 });
    if(gi===1) out.push({ key:'phys', subject:'Physics', cls:'sj-phys', topic:'Physics revision — definitions, then practice questions', note:'Use the Physics tab to drill definitions first', mins:45 });
    if(gi===2) out.push({ key:'chem', subject:'Chemistry', cls:'sj-chem', topic:'Chemistry revision — definitions, then practice questions', note:'Use the Chemistry tab to drill definitions first', mins:45 });
    if(gi===3) out.push({ key:'eng',  subject:'English',   cls:'sj-eng',  topic:'English — comprehension, summary or situational writing', note:'Rotate skills each week; add listening practice from Sep', mins:45 });
    if(gi===5){
      const paper = wk<=3 ? 'Extended algebra practice — past-paper section'
                  : wk<=6 ? 'Extended trigonometry practice — past-paper section'
                  : 'Full timed paper — ' + ((wk%2===1)?'E-Math':'A-Math') + ' Paper 1';
      out.push({ key:'paper', subject:'Timed paper', cls:'sj-paper', topic:paper, note:'135 min — exactly one full O-Level paper', mins:135 });
    }
  }
  out.push({ key:'hw', subject:'Homework', cls:'sj-hw', hw:true, mins:hwMins(),
             topic:'School homework & corrections',
             note: rest ? 'Deadlines don’t take a rest day — do this, then stop.'
                        : 'Work due first, then corrections from marked work' });
  return { rest, sessions:out };
}

function sessId(date, key){ return ymd(date)+'|'+key; }
function doneSet(){ try{ return new Set(JSON.parse(localStorage.getItem('osp-done')||'[]')); }catch(e){ return new Set(); } }
function saveDone(s){ localStorage.setItem('osp-done', JSON.stringify([...s])); }
function isDone(id){ return doneSet().has(id); }
function toggleDone(id){ const s=doneSet(); s.has(id)?s.delete(id):s.add(id); saveDone(s); }

/* Overall phase from the calendar month. */
function currentPhase(){
  const now = new Date();
  if(now < new Date(2026,8,1))  return { name:'Topical revision', note:'Build the weak topics now — algebra, then trigonometry.' };
  if(now < new Date(2026,9,1))  return { name:'Prelims / timed papers', note:'Shift to full papers under exam timing.' };
  return { name:'Final review — no new material', note:'Only revisit what you already know. Redo logged errors.' };
}

/* Streak: consecutive post-gym math blocks completed. Today pending doesn't break it. */
function mathStreak(){
  const today = midnight(new Date());
  const done = doneSet();
  let d = new Date(planStart());
  const days = [];
  while(d <= today){
    if(d.getDay() !== restDay()) days.push(new Date(d));
    d = addDays(d,1);
  }
  let n = 0;
  for(let i=days.length-1; i>=0; i--){
    const id = sessId(days[i],'math');
    if(done.has(id)){ n++; continue; }
    if(ymd(days[i]) === ymd(today)) continue;  // today still open
    break;
  }
  return n;
}

/* Weekly completed hours vs the 9-hour target. */
function weekStats(monday){
  const done = doneSet();
  let total=0, doneMins=0, doneCount=0, count=0, hwDone=0, hwTotal=0, hwMinsDone=0;
  for(let i=0;i<7;i++){
    const d = addDays(monday,i);
    sessionsFor(d).sessions.forEach(s=>{
      const isOn = done.has(sessId(d,s.key));
      if(s.hw){ hwTotal++; if(isOn){ hwDone++; hwMinsDone += s.mins; } return; }  // tracked apart from the revision target
      total += s.mins; count++;
      if(isOn){ doneMins += s.mins; doneCount++; }
    });
  }
  return { total, doneMins, doneCount, count, hwDone, hwTotal, hwMinsDone };
}

/* localStorage: known cards */
function knownKey(sub){ return 'osd-known-'+sub; }
function getKnown(sub){ try{ return JSON.parse(localStorage.getItem(knownKey(sub))||'[]'); }catch(e){ return []; } }
function setKnown(sub, arr){ localStorage.setItem(knownKey(sub), JSON.stringify(arr)); }
function isKnown(sub, id){ return getKnown(sub).includes(id); }
function toggleKnown(sub, id){
  const arr = getKnown(sub); const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  setKnown(sub, arr); return arr.includes(id);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function matches(card, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (card.t + ' ' + card.d + ' ' + (card.x||'')).toLowerCase().includes(q);
}

    ${filters.map(f=>`<button class="topic-pill ${state.logFilter===f?'active':''}" data-filter="${f}">${f==='all'?'All subjects':f}</button>`).join('')}
  </div>

  <div style="margin-top:6px;">${list}</div>
  ` + footerHTML();

  document.getElementById('log-form').addEventListener('submit', ev=>{
    ev.preventDefault();
    const date = document.getElementById('f-date').value;
    const arr = getLog();
    arr.push({
      id: 'e'+Date.now(),
      subject: document.getElementById('f-subject').value,
      topic:   document.getElementById('f-topic').value.trim(),
      mistake: document.getElementById('f-mistake').value.trim(),
      method:  document.getElementById('f-method').value.trim(),
      date,
      redo:    ymd(addDays(parseYmd(date), 4)),
      redone:  false,
    });
    saveLog(arr); renderLog();
  });
  app.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.logFilter=b.dataset.filter; renderLog(); });
  });
  app.querySelectorAll('[data-redone]').forEach(b=>{

      const arr=getLog(); const e=arr.find(x=>x.id===b.dataset.redone);

    });
  });
  app.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Delete this entry?')) return;
      saveLog(getLog().filter(x=>x.id!==b.dataset.del)); renderLog();
    });
  });
}

function auditHTML(sub, allCards){

    ? ' (Sound is split out from Waves here, so you see 21 headings for the syllabus’s 20 topics)'

    <p style="margin-top:12px;color:var(--slate-300);"><b>Removed, and why:</b></p>
    <ul>${AUDIT_REMOVED[sub].map(g=>`<li>${g}</li>`).join('')}</ul>
    <div class="src">Source: Singapore–Cambridge GCE Ordinary Level (2026) ${sub==='physics'?'Physics':'Chemistry'} (Syllabus ${code}), © MOE &amp; Cambridge University Press &amp; Assessment 2024. Always cross-check against your own school notes.</div>

/* Diagram + practice questions appended under each topic's cards.
   Hidden while searching, since the cards shown are then a filtered subset. */
function topicExtrasHTML(sub, topicName){
  if(state.query) return '';
  const ex = (TOPIC_EXTRAS[sub]||{})[topicName];
  if(!ex) return '';
  let html = '';
  if(ex.diagram){
    html += `<div class="ch-section" style="margin-top:26px;"><h4>Diagram</h4>${renderDiagram(ex.diagram)}</div>`;
  }
  if(ex.practice && ex.practice.length){
    html += renderSection({ h:'Practice questions', type:'examples', body:ex.practice });
  }
  return html ? `<div class="topic-extras">${html}</div>` : '';
}

function drawCards(subj, allCards){
  const sub = state.subject;
  const deck = document.getElementById('deck');
  const topics = state.topic==='all' ? subj.topics : subj.topics.filter(t=>t.name===state.topic);
  let out = '';
  let shown = 0;
  topics.forEach(t=>{
    const cards = t.cards
      .map((c,ci)=>({...c, id:sub+'-'+subj.topics.indexOf(t)+'-'+ci}))
      .filter(c=>matches(c, state.query));
    if(!cards.length) return;
    shown += cards.length;
    out += `<div class="topic-block"><h3>${esc(t.name)}</h3><div class="topic-sub">${cards.length} definition${cards.length>1?'s':''}</div><div class="card-grid">`;
    cards.forEach(c=>{
      const known = isKnown(sub, c.id);
      const quiz = state.mode==='quiz';
      out += `
      <div class="flash ${known?'known':''}" data-id="${c.id}">
        <button class="mark" data-mark="${c.id}" title="Mark as learnt">✓</button>
        <div class="term">${esc(c.t)}</div>
        ${quiz ? `<div class="prompt">Define this — then tap to check.</div>` : ``}
        <div class="def ${quiz?'hidden':''}">${esc(c.d)}</div>
        ${c.x ? `<div class="extra ${quiz?'hidden':''}">${c.x}</div>` : ``}
        ${quiz ? `<div class="reveal-hint">Tap to reveal ▾</div>` : ``}
      </div>`;
    });
    out += `</div>${topicExtrasHTML(sub, t.name)}</div>`;
  });
  deck.innerHTML = shown ? out : `<div class="empty">No definitions match "${esc(state.query)}".</div>`;

  // card interactions
  deck.querySelectorAll('.flash').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('.mark')) return;
      const def = card.querySelector('.def');
      const extra = card.querySelector('.extra');
      const hint = card.querySelector('.reveal-hint');
      if(def){ def.classList.toggle('hidden'); }
      if(extra){ extra.classList.toggle('hidden'); }
      if(hint){ hint.style.display = def && def.classList.contains('hidden') ? 'block':'none'; }
    });
  });
  deck.querySelectorAll('.mark').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.dataset.mark;
      toggleKnown(state.subject, id);
      renderDeck(DATA[state.subject]); // refresh counts
    });
  });
}

function wireDeck(subj, allCards){
  const search = document.getElementById('search');
  search.addEventListener('input', ()=>{ state.query = search.value; drawCards(subj, allCards); });
  document.getElementById('modeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    drawCards(subj, allCards);
  });
  document.getElementById('topicNav').addEventListener('click', e=>{
    const b = e.target.closest('.topic-pill'); if(!b) return;
    state.topic = b.dataset.topic;
    document.querySelectorAll('.topic-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawCards(subj, allCards);
  });
  const reset = document.getElementById('resetKnown');
  reset.addEventListener('click', e=>{
    e.preventDefault();
    if(confirm('Reset your learnt progress for this subject?')){
      setKnown(state.subject, []);
      renderDeck(DATA[state.subject]);
    }
  });
}

const DG = { bg:'#0B1120', line:'#475569', grid:'#1E293B', ink:'#F8FAFC',
             mute:'#94A3B8', blue:'#3B82F6', bl2:'#93C5FD', grn:'#34D399',
             amb:'#F59E0B', am2:'#FCD34D', ros:'#FB7185', vio:'#A78BFA' };

/* Generic labelled graph. series:[{pts:[[x,y]..],color,dash,label}] in data units. */
function svgAxes(p){
  const W=p.w||360, H=p.h||230, L=46, B=40, T=16, R=14;
  const xmax=p.xmax||10, ymax=p.ymax||10;
  const PX=x=> L + (x/xmax)*(W-L-R);
  const PY=y=> (H-B) - (y/ymax)*(H-B-T);
  let g='';
  if(p.grid!==false){
    for(let i=1;i<=4;i++){ const y=PY(ymax*i/4); g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${DG.grid}" stroke-width="1"/>`; }
  }
  const shade=(p.shade||[]).map(s=>`<polygon points="${s.pts.map(q=>PX(q[0])+','+PY(q[1])).join(' ')}" fill="${s.color||DG.blue}" fill-opacity="0.18"/>`).join('');
  const ser=(p.series||[]).map(s=>`<polyline points="${s.pts.map(q=>PX(q[0])+','+PY(q[1])).join(' ')}" fill="none" stroke="${s.color||DG.blue}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${s.dash?` stroke-dasharray="${s.dash}"`:''}/>`).join('');
  const notes=(p.notes||[]).map(n=>`<text x="${PX(n.x)}" y="${PY(n.y)}" font-size="11.5" fill="${n.color||DG.mute}" text-anchor="${n.anchor||'middle'}">${esc(n.text)}</text>`).join('');
  const dots=(p.dots||[]).map(d=>`<circle cx="${PX(d.x)}" cy="${PY(d.y)}" r="4" fill="${d.color||DG.am2}"/>`).join('');
  const xt=(p.xticks||[]).map(t=>`<text x="${PX(t.v)}" y="${H-B+16}" font-size="10.5" fill="${DG.mute}" text-anchor="middle">${esc(t.t)}</text>`).join('');
  const yt=(p.yticks||[]).map(t=>`<text x="${L-7}" y="${PY(t.v)+4}" font-size="10.5" fill="${DG.mute}" text-anchor="end">${esc(t.t)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(p.alt||'graph')}">
    ${g}${shade}
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="${DG.line}" stroke-width="1.6"/>
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="${DG.line}" stroke-width="1.6"/>
    ${ser}${dots}${notes}${xt}${yt}
    <text x="${(W+L)/2}" y="${H-6}" font-size="11.5" fill="${DG.mute}" text-anchor="middle">${esc(p.xlabel||'')}</text>
    <text x="14" y="${(H-B+T)/2}" font-size="11.5" fill="${DG.mute}" text-anchor="middle" transform="rotate(-90 14 ${(H-B+T)/2})">${esc(p.ylabel||'')}</text>
  </svg>`;
}

/* Three boxes of particles: solid, liquid, gas. */
function svgParticles(){
  const box=(x,title,mode)=>{
    let c='';
    if(mode==='solid'){ for(let r=0;r<4;r++) for(let k=0;k<4;k++) c+=`<circle cx="${x+16+k*18}" cy="${44+r*18}" r="7" fill="${DG.blue}" fill-opacity="0.85"/>`; }
    if(mode==='liquid'){ const pos=[[18,48],[38,44],[58,50],[76,45],[22,68],[44,64],[64,70],[80,64],[20,88],[42,86],[62,90],[78,84]];
      pos.forEach(q=>c+=`<circle cx="${x+q[0]}" cy="${q[1]}" r="7" fill="${DG.grn}" fill-opacity="0.85"/>`); }
    if(mode==='gas'){ const pos=[[20,40],[62,34],[86,58],[30,72],[70,84],[46,56],[16,96],[88,96]];
      pos.forEach(q=>c+=`<circle cx="${x+q[0]}" cy="${q[1]}" r="6.5" fill="${DG.ros}" fill-opacity="0.85"/>`); }
    return `<rect x="${x+6}" y="28" width="96" height="84" rx="6" fill="none" stroke="${DG.line}" stroke-width="1.5"/>${c}
      <text x="${x+54}" y="20" font-size="12.5" font-weight="700" fill="${DG.ink}" text-anchor="middle">${title}</text>`;
  };
  return `<svg viewBox="0 0 340 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Particle arrangement in solids, liquids and gases">
    ${box(0,'Solid','solid')}${box(112,'Liquid','liquid')}${box(224,'Gas','gas')}</svg>`;
}

/* Transverse wave with labels, or longitudinal compressions/rarefactions. */
function svgWaveLabelled(p){
  if(p.mode==='longitudinal'){
    let bars='';
    const dens=[6,5,4,3,4,6,9,12,9,6,4,3,4,5,7,10,13,10,7,5];
    let x=24;
    dens.forEach(d=>{ for(let i=0;i<2;i++){ bars+=`<line x1="${x}" y1="40" x2="${x}" y2="96" stroke="${DG.bl2}" stroke-width="2"/>`; x+=d; } });
    return `<svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Longitudinal sound wave">
      ${bars}
      <text x="96" y="30" font-size="11.5" fill="${DG.am2}" text-anchor="middle">compression</text>
      <text x="60" y="118" font-size="11.5" fill="${DG.grn}" text-anchor="middle">rarefaction</text>

    <line x1="67.5" y1="21" x2="67.5" y2="31" stroke="${DG.grn}" stroke-width="2"/>
    <line x1="217.5" y1="21" x2="217.5" y2="31" stroke="${DG.grn}" stroke-width="2"/>
    <text x="142.5" y="17" font-size="11.5" fill="${DG.grn}" text-anchor="middle">wavelength λ</text>
    <text x="67.5" y="${mid-A-8}" font-size="11" fill="${DG.mute}" text-anchor="middle">crest</text>
    <text x="142.5" y="${mid+A+17}" font-size="11" fill="${DG.mute}" text-anchor="middle">trough</text>
    <text x="180" y="152" font-size="11" fill="${DG.mute}" text-anchor="middle">particles vibrate perpendicular to the direction of travel</text></svg>`;

/* Free body diagram. */
function svgFreeBody(p){
  const F=(dx,dy,lab,col)=>`<line x1="160" y1="100" x2="${160+dx}" y2="${100+dy}" stroke="${col}" stroke-width="2.6" marker-end="url(#fb-${col.slice(1)})"/>
    <text x="${160+dx*1.18}" y="${100+dy*1.18+4}" font-size="11.5" font-weight="600" fill="${col}" text-anchor="middle">${lab}</text>`;
  const cols=[DG.grn,DG.ros,DG.am2,DG.bl2];
  const defs='<defs>'+cols.map(c=>`<marker id="fb-${c.slice(1)}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${c}"/></marker>`).join('')+'</defs>';
  return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free body diagram">
    ${defs}
    <rect x="134" y="80" width="52" height="40" rx="4" fill="${DG.blue}" fill-opacity="0.25" stroke="${DG.blue}" stroke-width="2"/>
    ${F(0,-62,'normal force N',DG.grn)}
    ${F(0,62,'weight W',DG.ros)}
    ${F(78,0,'driving force F',DG.am2)}
    ${F(-70,0,'friction f',DG.bl2)}
    <text x="160" y="192" font-size="11" fill="${DG.mute}" text-anchor="middle">balanced → constant velocity · unbalanced → acceleration</text></svg>`;
}

/* Atom with electron shells. */
function svgAtomShells(p){
  const shells=p.shells||[2,8,1];
  const rs=[30,52,74];
  const rings=shells.map((n,i)=>{
    const r=rs[i];
    let e='';
    for(let k=0;k<n;k++){ const a=(k/n)*2*Math.PI - Math.PI/2;
      e+=`<circle cx="${130+r*Math.cos(a)}" cy="${100+r*Math.sin(a)}" r="4" fill="${DG.bl2}"/>`; }

/* Flow diagram: labelled boxes joined by arrows. */
function svgFlow(p){
  const boxes=(p.boxes||[]).map(b=>`<rect x="${b.x}" y="${b.y}" width="${b.w||96}" height="${b.h||40}" rx="7" fill="${b.color||DG.blue}" fill-opacity="0.16" stroke="${b.color||DG.blue}" stroke-width="1.8"/>
    ${(b.text||'').split('|').map((t,i,a)=>`<text x="${b.x+(b.w||96)/2}" y="${b.y+(b.h||40)/2 + (i-(a.length-1)/2)*13 + 4}" font-size="11" font-weight="600" fill="${DG.ink}" text-anchor="middle">${esc(t)}</text>`).join('')}`).join('');
  const arrows=(p.arrows||[]).map(a=>`<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${a.color||DG.mute}" stroke-width="2" marker-end="url(#fl-ar)"/>

/* Dot-and-cross bonding diagram (two atoms). */
function svgDotCross(p){
  const ring=(cx,sym,own,shared,useCross)=>{
    let e='';
    for(let k=0;k<own;k++){ const a=(k/Math.max(own,1))*2*Math.PI - Math.PI/2 + (p.spin||0);
      e+= useCross
        ? `<path d="M${cx+42*Math.cos(a)-3.5},${100+42*Math.sin(a)-3.5} l7,7 M${cx+42*Math.cos(a)+3.5},${100+42*Math.sin(a)-3.5} l-7,7" stroke="${DG.am2}" stroke-width="1.9"/>`
        : `<circle cx="${cx+42*Math.cos(a)}" cy="${100+42*Math.sin(a)}" r="3.6" fill="${DG.bl2}"/>`;
    }
    return `<circle cx="${cx}" cy="100" r="42" fill="none" stroke="${DG.line}" stroke-width="1.4"/>
      <text x="${cx}" y="106" font-size="16" font-weight="700" fill="${DG.ink}" text-anchor="middle">${esc(sym)}</text>${e}`;
  };
  return `<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dot and cross diagram">
    ${ring(112,p.a||'H',p.aN==null?1:p.aN,0,false)}
    ${ring(228,p.b||'Cl',p.bN==null?7:p.bN,0,true)}
    <circle cx="170" cy="94" r="3.6" fill="${DG.bl2}"/>
    <path d="M166.5,102.5 l7,7 M173.5,102.5 l-7,7" stroke="${DG.am2}" stroke-width="1.9"/>
    <ellipse cx="170" cy="102" rx="17" ry="24" fill="none" stroke="${DG.grn}" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="170" y="150" font-size="11" fill="${DG.grn}" text-anchor="middle">shared pair</text>
    <text x="170" y="186" font-size="11" fill="${DG.mute}" text-anchor="middle">${esc(p.caption2||'a covalent bond is one shared pair of electrons')}</text></svg>`;
}
