<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>O-Level Study Deck | Physics · Chemistry · History</title>
<meta name="description" content="A study app for Singapore O-Level Pure Physics and Pure Chemistry definitions (2026 syllabus) and Elective History (Express) chapters and key events." />
<meta name="theme-color" content="#0B1120" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1120;
  --bg-alt:#0D1424;
  --card:#111827;
  --card-hover:#141d30;
  --border:rgba(148,163,184,0.14);
  --border-strong:rgba(148,163,184,0.26);
  --blue:#2563EB;
  --blue-bright:#3B82F6;
  --blue-soft:rgba(37,99,235,0.12);
  --green:#22C55E;
  --green-soft:rgba(34,197,94,0.12);
  --amber:#F59E0B;
  --white:#F8FAFC;
  --slate-100:#E2E8F0;
  --slate-300:#CBD5E1;
  --slate-400:#94A3B8;
  --slate-500:#64748B;
  --font:ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;
  --font-display:'Newsreader',ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;
  --container:1080px;
  --radius:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--slate-300);
  font-family:var(--font); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
ul{list-style:none;}
input,textarea{font-family:inherit;}
h1,h2,h3,h4{color:var(--white); font-weight:600; line-height:1.2; letter-spacing:-0.005em; font-family:var(--font-display);}
.container{max-width:var(--container); margin:0 auto; padding:0 20px;}
@media(min-width:768px){.container{padding:0 32px;}}

/* Header */
header{
  position:sticky; top:0; z-index:50; background:rgba(11,17,32,0.86);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.head-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:38px; height:38px; border-radius:10px; background:var(--blue-soft);
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--blue-bright); font-family:var(--font-display); font-weight:700; font-size:18px;
}
.brand h1{font-size:1.02rem; letter-spacing:-0.01em;}
.brand span{display:block; font-size:12px; color:var(--slate-500); font-family:var(--font); font-weight:400;}
.home-link{font-size:13px; color:var(--slate-400); border:1px solid var(--border); padding:8px 14px; border-radius:9px; transition:.25s var(--ease);}
.home-link:hover{color:var(--white); border-color:var(--border-strong);}

/* Subject tabs */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0; border-bottom:1px solid var(--border); -ms-overflow-style:none; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  font-size:14px; font-weight:500; padding:10px 18px; border-radius:10px;
  color:var(--slate-400); border:1px solid transparent; transition:.25s var(--ease);
}
.tab:hover{color:var(--white); background:var(--card);}
.tab.active{color:var(--white); background:var(--blue-soft); border-color:var(--border-strong);}
.tab .dot{width:8px; height:8px; border-radius:50%;}
.tab-plan .dot{background:#3B82F6;}
.tab-log .dot{background:#FB7185;}
.tab-emath .dot{background:#818CF8;}
.tab-amath .dot{background:#6366F1;}
.tab-phys .dot{background:#38BDF8;}
.tab-chem .dot{background:#34D399;}
.tab-hist .dot{background:#A78BFA;}

/* Hero intro per subject */
.subject-hero{padding:40px 0 8px;}
.eyebrow{display:inline-block; font-size:12px; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--blue-bright); margin-bottom:12px;}
.subject-hero h2{font-size:clamp(1.7rem,4vw,2.4rem);}
.subject-hero p{margin-top:12px; max-width:640px; color:var(--slate-400);}

/* Controls bar */
.controls{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  margin:28px 0 8px; padding:14px; background:var(--card);
  border:1px solid var(--border); border-radius:12px;
}
.search{flex:1; min-width:180px; position:relative;}
.search input{
  width:100%; background:var(--bg); border:1px solid var(--border);
  color:var(--white); padding:11px 14px 11px 38px; border-radius:10px; font-size:14px;
}
.search input::placeholder{color:var(--slate-500);}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--slate-500);}
.seg{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:3px;}
.seg button{font-size:13px; font-weight:500; padding:8px 14px; border-radius:8px; color:var(--slate-400); transition:.2s var(--ease);}
.seg button.on{background:var(--blue); color:#fff;}
.stat{font-size:13px; color:var(--slate-400); white-space:nowrap;}
.stat b{color:var(--white); font-weight:600;}

/* Topic pills */
.topic-nav{display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 6px;}
.topic-pill{
  font-size:13px; padding:7px 14px; border-radius:20px; border:1px solid var(--border);
  color:var(--slate-400); transition:.2s var(--ease);
}
.topic-pill:hover{color:var(--white); border-color:var(--border-strong);}
.topic-pill.active{background:var(--blue-soft); color:var(--blue-bright); border-color:var(--border-strong);}

/* Definition cards grid */
.topic-block{margin-top:36px;}
.topic-block h3{font-size:1.35rem; margin-bottom:4px;}
.topic-block .topic-sub{font-size:13px; color:var(--slate-500); margin-bottom:20px;}
.card-grid{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:640px){.card-grid{grid-template-columns:1fr 1fr;}}

.flash{
  position:relative; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:20px; min-height:132px; cursor:pointer;
  transition:border-color .25s var(--ease), transform .25s var(--ease), background .25s var(--ease);
}
.flash:hover{border-color:var(--border-strong); transform:translateY(-2px);}
.flash.known{border-color:rgba(34,197,94,0.4); background:rgba(34,197,94,0.04);}
.flash .term{font-family:var(--font-display); color:var(--white); font-size:1.12rem; font-weight:600; padding-right:34px;}
.flash .prompt{margin-top:10px; font-size:13px; color:var(--slate-500); font-style:italic;}
.flash .def{margin-top:12px; color:var(--slate-300); font-size:15px; line-height:1.6;}
.flash .def.hidden{display:none;}
.flash .extra{margin-top:10px; font-size:13px; color:var(--slate-400); border-top:1px solid var(--border); padding-top:10px;}
.flash .extra.hidden{display:none;}
.flash .mark{
  position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--slate-500); transition:.2s var(--ease); font-size:14px;
}
.flash .mark:hover{color:var(--white); border-color:var(--slate-400);}
.flash.known .mark{background:var(--green); color:#04140a; border-color:var(--green);}

/* Quiz mode reveal button */
.reveal-hint{margin-top:14px; font-size:12px; color:var(--blue-bright); letter-spacing:.03em;}

/* History */
.hist-intro{display:grid; gap:14px; grid-template-columns:1fr; margin-top:24px;}
@media(min-width:720px){.hist-intro{grid-template-columns:1fr 1fr 1fr;}}
.mini-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px;}
.mini-card h4{font-size:1rem; margin-bottom:6px;}
.mini-card p{font-size:13px; color:var(--slate-400);}

.chapter{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-top:16px; overflow:hidden;}
.chapter-head{display:flex; align-items:flex-start; gap:16px; padding:22px; cursor:pointer; transition:background .2s var(--ease);}
.chapter-head:hover{background:var(--card-hover);}
.chapter-num{
  flex-shrink:0; width:44px; height:44px; border-radius:11px; background:var(--blue-soft);
  border:1px solid var(--border-strong); display:grid; place-items:center;
  color:var(--blue-bright); font-family:var(--font-display); font-weight:700; font-size:19px;
}
.chapter-head .ch-title{flex:1;}
.chapter-head h3{font-size:1.22rem;}
.chapter-head .ch-q{font-size:13px; color:var(--slate-500); margin-top:4px; font-style:italic;}
.chapter-head .chev{flex-shrink:0; color:var(--slate-500); transition:transform .3s var(--ease); margin-top:8px;}
.chapter.open .chev{transform:rotate(180deg);}
.chapter-body{display:none; padding:0 22px 26px; border-top:1px solid var(--border);}
.chapter.open .chapter-body{display:block;}

.ch-section{margin-top:24px;}
.ch-section h4{font-size:1.02rem; color:var(--blue-bright); margin-bottom:10px; letter-spacing:.01em;}
.ch-section p{margin-bottom:12px; color:var(--slate-300);}
.ch-section ul.bullets{margin:0 0 12px; padding-left:2px;}
.ch-section ul.bullets li{position:relative; padding-left:20px; margin-bottom:8px; color:var(--slate-300);}
.ch-section ul.bullets li:before{content:"—"; position:absolute; left:0; color:var(--blue-bright);}
.ch-section li b{color:var(--white); font-weight:600;}

/* Timeline */
.timeline{margin-top:12px; border-left:2px solid var(--border-strong); padding-left:22px;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item:before{content:""; position:absolute; left:-29px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--blue); border:2px solid var(--bg);}
.tl-date{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:15px;}
.tl-text{font-size:14px; color:var(--slate-400); margin-top:2px;}

.keyterms{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.keyterm{font-size:12.5px; padding:6px 12px; border-radius:8px; background:var(--blue-soft); color:var(--slate-100); border:1px solid var(--border);}

/* Formula blocks — E-Math / A-Math */
.formula-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.formula-row{background:var(--bg); border:1px solid var(--border); border-left:3px solid var(--blue); border-radius:8px; padding:12px 15px;}
.f-expr{font-family:'Courier New',ui-monospace,monospace; font-size:14.5px; color:var(--white); letter-spacing:.01em;}
.f-desc{font-size:13px; color:var(--slate-400); margin-top:5px; line-height:1.5;}

/* Empty state */
.empty{text-align:center; padding:60px 20px; color:var(--slate-500);}

/* Footer note */
.foot{border-top:1px solid var(--border); margin-top:70px; padding:30px 0 50px; color:var(--slate-500); font-size:13px;}
.foot p{margin-bottom:8px;}
.note{background:var(--blue-soft); border:1px solid var(--border-strong); border-radius:12px; padding:16px 18px; margin-top:26px; font-size:13.5px; color:var(--slate-300);}
.note b{color:var(--white);}

/* ── Planner: phase banner ─────────────────────────────────── */
.phase-banner{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin-top:26px; padding:15px 18px; border-radius:12px;
  background:var(--blue-soft); border:1px solid var(--border-strong);
}
.ph-label{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--blue-bright); font-weight:700;}
.ph-name{font-family:var(--font-display); color:var(--white); font-size:1.06rem; font-weight:600;}
.ph-note{font-size:13px; color:var(--slate-400);}

/* ── Planner: countdown hero ───────────────────────────────── */
.countdown{margin-top:14px; padding:26px 20px; border-radius:14px; background:var(--card); border:1px solid var(--border); text-align:center;}
.cd-label{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.cd-row{display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
.cd-unit{min-width:76px; padding:12px 10px; border-radius:11px; background:var(--bg); border:1px solid var(--border);}
.cd-num{font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--white); line-height:1; font-variant-numeric:tabular-nums;}
.cd-cap{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--slate-500); margin-top:7px;}
.cd-sub{margin-top:16px; font-size:13px; color:var(--slate-400);}

/* ── Planner: stat tiles + meter ───────────────────────────── */
.stat-row{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
@media(min-width:620px){.stat-row{grid-template-columns:1fr 1fr;}}
@media(min-width:940px){.stat-row{grid-template-columns:repeat(3,1fr);}}
.tile{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px;}
.t-label{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.t-value{font-family:var(--font-display); font-size:1.85rem; font-weight:700; color:var(--white); margin-top:7px; line-height:1; font-variant-numeric:tabular-nums;}
.t-sub{font-size:13px; color:var(--slate-400); margin-top:7px;}
.meter{margin-top:13px; height:8px; border-radius:4px; background:var(--bg); overflow:hidden;}
.meter-fill{height:100%; border-radius:4px; background:var(--blue-bright); transition:width .45s var(--ease);}
.meter-fill.hit{background:var(--green);}

/* ── Planner: week navigation ──────────────────────────────── */
.week-nav{display:flex; align-items:center; gap:12px; margin-top:32px; flex-wrap:wrap;}
.wk-title{font-family:var(--font-display); color:var(--white); font-size:1.1rem; font-weight:600;}
.wk-sub{font-size:12.5px; color:var(--slate-500); margin-top:2px;}
.nav-btn{width:38px; height:38px; flex-shrink:0; border-radius:10px; border:1px solid var(--border); color:var(--slate-300); display:grid; place-items:center; transition:.2s var(--ease);}
.nav-btn:hover:not(:disabled){border-color:var(--slate-400); color:var(--white);}
.nav-btn:disabled{opacity:.3; cursor:not-allowed;}
.today-btn{font-size:12.5px; padding:9px 14px; border-radius:9px; border:1px solid var(--border); color:var(--slate-300); margin-left:auto;}
.today-btn:hover{color:var(--white); border-color:var(--border-strong);}

/* ── Planner: day + session rows ───────────────────────────── */
.day{background:var(--card); border:1px solid var(--border); border-radius:12px; margin-top:12px; overflow:hidden;}
.day.is-today{border-color:var(--blue);}
.day-head{display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.day-dow{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:1rem;}
.day-date{font-size:12.5px; color:var(--slate-500);}
.day-badge{margin-left:auto; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; font-weight:700;}
.badge-today{background:var(--blue); color:#fff;}
.badge-rest{background:rgba(148,163,184,.15); color:var(--slate-300);}
.sess{display:flex; align-items:flex-start; gap:13px; padding:14px 18px; border-bottom:1px solid var(--border);}
.sess:last-child{border-bottom:none;}
.sess-rest{padding:16px 18px; color:var(--slate-500); font-size:14px; font-style:italic;}
.cbx{flex-shrink:0; width:24px; height:24px; border-radius:7px; margin-top:1px; border:1.5px solid var(--border-strong); display:grid; place-items:center; color:transparent; font-size:13px; transition:.2s var(--ease);}
.cbx:hover{border-color:var(--slate-400);}
.sess.done .cbx{background:var(--green); border-color:var(--green); color:#04140a;}
.sess-body{flex:1; min-width:0;}
.sess-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sess-subj{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:3px 8px; border-radius:5px;}
.sj-math{background:rgba(59,130,246,.18); color:#93C5FD;}
.sj-phys{background:rgba(56,189,248,.15); color:#7DD3FC;}
.sj-chem{background:rgba(52,211,153,.15); color:#6EE7B7;}
.sj-eng{background:rgba(167,139,250,.18); color:#C4B5FD;}
.sj-paper{background:rgba(251,113,133,.15); color:#FDA4AF;}
.sj-hw{background:rgba(245,158,11,.15); color:#FCD34D;}
.sess-mins{font-size:12px; color:var(--slate-500); font-variant-numeric:tabular-nums;}
.sess-topic{margin-top:5px; color:var(--slate-100); font-size:14.5px; line-height:1.5;}
.sess.done .sess-topic{color:var(--slate-500); text-decoration:line-through;}
.sess-note{font-size:12.5px; color:var(--slate-500); margin-top:3px;}

/* ── Error log ─────────────────────────────────────────────── */
.log-form{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-top:22px;}
.fld{margin-bottom:13px;}
.fld label{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate-500); font-weight:700; margin-bottom:6px;}
.fld input,.fld select,.fld textarea{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--white); padding:10px 12px; border-radius:9px; font-size:14px;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue); outline-offset:1px;}
.fld textarea{resize:vertical; min-height:62px; line-height:1.55;}
.fld-row{display:grid; grid-template-columns:1fr; gap:0 13px;}
@media(min-width:620px){.fld-row{grid-template-columns:1fr 1fr;}}
.btn-solid{background:var(--blue); color:#fff; font-size:14px; font-weight:600; padding:11px 20px; border-radius:10px;}
.btn-solid:hover{background:var(--blue-bright);}
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:26px;}
.entry{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-top:12px;}
.entry.is-due{border-color:rgba(251,113,133,.45);}
.entry-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px;}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; border:1px solid transparent;}
.chip-due{background:rgba(251,113,133,.16); color:#FDA4AF; border-color:rgba(251,113,133,.4);}
.chip-sched{background:rgba(148,163,184,.12); color:var(--slate-400); border-color:var(--border);}
.entry-topic{font-family:var(--font-display); color:var(--white); font-weight:600; font-size:1.04rem;}
.entry-field{margin-top:10px;}
.ef-label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate-500); font-weight:700;}
.entry-field p{font-size:14px; color:var(--slate-300); margin-top:3px; line-height:1.55;}
.entry-actions{margin-top:13px; display:flex; gap:9px; flex-wrap:wrap;}
.mini-btn{font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid var(--border); color:var(--slate-300); transition:.2s var(--ease);}
.mini-btn:hover{border-color:var(--slate-400); color:var(--white);}
.mini-btn.danger:hover{border-color:rgba(251,113,133,.6); color:#FDA4AF;}
.tl-item.passed .tl-date,.tl-item.passed .tl-text{opacity:.45;}
.tl-item.target:before{background:var(--green);}

.hidden{display:none !important;}
.reset-btn{font-size:12px; color:var(--slate-500); text-decoration:underline; text-underline-offset:3px;}
.reset-btn:hover{color:var(--slate-300);}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="head-inner">
      <div class="brand">
        <div class="brand-mark">O</div>
        <div>
          <h1>O-Level HQ · 2026</h1>
          <span>Plan · Log · E-Math · A-Math · Physics · Chem · History</span>
        </div>
      </div>
      <a class="home-link" href="../index.html">← Portfolio</a>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab tab-plan active" data-subject="plan"><span class="dot"></span>Plan</button>
      <button class="tab tab-log" data-subject="log"><span class="dot"></span>Error Log</button>
      <button class="tab tab-emath" data-subject="emath"><span class="dot"></span>E-Math</button>
      <button class="tab tab-amath" data-subject="amath"><span class="dot"></span>A-Math</button>
      <button class="tab tab-phys" data-subject="physics"><span class="dot"></span>Physics</button>
      <button class="tab tab-chem" data-subject="chemistry"><span class="dot"></span>Chemistry</button>
      <button class="tab tab-hist" data-subject="history"><span class="dot"></span>History</button>
    </nav>
  </div>
</header>

<main class="container" id="app"></main>

<script>

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=midnight(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(d){ return d.getDate()+' '+MON[d.getMonth()]; }

/* Plan anchor — set once on first visit so week numbers stay stable. */
function planStart(){
  let s = localStorage.getItem('osp-start');
  if(!s){
    const t = midnight(new Date());
    const dow = (t.getDay()+6)%7;                 // Mon=0 … Sun=6
    const m = mondayOf(t);
    s = ymd(dow >= 4 ? addDays(m,7) : m);         // Fri/Sat/Sun → begin next Monday
    localStorage.setItem('osp-start', s);
  }
  return parseYmd(s);
}
function restDay(){ const v = localStorage.getItem('osp-rest'); return v===null ? 0 : +v; }  // 0 = Sunday
function gymOrder(){ // weekday numbers Mon→Sun, minus the rest day
  return [1,2,3,4,5,6,0].filter(d=>d!==restDay());
}
function weekIndexOf(monday){ return Math.round((monday - planStart())/(7*864e5)) + 1; }

function mathBlockFor(weekIdx, gi){
  if(weekIdx <= 3){
    return { subject:'A-Math', cls:'sj-math', topic: ALGEBRA[((weekIdx-1)*6+gi) % ALGEBRA.length], note:'Algebra at A-Math depth — your weak area' };
  }
  if(weekIdx <= 6){
    return { subject:'A-Math', cls:'sj-math', topic: TRIG[((weekIdx-4)*6+gi) % TRIG.length], note:'Trigonometry & mensuration — your weak area' };
  }
  const em = (weekIdx % 2 === 1);
  return { subject: em?'E-Math':'A-Math', cls:'sj-math', topic: PAPER_CYCLE[gi % PAPER_CYCLE.length], note:(em?'E-Math':'A-Math')+' week — alternating' };
}

/* All sessions for a given date. Homework is on every day, including the rest day. */
function hwMins(){ const v = localStorage.getItem('osp-hw'); return v===null ? 45 : +v; }

function sessionsFor(date){
  const wk = weekIndexOf(mondayOf(date));
  const dow = date.getDay();
  const rest = (dow === restDay());
  const out = [];
  if(!rest){
    const order = gymOrder();
    const gi = order.indexOf(dow);
    const m = mathBlockFor(wk, gi);
    out.push({ key:'math', subject:'Post-gym · '+m.subject, cls:m.cls, topic:m.topic, note:m.note, mins:45 });
    if(gi===1) out.push({ key:'phys', subject:'Physics', cls:'sj-phys', topic:'Physics revision — definitions, then practice questions', note:'Use the Physics tab to drill definitions first', mins:45 });
    if(gi===2) out.push({ key:'chem', subject:'Chemistry', cls:'sj-chem', topic:'Chemistry revision — definitions, then practice questions', note:'Use the Chemistry tab to drill definitions first', mins:45 });
    if(gi===3) out.push({ key:'eng',  subject:'English',   cls:'sj-eng',  topic:'English — comprehension, summary or situational writing', note:'Rotate skills each week; add listening practice from Sep', mins:45 });
    if(gi===5){
      const paper = wk<=3 ? 'Extended algebra practice — past-paper section'
                  : wk<=6 ? 'Extended trigonometry practice — past-paper section'
                  : 'Full timed paper — ' + ((wk%2===1)?'E-Math':'A-Math') + ' Paper 1';
      out.push({ key:'paper', subject:'Timed paper', cls:'sj-paper', topic:paper, note:'135 min — exactly one full O-Level paper', mins:135 });
    }
  }
  out.push({ key:'hw', subject:'Homework', cls:'sj-hw', hw:true, mins:hwMins(),
             topic:'School homework & corrections',
             note: rest ? 'Deadlines don’t take a rest day — do this, then stop.'
                        : 'Work due first, then corrections from marked work' });
  return { rest, sessions:out };
}

function sessId(date, key){ return ymd(date)+'|'+key; }
function doneSet(){ try{ return new Set(JSON.parse(localStorage.getItem('osp-done')||'[]')); }catch(e){ return new Set(); } }
function saveDone(s){ localStorage.setItem('osp-done', JSON.stringify([...s])); }
function isDone(id){ return doneSet().has(id); }
function toggleDone(id){ const s=doneSet(); s.has(id)?s.delete(id):s.add(id); saveDone(s); }

/* Overall phase from the calendar month. */
function currentPhase(){
  const now = new Date();
  if(now < new Date(2026,8,1))  return { name:'Topical revision', note:'Build the weak topics now — algebra, then trigonometry.' };
  if(now < new Date(2026,9,1))  return { name:'Prelims / timed papers', note:'Shift to full papers under exam timing.' };
  return { name:'Final review — no new material', note:'Only revisit what you already know. Redo logged errors.' };
}

/* Streak: consecutive post-gym math blocks completed. Today pending doesn't break it. */
function mathStreak(){
  const today = midnight(new Date());
  const done = doneSet();
  let d = new Date(planStart());
  const days = [];
  while(d <= today){
    if(d.getDay() !== restDay()) days.push(new Date(d));
    d = addDays(d,1);
  }
  let n = 0;
  for(let i=days.length-1; i>=0; i--){
    const id = sessId(days[i],'math');
    if(done.has(id)){ n++; continue; }
    if(ymd(days[i]) === ymd(today)) continue;  // today still open
    break;
  }
  return n;
}

/* Weekly completed hours vs the 9-hour target. */
function weekStats(monday){
  const done = doneSet();
  let total=0, doneMins=0, doneCount=0, count=0, hwDone=0, hwTotal=0, hwMinsDone=0;
  for(let i=0;i<7;i++){
    const d = addDays(monday,i);
    sessionsFor(d).sessions.forEach(s=>{
      const isOn = done.has(sessId(d,s.key));
      if(s.hw){ hwTotal++; if(isOn){ hwDone++; hwMinsDone += s.mins; } return; }  // tracked apart from the revision target
      total += s.mins; count++;
      if(isOn){ doneMins += s.mins; doneCount++; }
    });
  }
  return { total, doneMins, doneCount, count, hwDone, hwTotal, hwMinsDone };
}

/* localStorage: known cards */
function knownKey(sub){ return 'osd-known-'+sub; }
function getKnown(sub){ try{ return JSON.parse(localStorage.getItem(knownKey(sub))||'[]'); }catch(e){ return []; } }
function setKnown(sub, arr){ localStorage.setItem(knownKey(sub), JSON.stringify(arr)); }
function isKnown(sub, id){ return getKnown(sub).includes(id); }
function toggleKnown(sub, id){
  const arr = getKnown(sub); const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  setKnown(sub, arr); return arr.includes(id);
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  state.subject = btn.dataset.subject;
  state.topic = 'all'; state.query='';
  render();
});

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function matches(card, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (card.t + ' ' + card.d + ' ' + (card.x||'')).toLowerCase().includes(q);
}

function render(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer = null; }
  if(state.subject==='plan'){ renderPlan(); return; }
  if(state.subject==='log'){ renderLog(); return; }
  if(SYLLABUS_SUBJECTS.includes(state.subject)){ renderSyllabus(DATA[state.subject], state.subject); return; }
  renderDeck(DATA[state.subject]);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---- Plan view ---- */
function renderPlan(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer = null; }
  const phase = currentPhase();
  const today = midnight(new Date());
  const base = mondayOf(today) < planStart() ? planStart() : mondayOf(today);
  const monday = addDays(base, state.weekOffset*7);
  const wkIdx = weekIndexOf(monday);
  const st = weekStats(monday);
  const hrs = st.doneMins/60;
  const pct = Math.min(100, (hrs/WEEK_TARGET_HRS)*100);
  const streak = mathStreak();
  const lastMonday = mondayOf(PLAN_END);

  let days = '';
  for(let i=0;i<7;i++){
    const d = addDays(monday,i);
    const isToday = ymd(d)===ymd(today);
    const info = sessionsFor(d);
    let rows = '';
    if(info.rest){
      rows = `<div class="sess-rest">Rest day — no revision, or light review only.</div>`;
    }
    rows += info.sessions.map(s=>{
        const id = sessId(d, s.key);
        const done = isDone(id);
        return `<div class="sess ${done?'done':''}">
          <button class="cbx" data-sess="${id}" role="checkbox" aria-checked="${done}" aria-label="Mark ${esc(s.subject)} session complete">✓</button>
          <div class="sess-body">
            <div class="sess-top">
              <span class="sess-subj ${s.cls}">${esc(s.subject)}</span>
              <span class="sess-mins">${s.mins} min</span>
            </div>
            <div class="sess-topic">${esc(s.topic)}</div>
            <div class="sess-note">${esc(s.note)}</div>
          </div>
        </div>`;
      }).join('');
    days += `<div class="day ${isToday?'is-today':''}">
      <div class="day-head">
        <span class="day-dow">${DOW[d.getDay()]}</span>
        <span class="day-date">${fmtShort(d)}</span>
        ${isToday?'<span class="day-badge badge-today">Today</span>':(info.rest?'<span class="day-badge badge-rest">Rest</span>':'')}
      </div>${rows}</div>`;
  }

  const keyRows = KEY_DATES.map(k=>{
    const passed = k.d < today;
    return `<div class="tl-item ${passed?'passed':''} ${k.target?'target':''}">
      <div class="tl-date">${esc(k.when)}</div>
      <div class="tl-text">${esc(k.label)}${k.target?' — countdown target':''}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
  <section class="subject-hero">
    <span class="eyebrow">2026 GCE O-Level · Singapore</span>
    <h2>Study Plan</h2>
    <p>E-Math · A-Math · Physics · Chemistry · English — built around 6 gym days a week, a mandatory post-gym math block, a daily homework block, and a ${WEEK_TARGET_HRS}-hour weekly revision target.</p>
  </section>

  <div class="phase-banner">
    <span class="ph-label">Phase</span>
    <span class="ph-name">${esc(phase.name)}</span>
    <span class="ph-note">${esc(phase.note)}</span>
  </div>

  <div class="countdown">
    <div class="cd-label">Countdown to Mathematics · 21 Oct 2026</div>
    <div class="cd-row" id="cd-row"></div>
    <div class="cd-sub" id="cd-sub"></div>
  </div>

  <div class="stat-row">
    <div class="tile">
      <div class="t-label">This week · hours completed</div>
      <div class="t-value">${hrs.toFixed(2).replace(/\.?0+$/,'')} <span style="font-size:1rem;color:var(--slate-500);">/ ${WEEK_TARGET_HRS} hr</span></div>
      <div class="meter"><div class="meter-fill ${pct>=100?'hit':''}" style="width:${pct}%"></div></div>
      <div class="t-sub">${st.doneCount} of ${st.count} sessions done · ${(st.total/60).toFixed(2).replace(/\.?0+$/,'')} hr scheduled</div>
    </div>
    <div class="tile">
      <div class="t-label">Post-gym math streak</div>
      <div class="t-value">${streak} <span style="font-size:1rem;color:var(--slate-500);">day${streak===1?'':'s'}</span></div>
      <div class="t-sub">${streak===0?'Tick today’s math block to start a streak.':'Consecutive post-gym math blocks completed.'}</div>
    </div>
    <div class="tile">
      <div class="t-label">Homework this week</div>
      <div class="t-value">${st.hwDone} <span style="font-size:1rem;color:var(--slate-500);">/ ${st.hwTotal} days</span></div>
      <div class="meter"><div class="meter-fill ${st.hwDone>=st.hwTotal?'hit':''}" style="width:${st.hwTotal?(st.hwDone/st.hwTotal)*100:0}%"></div></div>
      <div class="t-sub">Tracked apart from the ${WEEK_TARGET_HRS}-hour revision target.</div>
    </div>
  </div>

  <div class="week-nav">
    <button class="nav-btn" id="wk-prev" aria-label="Previous week" ${monday<=mondayOf(planStart())?'disabled':''}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="wk-title">Week ${wkIdx}</div>
      <div class="wk-sub">${fmtShort(monday)} – ${fmtShort(addDays(monday,6))} · ${wkIdx<=3?'Algebra focus':wkIdx<=6?'Trigonometry focus':'Timed papers'}</div>
    </div>
    <button class="nav-btn" id="wk-next" aria-label="Next week" ${monday>=lastMonday?'disabled':''}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    ${state.weekOffset!==0?'<button class="today-btn" id="wk-today">Jump to this week</button>':''}
  </div>

  ${days}

  <div class="ch-section" style="margin-top:44px;">
    <h4>Key exam dates</h4>
    <div class="timeline">${keyRows}</div>
  </div>

  <div class="note" style="margin-top:30px;">
    <b>Rest day:</b> currently ${DOW[restDay()]}.
    <select id="rest-sel" style="margin-left:8px; background:var(--bg); border:1px solid var(--border); color:var(--white); padding:6px 10px; border-radius:8px; font-size:13px;">
      ${DOW.map((n,i)=>`<option value="${i}" ${i===restDay()?'selected':''}>${n}</option>`).join('')}
    </select>
    <div style="margin-top:8px; color:var(--slate-400);">The other six days are gym days, each with a post-gym math block.</div>
    <div style="margin-top:14px;">
      <b>Homework block:</b> every day, currently ${hwMins()} min.
      <select id="hw-sel" style="margin-left:8px; background:var(--bg); border:1px solid var(--border); color:var(--white); padding:6px 10px; border-radius:8px; font-size:13px;">
        ${[30,45,60,90,120].map(m=>`<option value="${m}" ${m===hwMins()?'selected':''}>${m} min</option>`).join('')}
      </select>
      <div style="margin-top:8px; color:var(--slate-400);">Homework is counted separately, so it never inflates your ${WEEK_TARGET_HRS}-hour revision total.</div>
    </div>
  </div>
  ` + footerHTML();

  // Countdown ticks live
  function tick(){
    const row = document.getElementById('cd-row'); if(!row) return;
    let ms = MATH_EXAM - new Date();
    const sub = document.getElementById('cd-sub');
    if(ms <= 0){ row.innerHTML = '<div class="cd-unit"><div class="cd-num">0</div><div class="cd-cap">Go time</div></div>'; sub.textContent='Good luck.'; return; }
    const dd = Math.floor(ms/864e5), hh = Math.floor(ms/36e5)%24, mm = Math.floor(ms/6e4)%60, ss = Math.floor(ms/1e3)%60;
    row.innerHTML = [[dd,'Days'],[hh,'Hours'],[mm,'Min'],[ss,'Sec']]
      .map(u=>`<div class="cd-unit"><div class="cd-num">${u[0]}</div><div class="cd-cap">${u[1]}</div></div>`).join('');
    sub.textContent = Math.ceil(dd/7) + ' weeks of study left · ' + (dd*WEEK_TARGET_HRS/7).toFixed(0) + ' planned hours remaining';
  }
  tick(); cdTimer = setInterval(tick, 1000);

  app.querySelectorAll('[data-sess]').forEach(b=>{
    b.addEventListener('click', ()=>{ toggleDone(b.dataset.sess); renderPlan(); });
  });
  const prev=document.getElementById('wk-prev'), next=document.getElementById('wk-next'), tdy=document.getElementById('wk-today');
  if(prev) prev.addEventListener('click', ()=>{ state.weekOffset--; renderPlan(); });
  if(next) next.addEventListener('click', ()=>{ state.weekOffset++; renderPlan(); });
  if(tdy)  tdy.addEventListener('click', ()=>{ state.weekOffset=0; renderPlan(); });
  const rs = document.getElementById('rest-sel');
  if(rs) rs.addEventListener('change', ()=>{ localStorage.setItem('osp-rest', rs.value); renderPlan(); });
  const hs = document.getElementById('hw-sel');
  if(hs) hs.addEventListener('change', ()=>{ localStorage.setItem('osp-hw', hs.value); renderPlan(); });
}

/* ---- Error log view ---- */
function renderLog(){
  const today = midnight(new Date());
  const entries = getLog().slice().sort((a,b)=> a.redo.localeCompare(b.redo));
  const subjects = ['E-Math','A-Math','Physics','Chemistry','English','History'];
  const filters = ['all', ...subjects];
  const shown = entries.filter(e=> state.logFilter==='all' || e.subject===state.logFilter);
  const dueCount = entries.filter(e=> parseYmd(e.redo) <= today && !e.redone).length;

  const list = shown.length ? shown.map(e=>{
    const due = parseYmd(e.redo) <= today && !e.redone;
    return `<div class="entry ${due?'is-due':''}">
      <div class="entry-top">
        <span class="sess-subj ${subjClass(e.subject)}">${esc(e.subject)}</span>
        <span class="entry-topic">${esc(e.topic)}</span>
        ${e.redone
          ? `<span class="chip chip-sched">✓ Re-attempted</span>`
          : due
            ? `<span class="chip chip-due">↻ Re-attempt due</span>`
            : `<span class="chip chip-sched">↻ Re-attempt ${fmtShort(parseYmd(e.redo))}</span>`}
      </div>
      <div class="entry-field"><div class="ef-label">What went wrong</div><p>${esc(e.mistake)}</p></div>
      <div class="entry-field"><div class="ef-label">Correct method</div><p>${esc(e.method)}</p></div>
      <div class="entry-actions">
        <button class="mini-btn" data-redone="${e.id}">${e.redone?'Mark not done':'Mark re-attempted'}</button>
        <button class="mini-btn danger" data-del="${e.id}">Delete</button>
      </div>
      <div class="t-sub" style="margin-top:9px;font-size:12px;">Logged ${fmtShort(parseYmd(e.date))}</div>
    </div>`;
  }).join('') : `<div class="empty">No entries yet. Log a mistake above and it will schedule its own re-attempt.</div>`;

  app.innerHTML = `
  <section class="subject-hero">
    <span class="eyebrow">Mistakes you only want to make once</span>
    <h2>Error Log</h2>
    <p>Log every mistake with the correct method. Each entry automatically schedules a re-attempt <b>4 days later</b>${dueCount?` — <b style="color:#FDA4AF">${dueCount} due now</b>`:''}.</p>
  </section>

  <form class="log-form" id="log-form">
    <div class="fld-row">
      <div class="fld">
        <label for="f-subject">Subject</label>
        <select id="f-subject">${subjects.map(s=>`<option>${s}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label for="f-topic">Topic</label>
        <input id="f-topic" type="text" placeholder="e.g. R-formula" required />
      </div>
    </div>
    <div class="fld">
      <label for="f-mistake">What went wrong</label>
      <textarea id="f-mistake" placeholder="e.g. Used tan instead of the R-formula, lost the sign on b" required></textarea>
    </div>
    <div class="fld">
      <label for="f-method">Correct method</label>
      <textarea id="f-method" placeholder="e.g. R = √(a²+b²), tan α = b/a with α acute, then write as R cos(θ−α)" required></textarea>
    </div>
    <div class="fld">
      <label for="f-date">Date</label>
      <input id="f-date" type="date" value="${ymd(today)}" required />
    </div>
    <button class="btn-solid" type="submit">Add to log</button>
  </form>

  <div class="filter-row">
    ${filters.map(f=>`<button class="topic-pill ${state.logFilter===f?'active':''}" data-filter="${f}">${f==='all'?'All subjects':f}</button>`).join('')}
  </div>

  <div style="margin-top:6px;">${list}</div>
  ` + footerHTML();

  document.getElementById('log-form').addEventListener('submit', ev=>{
    ev.preventDefault();
    const date = document.getElementById('f-date').value;
    const arr = getLog();
    arr.push({
      id: 'e'+Date.now(),
      subject: document.getElementById('f-subject').value,
      topic:   document.getElementById('f-topic').value.trim(),
      mistake: document.getElementById('f-mistake').value.trim(),
      method:  document.getElementById('f-method').value.trim(),
      date,
      redo:    ymd(addDays(parseYmd(date), 4)),
      redone:  false,
    });
    saveLog(arr); renderLog();
  });
  app.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.logFilter=b.dataset.filter; renderLog(); });
  });
  app.querySelectorAll('[data-redone]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const arr=getLog(); const e=arr.find(x=>x.id===b.dataset.redone);
      if(e){ e.redone=!e.redone; saveLog(arr); renderLog(); }
    });
  });
  app.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Delete this entry?')) return;
      saveLog(getLog().filter(x=>x.id!==b.dataset.del)); renderLog();
    });
  });
}

function renderDeck(subj){
  const sub = state.subject;
  const allCards = subj.topics.flatMap((t,ti)=>t.cards.map((c,ci)=>({...c, id:sub+'-'+ti+'-'+ci, topic:t.name})));
  const total = allCards.length;
  const knownCount = getKnown(sub).filter(id=>allCards.some(c=>c.id===id)).length;

  let html = `
  <section class="subject-hero">
    <span class="eyebrow">${sub==='physics'?'Pure Physics · 6091':'Pure Chemistry · 6092'}</span>
    <h2>${sub==='physics'?'Physics Definitions':'Chemistry Definitions'}</h2>
    <p>${esc(subj.intro)}</p>
  </section>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search definitions…" value="${esc(state.query)}"/>
    </label>
    <div class="seg" id="modeSeg">
      <button class="${state.mode==='flashcard'?'on':''}" data-mode="flashcard">Flashcards</button>
      <button class="${state.mode==='quiz'?'on':''}" data-mode="quiz">Quiz mode</button>
    </div>
    <span class="stat"><b>${knownCount}</b> / ${total} learnt · <a href="#" class="reset-btn" id="resetKnown">reset</a></span>
  </div>

  <div class="topic-nav" id="topicNav">
    <button class="topic-pill ${state.topic==='all'?'active':''}" data-topic="all">All topics</button>
    ${subj.topics.map(t=>`<button class="topic-pill ${state.topic===t.name?'active':''}" data-topic="${esc(t.name)}">${esc(t.name)}</button>`).join('')}
  </div>
  <div id="deck"></div>`;

  app.innerHTML = html + footerHTML();
  wireDeck(subj, allCards);
  drawCards(subj, allCards);
}

function drawCards(subj, allCards){
  const sub = state.subject;
  const deck = document.getElementById('deck');
  const topics = state.topic==='all' ? subj.topics : subj.topics.filter(t=>t.name===state.topic);
  let out = '';
  let shown = 0;
  topics.forEach(t=>{
    const cards = t.cards
      .map((c,ci)=>({...c, id:sub+'-'+subj.topics.indexOf(t)+'-'+ci}))
      .filter(c=>matches(c, state.query));
    if(!cards.length) return;
    shown += cards.length;
    out += `<div class="topic-block"><h3>${esc(t.name)}</h3><div class="topic-sub">${cards.length} definition${cards.length>1?'s':''}</div><div class="card-grid">`;
    cards.forEach(c=>{
      const known = isKnown(sub, c.id);
      const quiz = state.mode==='quiz';
      out += `
      <div class="flash ${known?'known':''}" data-id="${c.id}">
        <button class="mark" data-mark="${c.id}" title="Mark as learnt">✓</button>
        <div class="term">${esc(c.t)}</div>
        ${quiz ? `<div class="prompt">Define this — then tap to check.</div>` : ``}
        <div class="def ${quiz?'hidden':''}">${esc(c.d)}</div>
        ${c.x ? `<div class="extra ${quiz?'hidden':''}">${esc(c.x)}</div>` : ``}
        ${quiz ? `<div class="reveal-hint">Tap to reveal ▾</div>` : ``}
      </div>`;
    });
    out += `</div></div>`;
  });
  deck.innerHTML = shown ? out : `<div class="empty">No definitions match "${esc(state.query)}".</div>`;

  // card interactions
  deck.querySelectorAll('.flash').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('.mark')) return;
      const def = card.querySelector('.def');
      const extra = card.querySelector('.extra');
      const hint = card.querySelector('.reveal-hint');
      if(def){ def.classList.toggle('hidden'); }
      if(extra){ extra.classList.toggle('hidden'); }
      if(hint){ hint.style.display = def && def.classList.contains('hidden') ? 'block':'none'; }
    });
  });
  deck.querySelectorAll('.mark').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.dataset.mark;
      toggleKnown(state.subject, id);
      renderDeck(DATA[state.subject]); // refresh counts
    });
  });
}

function wireDeck(subj, allCards){
  const search = document.getElementById('search');
  search.addEventListener('input', ()=>{ state.query = search.value; drawCards(subj, allCards); });
  document.getElementById('modeSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    drawCards(subj, allCards);
  });
  document.getElementById('topicNav').addEventListener('click', e=>{
    const b = e.target.closest('.topic-pill'); if(!b) return;
    state.topic = b.dataset.topic;
    document.querySelectorAll('.topic-pill').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    drawCards(subj, allCards);
  });
  const reset = document.getElementById('resetKnown');
  reset.addEventListener('click', e=>{
    e.preventDefault();
    if(confirm('Reset your learnt progress for this subject?')){
      setKnown(state.subject, []);
      renderDeck(DATA[state.subject]);
    }
  });
}

/* ---- History ---- */
function renderSyllabus(S, key){
  let html = `
  <section class="subject-hero">
    <span class="eyebrow">${esc(S.eyebrow)}</span>
    <h2>${esc(S.title)}</h2>
    <p>${esc(S.intro)}</p>
  </section>
  <div class="hist-intro">
    ${S.cards.map(c=>`<div class="mini-card"><h4>${esc(c.h)}</h4><p>${esc(c.p)}</p></div>`).join('')}
  </div>
  <div id="chapters" style="margin-top:32px;">`;

  S.chapters.forEach((ch, i)=>{
    html += `
    <div class="chapter ${i===0?'open':''}" data-ch="${i}">
      <div class="chapter-head">
        <div class="chapter-num">${ch.n}</div>
        <div class="ch-title">
          <h3>${esc(ch.title)}</h3>
          <div class="ch-q">${esc(ch.q)}</div>
        </div>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="chapter-body">${ch.sections.map(renderSection).join('')}</div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html + footerHTML();

  document.querySelectorAll('.chapter-head').forEach(head=>{
    head.addEventListener('click', ()=> head.parentElement.classList.toggle('open'));
  });
  window.scrollTo({top:0, behavior:'instant'});
}

function renderSection(s){
  if(s.type==='text'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4>${s.body.map(p=>`<p>${p}</p>`).join('')}</div>`;
  }
  if(s.type==='bullets'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><ul class="bullets">${s.body.map(li=>`<li>${li}</li>`).join('')}</ul></div>`;
  }
  if(s.type==='formulas'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="formula-list">${s.body.map(f=>
      `<div class="formula-row"><div class="f-expr">${f.f}</div><div class="f-desc">${esc(f.d)}</div></div>`
    ).join('')}</div></div>`;
  }
  if(s.type==='terms'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="keyterms">${s.body.map(t=>`<span class="keyterm">${esc(t)}</span>`).join('')}</div></div>`;
  }
  if(s.type==='timeline'){
    return `<div class="ch-section"><h4>${esc(s.h)}</h4><div class="timeline">${s.body.map(e=>`<div class="tl-item"><div class="tl-date">${esc(e.d)}</div><div class="tl-text">${esc(e.t)}</div></div>`).join('')}</div></div>`;
  }
  return '';
}

function footerHTML(){
  return `
  <div class="foot">
