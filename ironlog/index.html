// Derive the rest day from the schedule rather than hardcoding Saturday in
// three places — they only have to disagree once to make the streak nonsense.
function isRestDay(dow){ return scheduleFor(dow) === "Rest"; }
function isRestDate(ds){ return isRestDay(dateOf(ds).getDay()); }
function workoutDone(w){ return !!w && totals(w).done > 0; }

function computeStreaks(){
  const done = new Set(Object.keys(history).filter(k=> workoutDone(history[k])));
  const tISO = todayISO();

  // Current streak: walk backwards from today; rest days are neutral bridges.
  let cur = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  // An untouched today doesn't count yet, but it mustn't break the run either.
  if (!done.has(tISO)) d.setDate(d.getDate()-1);
  for (let guard=0; guard<3650; guard++){
    if (isRestDay(d.getDay())){ d.setDate(d.getDate()-1); continue; }
    if (!done.has(isoDate(d))) break;
    cur++; d.setDate(d.getDate()-1);
  }

  // Longest streak: scan forward across the full logged range.
  const keys = [...done].sort();
  let longest = cur;
  if (keys.length){
    let run = 0;
    const end = new Date(); end.setHours(0,0,0,0);
    for (let dd=dateOf(keys[0]); dd<=end; dd.setDate(dd.getDate()+1)){
      if (isRestDay(dd.getDay())) continue;        // rest = neutral
      const ds = isoDate(dd);
      if (done.has(ds)) run++;
      else if (ds===tISO) continue;                // today still pending
      else { run = 0; continue; }
      if (run>longest) longest = run;
    }
  }
  return { current: cur, longest };
}

/* Ranked by estimated 1RM rather than raw weight, so a heavier-but-shorter set
   doesn't displace a genuinely stronger one. Heaviest weight is kept alongside. */
function computePRs(){
  if (_memoPRs) return _memoPRs;
  const pr = {}; // name -> { e1rm, kg, reps, group, topKg, date }
  Object.values(history).forEach(w=>{
    w.exercises.forEach(e=>{
      if (e.plyo) return;
      e.sets.forEach(s=>{
        if (!(s.done && s.kind==="working" && s.weightKg!=null)) return;
        const est = e1rm(s.weightKg, s.reps);
        const cur = pr[e.name];
        if (!cur){
          pr[e.name] = { e1rm:est, kg:s.weightKg, reps:s.reps, group:e.group, topKg:s.weightKg, date:w.date };
          return;
        }
        if (s.weightKg > cur.topKg) cur.topKg = s.weightKg;
        if (est!=null && (cur.e1rm==null || est > cur.e1rm)){
          cur.e1rm = est; cur.kg = s.weightKg; cur.reps = s.reps; cur.date = w.date;
        }
      });
    });
  });
  _memoPRs = pr;
  return pr;
}

function renderStats(){
  const view = $("#view-stats");
  const all = Object.values(history);
  const streaks = computeStreaks();
  const totalWorkouts = all.filter(workoutDone).length;
  let doneSets=0, allSets=0;
  all.forEach(w=>{ const t=totals(w); doneSets+=t.done; allSets+=t.total; });
  const rate = allSets? Math.round(doneSets/allSets*100):0;
  const prs = computePRs();
  const prList = Object.entries(prs).sort((a,b)=> (b[1].e1rm||b[1].kg)-(a[1].e1rm||a[1].kg));
  const totalVol = all.reduce((v,w)=> v + workoutVolume(w), 0);

  // This week vs last, so the numbers mean something in context.
  const wk = weekStats(0), lastWk = weekStats(1);
  // No comparison until the week is actually underway — a fresh Monday would
  // otherwise always read "down 100%".
  const started = wk.workouts > 0;
  const delta = (a,b)=>{
    if (!started || !b) return "";
    const pct = Math.round((a-b)/b*100);
    if (!isFinite(pct) || pct===0) return `<span class="dl flat">even</span>`;
    return `<span class="dl ${pct>0?"up":"down"}">${pct>0?"▲":"▼"}${Math.abs(pct)}%</span>`;
  };

  // Weekly goal — the streak is all-or-nothing, so a simple sessions-per-week
  // target gives the week a shape you can still hit after missing a day.
  const goal = Math.max(1, settings.weeklyGoal || 5);
  const goalPct = Math.min(100, Math.round(wk.workouts/goal*100));

  // Twelve weeks of volume, so a training block reads as a trend not a diff.
  const trend = weeklyVolumes(12);
  const tMax = Math.max(1, ...trend.map(t=>t.volume));
  const tBars = trend.map(t=>`
    <div class="tw-bar" title="${t.start.toLocaleDateString(undefined,{day:"numeric",month:"short"})}">
      <span style="height:${t.volume ? Math.max(3, Math.round(t.volume/tMax*100)) : 2}%"></span>
    </div>`).join("");
  const trendTotal = trend.reduce((a,t)=>a+t.volume, 0);

  const recovery = groupRecovery();
  const recRows = recovery.map(r=>`
    <div class="rec-row">
      <span class="g">${esc(r.group)}</span>
      <span class="d ${r.days<=1?"fresh":r.days>=5?"stale":""}">${
        r.days===0 ? "today" : r.days===1 ? "yesterday" : `${r.days} days ago`}</span>
    </div>`).join("");

  const stalled = plateauedExercises();
  const bw = bodyweightSeries();
  const groups = groupVolumes();
  const gMax = Math.max(1, ...Object.values(groups));
  const gRows = Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`
    <div class="bal-row">
      <div class="bal-top"><span>${esc(g)}</span><b>${fmtVolume(v)}</b></div>
      <div class="bal-bar"><span style="width:${Math.round(v/gMax*100)}%"></span></div>
    </div>`).join("");

  view.innerHTML = `
    <div class="today-hero"><div class="k">Your progress</div><div class="v">Statistics</div></div>

    <div class="week-card">
      <div class="week-head">This week <span>${wk.start.toLocaleDateString(undefined,{day:"numeric",month:"short"})} –</span></div>
      <div class="week-grid">
        <div><div class="n">${wk.workouts}</div><div class="l">workouts</div><div class="d">${delta(wk.workouts,lastWk.workouts)}</div></div>
        <div><div class="n">${wk.sets}</div><div class="l">sets</div><div class="d">${delta(wk.sets,lastWk.sets)}</div></div>
        <div><div class="n">${fmtVolume(wk.volume)}</div><div class="l">volume</div><div class="d">${delta(wk.volume,lastWk.volume)}</div></div>
      </div>
      <div class="goal-wrap">
        <div class="goal-head"><span>Weekly goal</span><b>${wk.workouts} / ${goal}</b></div>
        <div class="goal-bar"><span style="width:${goalPct}%" class="${wk.workouts>=goal?"hit":""}"></span></div>
      </div>
    </div>

    ${trendTotal > 0 ? `
      <div class="section-title">Volume trend <span class="hint-inline">last 12 weeks</span></div>
      <div class="chart-card" style="margin:0 2px 6px">
        <div class="chart-head"><span>per week · 12wk total</span><b>${fmtVolume(trendTotal)}</b></div>
        <div class="tw-chart">${tBars}</div>
      </div>` : ""}

    <div class="stat-grid">
      <div class="stat accent"><div class="n">${streaks.current}<small> 🔥</small></div><div class="l">Current streak</div></div>
      <div class="stat"><div class="n">${streaks.longest}</div><div class="l">Longest streak</div></div>
      <div class="stat"><div class="n">${totalWorkouts}</div><div class="l">Workouts completed</div></div>
      <div class="stat"><div class="n">${doneSets}</div><div class="l">Total sets</div></div>
      <div class="stat"><div class="n">${rate}<small>%</small></div><div class="l">Completion rate</div></div>
      <div class="stat"><div class="n">${fmtVolume(totalVol)}</div><div class="l">Total volume</div></div>
    </div>

    ${stalled.length ? `
      <div class="section-title">Needs attention</div>
      <div class="stall-card">
        <p class="stall-lead">No progress in ${stalled[0].sessions}+ sessions — consider a deload, more reps, or a form check.</p>
        ${stalled.map(s=>`<button class="stall-row" data-n="${esc(s.name)}">
            <span class="nm">${esc(s.name)}</span>
            <span class="kg">stuck at ${fmtWeightKg(s.kg)} × ${s.reps||"?"}</span>
          </button>`).join("")}
      </div>` : ""}

    ${bw.length>1 ? `
      <div class="section-title">Bodyweight</div>
      <div class="chart-card" style="margin:0 2px 6px">
        <div class="chart-head"><span>${bw.length} entries</span><b>${toDisplay(bw[bw.length-1].kg)} ${unitLabel()}</b></div>
        ${sparkline(bw.map(x=>x.kg), 300, 64)}
      </div>` : ""}

    ${recRows ? `<div class="section-title">Recovery <span class="hint-inline">last trained</span></div>
      <div class="bal-card">${recRows}</div>` : ""}

    ${gRows ? `<div class="section-title">Muscle group balance</div><div class="bal-card">${gRows}</div>` : ""}

    <div class="section-title">Personal Records <span class="hint-inline">by est. 1RM</span></div>
    <div id="prList"></div>`;

  view.querySelectorAll(".stall-row").forEach(b=> b.onclick = ()=> openExerciseDetail(b.dataset.n));

  const host = $("#prList");
  if (!prList.length){
    host.innerHTML = `<div class="empty"><span class="em">🏆</span>Log some weighted sets to start setting records.</div>`;
    return;
  }
  prList.forEach(([name, r])=>{
    const row = document.createElement("button");
    row.className = "pr-row";
    row.innerHTML = `<div><div class="nm">${esc(name)}</div>
        <div class="mg">${esc(r.group)} · best ${toDisplay(r.kg)}${unitLabel()} × ${r.reps||8}</div></div>
      <div class="val">${toDisplay(r.e1rm||r.kg)}<small> ${unitLabel()}</small></div>`;
    row.onclick = ()=> openExerciseDetail(name);
    host.appendChild(row);
  });
}

/* ---------- Programme editor ----------
   The built-in templates were fixed: no way to add a movement your gym
   actually has, drop one it doesn't, or put them in the order you train.
   Edits apply to workouts built from here on; sessions already logged keep
   the exercises they were done with. */
const EX_GROUPS = ["Chest","Shoulders","Triceps","Back","Biceps","Legs","Weights","Plyometrics","Core","Cardio"];

function openPlanEditor(type){
  const plan = editablePlan(type);
  const rows = plan.map((t,i)=>`
    <div class="plan-row">
      <div class="pr-main">
        <div class="nm">${esc(t.name)}</div>
        <div class="mt">${esc(t.group)} · ${t.sets}×${t.repMax&&t.repMax>t.reps?`${t.reps}–${t.repMax}`:t.reps}${t.warmup?" · warm-up":""}${t.bar?" · bar":""}${t.plyo?" · plyo":""}</div>
      </div>
      <div class="pr-ctl">
        <button class="pmv" data-i="${i}" data-d="-1" aria-label="Move up"${i===0?" disabled":""}>↑</button>
        <button class="pmv" data-i="${i}" data-d="1" aria-label="Move down"${i===plan.length-1?" disabled":""}>↓</button>
        <button class="pdel" data-i="${i}" aria-label="Remove">✕</button>
      </div>
    </div>`).join("");

  openSheet(`
    <h3 class="sh-title">${type} exercises</h3>
    <p class="sh-sub">${plan.length} in this day · reorder, remove, or add your own</p>
    ${rows || `<div class="empty"><span class="em">🏋️</span>No exercises — add one below.</div>`}

    <div class="section-title" style="margin-left:2px">Add an exercise</div>
    <input class="sheet-input" id="pnName" placeholder="Exercise name" maxlength="40">
    <div class="plan-add">
      <select class="sheet-input" id="pnGroup" aria-label="Muscle group">
        ${EX_GROUPS.map(g=>`<option value="${g}">${g}</option>`).join("")}
      </select>
      <input class="sheet-input" id="pnSets" type="number" min="1" max="10" value="3" aria-label="Number of sets">
      <input class="sheet-input" id="pnReps" type="number" min="1" max="50" value="8" aria-label="Reps, or the bottom of the rep range">
      <input class="sheet-input" id="pnRepsMax" type="number" min="1" max="50" placeholder="to" aria-label="Top of the rep range, optional">
    </div>
    <div class="plan-hint">sets · reps · optional top of range — leave blank for a fixed target</div>
    <div class="plan-flags">
      <button class="chip" id="pnWarm">Warm-up set</button>
      <button class="chip" id="pnBar">Barbell</button>
      <button class="chip" id="pnPlyo">Plyometric</button>
    </div>
    <button class="btn primary" id="pnAdd" style="margin:14px 0 10px">Add exercise</button>
    ${planIsCustom(type) ? `<button class="btn" id="pnReset" style="margin-bottom:10px">Reset ${type} to default</button>` : ""}
    <button class="btn ghost" id="pnClose">Done</button>`, true);

  const reopen = ()=>{ saveSettings(); closeSheet(); setTimeout(()=>openPlanEditor(type), 160); };

  $("#sheet").querySelectorAll(".pmv").forEach(b=> b.onclick = ()=>{
    const i = +b.dataset.i, j = i + (+b.dataset.d);
    if (j < 0 || j >= plan.length) return;
    const [m] = plan.splice(i,1); plan.splice(j,0,m);
    reopen();
  });
  $("#sheet").querySelectorAll(".pdel").forEach(b=> b.onclick = ()=>{
    const i = +b.dataset.i;
    const removed = plan[i];
    plan.splice(i,1);
    saveSettings(); closeSheet(); renderSettings();
    toast(`Removed ${removed.name}`, ()=>{
      plan.splice(i,0,removed); saveSettings(); renderSettings(); openPlanEditor(type);
    });
  });

  const flags = { warmup:false, bar:false, plyo:false };
  const bind = (id, key)=>{ $(id).onclick = ()=>{ flags[key] = !flags[key]; $(id).classList.toggle("on", flags[key]); }; };
  bind("#pnWarm","warmup"); bind("#pnBar","bar"); bind("#pnPlyo","plyo");

  $("#pnAdd").onclick = ()=>{
    const name = $("#pnName").value.trim();
    if (!name){ toast("Give it a name first"); return; }
    if (plan.some(p=> p.name.toLowerCase() === name.toLowerCase())){
      toast("Already in this day"); return;
    }
    const reps = Math.max(1, Math.min(50, +$("#pnReps").value || 8));
    const rawMax = +$("#pnRepsMax").value;
    plan.push({
      group: $("#pnGroup").value,
      name,
      warmup: flags.warmup,
      sets: Math.max(1, Math.min(10, +$("#pnSets").value || 3)),
      reps,

    });
    reopen();
    toast(`Added ${name}`);
  };
  const rst = $("#pnReset");
  if (rst) rst.onclick = ()=>{
    delete settings.plan[type];
    saveSettings(); closeSheet(); renderSettings();
    toast(`${type} reset to default`);
  };
  $("#pnClose").onclick = ()=>{ closeSheet(); renderSettings(); };
}

async function toggleReminders(){
  if (settings.reminders){ settings.reminders=false; saveSettings(); renderSettings(); return; }
  if (!("Notification" in window)){ toast("Notifications not supported"); return; }
  let perm = Notification.permission;
  if (perm==="default") perm = await Notification.requestPermission();
  if (perm!=="granted"){ toast("Notification permission denied"); renderSettings(); return; }
  settings.reminders = true; saveSettings(); renderSettings();
  scheduleReminder();
  const type = todayType();
  new Notification("IronLog", { body: type==="Rest" ? "Rest day — recovery is part of progress. 💪" : `Today is ${type} day. Let's train. 💪`, icon:"icon-192.png" });
}
let reminderTimer = null;
function scheduleReminder(){
  // Best-effort: fires at ~09:00 while the app/tab stays alive.
  clearTimeout(reminderTimer);
  if (!settings.reminders || Notification.permission!=="granted") return;
  const now = new Date();
  const next = new Date(); next.setHours(9,0,0,0);
  if (next <= now) next.setDate(next.getDate()+1);
  reminderTimer = setTimeout(()=>{
    const type = todayType();
    try{ new Notification("IronLog", { body: type==="Rest"?"Rest day — recover well. 💪":`Today is ${type} day. Time to train. 💪`, icon:"icon-192.png" }); }catch(e){}
    scheduleReminder();
  }, Math.min(next-now, 2147483000));
}

/* Bump when the stored shape changes in a way older builds can't read. */
const BACKUP_FORMAT = 1;

function exportData(){
  const payload = {
    app: "ironlog", format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    settings, history, bodylog,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ironlog-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  settings.workoutsSinceBackup = 0; settings.lastBackup = todayISO(); saveSettings();
  toast("Backup exported");
}
// One row per set, so the log opens cleanly in Sheets/Excel.
function exportCSV(){
  const esc = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows = [["date","workout","group","exercise","set","kind","weight_kg","reps","volume_kg","completed","effort","set_note","session_note"]];
  Object.values(history).sort((a,b)=> a.date<b.date?-1:1).forEach(w=>{
    w.exercises.forEach(ex=>{
      let n=0;
      ex.sets.forEach(s=>{
        if (s.kind==="working") n++;
        rows.push([ w.date, w.type, ex.group, ex.name, s.kind==="working"?n:0, s.kind,
                    s.weightKg==null?"":s.weightKg, s.reps==null?"":s.reps,
                    (s.done && s.weightKg!=null && s.reps) ? s.weightKg*s.reps : 0,
                    s.done?"yes":"no", RPE_TAGS[s.rpe||0].name, s.note||"", w.note||"" ]);
      });
    });
  });
  const csv = rows.map(r=>r.map(esc).join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ironlog-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast(rows.length>1 ? "CSV exported" : "Nothing logged yet");
}

/* Import used to assign whatever it found straight onto the live state, so a
   truncated download, someone else's JSON, or a future format would replace a
   year of training with nonsense and only fail later, somewhere else. Check
   the shape first and refuse anything that isn't a backup we understand. */
function validateBackup(data){
  if (!data || typeof data !== "object" || Array.isArray(data)) return "That isn't a backup file.";
  if (data.app && data.app !== "ironlog") return "That backup is from a different app.";
  if (data.format && data.format > BACKUP_FORMAT){
    return `That backup was made by a newer version of IronLog (format ${data.format}).`;
  }
  if (data.history == null && data.settings == null && data.bodylog == null){
    return "That file has no IronLog data in it.";
  }
  if (data.history != null){
    if (typeof data.history !== "object" || Array.isArray(data.history)) return "The history in that file is malformed.";
    for (const k of Object.keys(data.history)){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return `Bad date key in history: "${k}".`;
      const w = data.history[k];
      if (!w || typeof w !== "object" || !Array.isArray(w.exercises)) return `Workout ${k} is malformed.`;
      for (const ex of w.exercises){
        if (!ex || typeof ex.name !== "string" || !Array.isArray(ex.sets)) return `Workout ${k} has a malformed exercise.`;
      }
    }
  }
  if (data.bodylog != null && (typeof data.bodylog !== "object" || Array.isArray(data.bodylog))){
    return "The bodyweight log in that file is malformed.";
  }
  if (data.settings != null && (typeof data.settings !== "object" || Array.isArray(data.settings))){
    return "The settings in that file are malformed.";
  }
  return null;
}

function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ toast("That file isn't valid JSON"); return; }
    const problem = validateBackup(data);
    if (problem){ toast(problem); return; }
    if (data.history) history = data.history;
    if (data.settings) settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
    if (data.bodylog) bodylog = data.bodylog;
    saveHistory(); saveSettings(); saveBodylog();
    current = history[todayISO()] || null; saveCurrent();
    invalidateAnalytics(); applyTheme();
    toast(`Imported ${Object.keys(history).length} workouts`);
    go("today");
  };
  reader.onerror = ()=> toast("Could not read that file");
  reader.readAsText(file);
  e.target.value = "";
}

function applyTheme(){
  const acc = ACCENTS[settings.accent] || ACCENTS.pink;
  const r = document.documentElement;
  r.style.setProperty("--accent", acc.a);
  r.style.setProperty("--accent-dim", acc.d);
  r.style.setProperty("--accent-ghost", `rgba(${acc.rgb},.15)`);
  r.style.setProperty("--accent-line",  `rgba(${acc.rgb},.42)`);
  r.style.setProperty("--accent-glow",  `rgba(${acc.rgb},.55)`);
  r.style.setProperty("--on-accent", acc.on);
  r.setAttribute("data-amoled", settings.amoled ? "1" : "0");
  r.setAttribute("data-theme", resolvedTheme());
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", resolvedTheme()==="light" ? "#f7f6f7" : "#000000");
}
/* "auto" follows the OS. Resolved on every apply so a system switch mid-session
   lands as soon as anything re-themes. */
function resolvedTheme(){
  if (settings.theme === "light") return "light";
  if (settings.theme === "auto"){
    try{ return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
    catch(e){ return "dark"; }
  }
  return "dark";
}
try{
  window.matchMedia("(prefers-color-scheme: light)")
    .addEventListener("change", ()=>{ if (settings.theme === "auto") applyTheme(); });
}catch(e){}

function go(tab){

  if (tab==="today") renderToday();

  else if (tab==="settings") renderSettings();
}

/* Toast — optionally with an Undo action for destructive changes. */
let toastTimer=null;
function toast(msg, undoFn){
  const t=$("#toast");
  t.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = msg;
  t.appendChild(span);
  if (undoFn){
    const b = document.createElement("button");
    b.className = "toast-undo";
    b.textContent = "Undo";
    b.onclick = ()=>{ t.classList.remove("show"); clearTimeout(toastTimer); undoFn(); };
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), undoFn ? 5000 : 2000);
}
// Deep clone for undo snapshots; structuredClone isn't guaranteed on older WebKit.
function snapshot(o){ try{ return structuredClone(o); }catch(e){ return JSON.parse(JSON.stringify(o)); } }

/* A new worker used to install silently and sit there, so the app could keep
   running a stale build indefinitely — you'd fix a bug and the phone would
   never show it. Offer the reload instead, and let the user take it between
   sets rather than mid-set. */
let waitingWorker = null;
function watchForUpdate(reg){
  if (!reg) return;
  const offer = w => {
    if (!w || !navigator.serviceWorker.controller) return;   // first install, nothing to replace
    waitingWorker = w;
    const b = $("#updateBanner");
    if (b) b.hidden = false;
  };
  if (reg.waiting) offer(reg.waiting);
  reg.addEventListener("updatefound", ()=>{
    const nw = reg.installing;
    if (!nw) return;
    nw.addEventListener("statechange", ()=>{ if (nw.state === "installed") offer(nw); });
  });
  // The new worker has taken over — the page is now the stale half.
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  // Check again when the app comes back to the foreground.
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) reg.update().catch(()=>{}); });
}
$("#updateReload").onclick = ()=>{
  flushSaves();                                   // don't lose the current set to a reload
  if (waitingWorker) waitingWorker.postMessage({ type:"skip-waiting" });
  else location.reload();
};
$("#storageExport").onclick = exportData;

/* Bottom chrome vs. the viewport.
   `position:fixed` anchors to the *layout* viewport. iOS can move the visible
   (visual) viewport away from it — the keyboard shrinks it and doesn't always
   restore, and any page zoom detaches it outright — which leaves the nav and
   the rest timer stranded partway up the screen with content still drawn
   below them. Pinning inputs at 16px stops iOS zooming on focus in the first
   place; this is the recovery for when the two drift apart anyway. */
function syncChrome(){
  const vv = window.visualViewport;
  if (!vv) return;
  const layout = document.documentElement.clientHeight;
  const gap = layout - (vv.height + vv.offsetTop);
  // Sub-pixel noise is not a drift. And a bad reading should leave the chrome
  // slightly off rather than shoved off-screen, so cap the lift at half a screen.
  const pin = Math.abs(gap) < 2 ? 0 : Math.max(0, Math.min(gap, layout * 0.5));
  document.documentElement.style.setProperty("--vv-bottom", Math.round(pin) + "px");
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", syncChrome);
  window.visualViewport.addEventListener("scroll", syncChrome);
}
window.addEventListener("orientationchange", ()=> setTimeout(syncChrome, 300));
/* Dismissing the keyboard can leave iOS on a shrunken viewport until something
   forces it to recalculate. */
document.addEventListener("focusout", ()=> setTimeout(()=>{
  window.scrollTo(0, window.scrollY);
  syncChrome();
}, 150));

/* ---------- Boot ---------- */
function boot(){
  applyTheme();
  syncChrome();
  renderHeader();
  // If a stored "current" is stale (different day), file any work it holds into
  // the log before dropping it, then let today rebuild.
  if (current && current.date !== todayISO()){
    if (totals(current).done > 0){ history[current.date] = current; saveHistory(); }
    current = null; saveCurrent();
  }
  go("today");
  restoreTimer();
  if (settings.reminders) scheduleReminder();
  // Ask for durable storage so the browser doesn't evict the training log.
  try{
    if (navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist().catch(()=>{}); }).catch(()=>{});
    }
  }catch(e){}
  if ("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").then(watchForUpdate).catch(()=>{}));
  }
}
boot();
</script>
