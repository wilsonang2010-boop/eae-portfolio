<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<meta name="description" content="IronLog — a personal Push / Pull / Legs workout tracker with rest timer, history and stats. Works offline.">
<title>IronLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- Theme ---------- */
:root{
  --bg:#000000;
  --panel:#101013;
  --panel-2:#17171c;
  --panel-3:#212128;
  --border:#2a2a33;
  --text:#f6f4f6;
  --muted:#9a919b;
  --muted-2:#6a626e;
  /* Accent is fully variable-driven so a theme swap reaches every surface.
     applyTheme() rewrites all five from the chosen palette entry. */
  --accent:#ec4899;
  --accent-dim:#db2777;
  --accent-ghost:rgba(236,72,153,.15);
  --accent-line:rgba(236,72,153,.42);
  --accent-glow:rgba(236,72,153,.55);
  --on-accent:#1a0410;
  --info:#38bdf8;
  --danger:#ef4444;
  --amber:#f59e0b;
  --radius:22px;
  --radius-sm:14px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  /* Chrome surfaces that sit over content — translucent, so they need their
     own value per theme rather than a literal black. */
  --chrome:rgba(0,0,0,.82);
  --logo-2:#000;
  --shadow-strong:rgba(0,0,0,.85);
}
:root[data-amoled="1"]{ --panel:#08080a; --panel-2:#0f0f13; --panel-3:#17171c; --border:#212128; }
/* Light theme. Only the neutrals move — the accent cascade is untouched, so
   every palette still works and nothing needs a second set of overrides.
   --on-accent stays dark because accent fills stay saturated in both themes. */
:root[data-theme="light"]{
  --bg:#f7f6f7;
  --panel:#ffffff;
  --panel-2:#f0eef0;
  --panel-3:#e4e1e5;
  --border:#dcd8dd;
  --text:#16141a;
  --muted:#6b636f;
  --muted-2:#948c98;
  --chrome:rgba(255,255,255,.86);
  --logo-2:#dcd8dd;
  --shadow-strong:rgba(20,16,24,.18);
}
:root[data-theme="light"][data-amoled="1"]{ --panel:#ffffff; --panel-2:#f0eef0; --panel-3:#e4e1e5; --border:#dcd8dd; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* An author `display` rule beats the UA stylesheet's [hidden], so anything
   given display:flex/grid stays on screen while "hidden". Put it back. */
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  line-height:1.45;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
/* Keyboard users had nothing to follow — the app is tap-first but that's no
   reason for the focus ring to be invisible. :focus-visible keeps it off for
   touch and mouse. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* Respect the OS "reduce motion" setting: the pop, ring and slide animations
   are decoration, and vestibular triggers for some people. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
::selection{background:var(--accent-ghost)}
.app{
  max-width:520px;margin:0 auto;min-height:100%;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 14px) 20px 12px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(160deg,var(--panel-2),var(--logo-2));
  border:1px solid var(--border);
  display:grid;place-items:center;
}
.brand .logo svg{width:20px;height:20px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.brand .sub{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.25}
.brand .sub b{color:var(--text);font-weight:600;display:block;font-size:13px}
.rest-launch{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;margin-left:12px;
  background:var(--panel-2);border:1px solid var(--border);display:grid;place-items:center;
  transition:transform .12s,border-color .2s;
}
.rest-launch svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.rest-launch:active{transform:scale(.92)}
.rest-launch:active svg{stroke:var(--accent)}

/* ---------- Views ---------- */
.view{padding:6px 16px 20px;animation:fade .28s ease}
.view[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Progress bar ---------- */
.progress-wrap{
  position:sticky;top:calc(var(--safe-t) + 58px);z-index:30;
  background:var(--bg);padding:8px 4px 12px;margin:0 -4px;
}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-head .t{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.progress-head .p{font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--border)}
.bar>span{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));
  transition:width .5s cubic-bezier(.22,1,.36,1);
}

/* ---------- Cards ---------- */
.group-label{
  font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted-2);
  text-transform:uppercase;margin:22px 6px 10px;display:flex;align-items:center;gap:8px;
}
.group-label::after{content:"";flex:1;height:1px;background:var(--border)}
.ex-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 16px 8px;margin-bottom:14px;transition:border-color .3s;
}
.ex-card.complete{border-color:var(--accent-line)}
.ex-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.ex-name{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.ex-scheme{font-size:12.5px;color:var(--muted);margin-top:3px}
.ex-tag{
  margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--border);padding:5px 9px;border-radius:99px;
}
.ex-done-badge{margin-left:auto;color:var(--accent);display:none;align-items:center;gap:5px;font-size:13px;font-weight:700}
.ex-card.complete .ex-done-badge{display:flex}
.ex-card.complete .ex-tag{display:none}

.ex-title{text-align:left;flex:1;min-width:0;padding:0;display:block}
.ex-title:active .ex-name{color:var(--accent)}
.ex-menu{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;margin-left:6px;
  background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
  font-size:17px;font-weight:800;line-height:1;
}
.ex-card.skipped{opacity:.55}
.ex-card.skipped .ex-name{text-decoration:line-through}
.skip-note{font-size:13px;color:var(--muted);padding:4px 4px 12px}
.swap-btn{
  width:34px;height:34px;border-radius:10px;margin-left:10px;vertical-align:middle;
  background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
  font-size:16px;font-weight:800;
}
.swap-btn:active{color:var(--accent);border-color:var(--accent)}
/* Progression nudge */
.prog-chip{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--accent-ghost);border:1px solid var(--accent-line);border-radius:13px;
  padding:10px 12px;margin:2px 0 10px;font-size:13px;color:var(--text);font-weight:600;
}
.prog-chip .up{color:var(--accent);font-size:11px}
.prog-chip b{color:var(--accent)}
.prog-chip:active{transform:scale(.99)}
/* Card footer actions */
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 8px;border-top:1px solid var(--border);margin-top:6px}
.foot-btn{
  font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--border);border-radius:10px;padding:8px 11px;
}
.foot-btn:active{color:var(--accent);border-color:var(--accent)}
.foot-btn.del{color:var(--muted-2)}

/* ---------- Set rows ---------- */
.set{
  display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:14px;
  transition:background .3s;
}
.set + .set{border-top:1px solid var(--border)}
.set.done{background:var(--accent-ghost);border-top-color:transparent}
.set.done + .set{border-top-color:transparent}
.check{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  background:var(--panel-2);border:2px solid var(--border);
  display:grid;place-items:center;transition:transform .12s,background .25s,border-color .25s;
}
.check svg{width:24px;height:24px;stroke:var(--muted-2);transition:stroke .2s;opacity:.0}
.check:active{transform:scale(.9)}
.set.done .check{background:var(--accent);border-color:var(--accent)}
.set.done .check svg{stroke:var(--on-accent);opacity:1;stroke-width:3.2}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .32s ease}
.set-main{flex:1;min-width:0}
.set-top{display:flex;align-items:center;gap:8px;min-width:0}
.set-label{
  font-size:13px;font-weight:700;min-width:32px;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.set-label.warm{color:var(--amber)}
/* Only shown on a set that set a record — hidden everywhere else. */
.pr-badge{display:none}
.set.pr .pr-badge{
  display:inline-block;flex:0 0 auto;font-size:9.5px;font-weight:900;letter-spacing:.06em;
  background:var(--amber);color:#1a1204;border-radius:5px;padding:2px 4px;line-height:1.1;
}
.set-inputs{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0}
.field{
  display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--border);
  border-radius:11px;padding:0 7px;height:40px;transition:border-color .2s;flex:0 0 auto;
}
.field:focus-within{border-color:var(--accent)}
.field input{
  width:52px;background:none;border:none;outline:none;color:var(--text);
  font-size:16px;font-weight:700;text-align:right;padding:0;
  font-variant-numeric:tabular-nums;
}
.field.reps input{width:34px;text-align:center}
.field .u{font-size:11px;color:var(--muted);margin-left:4px;font-weight:600}
/* Weight/reps are buttons, not text inputs: they open the in-app keypad so
   iOS never opens its keyboard (which is what triggers "Undo Typing" on shake). */
.field .val{
  min-width:40px;text-align:right;font-size:16px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.field.reps .val{min-width:24px;text-align:center}
.field .val.empty{color:var(--muted-2)}
.field:disabled{opacity:.6}
.field.tapped{border-color:var(--accent)}

/* ---------- Numeric keypad ---------- */
.kp-overlay{
  position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .24s;
}
.kp-overlay.show{opacity:1;pointer-events:auto}
.keypad{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
  border-radius:26px 26px 0 0;padding:18px 16px calc(16px + var(--safe-b));
  transform:translateY(26px);transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.kp-overlay.show .keypad{transform:none}
.kp-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;padding:0 4px}
.kp-label{font-size:12.5px;color:var(--muted);font-weight:600}
.kp-value{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kp-value small{font-size:16px;color:var(--muted);font-weight:700;margin-left:3px}
.kp-done{
  margin-left:auto;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;
  padding:12px 22px;border-radius:13px;
}
.kp-plates{font-size:11.5px;color:var(--accent);font-weight:700;margin-top:3px;letter-spacing:.01em}
.kp-quick{display:flex;gap:8px;margin-bottom:10px}
.kp-quick button{
  flex:1;padding:11px 0;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);
  font-size:14px;font-weight:700;color:var(--muted);
}
.kp-quick button:active{border-color:var(--accent);color:var(--text)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp-grid button{
  padding:16px 0;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);
  font-size:22px;font-weight:700;transition:transform .1s,background .15s;
}
.kp-grid button:active{transform:scale(.95);background:var(--panel-3)}
.kp-grid button.wide{grid-column:span 1}
.note-btn{
  font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);
  border-radius:10px;height:40px;padding:0 8px;font-weight:600;white-space:nowrap;flex:0 0 auto;
}
.note-btn.has{color:var(--accent);border-color:var(--accent-line)}
.note-row{padding:0 4px 8px 60px;overflow:hidden}
.note-row input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;
  padding:9px 12px;color:var(--text);font-size:14px;outline:none;
}
.note-row input:focus{border-color:var(--accent)}
/* Effort tag */
.set-more{
  height:40px;min-width:38px;padding:0 7px;flex:0 0 auto;display:flex;align-items:center;gap:3px;
  justify-content:center;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
}
.set-more.has{border-color:var(--muted-2)}
.set-more .dot{width:9px;height:9px;border-radius:99px;background:var(--muted-2);display:block}
.set-more .dot.easy{background:var(--info)}
.set-more .dot.solid{background:var(--accent)}
.set-more .dot.hard{background:var(--amber)}
.set-more .nd{font-size:9px;line-height:1}
.note-text{
  display:block;font-size:12.5px;color:var(--muted);font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* Effort picker inside the set sheet */
.eff-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.eff-row{display:flex;gap:8px}
.eff{
  flex:1;padding:12px 0;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--muted);
  background:var(--panel-2);border:1px solid var(--border);
}
.eff.on{color:var(--on-accent);background:var(--muted-2);border-color:var(--muted-2)}
.eff.easy.on{background:var(--info);border-color:var(--info)}
.eff.solid.on{background:var(--accent);border-color:var(--accent)}
.eff.hard.on{background:var(--amber);border-color:var(--amber)}
/* Session note */
.wnote-btn{
  display:block;width:calc(100% - 4px);text-align:left;margin:12px 2px 2px;
  background:var(--panel);border:1px dashed var(--border);border-radius:14px;
  padding:11px 14px;font-size:13.5px;color:var(--muted);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wnote-btn.has{border-style:solid;color:var(--text);background:var(--panel-2)}
.sheet-input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:13px;
  padding:13px 14px;color:var(--text);outline:none;
  /* Never below 16px: iOS auto-zooms the whole page when you focus a smaller
     control, and that zoom is what leaves the nav and rest timer stranded
     partway up the screen. */
  font-size:16px;
}
.sheet-input:focus{border-color:var(--accent)}

@media (max-width:380px){
  .ex-card{padding:14px 12px 8px}
  .set{gap:9px}
  .check{width:42px;height:42px}
  .set-inputs{gap:5px}
  .field{padding:0 6px;height:38px}
  .field .val{min-width:34px}
  .field.reps .val{min-width:20px}
  .field .u{font-size:10px;margin-left:3px}
  .set-more{height:38px;min-width:34px;padding:0 5px}
  .note-row{padding-left:52px}
}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:-.01em;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  transition:transform .1s,filter .2s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary.ready{box-shadow:0 8px 30px -8px var(--accent-glow);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 24px -10px var(--accent-glow)}50%{box-shadow:0 10px 34px -8px var(--accent-glow)}}
.btn.ghost{background:transparent}
.btn.small{width:auto;padding:11px 16px;font-size:14px;border-radius:13px}
.finish-wrap{margin:22px 2px 6px}

/* ---------- Rest / empty states ---------- */
.rest-card{
  margin:40px 6px;padding:44px 26px;text-align:center;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
}
.rest-card .em{font-size:56px;margin-bottom:6px}
.rest-card h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.rest-card p{color:var(--muted);font-size:15px;margin:0}
.day-pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:99px;padding:8px 16px;
  font-size:14px;font-weight:700;margin-bottom:2px;
}
.day-pill .dot{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.today-hero{padding:6px 6px 2px}
.today-hero .k{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.today-hero .v{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.today-hero .v .type{color:var(--accent)}
.done-note{
  display:flex;gap:10px;align-items:center;background:var(--accent-ghost);
  border:1px solid var(--accent-line);border-radius:14px;padding:11px 14px;margin:12px 2px 4px;
  font-size:14px;color:var(--text);font-weight:600;
}
.done-note .txt{flex:1;min-width:0}
.done-note .done-resume{
  flex:0 0 auto;background:var(--accent);color:var(--on-accent);border-radius:10px;
  padding:8px 14px;font-size:13.5px;font-weight:800;
}

/* ---------- Rest timer sheet ---------- */
/* z-index sits above the modal overlay (80) so the timer is still visible
   while a past workout is open for editing. */
/* Sits just above the bottom nav rather than over it, so tabs stay reachable
   during a 2:30 rest. */
.rest-timer{
  position:fixed;left:0;right:0;z-index:85;
  bottom:calc(var(--nav-h) + var(--safe-b) + var(--vv-bottom,0px));
  transform:translateY(140%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.rest-timer.show{transform:translateY(0);pointer-events:auto}
.rest-timer-inner{
  max-width:520px;margin:0 auto;
  background:var(--panel);border:1px solid var(--border);
  border-radius:26px 26px 0 0;padding:18px 20px 18px;
  box-shadow:0 -20px 50px -20px var(--shadow-strong);
}
.rt-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rt-ring{width:78px;height:78px;flex:0 0 auto;position:relative}
.rt-ring svg{transform:rotate(-90deg)}
.rt-ring .time{
  position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.rt-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.rt-sub{font-size:15px;font-weight:700;margin-top:2px}
.rt-adjust{margin-left:auto;display:flex;gap:8px}
.rt-adjust button{width:44px;height:44px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);font-size:13px;font-weight:800;color:var(--muted)}
.rt-btns{display:flex;gap:10px}
.rt-btns button{
  flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:800;
  background:var(--panel-2);border:1px solid var(--border);
}
.rt-btns .skip{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- Bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:var(--vv-bottom,0px);z-index:50;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--chrome);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  display:flex;max-width:520px;margin:0 auto;
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted-2);font-size:10.5px;font-weight:700;letter-spacing:.02em;transition:color .2s;
}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.nav button.active{color:var(--accent)}
.nav button.active svg{transform:translateY(-1px)}

/* ---------- Stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 2px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:16px;color:var(--muted);font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat.accent .n{color:var(--accent)}
.section-title{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:24px 4px 12px;display:flex;align-items:center;gap:8px}
.pr-row{
  display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:13px 15px;margin-bottom:9px;
}
.pr-row .nm{font-weight:700;font-size:15px}
.pr-row .mg{font-size:12px;color:var(--muted)}
.pr-row{width:100%;text-align:left}
.pr-row .val{margin-left:auto;font-size:18px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.pr-row .val small{font-size:12px;color:var(--muted);font-weight:700}
.pr-row:active{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty .em{font-size:40px;display:block;margin-bottom:10px;opacity:.7}
.hint-inline{font-size:11.5px;color:var(--muted-2);font-weight:600;letter-spacing:0}

/* ---------- Week summary / balance / charts ---------- */
.week-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:8px 2px 14px}
.week-head{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.week-head span{color:var(--muted-2);letter-spacing:0;text-transform:none;font-weight:600}
.week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.week-grid .n{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.week-grid .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.week-grid .d{font-size:11px;font-weight:700;margin-top:3px;min-height:14px}
.dl{font-weight:800}
.dl.up{color:var(--accent)} .dl.down{color:var(--danger)} .dl.flat{color:var(--muted-2)}
/* Weekly session goal, under the week-vs-week numbers. */
.goal-wrap{margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.goal-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:7px}
.goal-head b{color:var(--text);font-variant-numeric:tabular-nums}
.goal-bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.goal-bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .3s ease}
.goal-bar>span.hit{background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
/* Twelve-week volume bars. */
.tw-chart{display:flex;align-items:flex-end;gap:3px;height:64px;padding-bottom:6px}
.tw-bar{flex:1;height:100%;display:flex;align-items:flex-end}
.tw-bar>span{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--accent-line);min-height:2px}
.tw-bar:last-child>span{background:var(--accent)}
/* Days since each group was last trained. */
.rec-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:5px 0}
.rec-row + .rec-row{border-top:1px solid var(--border)}
.rec-row .g{font-weight:700}
.rec-row .d{font-size:12.5px;color:var(--muted);font-weight:600}
.rec-row .d.fresh{color:var(--accent)}
.rec-row .d.stale{color:var(--amber)}
.bal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:0 2px 6px}
.bal-row + .bal-row{margin-top:12px}
.bal-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.bal-top b{color:var(--text);font-variant-numeric:tabular-nums}
.bal-bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bal-bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-dim),var(--accent))}
.chart-card{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:14px 14px 8px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.chart-head b{color:var(--text);font-variant-numeric:tabular-nums}
.spark{display:block;overflow:visible}
.ex-hist-row{
  display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:13px;padding:11px 13px;margin-bottom:8px;
}
.ex-hist-row .d{font-size:13.5px;font-weight:700}
.ex-hist-row .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-hist-row .v{margin-left:auto;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;font-size:15px}
/* Past notes for a movement, in its detail sheet. */
.note-hist{background:var(--panel-2);border:1px solid var(--border);border-radius:13px;padding:10px 13px;margin-bottom:8px}
.note-hist .d{font-size:11.5px;color:var(--muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.note-hist .t{font-size:13.5px;margin-top:3px;line-height:1.4}
.ex-hist-row .v small{color:var(--muted);font-weight:600;font-size:11px}

/* ---------- Calendar ---------- */
.cal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:6px 2px 18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .m{font-size:17px;font-weight:800;letter-spacing:-.01em}
.cal-head button{width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);font-size:18px;font-weight:800;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--muted-2);font-weight:700;padding-bottom:4px}
.cal-day{
  aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;position:relative;background:transparent;color:var(--muted);
}
.cal-day.pad{visibility:hidden}
.cal-day.today{outline:2px solid var(--accent-dim);color:var(--text)}
.cal-day.has{background:var(--accent-ghost);color:var(--text)}
.cal-day.has .tp{position:absolute;bottom:5px;font-size:8px;font-weight:800;letter-spacing:.04em;color:var(--accent)}
.cal-day.rest{color:var(--muted-2)}
.hist-row{
  display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left;width:100%;
}
.hist-row .ic{width:42px;height:42px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;flex:0 0 auto}
.hist-row .ic svg{width:22px;height:22px}
.hist-row .h-t{font-weight:800;font-size:16px}
.hist-row .h-d{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:170px}
.hist-row .note-dot{font-size:11px}
.hist-row .h-p{margin-left:auto;text-align:right}
.hist-row .h-p .pct{font-weight:800;color:var(--accent);font-size:16px}
.hist-row .h-p .st{font-size:12px;color:var(--muted)}
.list-more{text-align:center;color:var(--muted-2);font-size:12.5px;padding:12px 8px 4px}

/* ---------- Programme editor ---------- */
.split-rows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:12px 12px 4px}
.split-row{
  display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
  padding:8px 1px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);
}
.split-row>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-row .dn{font-size:9.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.02em}
.split-row .dt{font-size:10px;font-weight:800;line-height:1.1}
.split-row .dt.push{color:var(--accent)}
.split-row .dt.pull{color:var(--info)}
.split-row .dt.legs{color:var(--amber)}
.split-row .dt.rest{color:var(--muted-2)}
.plan-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.plan-row .pr-main{flex:1;min-width:0}
.plan-row .nm{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-row .mt{font-size:11.5px;color:var(--muted);margin-top:1px}
.plan-row .pr-ctl{display:flex;gap:5px;flex:0 0 auto}
.plan-row .pr-ctl button{width:31px;height:31px;border-radius:9px;background:var(--panel-3);font-size:14px;font-weight:800;color:var(--muted)}
.plan-row .pr-ctl button:disabled{opacity:.3}
.plan-row .pdel{color:var(--danger)!important}
.plan-add{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}
.plan-add .sheet-input{margin:0;min-width:0;padding-left:10px;padding-right:6px}
.plan-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}
.plan-flags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- Settings ---------- */
.set-group{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 2px 16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 16px}
.set-row + .set-row{border-top:1px solid var(--border)}
.set-row .lab{font-weight:600;font-size:15px}
.set-row .desc{font-size:12px;color:var(--muted);margin-top:2px}
.set-row .ctl{margin-left:auto;flex:0 0 auto}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.switch{width:52px;height:31px;border-radius:99px;background:var(--panel-3);border:1px solid var(--border);position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:99px;background:#fff;transition:transform .25s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(21px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);font-size:20px;font-weight:700;color:var(--text);display:grid;place-items:center}
.stepper .v{min-width:64px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:9px}
.swatch{width:30px;height:30px;border-radius:99px;border:2px solid transparent;transition:transform .15s}
.swatch.on{border-color:var(--text);transform:scale(1.08)}
.hint{font-size:12.5px;color:var(--muted);padding:2px 8px;margin:-4px 2px 16px;line-height:1.5}
.hint b{color:var(--text)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s;
}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
  border-radius:28px 28px 0 0;padding:26px 22px calc(26px + var(--safe-b));
  transform:translateY(30px);transition:transform .32s cubic-bezier(.22,1,.36,1);
  max-height:88vh;overflow:auto;
}
.overlay.show .sheet{transform:none}
.summary .celebrate{text-align:center;margin-bottom:20px}
.summary .celebrate .em{font-size:52px}
.summary .celebrate h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.summary .celebrate p{color:var(--muted);margin:0;font-size:14px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.sum-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.sum-cell .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sum-cell.accent .n{color:var(--accent)}
.sum-cell .l{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.sheet h3.sh-title{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sheet .sh-sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translate(-50%,20px);
  background:var(--panel-3);border:1px solid var(--border);color:var(--text);
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 40px -12px rgba(0,0,0,.7);
}
/* pointer-events must come back on, or the Undo action is unclickable. */
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast{display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px)}
.toast-undo{color:var(--accent);font-weight:800;font-size:14px;padding:2px 2px;flex:0 0 auto}

/* ---------- History search ---------- */
.search-row{display:flex;align-items:center;gap:8px;margin:0 2px 10px;position:relative}
.search-in{
  flex:1;background:var(--panel);border:1px solid var(--border);border-radius:13px;
  padding:12px 14px;color:var(--text);font-size:16px;outline:none;   /* see .sheet-input */
}
.search-in:focus{border-color:var(--accent)}
.search-clear{
  position:absolute;right:10px;width:28px;height:28px;border-radius:99px;
  background:var(--panel-3);color:var(--muted);font-size:13px;font-weight:800;
}
.chips{display:flex;gap:8px;margin:0 2px 4px;flex-wrap:wrap}
.chip{
  font-size:13px;font-weight:700;color:var(--muted);background:var(--panel);
  border:1px solid var(--border);border-radius:99px;padding:7px 14px;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- Quote ---------- */
.quote{margin:0;padding:0 20px 6px}
.quote blockquote{
  margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.4;
  color:var(--text);
}
.quote blockquote::before{content:"“"}
.quote blockquote::after{content:"”"}
.quote figcaption{
  margin-top:2px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);
}

/* ---------- Banners ---------- */
.banner{
  display:flex;align-items:center;gap:12px;margin:8px 20px 4px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--radius-sm);
}
.banner.danger{border-color:rgba(239,68,68,.5)}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:14px;font-weight:800}
.banner .bt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.banner>button{
  flex:0 0 auto;background:var(--accent);color:var(--on-accent);
  border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:800;
}
.banner.danger>button{background:var(--danger);color:#fff}

/* ---------- Plateau ---------- */
.stall-card{background:var(--panel);border:1px solid rgba(245,158,11,.35);border-radius:var(--radius);padding:14px 16px;margin:0 2px 6px}
.stall-lead{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.stall-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;
}
.stall-row .nm{font-weight:700;font-size:14px}
.stall-row .kg{margin-left:auto;font-size:12px;color:var(--amber);font-weight:700;white-space:nowrap}
.link{color:var(--accent);font-weight:700;background:none;padding:0;font-size:inherit}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6M6.5 7.5v9M17.5 7.5v9M20 9v6M6.5 12h11" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <h1>IronLog</h1>
      <div class="sub"><b id="topDay">—</b><span id="topDate">—</span></div>
      <button class="rest-launch" id="manualTimer" aria-label="Start rest timer" title="Start rest timer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.2 2.2M9.5 2.5h5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <figure class="quote">
    <blockquote>Nothing is given. Everything is earned.</blockquote>
    <figcaption>LeBron James</figcaption>
  </figure>

  <!-- Saves failing (quota, private browsing). Shown only when writes break. -->
  <div class="banner danger" id="storageBanner" hidden>
    <div class="bt">
      <b>Saves are failing</b>
      <span>Device storage is full — new sets may not be kept. Export a backup now.</span>
    </div>
    <button id="storageExport">Export</button>
  </div>

  <!-- A newer version of the app is cached and waiting. -->
  <div class="banner" id="updateBanner" hidden>
    <div class="bt">
      <b>Update ready</b>
      <span>A new version of IronLog has downloaded.</span>
    </div>
    <button id="updateReload">Reload</button>
  </div>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-stats" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<!-- Rest timer -->
<div class="rest-timer" id="restTimer">
  <div class="rest-timer-inner">
    <div class="rt-top">
      <div class="rt-ring">
        <svg width="78" height="78" viewBox="0 0 78 78">
          <circle cx="39" cy="39" r="34" stroke="var(--panel-3)" stroke-width="7" fill="none"/>
          <circle id="rtArc" cx="39" cy="39" r="34" stroke="var(--accent)" stroke-width="7" fill="none"
                  stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="0"/>
        </svg>
        <div class="time" id="rtTime">2:30</div>
      </div>
      <div>
        <div class="rt-label" id="rtTitle">Rest</div>
        <div class="rt-sub" id="rtSub">Recovering…</div>
      </div>
      <div class="rt-adjust">
        <button id="rtMinus" aria-label="Take 15 seconds off the rest">−15</button>
        <button id="rtPlus" aria-label="Add 15 seconds to the rest">+15</button>
      </div>
    </div>
    <div class="rt-btns">
      <button id="rtPause">Pause</button>
      <button id="rtRestart">Restart</button>
      <button class="skip" id="rtSkip">Skip</button>
    </div>
  </div>
</div>

<!-- Bottom nav -->
