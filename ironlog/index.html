<script>
"use strict";
/* ============================================================
   IronLog — offline-first Push / Pull / Legs tracker.
   All state lives in localStorage; the app works with no network.
   ============================================================ */

/* ---------- Constants ---------- */
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
// Indexed by Date.getDay(): Sun..Sat
const SCHEDULE = ["Legs","Push","Pull","Legs","Push","Pull","Rest"];

const TEMPLATES = {
  Push: [
    { group:"Chest",     name:"Bench Press",       warmup:true,  sets:3, reps:8, bar:true },
    { group:"Chest",     name:"Pec Fly",           warmup:false, sets:3, reps:8 },
    { group:"Shoulders", name:"Shoulder Press",    warmup:true,  sets:3, reps:8, bar:true },
    { group:"Shoulders", name:"Lateral Raises",    warmup:false, sets:3, reps:8 },
    { group:"Triceps",   name:"Tricep Pushdown",   warmup:true,  sets:3, reps:8 },
    { group:"Triceps",   name:"Tricep Extension",  warmup:false, sets:3, reps:8 },
  ],
  Pull: [
    { group:"Back",   name:"Lat Pulldown",     warmup:true,  sets:3, reps:8 },
    { group:"Back",   name:"Assisted Pull-up", warmup:false, sets:3, reps:8 },
    { group:"Back",   name:"Seated Row",       warmup:false, sets:3, reps:8 },
    { group:"Biceps", name:"Bicep Curl",       warmup:true,  sets:3, reps:8 },
    { group:"Biceps", name:"Hammer Curl",      warmup:false, sets:3, reps:8 },
  ],
  Legs: [
    { group:"Plyometrics", name:"Seated Box Jump",          warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Box Jump",                 warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Depth Jump",               warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Pogo Jump",                warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Full Effort Forward Jump", warmup:false, sets:2, reps:5, plyo:true },
    { group:"Weights",     name:"Leg Press",       warmup:true,  sets:3, reps:8, bar:true },
    { group:"Weights",     name:"Leg Extension",   warmup:false, sets:3, reps:8 },
  ],
};

/* Accent palette. `rgb` drives the translucent tints, `on` is the text colour
   used on top of a filled accent surface. Pink is the default theme. */
const ACCENTS = {
  pink:   { a:"#ec4899", d:"#db2777", rgb:"236,72,153",  on:"#1a0410" },
  rose:   { a:"#fb7185", d:"#e11d48", rgb:"251,113,133", on:"#1d0509" },
  violet: { a:"#a78bfa", d:"#7c3aed", rgb:"167,139,250", on:"#12061f" },
  green:  { a:"#22c55e", d:"#16a34a", rgb:"34,197,94",   on:"#04120a" },
  blue:   { a:"#38bdf8", d:"#0284c7", rgb:"56,189,248",  on:"#031420" },
};

const DEFAULT_SETTINGS = {
  restSec: 150, units: "kg", accent: "pink", amoled: false,
  reminders: false, sound: true, vibrate: true, bodyKg: 70,
  // Which kinds of set auto-start the rest timer. Working sets always do.
  restAfterPlyo: true, restAfterWarmup: false,
  // Hold an inaudible audio loop during a rest so the finish alarm still
  // sounds with the app in the background or the phone locked.
  bgAlarm: true,
  // Per-exercise rest overrides, keyed by exercise name: { "Pec Fly": 90 }
  exRest: {},
  barKg: 20, plates: [20,15,10,5,2.5,1.25], showPlates: true,
  lastBackup: null, workoutsSinceBackup: 0,
  askedNotify: false,   // only prompt for notification permission once
  // null means "use the built-in split"; otherwise 7 entries, Sun..Sat.
  schedule: null,
  // Per-type exercise lists that override TEMPLATES once edited.
  plan: {},
  weeklyGoal: 5,
  theme: "dark",        // dark | light | auto
};

/* ---------- Storage ---------- */
/* A failed write used to be swallowed whole. That's the worst possible
   outcome for a training log: the app keeps working, you keep ticking sets,
   and none of it survives the next reload. Surface it instead. */
let storageBroken = false;
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){
    try {
      localStorage.setItem(k, JSON.stringify(v));
      if (storageBroken){ storageBroken = false; showStorageBanner(false); }
      return true;
    } catch(e){
      if (!storageBroken){ storageBroken = true; showStorageBanner(true); }
      return false;
    }
  },
};
function showStorageBanner(show){
  const b = document.getElementById("storageBanner");
  if (b) b.hidden = !show;
}
const K_SET = "IL_SETTINGS", K_HIST = "IL_HISTORY", K_CUR = "IL_CURRENT",
      K_TIMER = "IL_TIMER", K_BODY = "IL_BODYLOG";

let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get(K_SET, {}));
let history  = LS.get(K_HIST, {});   // { "YYYY-MM-DD": workout }
let current  = LS.get(K_CUR, null);  // today's in-progress/finished workout
let bodylog  = LS.get(K_BODY, {});   // { "YYYY-MM-DD": kg }
let activeTab = "today";
let calMonth = new Date(); calMonth.setDate(1);
let histQuery = "", histFilter = "All";

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
function isoDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
/* "2026-08-04" parsed bare is UTC midnight, which renders as the *previous*
   day anywhere west of UTC. Always read a log key as local midnight. */
function dateOf(ds){ return new Date(ds+"T00:00:00"); }
function todayISO(){ return isoDate(new Date()); }

/* The split and the exercise lists both start from the built-in constants and
   are overridden once edited, so an untouched install behaves exactly as
   before and a customised one never falls back mid-session. */
const WORKOUT_TYPES = ["Push","Pull","Legs","Rest"];
function scheduleFor(dow){
  const s = settings.schedule;
  return (Array.isArray(s) && WORKOUT_TYPES.includes(s[dow])) ? s[dow] : SCHEDULE[dow];
}
function currentSchedule(){ return [0,1,2,3,4,5,6].map(scheduleFor); }
function templateFor(type){
  const p = settings.plan && settings.plan[type];
  return (Array.isArray(p) && p.length) ? p : (TEMPLATES[type] || []);
}
/* A mutable copy of a day's exercise list, seeded from the built-in template
   the first time it's edited. */
function editablePlan(type){
  if (!settings.plan) settings.plan = {};
  if (!Array.isArray(settings.plan[type]) || !settings.plan[type].length){
    settings.plan[type] = (TEMPLATES[type]||[]).map(t=> Object.assign({}, t));
  }
  return settings.plan[type];
}
function planIsCustom(type){
  const p = settings.plan && settings.plan[type];
  if (!Array.isArray(p) || !p.length) return false;
  return JSON.stringify(p) !== JSON.stringify(TEMPLATES[type]||[]);
}
function todayType(){ return scheduleFor(new Date().getDay()); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const KG_PER_LB = 0.45359237;
function toDisplay(kg){ if(kg==null) return ""; const v = settings.units==="kg"? kg : kg/KG_PER_LB; return +(Math.round(v*100)/100); }
function fromDisplay(v){ if(v===""||v==null||isNaN(v)) return null; return settings.units==="kg"? +v : +v*KG_PER_LB; }
function unitLabel(){ return settings.units; }
function fmtWeightKg(kg){ if(kg==null) return "—"; return `${toDisplay(kg)} ${unitLabel()}`; }
/* Persistence is debounced: tapping through a workout used to re-serialise the
   whole history on every checkbox, weight and note keystroke. Writes coalesce
   into one, and always flush before the page can go away. */
const _dirty = new Set();
let _saveTimer = null;
function markDirty(key){
  _dirty.add(key);
  // Only the logged history feeds the analytics; the in-progress workout
  // doesn't, so ticking sets must not keep clearing the memo.
  if (key === K_HIST) invalidateAnalytics();
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushSaves, 180);
}
function flushSaves(){
  clearTimeout(_saveTimer); _saveTimer = null;
  if (!_dirty.size) return;
  if (_dirty.has(K_SET))  LS.set(K_SET, settings);
  if (_dirty.has(K_HIST)) LS.set(K_HIST, history);
  if (_dirty.has(K_BODY)) LS.set(K_BODY, bodylog);
  if (_dirty.has(K_CUR)){
    if (current) LS.set(K_CUR, current);
    else { try{ localStorage.removeItem(K_CUR); }catch(e){} }
  }
  _dirty.clear();
}
function saveSettings(){ markDirty(K_SET); }
function saveHistory(){ markDirty(K_HIST); }
function saveCurrent(){ markDirty(K_CUR); }
function saveBodylog(){ markDirty(K_BODY); }
window.addEventListener("pagehide", flushSaves);
window.addEventListener("beforeunload", flushSaves);
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) flushSaves(); });

/* Analytics memo. exerciseHistory/computePRs each scan and sort the whole log,
   and a single render calls them once per exercise card — this collapses that
   to one scan per data change. */
let _memoEx = new Map(), _memoPRs = null, _memoStall = null;
function invalidateAnalytics(){ _memoEx.clear(); _memoPRs = null; _memoStall = null; }

/* ---------- Workout building ---------- */
function buildWorkout(type, dateISO){
  const exercises = templateFor(type).map((t, i) => {
    const sets = [];
    if (t.warmup) sets.push({ kind:"warmup", done:false, weightKg:null, reps:t.reps, note:"" });
    for (let s=0; s<t.sets; s++) sets.push({ kind:"working", done:false, weightKg:null, reps:t.reps, note:"" });
    return { id:i, name:t.name, group:t.group, plyo:!!t.plyo, bar:!!t.bar,
             reps:t.reps, repMax:t.repMax || null, sets };
  });
  const w = { type, date:dateISO, startedAt:null, endedAt:null, exercises };
  preloadWeights(w);
  return w;
}
// Preload the most recent same-type workout's weights.
function preloadWeights(w){
  const past = Object.values(history)
    .filter(h => h.type===w.type && h.date!==w.date)
    .sort((a,b)=> a.date<b.date?1:-1)[0];
  if (!past) return;
  const byName = {};
  past.exercises.forEach(e => byName[e.name] = e);
  w.exercises.forEach(e => {
    const p = byName[e.name];
    if (!p) return;
    e.sets.forEach((set, i) => {
      const ps = p.sets[i];
      if (ps && ps.weightKg!=null) set.weightKg = ps.weightKg;
    });
  });
}
function totals(w){
  let done=0, total=0;
  w.exercises.forEach(e=>e.sets.forEach(s=>{
    if (e.skipped) return;
    total++; if(s.done) done++;
  }));
  return { done, total, pct: total? Math.round(done/total*100):0 };
}

/* ============================================================
   ANALYTICS
   ============================================================ */
// Epley estimated 1-rep max. Lets us compare 60kg×8 against 70kg×3 — a plain
// "heaviest weight" comparison calls the second a PR when it usually isn't.
function e1rm(kg, reps){
  if (kg==null || !reps || reps<1) return null;
  if (reps === 1) return kg;
  return kg * (1 + reps/30);
}
/* Working sets only. Warm-ups used to count, which quietly inflated total
   volume, weekly volume and the muscle-group balance — a 3-set exercise with
   a warm-up reported a third more work than was actually done. */
function setVolume(s){
  return (s.done && s.kind === "working" && s.weightKg!=null && s.reps) ? s.weightKg*s.reps : 0;
}
function workoutVolume(w){
  let v=0;
  w.exercises.forEach(e=>{ if(!e.skipped) e.sets.forEach(s=>{ v += setVolume(s); }); });
  return v;
}
function exerciseVolume(e){
  let v=0; e.sets.forEach(s=>{ v += setVolume(s); }); return v;
}
// Every logged session that contains this exercise, newest first. Memoized:
// a single render asks for the same exercise several times.
function exerciseHistory(name){
  const hit = _memoEx.get(name);
  if (hit) return hit;
  const out = _exerciseHistory(name);
  _memoEx.set(name, out);
  return out;
}
function _exerciseHistory(name){
  return Object.values(history)
    .filter(w => w.exercises.some(e=>e.name===name))
    .sort((a,b)=> a.date<b.date?1:-1)
    .map(w => {
      const e = w.exercises.find(x=>x.name===name);
      const working = e.sets.filter(s=>s.kind==="working" && s.done && s.weightKg!=null);
      let best = null;
      working.forEach(s=>{ const v=e1rm(s.weightKg,s.reps); if(v!=null && (best==null || v>best.v)) best={v, kg:s.weightKg, reps:s.reps}; });
      return { date:w.date, type:w.type, ex:e, sets:working, best, volume:exerciseVolume(e),
               topKg: working.reduce((m,s)=> s.weightKg>m ? s.weightKg : m, 0) };
    });
}
// The most recent completed session for an exercise, for "repeat last time".
function lastSessionFor(name, excludeDate){
  return exerciseHistory(name).find(h => h.date !== excludeDate && h.sets.length) || null;
}
/* Did every working set hit its rep target at the same weight last time? If so
   it's time to add weight — 2.5kg upper body, 5kg lower. */
/* Rep ranges. An exercise may carry a repMax, in which case `reps` is the
   bottom of the range: you add reps week to week and only add weight once
   every working set reaches the top, then drop back to the bottom. Without a
   repMax this behaves exactly as before — hit the fixed target, add weight. */
function repTop(ex){ return (ex.repMax && ex.repMax > ex.reps) ? ex.repMax : ex.reps; }
function repsLabel(ex){ return repTop(ex) > ex.reps ? `${ex.reps}–${ex.repMax}` : `${ex.reps}`; }

function progressionSuggestion(ex, w){
  if (ex.plyo) return null;
  const last = lastSessionFor(ex.name, w.date);
  if (!last) return null;
  const target = repTop(ex);
  const all = last.ex.sets.filter(s=>s.kind==="working");
  if (!all.length || !all.every(s=> s.done && s.weightKg!=null && (s.reps||0) >= target)) return null;
  const base = all[0].weightKg;
  if (!all.every(s=> Math.abs(s.weightKg-base) < 0.01)) return null;
  const lower = /leg|squat|calf|hip/i.test(ex.name) || ex.group==="Weights";
  const step = lower ? 5 : 2.5;
  // With a range, adding weight means resetting to the bottom of it.
  const resetTo = target > ex.reps ? ex.reps : null;
  return { from: base, to: +(base+step).toFixed(2), step, target, resetTo };
}
function suggestedWarmupKg(ex){
  const working = ex.sets.filter(s=>s.kind==="working" && s.weightKg!=null);
  if (!working.length) return null;
  const target = working[0].weightKg;
  if (!target) return null;
  const half = target/2;
  const step = 2.5;                                   // round to the nearest plate pair
  return Math.max(step, Math.round(half/step)*step);
}
// Monday-anchored week key, so "this week" matches the training split.
function weekStart(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = (x.getDay()+6)%7;                        // Mon=0
  x.setDate(x.getDate()-dow);
  return x;
}
function weekStats(offset){
  const start = weekStart(new Date()); start.setDate(start.getDate() - offset*7);
  const end = new Date(start); end.setDate(end.getDate()+7);
  let workouts=0, sets=0, volume=0;
  Object.values(history).forEach(w=>{
    const d = dateOf(w.date);
    if (d>=start && d<end){
      const t = totals(w);
      if (t.done>0){ workouts++; sets += t.done; volume += workoutVolume(w); }
    }
  });
  return { workouts, sets, volume, start };
}
// Completed working-set volume per muscle group, for a balance check.
function groupVolumes(){
  const g = {};
  Object.values(history).forEach(w=> w.exercises.forEach(e=>{
    if (e.plyo) return;
    const v = exerciseVolume(e);
    if (v>0) g[e.group] = (g[e.group]||0) + v;
  }));
  return g;
}
/* Plate maths: what to hang on each side of the bar. Returns null when the
   target isn't loadable (below the bar, or an odd remainder). */
function platesFor(totalKg){
  const bar = settings.barKg || 20;
  if (totalKg==null || totalKg < bar) return null;
  let perSide = (totalKg - bar)/2;
  if (perSide === 0) return { bar, plates:[], leftover:0 };
  const out = [];
  const avail = [...(settings.plates||[])].sort((a,b)=>b-a);
  for (const p of avail){
    while (perSide >= p - 1e-9){ out.push(p); perSide = +(perSide - p).toFixed(4); }
  }
  return { bar, plates: out, leftover: +perSide.toFixed(2) };
}
function platesText(totalKg){
  const r = platesFor(totalKg);
  if (!r) return "";
  if (!r.plates.length) return `bar only (${r.bar})`;
  const counts = {};
  r.plates.forEach(p=> counts[p] = (counts[p]||0)+1);
  const parts = Object.keys(counts).sort((a,b)=>b-a)
    .map(p => counts[p]>1 ? `${p}×${counts[p]}` : `${p}`);
  return `${r.bar} bar + ${parts.join(" + ")} / side` + (r.leftover ? ` (+${r.leftover} short)` : "");
}

/* Effort tags. Stored on the set as a 0-3 index; 0 means untagged. */
const RPE_TAGS = [
  { k:0, label:"·", name:"No tag", cls:"" },
  { k:1, label:"E", name:"Easy",   cls:"easy" },
  { k:2, label:"S", name:"Solid",  cls:"solid" },
  { k:3, label:"H", name:"Hard",   cls:"hard" },
];

/* An exercise is stalled when its best e1RM hasn't improved across the last
   N sessions — a cue to deload or change something. */
function plateauFor(name, sessions){
  const hist = exerciseHistory(name).filter(h=>h.best);
  const n = sessions || 3;
  if (hist.length < n) return null;
  const recent = hist.slice(0, n);                     // newest first
  const best = Math.max(...recent.map(h=>h.best.v));
  const older = hist.slice(n);
  const priorBest = older.length ? Math.max(...older.map(h=>h.best.v)) : null;
  if (priorBest!=null && best > priorBest + 0.01) return null;   // still climbing
  const allSame = recent.every(h=> Math.abs(h.best.v - recent[0].best.v) < 0.01);
  if (!allSame && priorBest==null) return null;
  return { sessions:n, kg: recent[0].best.kg, reps: recent[0].best.reps };
}
function plateauedExercises(){
  if (_memoStall) return _memoStall;
  const names = new Set();
  Object.values(history).forEach(w=> w.exercises.forEach(e=>{ if(!e.plyo) names.add(e.name); }));
  const out = [];
  names.forEach(n=>{ const p = plateauFor(n); if (p) out.push({ name:n, ...p }); });
  _memoStall = out;
  return out;
}

/* Did this set just beat the best estimated 1RM this movement has ever seen?
   Compared against *other* sessions only — today's own earlier sets shouldn't
   make every subsequent set a fresh record. Nothing to celebrate on a first
   ever attempt, so an empty history returns null. */
function prBeatenBy(ex, set, w){
  if (!set || !set.done || ex.plyo) return null;
  if (set.kind !== "working" || set.weightKg == null || !set.reps) return null;
  const est = e1rm(set.weightKg, set.reps);
  if (est == null) return null;
  let prev = 0;
  exerciseHistory(ex.name).forEach(h=>{ if (h.date !== w.date && h.best && h.best.v > prev) prev = h.best.v; });
  if (!prev || est <= prev + 0.01) return null;
  return { est, prev, gain: est - prev };
}

/* Volume per week for the last n weeks, oldest first — the week-vs-week card
   can't show whether you're trending up over a training block. */
function weeklyVolumes(n){
  const out = [];
  for (let i = n-1; i >= 0; i--){
    const s = weekStats(i);
    out.push({ volume: s.volume, workouts: s.workouts, start: s.start });
  }
  return out;
}

/* Days since each muscle group was last actually worked. */
function groupRecovery(){
  const last = {};
  Object.values(history).forEach(w=>{
    w.exercises.forEach(e=>{
      if (!e.sets.some(s=> s.done)) return;
      if (!last[e.group] || w.date > last[e.group]) last[e.group] = w.date;
    });
  });
  const today = dateOf(todayISO()).getTime();
  return Object.keys(last).map(g=>({
    group: g, date: last[g],
    days: Math.max(0, Math.round((today - dateOf(last[g]).getTime()) / 86400000)),
  })).sort((a,b)=> b.days - a.days);
}

/* Every note ever written against a movement — per-set and session-level —
   newest first. They were previously write-only. */
function exerciseNotes(name){
  const out = [];
  exerciseHistory(name).forEach(h=>{
    (h.ex.sets||[]).forEach(s=>{ if (s.note) out.push({ date:h.date, text:s.note, kind:"set" }); });
    const w = history[h.date];
    if (w && w.note) out.push({ date:h.date, text:w.note, kind:"session" });
  });
  return out;
}

/* Bodyweight log: { "YYYY-MM-DD": kg } */
function logBodyweight(kg, dateISO){
  if (kg==null || !isFinite(kg)) return;
  bodylog[dateISO || todayISO()] = +kg;
  settings.bodyKg = +kg;                                // keep the calorie basis current
  saveBodylog(); saveSettings();
}
function bodyweightSeries(){
  return Object.keys(bodylog).sort().map(d=>({ date:d, kg:bodylog[d] }));
}

// Returns the value *with* its unit — callers must not append one.
function fmtVolume(kg){
  const u = settings.units==="kg" ? "kg" : "lb";
  const v = settings.units==="kg" ? kg : kg/KG_PER_LB;
  if (v >= 10000) return `${Math.round(v/1000)}k ${u}`;
  if (v >= 1000)  return `${(v/1000).toFixed(1)}k ${u}`;
  return `${Math.round(v)} ${u}`;
}
function workoutCalories(w){
  const dur = ((w.endedAt||Date.now()) - (w.startedAt||w.endedAt||Date.now()))/1000;
  const minutes = Math.max(dur/60, totals(w).done*0.9); // floor so a quick session still counts
  const kcal = 5.0 * 3.5 * (settings.bodyKg||70) / 200 * minutes;
  return Math.max(0, Math.round(kcal));
}

/* ============================================================
   TODAY VIEW
   ============================================================ */
/* The scheduled split for today, unless an override has been chosen (missed
   Monday and doing Push on Tuesday, or training on a rest day). */
function activeType(){
  const tISO = todayISO();
  if (current && current.date===tISO) return current.type;
  if (history[tISO]) return history[tISO].type;
  return todayType();
}
function ensureToday(type){
  const t = type || activeType();
  if (t === "Rest") return null;
  const tISO = todayISO();
  if (current && current.date===tISO && current.type===t) return current;
  if (history[tISO] && history[tISO].type===t){ current = history[tISO]; saveCurrent(); return current; }
  current = buildWorkout(t, tISO);
  saveCurrent();
  return current;
}
// Switch today's workout to another split.
function chooseWorkout(){
  const scheduled = todayType();
  const cur = activeType();
  openSheet(`
    <h3 class="sh-title">Train something else</h3>
    <p class="sh-sub">Today is scheduled as <b>${scheduled}</b>. Pick any session — useful if you missed a day.</p>
    ${["Push","Pull","Legs"].map(t=>`<button class="btn${t===cur?" primary":""}" data-t="${t}" style="margin-bottom:10px">${t} Day</button>`).join("")}
    ${cur!=="Rest" ? `<button class="btn" id="mkRest" style="margin-bottom:10px">Make it a rest day</button>` : ""}
    <button class="btn ghost" id="pickClose">Cancel</button>`);
  $("#sheet").querySelectorAll("button[data-t]").forEach(b=> b.onclick = ()=>{
    const t = b.dataset.t;
    const tISO = todayISO();
    if (activeType() !== t){
      const existing = history[tISO];
      if (existing && totals(existing).done > 0 && existing.type !== t){
        // Don't silently bin a logged session.
        toast("Finish or clear today's log first");
        return;
      }
      current = buildWorkout(t, tISO);
      saveCurrent();
    }
    closeSheet(); renderToday();
  });
  const mk = $("#mkRest");
  if (mk) mk.onclick = ()=>{
    const tISO = todayISO();
    if (history[tISO] && totals(history[tISO]).done>0){ toast("Today already has logged sets"); return; }
    current = null; saveCurrent(); delete history[tISO]; saveHistory();
    closeSheet(); renderToday();
  };
  $("#pickClose").onclick = closeSheet;
}

function renderToday(){
  const view = $("#view-today");
  const type = activeType();
  const dayName = DAYS[new Date().getDay()];

  if (type === "Rest"){
    view.innerHTML = `
      <div class="today-hero">
        <div class="k">${dayName}</div>
        <div class="v">Rest Day</div>
      </div>
      <div class="rest-card">
        <div class="em">💪</div>
        <h2>Rest Day</h2>
        <p>Recovery is part of progress.</p>
      </div>
      <div class="finish-wrap"><button class="btn ghost" id="pickBtn">Train anyway →</button></div>`;
    $("#pickBtn").onclick = chooseWorkout;
    return;
  }

  const w = ensureToday(type);
  const t = totals(w);
  const finished = !!w.endedAt;

  view.innerHTML = `
    <div class="today-hero">
      <div class="k">${dayName}${finished ? " · Completed" : ""}${type!==todayType() ? " · swapped" : ""}</div>
      <div class="v">Today's <span class="type">${type}</span>
        <button class="swap-btn" id="pickBtn" aria-label="Change workout">⇄</button>
      </div>
    </div>
    ${finished ? `<div class="done-note">
      <span class="txt">✓ Workout logged — edit any set below, or pick up where you left off.</span>
      <button class="done-resume" id="resumeBtn">Resume</button>
    </div>` : ""}
    <button class="wnote-btn${w.note?" has":""}" id="wNoteBtn">${w.note ? `📝 ${esc(w.note)}` : "📝 Add a note for this session"}</button>
    <div class="progress-wrap">
      <div class="progress-head">
        <span class="t">Workout Progress</span>
        <span class="p" id="progPct">${t.pct}%</span>
      </div>
      <div class="bar"><span id="progBar" style="width:${t.pct}%"></span></div>
    </div>
    <div id="exList"></div>
    <div class="finish-wrap">
      <button class="btn primary ${t.done===t.total && t.total>0 ? "ready":""}" id="finishBtn">
        ${finished ? "View Summary" : "Finish Workout"}
      </button>
    </div>`;

  renderExercises($("#exList"), w, true);
  $("#finishBtn").onclick = ()=> finishWorkout(w);
  $("#pickBtn").onclick = chooseWorkout;
  $("#wNoteBtn").onclick = ()=> editWorkoutNote(w);
  const res = $("#resumeBtn");
  if (res) res.onclick = ()=> resumeWorkout(w);
  startSessionClock(w);
}

/* Finish is a big button and easy to hit by accident — and a session isn't
   necessarily over just because it's been logged. Resuming clears the end
   stamp so the clock, the Finish button and the rest timer all come back.
   The log entry stays where it is; only the "completed" stamp lifts. */
function resumeWorkout(w){
  if (!w || !w.endedAt) return;
  const ended = w.endedAt;
  w.endedAt = null;
  // Finishing again must not count the same session twice toward the nudge.
  settings.workoutsSinceBackup = Math.max(0, (settings.workoutsSinceBackup||0) - 1);
  saveSettings();
  saveCurrentOrHistory(w);
  closeSheet();
  renderToday();
  toast("Workout resumed", ()=>{
    w.endedAt = ended;
    settings.workoutsSinceBackup = (settings.workoutsSinceBackup||0) + 1;
    saveSettings(); saveCurrentOrHistory(w); renderToday();
  });
}

/* Session-level note — "slept badly", "gym packed", etc. */
function editWorkoutNote(w){
  openSheet(`
    <h3 class="sh-title">Session note</h3>
    <p class="sh-sub">${w.type} · ${dateOf(w.date).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})}</p>
    <input class="sheet-input" id="wNoteIn" placeholder="How did it go?" value="${esc(w.note||"")}">
    <button class="btn primary" id="wNoteSave" style="margin:14px 0 10px">Save</button>
    <button class="btn ghost" id="wNoteCancel">Cancel</button>`);
  const inp = $("#wNoteIn");
  setTimeout(()=>inp.focus(), 120);
  $("#wNoteSave").onclick = ()=>{
    w.note = inp.value.trim();
    saveCurrentOrHistory(w); closeSheet(); renderToday();
  };
  $("#wNoteCancel").onclick = closeSheet;
}

/* A running clock in the header once the first set is ticked. */
let clockIv = null;
function startSessionClock(w){
  clearInterval(clockIv); clockIv = null;
  const el = $("#topDate");
  const paint = ()=>{
    if (!w.startedAt || w.endedAt){ renderHeader(); return; }
    const s = Math.max(0, Math.round((Date.now()-w.startedAt)/1000));
    el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} elapsed`;
  };
  if (w.startedAt && !w.endedAt){ paint(); clockIv = setInterval(paint, 1000); }
  else renderHeader();
}

/* Renders exercise cards into `host`. `editable` allows checking/typing.
   Structural edits (add/remove set, skip) re-run this to redraw in place. */
function renderExercises(host, w, editable){
  host.innerHTML = "";
  const redraw = ()=>{ renderExercises(host, w, editable); updateProgress(w); };
  let lastGroup = null;
  w.exercises.forEach(ex => {
    if (ex.group !== lastGroup){
      const gl = document.createElement("div");
      gl.className = "group-label";
      gl.textContent = ex.group;
      host.appendChild(gl);
      lastGroup = ex.group;
    }
    host.appendChild(exerciseCard(ex, w, editable, redraw));
  });
}

function exerciseCard(ex, w, editable, redraw){
  const card = document.createElement("div");
  card.className = "ex-card" + (ex.skipped ? " skipped" : "");
  const working = ex.sets.filter(s=>s.kind==="working").length;
  const scheme = `${working} × ${repsLabel(ex)}${ex.plyo?"  ·  plyometric":""}`;
  const allDone = !ex.skipped && ex.sets.every(s=>s.done);
  if (allDone) card.classList.add("complete");
  const last = lastSessionFor(ex.name, w.date);

  card.innerHTML = `
    <div class="ex-head">
      <button class="ex-title" aria-label="${esc(ex.name)} history">
        <h3 class="ex-name">${esc(ex.name)}</h3>
        <div class="ex-scheme">${scheme}${last ? ` · last ${fmtWeightKg(last.topKg)}` : ""}</div>
      </button>
      <span class="ex-tag">${esc(ex.group)}</span>
      <span class="ex-done-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Done
      </span>
      <button class="ex-menu" aria-label="Exercise options"${editable?"":" disabled"}>⋯</button>
    </div>`;

  card.querySelector(".ex-title").onclick = ()=> openExerciseDetail(ex.name);
  if (editable) card.querySelector(".ex-menu").onclick = ()=> openExerciseMenu(ex, w, redraw);

  // Time to add weight? Offer it as a one-tap chip.
  const prog = editable && !ex.skipped ? progressionSuggestion(ex, w) : null;
  if (prog){
    const chip = document.createElement("button");
    chip.className = "prog-chip";
    chip.innerHTML = `<span class="up">▲</span> Hit ${prog.target} at ${fmtWeightKg(prog.from)} — try <b>${fmtWeightKg(prog.to)}</b>${
      prog.resetTo ? ` × ${prog.resetTo}` : ""}`;
    chip.onclick = ()=>{
      ex.sets.forEach(s=>{
        if (s.kind!=="working") return;
        s.weightKg = prog.to;
        if (prog.resetTo) s.reps = prog.resetTo;   // new weight, bottom of the range
      });
      const wu = suggestedWarmupKg(ex);
      ex.sets.forEach(s=>{ if (s.kind==="warmup" && s.weightKg==null && wu) s.weightKg = wu; });
      saveCurrentOrHistory(w); toast(`Set to ${fmtWeightKg(prog.to)}`); redraw();
    };
    card.appendChild(chip);
  }

  if (ex.skipped){
    const note = document.createElement("div");
    note.className = "skip-note";
    note.textContent = "Skipped — machine busy or swapped out.";
    card.appendChild(note);
    return card;
  }

  ex.sets.forEach((set, si) => {
    const setEl = document.createElement("div");
    setEl.className = "set" + (set.done ? " done" : "") + (set.pr ? " pr" : "");
    const isWarm = set.kind==="warmup";
    // compute working set number
    let wn = 0;
    for (let k=0;k<=si;k++){ if(ex.sets[k].kind==="working") wn++; }
    const label = isWarm ? "Warm-up" : `Set ${wn}`;
    const shortLabel = isWarm ? "Warm" : `Set ${wn}`;

    setEl.innerHTML = `
      <button class="check" aria-label="Complete ${label}"${editable?"":" disabled"}>
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="set-main">
        <div class="set-top">
          <span class="set-label${isWarm?" warm":""}">${shortLabel}</span>
          <span class="pr-badge" aria-label="Personal record">PR</span>
          <div class="set-inputs">
            <button class="field wbtn"${editable?"":" disabled"} aria-label="Weight">
              <span class="val${set.weightKg==null?" empty":""}">${set.weightKg!=null?toDisplay(set.weightKg):"0"}</span>
              <span class="u">${unitLabel()}</span>
            </button>
            <button class="field reps rbtn"${editable?"":" disabled"} aria-label="Reps">
              <span class="val${set.reps==null?" empty":""}">${set.reps!=null?set.reps:ex.reps}</span>
              <span class="u">rp</span>
            </button>
            <button class="set-more${set.note||set.rpe?" has":""}"${editable?"":" disabled"} aria-label="Effort and note">
              <span class="dot ${RPE_TAGS[set.rpe||0].cls}"></span>${set.note?"<span class='nd'>📝</span>":""}
            </button>
          </div>
        </div>
      </div>`;
    // Note text is shown under the row when present; editing happens in the sheet.
    const noteRow = document.createElement("div");
    noteRow.className = "note-row";
    noteRow.hidden = !set.note;
    noteRow.innerHTML = `<span class="note-text">${esc(set.note||"")}</span>`;

    // --- events ---
    const check = setEl.querySelector(".check");
    check.addEventListener("click", ()=>{
      if(!editable) return;
      set.done = !set.done;
      setEl.classList.toggle("done", set.done);
      check.classList.remove("pop"); void check.offsetWidth; check.classList.add("pop");
      if (set.done && !w.startedAt){ w.startedAt = Date.now(); if (activeTab==="today") startSessionClock(w); }
      card.classList.toggle("complete", ex.sets.every(s=>s.done));
      updateProgress(w);
      saveCurrentOrHistory(w);
      // A record is worth knowing about while you're still on the bench, not
      // three taps deep in Stats a week later.
      if (!set.done) delete set.pr;
      else {
        const pr = prBeatenBy(ex, set, w);
        if (pr){
          set.pr = true;
          saveCurrentOrHistory(w);
          toast(`🏆 PR — ${ex.name} ${fmtWeightKg(set.weightKg)} × ${set.reps}`);
          if (settings.vibrate && navigator.vibrate) navigator.vibrate([30,50,30,50,90]);
        }
      }
      setEl.classList.toggle("pr", !!set.pr);
      if (set.done && shouldRest(ex, set)) startRest(ex.name);
    });
    const wBtn = setEl.querySelector(".wbtn"), wVal = wBtn.querySelector(".val");
    wBtn.addEventListener("click", ()=>{
      if(!editable) return;
      openKeypad({
        title: `${ex.name} · ${label}`,
        unit: unitLabel(),
        decimals: true,
        plates: !!ex.bar,
        value: set.weightKg!=null ? toDisplay(set.weightKg) : "",
        onCommit(v){
          set.weightKg = v==="" ? null : fromDisplay(v);
          wVal.textContent = set.weightKg!=null ? toDisplay(set.weightKg) : "0";
          wVal.classList.toggle("empty", set.weightKg==null);
          saveCurrentOrHistory(w);
        }
      });
    });
    const rBtn = setEl.querySelector(".rbtn"), rVal = rBtn.querySelector(".val");
    rBtn.addEventListener("click", ()=>{
      if(!editable) return;
      openKeypad({
        title: `${ex.name} · ${label}`,
        unit: "reps",
        decimals: false,
        value: set.reps!=null ? set.reps : "",
        onCommit(v){
          const n = parseInt(v,10);
          set.reps = isNaN(n) ? null : n;
          rVal.textContent = set.reps!=null ? set.reps : ex.reps;
          rVal.classList.toggle("empty", set.reps==null);
          saveCurrentOrHistory(w);
        }
      });
    });
    // Effort + note share one compact control; the row has no space for two.
    const moreBtn = setEl.querySelector(".set-more");
    moreBtn.addEventListener("click", ()=>{
      if(!editable) return;
      openSetSheet(set, `${ex.name} · ${label}`, (changedInputs)=>{
        moreBtn.className = "set-more" + (set.note||set.rpe ? " has" : "");
        moreBtn.innerHTML = `<span class="dot ${RPE_TAGS[set.rpe||0].cls}"></span>` +
                            (set.note ? "<span class='nd'>📝</span>" : "");
        noteRow.hidden = !set.note;
        noteRow.querySelector(".note-text").textContent = set.note || "";
        saveCurrentOrHistory(w);
        if (changedInputs) redraw();          // weight/reps copied in — repaint
      }, ex.sets[si-1]);
    });

    card.appendChild(setEl);
    card.appendChild(noteRow);
  });

  if (editable){
    const foot = document.createElement("div");
    foot.className = "ex-foot";
    const canWarm = !ex.sets.some(s=>s.kind==="warmup") && !ex.plyo;
    foot.innerHTML = `
      <button class="foot-btn add">＋ Add set</button>
      ${canWarm ? `<button class="foot-btn warm">＋ Warm-up</button>` : ""}
      ${last ? `<button class="foot-btn repeat">↻ Repeat last</button>` : ""}
      ${ex.sets.length > 1 ? `<button class="foot-btn del" aria-label="Remove the last set">− Remove set</button>` : ""}`;

    foot.querySelector(".add").onclick = ()=>{
      const lastWorking = [...ex.sets].reverse().find(s=>s.kind==="working");
      ex.sets.push({ kind:"working", done:false,
                     weightKg: lastWorking ? lastWorking.weightKg : null,
                     reps: ex.reps, note:"" });
      saveCurrentOrHistory(w); redraw();
    };
    const warmBtn = foot.querySelector(".warm");
    if (warmBtn) warmBtn.onclick = ()=>{
      ex.sets.unshift({ kind:"warmup", done:false, weightKg:suggestedWarmupKg(ex), reps:ex.reps, note:"" });
      saveCurrentOrHistory(w); redraw();
    };
    const repBtn = foot.querySelector(".repeat");
    if (repBtn) repBtn.onclick = ()=>{
      // Copy last session's working weights/reps onto this session's working sets.
      const src = last.ex.sets.filter(s=>s.kind==="working");
      let i = 0;
      ex.sets.forEach(s=>{
        if (s.kind!=="working") return;
        const from = src[Math.min(i, src.length-1)];
        if (from){ s.weightKg = from.weightKg; if (from.reps) s.reps = from.reps; }
        i++;
      });
      saveCurrentOrHistory(w); toast("Filled from last session"); redraw();
    };
    const delBtn = foot.querySelector(".del");
    if (delBtn) delBtn.onclick = ()=>{
      for (let i=ex.sets.length-1; i>=0; i--){
        if (ex.sets[i].kind==="working"){ ex.sets.splice(i,1); break; }
      }
      saveCurrentOrHistory(w); redraw();
    };
    card.appendChild(foot);
  }

  return card;
}

/* Effort tag + note for a single set. */
function openSetSheet(set, title, onDone, prevSet){
  // Most sets repeat the one above them; typing both numbers again is busywork.
  const canCopy = prevSet && (prevSet.weightKg != null || prevSet.reps != null);
  openSheet(`
    <h3 class="sh-title">Set details</h3>
    <p class="sh-sub">${esc(title)}</p>
    ${canCopy ? `<button class="btn" id="setCopy" style="margin-bottom:16px">↑ Same as previous set${
      prevSet.weightKg!=null ? ` · ${fmtWeightKg(prevSet.weightKg)}${prevSet.reps?` × ${prevSet.reps}`:""}` : ""}</button>` : ""}
    <div class="eff-label">How did it feel?</div>
    <div class="eff-row" id="effRow">
      ${RPE_TAGS.map(t=>`<button class="eff ${t.cls}${(set.rpe||0)===t.k?" on":""}" data-k="${t.k}">${t.name==="No tag"?"—":t.name}</button>`).join("")}
    </div>
    <div class="eff-label" style="margin-top:16px">Note</div>
    <input class="sheet-input" id="setNoteIn" placeholder="Anything worth remembering?" value="${esc(set.note||"")}">
    <button class="btn primary" id="setSave" style="margin:16px 0 10px">Save</button>
    <button class="btn ghost" id="setCancel">Cancel</button>`);
  let pick = set.rpe||0;
  $("#effRow").querySelectorAll(".eff").forEach(b=> b.onclick = ()=>{
    pick = +b.dataset.k;
    $("#effRow").querySelectorAll(".eff").forEach(x=> x.classList.toggle("on", +x.dataset.k===pick));
  });
  const copy = $("#setCopy");
  if (copy) copy.onclick = ()=>{
    set.rpe = pick || 0;
    set.note = $("#setNoteIn").value.trim();
    if (prevSet.weightKg != null) set.weightKg = prevSet.weightKg;
    if (prevSet.reps != null) set.reps = prevSet.reps;
    closeSheet(); onDone(true);
    toast("Copied from the set above");
  };
  $("#setSave").onclick = ()=>{
    set.rpe = pick || 0;
    set.note = $("#setNoteIn").value.trim();
    closeSheet(); onDone(false);
  };
  $("#setCancel").onclick = closeSheet;
}

/* Per-exercise options: history, rest override, skip, reset. */
function openExerciseMenu(ex, w, redraw){
  const rest = restSecFor(ex);
  const m = Math.floor(rest/60), sec = rest%60;
  openSheet(`
    <h3 class="sh-title">${esc(ex.name)}</h3>
    <p class="sh-sub">${esc(ex.group)} · ${ex.sets.filter(s=>s.kind==="working").length} × ${ex.reps}</p>

    <div class="set-group" style="margin:0 0 14px">
      <div class="set-row">
        <div><div class="lab">Rest for this exercise</div>
             <div class="desc">${settings.exRest[ex.name]!=null ? "Custom" : "Using the default"}</div></div>
        <div class="ctl stepper">
          <button id="exRestDown" aria-label="Shorter rest for this exercise">−</button>
          <span class="v" id="exRestVal">${m}:${String(sec).padStart(2,"0")}</span>
          <button id="exRestUp" aria-label="Longer rest for this exercise">+</button>
        </div>
      </div>
      ${settings.exRest[ex.name]!=null ? `<div class="set-row" id="exRestClear"><div><div class="lab">Reset to default</div><div class="desc">${Math.floor(settings.restSec/60)}:${String(settings.restSec%60).padStart(2,"0")}</div></div><div class="ctl"><span class="link">Reset</span></div></div>` : ""}
    </div>

    <button class="btn" id="exHist" style="margin-bottom:10px">View history &amp; trend</button>
    <button class="btn" id="exSkip" style="margin-bottom:10px">${ex.skipped?"Un-skip exercise":"Skip this exercise"}</button>
    <button class="btn" id="exReset" style="margin-bottom:10px">Clear this exercise's sets</button>
    <button class="btn ghost" id="exClose">Close</button>`);

  const bump = d => {
    const next = Math.max(15, Math.min(600, restSecFor(ex) + d));
    settings.exRest[ex.name] = next; saveSettings();
    closeSheet(); setTimeout(()=>openExerciseMenu(ex, w, redraw), 180);
  };
  $("#exRestDown").onclick = ()=> bump(-15);
  $("#exRestUp").onclick   = ()=> bump(15);
  const clr = $("#exRestClear");
  if (clr) clr.onclick = ()=>{
    delete settings.exRest[ex.name]; saveSettings();
    closeSheet(); setTimeout(()=>openExerciseMenu(ex, w, redraw), 180);
  };

  $("#exHist").onclick = ()=>{ closeSheet(); setTimeout(()=>openExerciseDetail(ex.name), 260); };
  $("#exSkip").onclick = ()=>{
    const before = snapshot(ex.sets), wasSkipped = !!ex.skipped;
    ex.skipped = !ex.skipped;
    if (ex.skipped) ex.sets.forEach(s=> s.done=false);
    saveCurrentOrHistory(w); closeSheet(); redraw();
    toast(ex.skipped ? "Exercise skipped" : "Exercise restored", ()=>{
      ex.skipped = wasSkipped; ex.sets = before;
      saveCurrentOrHistory(w); redraw();
    });
  };
  $("#exReset").onclick = ()=>{
    const before = snapshot(ex.sets);
    ex.sets.forEach(s=>{ s.done=false; s.note=""; delete s.rpe; });
    saveCurrentOrHistory(w); closeSheet(); redraw();
    toast("Cleared", ()=>{ ex.sets = before; saveCurrentOrHistory(w); redraw(); });
  };
  $("#exClose").onclick = closeSheet;
}

/* A session earns its place in the log the moment a set is ticked, not when
   "Finish" is tapped. The calendar, history list, stats and streak all read
   from `history`, so waiting for Finish meant a real session showed up
   nowhere — and boot drops a `current` from an earlier day, so an unfinished
   one was silently lost at midnight. */
function logIfWorked(w){
  if (totals(w).done > 0){ history[w.date] = w; saveHistory(); return; }
  if (history[w.date] === w){
    // Nothing completed — don't leave an empty day sitting in the log.
    if (!w.endedAt) delete history[w.date];
    saveHistory();
  }
}

// Persist to whichever store the workout belongs to.
function saveCurrentOrHistory(w){
  if (!w || !w.date) return;
  if (current === w) saveCurrent();
  if (current === w || history[w.date]) logIfWorked(w);
}

function updateProgress(w){
  const t = totals(w);
  const bar = $("#progBar"), pct = $("#progPct"), fin = $("#finishBtn");
  if (bar) bar.style.width = t.pct + "%";
  if (pct) pct.textContent = t.pct + "%";
  if (fin && !w.endedAt) fin.classList.toggle("ready", t.done===t.total && t.total>0);
}

/* ---------- Finish ---------- */
function finishWorkout(w){
  const t = totals(w);
  if (!w.endedAt){
    if (t.done === 0){ toast("Complete a set first"); return; }
    if (!w.startedAt) w.startedAt = Date.now();
    w.endedAt = Date.now();
    history[w.date] = w;
    saveHistory(); saveCurrent();
    if (settings.vibrate && navigator.vibrate) navigator.vibrate([40,60,40]);
    settings.workoutsSinceBackup = (settings.workoutsSinceBackup||0) + 1;
    saveSettings();
    clearInterval(clockIv); clockIv = null; renderHeader();
  }
  showSummary(w);
  renderToday();
}

function showSummary(w){
  const t = totals(w);
  const durSec = Math.max(0, Math.round(((w.endedAt||Date.now()) - (w.startedAt||w.endedAt||Date.now()))/1000));
  const mm = Math.floor(durSec/60), ss = durSec%60;
  const cal = workoutCalories(w);
  openSheet(`
    <div class="summary">
      <div class="celebrate">
        <div class="em">🎉</div>
        <h2>Workout Complete</h2>
        <p>${w.type} · ${dateOf(w.date).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</p>
      </div>
      <div class="sum-grid">
        <div class="sum-cell accent"><div class="n">${t.done}</div><div class="l">Sets Completed</div></div>
        <div class="sum-cell"><div class="n">${mm}<small style="font-size:15px">m</small> ${ss}<small style="font-size:15px">s</small></div><div class="l">Duration</div></div>
        <div class="sum-cell"><div class="n">${t.pct}%</div><div class="l">Completion</div></div>
        <div class="sum-cell"><div class="n">${cal}</div><div class="l">Calories (est.)</div></div>
      </div>
      <button class="btn primary" id="sumDone" style="margin-top:16px">Done</button>
      ${w.date===todayISO() ? `<button class="btn ghost" id="sumResume" style="margin-top:10px">↩ Not done yet — resume</button>` : ""}
    </div>`);
  $("#sumDone").onclick = ()=>{ closeSheet(); maybeRemindBackup(); };
  const sr = $("#sumResume");
  if (sr) sr.onclick = ()=> resumeWorkout(w);
}

/* localStorage can be evicted by the browser, and export is manual — so nudge
   for a backup every 10 finished workouts. */
function maybeRemindBackup(){
  if ((settings.workoutsSinceBackup||0) < 10) return;
  setTimeout(()=>{
    openSheet(`
      <h3 class="sh-title">Back up your log?</h3>
      <p class="sh-sub">${settings.workoutsSinceBackup} workouts since your last backup. Your data lives on this device only — browsers can clear it.</p>
      <button class="btn primary" id="buNow" style="margin-bottom:10px">Export backup</button>
      <button class="btn ghost" id="buLater">Later</button>`);
    $("#buNow").onclick = ()=>{ exportData(); closeSheet(); };
    $("#buLater").onclick = ()=>{ settings.workoutsSinceBackup = 0; saveSettings(); closeSheet(); };
  }, 500);
}

/* ============================================================
   NUMERIC KEYPAD
   Weight/reps entry never uses a real <input>, so iOS never opens its
   keyboard and never builds a typing-undo stack — which is what makes
   "Undo Typing" pop up when the phone is shaken mid-workout.
   ============================================================ */
let kp = null; // { buf, decimals, onCommit, fresh }

function openKeypad(opts){
  kp = { buf: String(opts.value==null?"":opts.value), decimals:!!opts.decimals,
         onCommit:opts.onCommit, fresh:true, plates:!!opts.plates };
  $("#kpLabel").textContent = opts.title || "";
  $("#kpUnit").textContent = opts.unit || "";
  const steps = opts.decimals ? [-5,-2.5,2.5,5] : [-2,-1,1,2];
  $("#kpQuick").innerHTML = steps.map(s=>`<button data-adj="${s}">${s>0?"+":"−"}${Math.abs(s)}</button>`).join("");
  const keys = ["1","2","3","4","5","6","7","8","9", opts.decimals?".":"C", "0", "⌫"];
  $("#kpGrid").innerHTML = keys.map(k=>`<button data-k="${k}">${k}</button>`).join("");
  $("#kpQuick").querySelectorAll("button").forEach(b=> b.onclick = ()=> kpAdjust(parseFloat(b.dataset.adj)));
  $("#kpGrid").querySelectorAll("button").forEach(b=> b.onclick = ()=> kpKey(b.dataset.k));
  kpRender();
  $("#kpOverlay").classList.add("show");
}
function kpRender(){
  const v = kp.buf === "" ? "0" : kp.buf;
  $("#kpValue").textContent = v;
  // Plate breakdown for bar-loaded lifts, in kg regardless of display unit.
  const el = $("#kpPlates");
  if (!el) return;
  if (kp.plates && settings.showPlates){
    const kg = fromDisplay(v);
    const txt = kg!=null ? platesText(kg) : "";
    el.textContent = txt;
    el.hidden = !txt;
  } else {
    el.hidden = true;
  }
}
function kpKey(k){
  if (!kp) return;
  if (k === "⌫"){ kp.buf = kp.buf.slice(0,-1); }
  else if (k === "C"){ kp.buf = ""; }
  else if (k === "."){
    if (kp.fresh){ kp.buf = "0"; kp.fresh = false; }
    if (!kp.buf.includes(".")) kp.buf = (kp.buf===""?"0":kp.buf) + ".";
  } else {
    // First digit replaces the pre-filled value rather than appending to it.
    if (kp.fresh){ kp.buf = ""; kp.fresh = false; }
    if (kp.buf.replace(".","").length < 6) kp.buf += k;
  }
  kp.fresh = false;
  kpRender();
}
function kpAdjust(delta){
  if (!kp) return;
  const cur = parseFloat(kp.buf || "0") || 0;
  let next = cur + delta;
  if (next < 0) next = 0;
  if (!kp.decimals) next = Math.round(next);
  kp.buf = String(+(Math.round(next*100)/100));
  kp.fresh = false;
  kpRender();
}
function closeKeypad(commit){
  if (kp && commit && kp.onCommit){
    const raw = kp.buf.replace(/\.$/,"");
    kp.onCommit(raw === "" ? "" : String(+raw));
  }
  kp = null;
  $("#kpOverlay").classList.remove("show");
}
$("#kpDone").onclick = ()=> closeKeypad(true);
$("#kpOverlay").addEventListener("click", e=>{ if (e.target.id === "kpOverlay") closeKeypad(true); });

/* ============================================================
   REST TIMER
   ============================================================ */
/* The countdown is driven off wall-clock time (endAt), not by counting
   interval ticks — mobile browsers throttle or freeze timers when the screen
   locks or the app is backgrounded, which would otherwise stall the count. */
const timer = { total:0, remaining:0, endAt:0, running:false, iv:null, to:null, exercise:"", finished:false };
const RT_CIRC = 2 * Math.PI * 34; // 213.6

// Working sets always rest; warm-ups and plyometrics follow their settings.
function shouldRest(ex, set){
  if (set.kind === "warmup") return !!settings.restAfterWarmup;
  if (ex.plyo) return !!settings.restAfterPlyo;
  return true;
}
// Per-exercise override, falling back to the global rest length.
function restSecFor(ex){
  const name = typeof ex === "string" ? ex : (ex && ex.name);
  const o = name && settings.exRest ? settings.exRest[name] : null;
  return (o!=null && isFinite(o)) ? o : settings.restSec;
}

function startRest(exerciseName){
  const secs = restSecFor(exerciseName);
  timer.total = secs;
  timer.remaining = secs;
  timer.endAt = Date.now() + timer.total*1000;
  timer.exercise = exerciseName || "";
  timer.running = true;
  timer.finished = false;
  $("#rtTitle").textContent = "Rest";
  $("#rtSub").textContent = exerciseName ? `After ${exerciseName}` : "Recovering…";
  $("#restTimer").classList.add("show");
  $("#rtPause").textContent = "Pause";
  tickRender();
  startLoop();
  persistTimer();
  acquireWake();
  ensureNotifyPermission();
}
function startLoop(){
  clearInterval(timer.iv);
  // 250ms so the display re-syncs quickly after the tab wakes back up.
  timer.iv = setInterval(tick, 250);
  // A timeout aimed at the exact finish moment, in case the interval is
  // throttled while the app sits in the background.
  clearTimeout(timer.to);
  if (timer.running) timer.to = setTimeout(tick, Math.max(0, timer.endAt - Date.now()) + 60);
}
function stopLoop(){ clearInterval(timer.iv); timer.iv = null; clearTimeout(timer.to); timer.to = null; }

/* The countdown is stored so that closing the app — or the OS discarding the
   page — doesn't lose it. On reopen we recompute from the saved end time. */
function persistTimer(){
  if (timer.running || (timer.remaining > 0 && !timer.finished)){
    LS.set(K_TIMER, { total:timer.total, endAt:timer.endAt, remaining:timer.remaining,
                      running:timer.running, exercise:timer.exercise });
  } else {
    try{ localStorage.removeItem(K_TIMER); }catch(e){}
  }
  // Every timer state change routes through here, so both background alarms
  // stay in step with start / pause / adjust / restart / skip.
  if (timer.running){
    scheduleRestAlarm();
    scheduleAlarm((timer.endAt - Date.now())/1000);
  } else {
    cancelRestAlarm();
    cancelAlarm();
    stopKeepAlive();
  }
}

/* Our own setInterval/setTimeout get throttled — and on a locked phone frozen
   outright — once the app isn't in front, so the finish moment can pass with
   nothing firing. Hand the deadline to the service worker as well: it lives
   outside the page and can raise the notification on its own. The OS can still
   kill the worker (iOS reliably does), so this is a safety net, not a promise. */
function restBody(){
  return timer.exercise ? `Rest done after ${timer.exercise} — next set 💥` : "Rest complete — next set 💥";
}
function swPost(msg){
  try{
    const c = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (c) c.postMessage(msg);
  }catch(e){}
}
function scheduleRestAlarm(){ swPost({ type:"schedule-rest", at: timer.endAt, body: restBody() }); }
function cancelRestAlarm(){ swPost({ type:"cancel-rest" }); }

/* Nothing can notify without permission, and the app only ever asked inside
   the daily-reminder toggle — so for anyone who never turned reminders on,
   the rest timer was silently unable to notify at all. Ask the first time a
   rest actually runs; startRest is always reached from a tap, which is what
   iOS requires. */
function ensureNotifyPermission(){
  if (!("Notification" in window)) return;
  if (Notification.permission !== "default" || settings.askedNotify) return;
  settings.askedNotify = true; saveSettings();
  try{ const r = Notification.requestPermission(); if (r && r.catch) r.catch(()=>{}); }catch(e){}
}
function restoreTimer(){
  const s = LS.get(K_TIMER, null);
  if (!s) return;
  timer.total = s.total || settings.restSec;
  timer.exercise = s.exercise || "";
  timer.finished = false;
  $("#rtTitle").textContent = "Rest";
  $("#rtSub").textContent = timer.exercise ? `After ${timer.exercise}` : "Recovering…";
  if (s.running){
    const rem = Math.round((s.endAt - Date.now())/1000);
    if (rem <= 0){ try{ localStorage.removeItem(K_TIMER); }catch(e){} missedRest(s.endAt); return; }
    timer.endAt = s.endAt; timer.remaining = rem; timer.running = true;
    $("#rtPause").textContent = "Pause";
    $("#restTimer").classList.add("show");
    tickRender(); startLoop(); acquireWake();
    persistTimer();                     // re-arms the background alarm too
  } else {
    timer.remaining = s.remaining || 0;
    if (timer.remaining <= 0) return;
    timer.running = false;
    $("#rtPause").textContent = "Resume";
    $("#restTimer").classList.add("show");
    tickRender();
  }
}

/* The rest ran out while the app was closed, so none of our timers fired and
   there was no beep. It used to just delete the saved countdown and show
   nothing at all — say so on the way back in instead. */
function missedRest(endAt){
  const ago = Math.max(0, Math.round((Date.now()-endAt)/1000));
  timer.total = timer.total || settings.restSec;
  timer.remaining = 0; timer.running = false; timer.finished = true;
  $("#rtSub").textContent = ago < 90
    ? "Rest finished while you were away"
    : `Rest finished ${Math.round(ago/60)} min ago`;
  $("#rtTitle").textContent = "Rest done";
  $("#restTimer").classList.add("show");
  tickRender();
  cancelRestAlarm();
  setTimeout(()=>{ if (timer.finished) hideRest(); }, 4000);
}

/* Keep the screen on while resting so the phone doesn't sleep mid-countdown. */
let wakeLock = null;
async function acquireWake(){
  try{
    if ("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if (wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }

function notifyRestDone(){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const body = timer.exercise ? `Rest done after ${timer.exercise} — next set 💥` : "Rest complete — next set 💥";
  try{
    if (navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification("IronLog", { body, icon:"icon-192.png", badge:"icon-192.png", tag:"ironlog-rest", renotify:true, vibrate:[120,80,120] }))
        .catch(()=>{ try{ new Notification("IronLog", { body, icon:"icon-192.png" }); }catch(e){} });
    } else {
      new Notification("IronLog", { body, icon:"icon-192.png" });
    }
  }catch(e){}
}
function clearRestNotification(){
  try{
    if (!navigator.serviceWorker || !navigator.serviceWorker.ready) return;
    const close = ()=> navigator.serviceWorker.ready.then(reg=>{
      if (reg.getNotifications) reg.getNotifications({ tag:"ironlog-rest" })
        .then(ns=> ns.forEach(n=> n.close())).catch(()=>{});
    }).catch(()=>{});
    close();
    setTimeout(close, 500);             // in case the alarm just pipped us
  }catch(e){}
}
function tick(){
  if (!timer.running) return;
  const rem = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
  if (rem === timer.remaining) return;
  timer.remaining = rem;
  tickRender();
  // Short cue on the last three seconds so you can be set before it ends.
  if (rem > 0 && rem <= 3){
    cue();
    if (settings.vibrate && navigator.vibrate) navigator.vibrate(35);
  }
  if (rem <= 0) finishRest();
}
function tickRender(){
  const m = Math.floor(timer.remaining/60), s = timer.remaining%60;
  $("#rtTime").textContent = `${m}:${String(s).padStart(2,"0")}`;
  const frac = timer.total ? timer.remaining/timer.total : 0;
  $("#rtArc").style.strokeDashoffset = (RT_CIRC * (1 - frac)).toFixed(1);
}
function finishRest(){
  stopLoop();
  timer.running = false;
  timer.finished = true;
  timer.remaining = 0;
  // If the alarm was armed, its tones have already sounded off the audio clock
  // — this handler is just catching up. Beeping again would double it.
  const alarmSounded = alarmArmed;
  tickRender();
  persistTimer();
  if (!alarmSounded) beep();
  if (settings.vibrate && navigator.vibrate) navigator.vibrate([120,80,120,80,200]);
  // If you're looking at the app you've already had the beep — make sure the
  // background alarm doesn't leave a banner behind for a rest you watched end.
  if (document.hidden) notifyRestDone(); else clearRestNotification();
  releaseWake();
  $("#rtSub").textContent = "Rest complete 💥";
  setTimeout(()=>{ if (timer.finished) hideRest(); }, 1500);
}
function hideRest(){
  $("#restTimer").classList.remove("show");
  stopLoop();
  timer.running = false;
  timer.remaining = 0;
  persistTimer();
  releaseWake();
}
function pauseRest(){
  if (timer.remaining<=0) return;
  if (timer.running){
    timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
    timer.running = false;
    stopLoop();
  } else {
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    startLoop();
  }
  $("#rtPause").textContent = timer.running ? "Pause" : "Resume";
  tickRender();
  persistTimer();
  if (timer.running) acquireWake(); else releaseWake();
}
function restartRest(){
  timer.remaining = timer.total;
  timer.endAt = Date.now() + timer.total*1000;
  timer.running = true;
  timer.finished = false;
  $("#rtPause").textContent = "Pause";
  $("#rtTitle").textContent = "Rest";
  $("#rtSub").textContent = timer.exercise ? `After ${timer.exercise}` : "Recovering…";
  tickRender();
  startLoop();
  persistTimer();
  acquireWake();
}
function adjustRest(delta){
  timer.remaining = Math.max(5, timer.remaining + delta);
  timer.total = Math.max(timer.total, timer.remaining);
  timer.finished = false;
  if (timer.running){ timer.endAt = Date.now() + timer.remaining*1000; startLoop(); }
  else $("#rtPause").textContent = "Resume";
  tickRender();
  persistTimer();
}
// Re-sync the moment the app comes back to the foreground.
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){ persistTimer(); return; }
  if (timer.running){ tick(); startLoop(); acquireWake(); }
});
window.addEventListener("pagehide", persistTimer);
$("#rtPause").onclick = pauseRest;
$("#rtSkip").onclick = hideRest;
$("#rtRestart").onclick = restartRest;
$("#rtPlus").onclick = ()=>adjustRest(15);
$("#rtMinus").onclick = ()=>adjustRest(-15);
// Start a rest any time, regardless of which set you just finished.
$("#manualTimer").onclick = ()=> startRest("");

/* Beep via WebAudio (no asset needed). */
let audioCtx = null;
function ensureCtx(){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

/* ---------- Background alarm ----------
   The finish sound used to be played when JS noticed the countdown had hit
   zero — which is precisely what stops happening once the app isn't in front.
   Instead the whole alarm is scheduled on the audio clock the moment the rest
   starts. Web Audio renders on its own thread and keeps that schedule while
   the page is throttled or frozen, so the beep lands on time with the phone
   locked or another app open.

   Two things make that hold on iOS: the context has to be created from a tap
   (startRest always is), and something has to be audibly playing or iOS
   suspends the context and the schedule with it — hence the near-silent
   keep-alive loop below. */
let alarmNodes = [];
let keepAlive = null;
let alarmArmed = false;

function startKeepAlive(){
  if (keepAlive) return;
  const ctx = ensureCtx();
  // A digitally-silent buffer reads as "nothing playing" and gets suspended,
  // so this is inaudible rather than silent.
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i=0; i<ch.length; i++) ch[i] = (i & 1 ? 1 : -1) * 1e-4;
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buf; src.loop = true;
  g.gain.value = 0.0015;
  src.connect(g); g.connect(ctx.destination);
  try{ src.start(); }catch(e){}
  keepAlive = { src, g };
}
function stopKeepAlive(){
  if (!keepAlive) return;
  try{ keepAlive.src.stop(); }catch(e){}
  try{ keepAlive.src.disconnect(); keepAlive.g.disconnect(); }catch(e){}
  keepAlive = null;
}
function cancelAlarm(){
  const now = audioCtx ? audioCtx.currentTime : Infinity;
  alarmNodes.forEach(n=>{
    // Never cut off a tone that's already sounding — only unschedule future ones.
    if (n._at > now){ try{ n.stop(); n.disconnect(); }catch(e){} }
  });
  alarmNodes = [];
  alarmArmed = false;
}
/* Schedule the finish tones `secs` from now, on the audio clock. */
function scheduleAlarm(secs){
  cancelAlarm();
  if (!settings.sound || !settings.bgAlarm || !(secs > 0)) return;
  try{
    const ctx = ensureCtx();
    startKeepAlive();
    const at = ctx.currentTime + secs;
    [880, 1174, 1568, 1174, 1568].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t0 = at + i*0.18;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.35, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.26);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0+0.28);
      o._at = t0;
      alarmNodes.push(o);
    });
    alarmArmed = true;
  }catch(e){ alarmArmed = false; }
}

// Single short tick for the 3-2-1 countdown.
function cue(){
  if (!settings.sound) return;
  try{
    ensureCtx();
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type="sine"; o.frequency.value=660;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.18, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0+0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0+0.14);
  }catch(e){}
}
function beep(){
  if (!settings.sound) return;
  try{
    ensureCtx();
    const now = audioCtx.currentTime;
    [880, 1174, 1568].forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = now + i*0.16;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.3, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+0.24);
    });
  }catch(e){}
}

/* ============================================================
   HISTORY VIEW
   ============================================================ */
// Sessions with at least one completed set, newest first. Anything with
// nothing ticked isn't a workout, and shouldn't reach the calendar or the list.
function loggedWorkouts(){
  return Object.values(history)
    .filter(w=> w && w.date && totals(w).done > 0)
    .sort((a,b)=> a.date<b.date?1:-1);
}

function renderHistory(){
  const view = $("#view-history");

  view.innerHTML = `
    <div class="today-hero"><div class="k">Log</div><div class="v">History</div></div>
    <div class="cal-card" id="calCard"></div>
    <div class="search-row">
      <input class="search-in" id="histSearch" placeholder="Search exercise or day…" value="${esc(histQuery)}">
      ${histQuery ? `<button class="search-clear" id="histClear" aria-label="Clear search">✕</button>` : ""}
    </div>
    <div class="chips" id="histChips">
      ${["All","Push","Pull","Legs"].map(t=>`<button class="chip${histFilter===t?" on":""}" data-f="${t}">${t}</button>`).join("")}
    </div>
    <div class="section-title" id="histTitle">Recent workouts</div>
    <div id="histList"></div>`;

  renderCalendar();

  const search = $("#histSearch");
  search.addEventListener("input", ()=>{
    histQuery = search.value;
    paintHistList();
    // keep focus and caret while typing
  });
  const clr = $("#histClear");
  if (clr) clr.onclick = ()=>{ histQuery=""; renderHistory(); };
  $("#histChips").querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{
    histFilter = b.dataset.f; renderHistory();
  });

  paintHistList();
}

// Applies the current search + type filter to the workout list.
function paintHistList(){
  const list = $("#histList"); if (!list) return;
  const q = histQuery.trim().toLowerCase();
  const all = loggedWorkouts();
  let entries = all;
  if (histFilter && histFilter!=="All") entries = entries.filter(w=> w.type===histFilter);
  if (q) entries = entries.filter(w =>
    w.type.toLowerCase().includes(q) ||
    w.date.includes(q) ||
    dateOf(w.date).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}).toLowerCase().includes(q) ||
    (w.note||"").toLowerCase().includes(q) ||
    w.exercises.some(e=> e.name.toLowerCase().includes(q) || e.group.toLowerCase().includes(q))
  );

  const title = $("#histTitle");
  if (title) title.textContent = (q || histFilter!=="All")
    ? `${entries.length} match${entries.length===1?"":"es"}` : "Recent workouts";

  list.innerHTML = "";
  if (!entries.length){
    list.innerHTML = all.length
      ? `<div class="empty"><span class="em">🔍</span>Nothing matches that.</div>`
      : `<div class="empty"><span class="em">📅</span>No workouts logged yet.<br>Tick your first set to start your history.</div>`;
    return;
  }
  const CAP = 40;
  entries.slice(0, CAP).forEach(w => list.appendChild(histRow(w)));
  if (entries.length > CAP){
    const more = document.createElement("div");
    more.className = "list-more";
    more.textContent = `+ ${entries.length - CAP} older — search to narrow it down`;
    list.appendChild(more);
  }
}

function renderCalendar(){
  const card = $("#calCard");
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysIn = new Date(year, month+1, 0).getDate();
  const monthName = calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const tISO = todayISO();

  let cells = "";
  ["S","M","T","W","T","F","S"].forEach(d=> cells += `<div class="dow">${d}</div>`);
  for (let i=0;i<startDow;i++) cells += `<div class="cal-day pad"></div>`;
  for (let day=1; day<=daysIn; day++){
    const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const w = history[ds];
    const logged = !!w && totals(w).done > 0;   // an entry with nothing ticked isn't a workout
    const rest = isRestDay(new Date(year, month, day).getDay());
    let cls = "cal-day";
    if (logged) cls += " has";
    else if (rest) cls += " rest";
    if (ds===tISO) cls += " today";
    const tag = logged ? `<span class="tp">${esc(String(w.type||"?")[0])}</span>` : "";
    cells += `<button class="${cls}" ${logged?`data-date="${ds}"`:""}>${day}${tag}</button>`;
  }

  card.innerHTML = `
    <div class="cal-head">
      <button id="calPrev" aria-label="Previous month">‹</button>
      <div class="m">${monthName}</div>
      <button id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">${cells}</div>`;

  $("#calPrev").onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); };
  $("#calNext").onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); };
  card.querySelectorAll(".cal-day.has").forEach(b=> b.onclick = ()=> openWorkoutDetail(b.dataset.date));
}

// Inline SVG sparkline; no chart library, stays offline-safe.
function sparkline(values, w, h){
  if (values.length < 2) return "";
  const max = Math.max(...values), min = Math.min(...values);
  const span = (max-min) || 1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=>[i*step, h - ((v-min)/span)*(h-6) - 3]);
  const d = pts.map((p,i)=> `${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${d} L${w},${h} L0,${h} Z`;
  const lastPt = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" class="spark">
    <path d="${area}" fill="var(--accent-ghost)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3" fill="var(--accent)"/>
  </svg>`;
}

  openSheet(`

    ${pr ? `
      <div class="sum-grid" style="margin-bottom:16px">
        <div class="sum-cell accent"><div class="n">${toDisplay(pr.e1rm||pr.kg)}<small style="font-size:14px"> ${unitLabel()}</small></div><div class="l">Est. 1RM</div></div>
        <div class="sum-cell"><div class="n">${toDisplay(pr.topKg)}<small style="font-size:14px"> ${unitLabel()}</small></div><div class="l">Heaviest set</div></div>
      </div>` : ""}
    ${volumes.length>1 ? `
      <div class="chart-card">

    ${bests.length>1 ? `
