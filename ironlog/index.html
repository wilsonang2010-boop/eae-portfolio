<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<meta name="description" content="IronLog — a personal Push / Pull / Legs workout tracker with rest timer, history and stats. Works offline.">
<title>IronLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- Theme ---------- */
:root{
  --bg:#0a0b0f;
  --panel:#14161c;
  --panel-2:#1b1e26;
  --panel-3:#232732;
  --border:#262b36;
  --text:#f3f5f8;
  --muted:#8b93a3;
  --muted-2:#5c6472;
  --accent:#22c55e;
  --accent-dim:#16a34a;
  --accent-ghost:rgba(34,197,94,.14);
  --danger:#ef4444;
  --amber:#f59e0b;
  --radius:22px;
  --radius-sm:14px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
:root[data-amoled="1"]{ --bg:#000000; --panel:#0c0d11; --panel-2:#141620; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  line-height:1.45;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
::selection{background:var(--accent-ghost)}
.app{
  max-width:520px;margin:0 auto;min-height:100%;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 14px) 20px 12px;
  background:linear-gradient(180deg,var(--bg) 72%,transparent);
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(160deg,#1b1e26,#0d0e12);
  border:1px solid var(--border);
  display:grid;place-items:center;
}
.brand .logo svg{width:20px;height:20px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.brand .sub{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.25}
.brand .sub b{color:var(--text);font-weight:600;display:block;font-size:13px}
.rest-launch{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;margin-left:12px;
  background:var(--panel-2);border:1px solid var(--border);display:grid;place-items:center;
  transition:transform .12s,border-color .2s;
}
.rest-launch svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.rest-launch:active{transform:scale(.92)}
.rest-launch:active svg{stroke:var(--accent)}

/* ---------- Views ---------- */
.view{padding:6px 16px 20px;animation:fade .28s ease}
.view[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Progress bar ---------- */
.progress-wrap{
  position:sticky;top:calc(var(--safe-t) + 58px);z-index:30;
  background:var(--bg);padding:8px 4px 12px;margin:0 -4px;
}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-head .t{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.progress-head .p{font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--border)}
.bar>span{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));
  transition:width .5s cubic-bezier(.22,1,.36,1);
}

/* ---------- Cards ---------- */
.group-label{
  font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted-2);
  text-transform:uppercase;margin:22px 6px 10px;display:flex;align-items:center;gap:8px;
}
.group-label::after{content:"";flex:1;height:1px;background:var(--border)}
.ex-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 16px 8px;margin-bottom:14px;transition:border-color .3s;
}
.ex-card.complete{border-color:rgba(34,197,94,.4)}
.ex-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.ex-name{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.ex-scheme{font-size:12.5px;color:var(--muted);margin-top:3px}
.ex-tag{
  margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--border);padding:5px 9px;border-radius:99px;
}
.ex-done-badge{margin-left:auto;color:var(--accent);display:none;align-items:center;gap:5px;font-size:13px;font-weight:700}
.ex-card.complete .ex-done-badge{display:flex}
.ex-card.complete .ex-tag{display:none}

.ex-title{text-align:left;flex:1;min-width:0;padding:0;display:block}
.ex-title:active .ex-name{color:var(--accent)}
.ex-menu{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;margin-left:6px;
  background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
  font-size:17px;font-weight:800;line-height:1;
}
.ex-card.skipped{opacity:.55}
.ex-card.skipped .ex-name{text-decoration:line-through}
.skip-note{font-size:13px;color:var(--muted);padding:4px 4px 12px}
.swap-btn{
  width:34px;height:34px;border-radius:10px;margin-left:10px;vertical-align:middle;
  background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
  font-size:16px;font-weight:800;
}
.swap-btn:active{color:var(--accent);border-color:var(--accent)}
/* Progression nudge */
.prog-chip{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:var(--accent-ghost);border:1px solid rgba(34,197,94,.4);border-radius:13px;
  padding:10px 12px;margin:2px 0 10px;font-size:13px;color:var(--text);font-weight:600;
}
.prog-chip .up{color:var(--accent);font-size:11px}
.prog-chip b{color:var(--accent)}
.prog-chip:active{transform:scale(.99)}
/* Card footer actions */
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 8px;border-top:1px solid var(--border);margin-top:6px}
.foot-btn{
  font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--border);border-radius:10px;padding:8px 11px;
}
.foot-btn:active{color:var(--accent);border-color:var(--accent)}
.foot-btn.del{color:var(--muted-2)}

/* ---------- Set rows ---------- */
.set{
  display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:14px;
  transition:background .3s;
}
.set + .set{border-top:1px solid var(--border)}
.set.done{background:var(--accent-ghost);border-top-color:transparent}
.set.done + .set{border-top-color:transparent}
.check{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  background:var(--panel-2);border:2px solid var(--border);
  display:grid;place-items:center;transition:transform .12s,background .25s,border-color .25s;
}
.check svg{width:24px;height:24px;stroke:var(--muted-2);transition:stroke .2s;opacity:.0}
.check:active{transform:scale(.9)}
.set.done .check{background:var(--accent);border-color:var(--accent)}
.set.done .check svg{stroke:#04120a;opacity:1;stroke-width:3.2}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .32s ease}
.set-main{flex:1;min-width:0}
.set-top{display:flex;align-items:center;gap:10px}
.set-label{font-size:14px;font-weight:700;min-width:60px}
.set-label.warm{color:var(--amber)}
.set-inputs{display:flex;align-items:center;gap:8px;margin-left:auto}
.field{
  display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--border);
  border-radius:11px;padding:0 9px;height:40px;transition:border-color .2s;
}
.field:focus-within{border-color:var(--accent)}
.field input{
  width:52px;background:none;border:none;outline:none;color:var(--text);
  font-size:16px;font-weight:700;text-align:right;padding:0;
  font-variant-numeric:tabular-nums;
}
.field.reps input{width:34px;text-align:center}
.field .u{font-size:12px;color:var(--muted);margin-left:5px;font-weight:600}
/* Weight/reps are buttons, not text inputs: they open the in-app keypad so
   iOS never opens its keyboard (which is what triggers "Undo Typing" on shake). */
.field .val{
  min-width:52px;text-align:right;font-size:16px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.field.reps .val{min-width:34px;text-align:center}
.field .val.empty{color:var(--muted-2)}
.field:disabled{opacity:.6}
.field.tapped{border-color:var(--accent)}

/* ---------- Numeric keypad ---------- */
.kp-overlay{
  position:fixed;inset:0;z-index:96;background:rgba(4,5,8,.72);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .24s;
}
.kp-overlay.show{opacity:1;pointer-events:auto}
.keypad{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
  border-radius:26px 26px 0 0;padding:18px 16px calc(16px + var(--safe-b));
  transform:translateY(26px);transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.kp-overlay.show .keypad{transform:none}
.kp-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;padding:0 4px}
.kp-label{font-size:12.5px;color:var(--muted);font-weight:600}
.kp-value{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kp-value small{font-size:16px;color:var(--muted);font-weight:700;margin-left:3px}
.kp-done{
  margin-left:auto;background:var(--accent);color:#04120a;font-weight:800;font-size:15px;
  padding:12px 22px;border-radius:13px;
}
.kp-quick{display:flex;gap:8px;margin-bottom:10px}
.kp-quick button{
  flex:1;padding:11px 0;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);
  font-size:14px;font-weight:700;color:var(--muted);
}
.kp-quick button:active{border-color:var(--accent);color:var(--text)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp-grid button{
  padding:16px 0;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);
  font-size:22px;font-weight:700;transition:transform .1s,background .15s;
}
.kp-grid button:active{transform:scale(.95);background:var(--panel-3)}
.kp-grid button.wide{grid-column:span 1}
.note-btn{
  font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);
  border-radius:10px;height:40px;padding:0 10px;font-weight:600;white-space:nowrap;
}
.note-btn.has{color:var(--accent);border-color:rgba(34,197,94,.4)}
.note-row{padding:0 4px 6px 62px;overflow:hidden}
.note-row input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;
  padding:9px 12px;color:var(--text);font-size:14px;outline:none;
}
.note-row input:focus{border-color:var(--accent)}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:-.01em;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  transition:transform .1s,filter .2s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04120a}
.btn.primary.ready{box-shadow:0 8px 30px -8px rgba(34,197,94,.6);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 24px -10px rgba(34,197,94,.5)}50%{box-shadow:0 10px 34px -8px rgba(34,197,94,.8)}}
.btn.ghost{background:transparent}
.btn.small{width:auto;padding:11px 16px;font-size:14px;border-radius:13px}
.finish-wrap{margin:22px 2px 6px}

/* ---------- Rest / empty states ---------- */
.rest-card{
  margin:40px 6px;padding:44px 26px;text-align:center;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
}
.rest-card .em{font-size:56px;margin-bottom:6px}
.rest-card h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.rest-card p{color:var(--muted);font-size:15px;margin:0}
.day-pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:99px;padding:8px 16px;
  font-size:14px;font-weight:700;margin-bottom:2px;
}
.day-pill .dot{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.today-hero{padding:6px 6px 2px}
.today-hero .k{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.today-hero .v{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.today-hero .v .type{color:var(--accent)}
.done-note{
  display:flex;gap:10px;align-items:center;background:var(--accent-ghost);
  border:1px solid rgba(34,197,94,.35);border-radius:14px;padding:11px 14px;margin:12px 2px 4px;
  font-size:14px;color:var(--text);font-weight:600;
}

/* ---------- Rest timer sheet ---------- */
/* z-index sits above the modal overlay (80) so the timer is still visible
   while a past workout is open for editing. */
/* Sits just above the bottom nav rather than over it, so tabs stay reachable
   during a 2:30 rest. */
.rest-timer{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:85;
  transform:translateY(140%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.rest-timer.show{transform:translateY(0);pointer-events:auto}
.rest-timer-inner{
  max-width:520px;margin:0 auto;
  background:var(--panel);border:1px solid var(--border);
  border-radius:26px 26px 0 0;padding:18px 20px 18px;
  box-shadow:0 -20px 50px -20px rgba(0,0,0,.85);
}
.rt-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rt-ring{width:78px;height:78px;flex:0 0 auto;position:relative}
.rt-ring svg{transform:rotate(-90deg)}
.rt-ring .time{
  position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.rt-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.rt-sub{font-size:15px;font-weight:700;margin-top:2px}
.rt-adjust{margin-left:auto;display:flex;gap:8px}
.rt-adjust button{width:44px;height:44px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);font-size:13px;font-weight:800;color:var(--muted)}
.rt-btns{display:flex;gap:10px}
.rt-btns button{
  flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:800;
  background:var(--panel-2);border:1px solid var(--border);
}
.rt-btns .skip{background:var(--accent);border-color:var(--accent);color:#04120a}

/* ---------- Bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(12,13,17,.86);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  display:flex;max-width:520px;margin:0 auto;
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted-2);font-size:10.5px;font-weight:700;letter-spacing:.02em;transition:color .2s;
}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.nav button.active{color:var(--accent)}
.nav button.active svg{transform:translateY(-1px)}

/* ---------- Stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 2px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:16px;color:var(--muted);font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat.accent .n{color:var(--accent)}
.section-title{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:24px 4px 12px;display:flex;align-items:center;gap:8px}
.pr-row{
  display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:13px 15px;margin-bottom:9px;
}
.pr-row .nm{font-weight:700;font-size:15px}
.pr-row .mg{font-size:12px;color:var(--muted)}
.pr-row{width:100%;text-align:left}
.pr-row .val{margin-left:auto;font-size:18px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.pr-row .val small{font-size:12px;color:var(--muted);font-weight:700}
.pr-row:active{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty .em{font-size:40px;display:block;margin-bottom:10px;opacity:.7}
.hint-inline{font-size:11.5px;color:var(--muted-2);font-weight:600;letter-spacing:0}

/* ---------- Week summary / balance / charts ---------- */
.week-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:8px 2px 14px}
.week-head{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.week-head span{color:var(--muted-2);letter-spacing:0;text-transform:none;font-weight:600}
.week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.week-grid .n{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.week-grid .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.week-grid .d{font-size:11px;font-weight:700;margin-top:3px;min-height:14px}
.dl{font-weight:800}
.dl.up{color:var(--accent)} .dl.down{color:var(--danger)} .dl.flat{color:var(--muted-2)}
.bal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:0 2px 6px}
.bal-row + .bal-row{margin-top:12px}
.bal-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.bal-top b{color:var(--text);font-variant-numeric:tabular-nums}
.bal-bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bal-bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-dim),var(--accent))}
.chart-card{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:14px 14px 8px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.chart-head b{color:var(--text);font-variant-numeric:tabular-nums}
.spark{display:block;overflow:visible}
.ex-hist-row{
  display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:13px;padding:11px 13px;margin-bottom:8px;
}
.ex-hist-row .d{font-size:13.5px;font-weight:700}
.ex-hist-row .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-hist-row .v{margin-left:auto;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;font-size:15px}
.ex-hist-row .v small{color:var(--muted);font-weight:600;font-size:11px}

/* ---------- Calendar ---------- */
.cal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:6px 2px 18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .m{font-size:17px;font-weight:800;letter-spacing:-.01em}
.cal-head button{width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);font-size:18px;font-weight:800;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--muted-2);font-weight:700;padding-bottom:4px}
.cal-day{
  aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;position:relative;background:transparent;color:var(--muted);
}
.cal-day.pad{visibility:hidden}
.cal-day.today{outline:2px solid var(--accent-dim);color:var(--text)}
.cal-day.has{background:var(--accent-ghost);color:var(--text)}
.cal-day.has .tp{position:absolute;bottom:5px;font-size:8px;font-weight:800;letter-spacing:.04em;color:var(--accent)}
.cal-day.rest{color:var(--muted-2)}
.hist-row{
  display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;text-align:left;width:100%;
}
.hist-row .ic{width:42px;height:42px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;flex:0 0 auto}
.hist-row .ic svg{width:22px;height:22px}
.hist-row .h-t{font-weight:800;font-size:16px}
.hist-row .h-d{font-size:12.5px;color:var(--muted);margin-top:1px}
.hist-row .h-p{margin-left:auto;text-align:right}
.hist-row .h-p .pct{font-weight:800;color:var(--accent);font-size:16px}
.hist-row .h-p .st{font-size:12px;color:var(--muted)}

/* ---------- Settings ---------- */
.set-group{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 2px 16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 16px}
.set-row + .set-row{border-top:1px solid var(--border)}
.set-row .lab{font-weight:600;font-size:15px}
.set-row .desc{font-size:12px;color:var(--muted);margin-top:2px}
.set-row .ctl{margin-left:auto;flex:0 0 auto}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#04120a}
.switch{width:52px;height:31px;border-radius:99px;background:var(--panel-3);border:1px solid var(--border);position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:99px;background:#fff;transition:transform .25s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(21px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);font-size:20px;font-weight:700;color:var(--text);display:grid;place-items:center}
.stepper .v{min-width:64px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:9px}
.swatch{width:30px;height:30px;border-radius:99px;border:2px solid transparent;transition:transform .15s}
.swatch.on{border-color:var(--text);transform:scale(1.08)}
.hint{font-size:12.5px;color:var(--muted);padding:2px 8px;margin:-4px 2px 16px;line-height:1.5}
.hint b{color:var(--text)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(4,5,8,.72);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s;
}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
  border-radius:28px 28px 0 0;padding:26px 22px calc(26px + var(--safe-b));
  transform:translateY(30px);transition:transform .32s cubic-bezier(.22,1,.36,1);
  max-height:88vh;overflow:auto;
}
.overlay.show .sheet{transform:none}
.summary .celebrate{text-align:center;margin-bottom:20px}
.summary .celebrate .em{font-size:52px}
.summary .celebrate h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.summary .celebrate p{color:var(--muted);margin:0;font-size:14px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.sum-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.sum-cell .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sum-cell.accent .n{color:var(--accent)}
.sum-cell .l{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.sheet h3.sh-title{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sheet .sh-sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translate(-50%,20px);
  background:var(--panel-3);border:1px solid var(--border);color:var(--text);
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 40px -12px rgba(0,0,0,.7);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.link{color:var(--accent);font-weight:700;background:none;padding:0;font-size:inherit}
</style>
</head>

<!-- In-app numeric keypad (keeps the OS keyboard, and iOS shake-to-undo, out of the way) -->

<script>
"use strict";
/* ============================================================
   IronLog — offline-first Push / Pull / Legs tracker.
   All state lives in localStorage; the app works with no network.
   ============================================================ */

/* ---------- Constants ---------- */
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
// Indexed by Date.getDay(): Sun..Sat
const SCHEDULE = ["Legs","Push","Pull","Legs","Push","Pull","Rest"];

const TEMPLATES = {
  Push: [
    { group:"Chest",     name:"Bench Press",       warmup:true,  sets:3, reps:8 },
    { group:"Chest",     name:"Pec Fly",           warmup:false, sets:3, reps:8 },
    { group:"Shoulders", name:"Shoulder Press",    warmup:true,  sets:3, reps:8 },
    { group:"Shoulders", name:"Lateral Raises",    warmup:false, sets:3, reps:8 },
    { group:"Triceps",   name:"Tricep Pushdown",   warmup:true,  sets:3, reps:8 },
    { group:"Triceps",   name:"Tricep Extension",  warmup:false, sets:3, reps:8 },
  ],
  Pull: [
    { group:"Back",   name:"Lat Pulldown",     warmup:true,  sets:3, reps:8 },
    { group:"Back",   name:"Assisted Pull-up", warmup:false, sets:3, reps:8 },
    { group:"Back",   name:"Seated Row",       warmup:false, sets:3, reps:8 },
    { group:"Biceps", name:"Bicep Curl",       warmup:true,  sets:3, reps:8 },
    { group:"Biceps", name:"Hammer Curl",      warmup:false, sets:3, reps:8 },
  ],
  Legs: [
    { group:"Plyometrics", name:"Seated Box Jump",          warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Box Jump",                 warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Depth Jump",               warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Pogo Jump",                warmup:false, sets:2, reps:5, plyo:true },
    { group:"Plyometrics", name:"Full Effort Forward Jump", warmup:false, sets:2, reps:5, plyo:true },
    { group:"Weights",     name:"Leg Press",       warmup:true,  sets:3, reps:8 },
    { group:"Weights",     name:"Leg Extension",   warmup:false, sets:3, reps:8 },
  ],
};

const ACCENTS = {
  green:  { a:"#22c55e", d:"#16a34a", g:"rgba(34,197,94,.14)" },
  blue:   { a:"#3b82f6", d:"#2563eb", g:"rgba(59,130,246,.14)" },
  violet: { a:"#8b5cf6", d:"#7c3aed", g:"rgba(139,92,246,.14)" },
  orange: { a:"#f59e0b", d:"#d97706", g:"rgba(245,158,11,.14)" },
  red:    { a:"#ef4444", d:"#dc2626", g:"rgba(239,68,68,.14)" },
};

const DEFAULT_SETTINGS = {
  restSec: 150, units: "kg", accent: "green", amoled: false,
  reminders: false, sound: true, vibrate: true, bodyKg: 70,
  // Which kinds of set auto-start the rest timer. Working sets always do.
  restAfterPlyo: true, restAfterWarmup: false,
};

/* ---------- Storage ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const K_SET = "IL_SETTINGS", K_HIST = "IL_HISTORY", K_CUR = "IL_CURRENT", K_TIMER = "IL_TIMER";

let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get(K_SET, {}));
let history  = LS.get(K_HIST, {});   // { "YYYY-MM-DD": workout }
let current  = LS.get(K_CUR, null);  // today's in-progress/finished workout
let activeTab = "today";
let calMonth = new Date(); calMonth.setDate(1);

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
function isoDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
function todayISO(){ return isoDate(new Date()); }
function todayType(){ return SCHEDULE[new Date().getDay()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const KG_PER_LB = 0.45359237;
function toDisplay(kg){ if(kg==null) return ""; const v = settings.units==="kg"? kg : kg/KG_PER_LB; return +(Math.round(v*100)/100); }
function fromDisplay(v){ if(v===""||v==null||isNaN(v)) return null; return settings.units==="kg"? +v : +v*KG_PER_LB; }
function unitLabel(){ return settings.units; }
function fmtWeightKg(kg){ if(kg==null) return "—"; return `${toDisplay(kg)} ${unitLabel()}`; }
function saveSettings(){ LS.set(K_SET, settings); }
function saveHistory(){ LS.set(K_HIST, history); }
function saveCurrent(){ if(current) LS.set(K_CUR, current); else localStorage.removeItem(K_CUR); }

/* ---------- Workout building ---------- */
function buildWorkout(type, dateISO){
  const exercises = TEMPLATES[type].map((t, i) => {
    const sets = [];
    if (t.warmup) sets.push({ kind:"warmup", done:false, weightKg:null, reps:t.reps, note:"" });
    for (let s=0; s<t.sets; s++) sets.push({ kind:"working", done:false, weightKg:null, reps:t.reps, note:"" });
    return { id:i, name:t.name, group:t.group, plyo:!!t.plyo, reps:t.reps, sets };
  });
  const w = { type, date:dateISO, startedAt:null, endedAt:null, exercises };
  preloadWeights(w);
  return w;
}
// Preload the most recent same-type workout's weights.
function preloadWeights(w){
  const past = Object.values(history)
    .filter(h => h.type===w.type && h.date!==w.date)
    .sort((a,b)=> a.date<b.date?1:-1)[0];
  if (!past) return;
  const byName = {};
  past.exercises.forEach(e => byName[e.name] = e);
  w.exercises.forEach(e => {
    const p = byName[e.name];
    if (!p) return;
    e.sets.forEach((set, i) => {
      const ps = p.sets[i];
      if (ps && ps.weightKg!=null) set.weightKg = ps.weightKg;
    });
  });
}
function totals(w){
  let done=0, total=0;
  w.exercises.forEach(e=>e.sets.forEach(s=>{
    if (e.skipped) return;
    total++; if(s.done) done++;
  }));
  return { done, total, pct: total? Math.round(done/total*100):0 };
}

/* ============================================================
   ANALYTICS
   ============================================================ */
// Epley estimated 1-rep max. Lets us compare 60kg×8 against 70kg×3 — a plain
// "heaviest weight" comparison calls the second a PR when it usually isn't.
function e1rm(kg, reps){
  if (kg==null || !reps || reps<1) return null;
  if (reps === 1) return kg;
  return kg * (1 + reps/30);
}
function setVolume(s){ return (s.done && s.weightKg!=null && s.reps) ? s.weightKg*s.reps : 0; }
function workoutVolume(w){
  let v=0;
  w.exercises.forEach(e=>{ if(!e.skipped) e.sets.forEach(s=>{ v += setVolume(s); }); });
  return v;
}
function exerciseVolume(e){
  let v=0; e.sets.forEach(s=>{ v += setVolume(s); }); return v;
}
// Every logged session that contains this exercise, newest first.
function exerciseHistory(name){
  return Object.values(history)
    .filter(w => w.exercises.some(e=>e.name===name))
    .sort((a,b)=> a.date<b.date?1:-1)
    .map(w => {
      const e = w.exercises.find(x=>x.name===name);
      const working = e.sets.filter(s=>s.kind==="working" && s.done && s.weightKg!=null);
      let best = null;
      working.forEach(s=>{ const v=e1rm(s.weightKg,s.reps); if(v!=null && (best==null || v>best.v)) best={v, kg:s.weightKg, reps:s.reps}; });
      return { date:w.date, type:w.type, ex:e, sets:working, best, volume:exerciseVolume(e),
               topKg: working.reduce((m,s)=> s.weightKg>m ? s.weightKg : m, 0) };
    });
}
// The most recent completed session for an exercise, for "repeat last time".
function lastSessionFor(name, excludeDate){
  return exerciseHistory(name).find(h => h.date !== excludeDate && h.sets.length) || null;
}
/* Did every working set hit its rep target at the same weight last time? If so
   it's time to add weight — 2.5kg upper body, 5kg lower. */
function progressionSuggestion(ex, w){
  if (ex.plyo) return null;
  const last = lastSessionFor(ex.name, w.date);
  if (!last) return null;
  const target = ex.reps;
  const all = last.ex.sets.filter(s=>s.kind==="working");
  if (!all.length || !all.every(s=> s.done && s.weightKg!=null && (s.reps||0) >= target)) return null;
  const base = all[0].weightKg;
  if (!all.every(s=> Math.abs(s.weightKg-base) < 0.01)) return null;
  const lower = /leg|squat|calf|hip/i.test(ex.name) || ex.group==="Weights";
  const step = lower ? 5 : 2.5;
  return { from: base, to: +(base+step).toFixed(2), step };
}
function suggestedWarmupKg(ex){
  const working = ex.sets.filter(s=>s.kind==="working" && s.weightKg!=null);
  if (!working.length) return null;
  const target = working[0].weightKg;
  if (!target) return null;
  const half = target/2;
  const step = 2.5;                                   // round to the nearest plate pair
  return Math.max(step, Math.round(half/step)*step);
}
// Monday-anchored week key, so "this week" matches the training split.
function weekStart(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const dow = (x.getDay()+6)%7;                        // Mon=0
  x.setDate(x.getDate()-dow);
  return x;
}
function weekStats(offset){
  const start = weekStart(new Date()); start.setDate(start.getDate() - offset*7);
  const end = new Date(start); end.setDate(end.getDate()+7);
  let workouts=0, sets=0, volume=0;
  Object.values(history).forEach(w=>{
    const d = new Date(w.date+"T00:00:00");
    if (d>=start && d<end){
      const t = totals(w);
      if (t.done>0){ workouts++; sets += t.done; volume += workoutVolume(w); }
    }
  });
  return { workouts, sets, volume, start };
}
// Completed working-set volume per muscle group, for a balance check.
function groupVolumes(){
  const g = {};
  Object.values(history).forEach(w=> w.exercises.forEach(e=>{
    if (e.plyo) return;
    const v = exerciseVolume(e);
    if (v>0) g[e.group] = (g[e.group]||0) + v;
  }));
  return g;
}
// Returns the value *with* its unit — callers must not append one.
function fmtVolume(kg){
  const u = settings.units==="kg" ? "kg" : "lb";
  const v = settings.units==="kg" ? kg : kg/KG_PER_LB;
  if (v >= 10000) return `${Math.round(v/1000)}k ${u}`;
  if (v >= 1000)  return `${(v/1000).toFixed(1)}k ${u}`;
  return `${Math.round(v)} ${u}`;
}
function workoutCalories(w){
  const dur = ((w.endedAt||Date.now()) - (w.startedAt||w.endedAt||Date.now()))/1000;
  const minutes = Math.max(dur/60, totals(w).done*0.9); // floor so a quick session still counts
  const kcal = 5.0 * 3.5 * (settings.bodyKg||70) / 200 * minutes;
  return Math.max(0, Math.round(kcal));
}

/* ============================================================
   TODAY VIEW
   ============================================================ */
/* The scheduled split for today, unless an override has been chosen (missed
   Monday and doing Push on Tuesday, or training on a rest day). */
function activeType(){
  const tISO = todayISO();
  if (current && current.date===tISO) return current.type;
  if (history[tISO]) return history[tISO].type;
  return todayType();
}
function ensureToday(type){
  const t = type || activeType();
  if (t === "Rest") return null;
  const tISO = todayISO();
  if (current && current.date===tISO && current.type===t) return current;
  if (history[tISO] && history[tISO].type===t){ current = history[tISO]; saveCurrent(); return current; }
  current = buildWorkout(t, tISO);
  saveCurrent();
  return current;
}
// Switch today's workout to another split.
function chooseWorkout(){
  const scheduled = todayType();
  const cur = activeType();
  openSheet(`
    <h3 class="sh-title">Train something else</h3>
    <p class="sh-sub">Today is scheduled as <b>${scheduled}</b>. Pick any session — useful if you missed a day.</p>
    ${["Push","Pull","Legs"].map(t=>`<button class="btn${t===cur?" primary":""}" data-t="${t}" style="margin-bottom:10px">${t} Day</button>`).join("")}
    ${cur!=="Rest" ? `<button class="btn" id="mkRest" style="margin-bottom:10px">Make it a rest day</button>` : ""}
    <button class="btn ghost" id="pickClose">Cancel</button>`);
  $("#sheet").querySelectorAll("button[data-t]").forEach(b=> b.onclick = ()=>{
    const t = b.dataset.t;
    const tISO = todayISO();
    if (activeType() !== t){
      const existing = history[tISO];
      if (existing && totals(existing).done > 0 && existing.type !== t){
        // Don't silently bin a logged session.
        toast("Finish or clear today's log first");
        return;
      }
      current = buildWorkout(t, tISO);
      saveCurrent();
    }
    closeSheet(); renderToday();
  });
  const mk = $("#mkRest");
  if (mk) mk.onclick = ()=>{
    const tISO = todayISO();
    if (history[tISO] && totals(history[tISO]).done>0){ toast("Today already has logged sets"); return; }
    current = null; saveCurrent(); delete history[tISO]; saveHistory();
    closeSheet(); renderToday();
  };
  $("#pickClose").onclick = closeSheet;
}

function renderToday(){
  const view = $("#view-today");
  const type = activeType();
  const dayName = DAYS[new Date().getDay()];

  if (type === "Rest"){
    view.innerHTML = `
      <div class="today-hero">
        <div class="k">${dayName}</div>
        <div class="v">Rest Day</div>
      </div>
      <div class="rest-card">
        <div class="em">💪</div>
        <h2>Rest Day</h2>
        <p>Recovery is part of progress.</p>
      </div>
      <div class="finish-wrap"><button class="btn ghost" id="pickBtn">Train anyway →</button></div>`;
    $("#pickBtn").onclick = chooseWorkout;
    return;
  }

  const w = ensureToday(type);
  const t = totals(w);
  const finished = !!w.endedAt;

  view.innerHTML = `
    <div class="today-hero">
      <div class="k">${dayName}${finished ? " · Completed" : ""}${type!==todayType() ? " · swapped" : ""}</div>
      <div class="v">Today's <span class="type">${type}</span>
        <button class="swap-btn" id="pickBtn" aria-label="Change workout">⇄</button>
      </div>
    </div>
    ${finished ? `<div class="done-note">✓ Workout logged. You can still edit any set below.</div>` : ""}
    <div class="progress-wrap">
      <div class="progress-head">
        <span class="t">Workout Progress</span>
        <span class="p" id="progPct">${t.pct}%</span>
      </div>
      <div class="bar"><span id="progBar" style="width:${t.pct}%"></span></div>
    </div>
    <div id="exList"></div>
    <div class="finish-wrap">
      <button class="btn primary ${t.done===t.total && t.total>0 ? "ready":""}" id="finishBtn">
        ${finished ? "View Summary" : "Finish Workout"}
      </button>
    </div>`;

  renderExercises($("#exList"), w, true);
  $("#finishBtn").onclick = ()=> finishWorkout(w);
  $("#pickBtn").onclick = chooseWorkout;
}

/* Renders exercise cards into `host`. `editable` allows checking/typing.
   Structural edits (add/remove set, skip) re-run this to redraw in place. */
function renderExercises(host, w, editable){
  host.innerHTML = "";
  const redraw = ()=>{ renderExercises(host, w, editable); updateProgress(w); };
  let lastGroup = null;
  w.exercises.forEach(ex => {
    if (ex.group !== lastGroup){
      const gl = document.createElement("div");
      gl.className = "group-label";
      gl.textContent = ex.group;
      host.appendChild(gl);
      lastGroup = ex.group;
    }
    host.appendChild(exerciseCard(ex, w, editable, redraw));
  });
}

function exerciseCard(ex, w, editable, redraw){
  const card = document.createElement("div");
  card.className = "ex-card" + (ex.skipped ? " skipped" : "");
  const working = ex.sets.filter(s=>s.kind==="working").length;
  const scheme = `${working} × ${ex.reps}${ex.plyo?"  ·  plyometric":""}`;
  const allDone = !ex.skipped && ex.sets.every(s=>s.done);
  if (allDone) card.classList.add("complete");
  const last = lastSessionFor(ex.name, w.date);

  card.innerHTML = `
    <div class="ex-head">
      <button class="ex-title" aria-label="${esc(ex.name)} history">
        <h3 class="ex-name">${esc(ex.name)}</h3>
        <div class="ex-scheme">${scheme}${last ? ` · last ${fmtWeightKg(last.topKg)}` : ""}</div>
      </button>
      <span class="ex-tag">${esc(ex.group)}</span>
      <span class="ex-done-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Done
      </span>
      <button class="ex-menu" aria-label="Exercise options"${editable?"":" disabled"}>⋯</button>
    </div>`;

  card.querySelector(".ex-title").onclick = ()=> openExerciseDetail(ex.name);
  if (editable) card.querySelector(".ex-menu").onclick = ()=> openExerciseMenu(ex, w, redraw);

  // Time to add weight? Offer it as a one-tap chip.
  const prog = editable && !ex.skipped ? progressionSuggestion(ex, w) : null;
  if (prog){
    const chip = document.createElement("button");
    chip.className = "prog-chip";
    chip.innerHTML = `<span class="up">▲</span> Hit all reps at ${fmtWeightKg(prog.from)} — try <b>${fmtWeightKg(prog.to)}</b>`;
    chip.onclick = ()=>{
      ex.sets.forEach(s=>{ if (s.kind==="working") s.weightKg = prog.to; });
      const wu = suggestedWarmupKg(ex);
      ex.sets.forEach(s=>{ if (s.kind==="warmup" && s.weightKg==null && wu) s.weightKg = wu; });
      saveCurrentOrHistory(w); toast(`Set to ${fmtWeightKg(prog.to)}`); redraw();
    };
    card.appendChild(chip);
  }

  if (ex.skipped){
    const note = document.createElement("div");
    note.className = "skip-note";
    note.textContent = "Skipped — machine busy or swapped out.";
    card.appendChild(note);
    return card;
  }

  ex.sets.forEach((set, si) => {
    const setEl = document.createElement("div");
    setEl.className = "set" + (set.done ? " done" : "");
    const isWarm = set.kind==="warmup";
    // compute working set number
    let wn = 0;
    for (let k=0;k<=si;k++){ if(ex.sets[k].kind==="working") wn++; }
    const label = isWarm ? "Warm-up" : `Set ${wn}`;

    setEl.innerHTML = `
      <button class="check" aria-label="Complete ${label}"${editable?"":" disabled"}>
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="set-main">
        <div class="set-top">
          <span class="set-label${isWarm?" warm":""}">${label}</span>
          <div class="set-inputs">
            <button class="field wbtn"${editable?"":" disabled"} aria-label="Weight">
              <span class="val${set.weightKg==null?" empty":""}">${set.weightKg!=null?toDisplay(set.weightKg):"0"}</span>
              <span class="u">${unitLabel()}</span>
            </button>
            <button class="field reps rbtn"${editable?"":" disabled"} aria-label="Reps">
              <span class="val${set.reps==null?" empty":""}">${set.reps!=null?set.reps:ex.reps}</span>
              <span class="u">rp</span>
            </button>
            <button class="note-btn${set.note?" has":""}"${editable?"":" disabled"}>${set.note?"✎":"＋"}</button>
          </div>
        </div>
      </div>`;
    const noteRow = document.createElement("div");
    noteRow.className = "note-row";
    noteRow.hidden = !set.note;
    noteRow.innerHTML = `<input class="note" placeholder="Add a note…"${editable?"":" disabled"} value="${esc(set.note||"")}">`;

    // --- events ---
    const check = setEl.querySelector(".check");
    check.addEventListener("click", ()=>{
      if(!editable) return;
      set.done = !set.done;
      setEl.classList.toggle("done", set.done);
      check.classList.remove("pop"); void check.offsetWidth; check.classList.add("pop");
      if (set.done && !w.startedAt) w.startedAt = Date.now();
      card.classList.toggle("complete", ex.sets.every(s=>s.done));
      updateProgress(w);
      saveCurrentOrHistory(w);
      if (set.done && shouldRest(ex, set)) startRest(ex.name);
    });
    const wBtn = setEl.querySelector(".wbtn"), wVal = wBtn.querySelector(".val");
    wBtn.addEventListener("click", ()=>{
      if(!editable) return;
      openKeypad({
        title: `${ex.name} · ${label}`,
        unit: unitLabel(),
        decimals: true,
        value: set.weightKg!=null ? toDisplay(set.weightKg) : "",
        onCommit(v){
          set.weightKg = v==="" ? null : fromDisplay(v);
          wVal.textContent = set.weightKg!=null ? toDisplay(set.weightKg) : "0";
          wVal.classList.toggle("empty", set.weightKg==null);
          saveCurrentOrHistory(w);
        }
      });
    });
    const rBtn = setEl.querySelector(".rbtn"), rVal = rBtn.querySelector(".val");
    rBtn.addEventListener("click", ()=>{
      if(!editable) return;
      openKeypad({
        title: `${ex.name} · ${label}`,
        unit: "reps",
        decimals: false,
        value: set.reps!=null ? set.reps : "",
        onCommit(v){
          const n = parseInt(v,10);
          set.reps = isNaN(n) ? null : n;
          rVal.textContent = set.reps!=null ? set.reps : ex.reps;
          rVal.classList.toggle("empty", set.reps==null);
          saveCurrentOrHistory(w);
        }
      });
    });
    const noteBtn = setEl.querySelector(".note-btn");
    noteBtn.addEventListener("click", ()=>{ if(!editable) return; noteRow.hidden=!noteRow.hidden; if(!noteRow.hidden) noteRow.querySelector("input").focus(); });
    const noteInput = noteRow.querySelector(".note");
    noteInput.addEventListener("input", ()=>{ set.note = noteInput.value; noteBtn.classList.toggle("has", !!set.note); noteBtn.textContent = set.note?"✎":"＋"; saveCurrentOrHistory(w); });

    card.appendChild(setEl);
    card.appendChild(noteRow);
  });

  if (editable){
    const foot = document.createElement("div");
    foot.className = "ex-foot";
    const canWarm = !ex.sets.some(s=>s.kind==="warmup") && !ex.plyo;
    foot.innerHTML = `
      <button class="foot-btn add">＋ Add set</button>
      ${canWarm ? `<button class="foot-btn warm">＋ Warm-up</button>` : ""}
      ${last ? `<button class="foot-btn repeat">↻ Repeat last</button>` : ""}
      ${ex.sets.length > 1 ? `<button class="foot-btn del">− Remove set</button>` : ""}`;

    foot.querySelector(".add").onclick = ()=>{
      const lastWorking = [...ex.sets].reverse().find(s=>s.kind==="working");
      ex.sets.push({ kind:"working", done:false,
                     weightKg: lastWorking ? lastWorking.weightKg : null,
                     reps: ex.reps, note:"" });
      saveCurrentOrHistory(w); redraw();
    };
    const warmBtn = foot.querySelector(".warm");
    if (warmBtn) warmBtn.onclick = ()=>{
      ex.sets.unshift({ kind:"warmup", done:false, weightKg:suggestedWarmupKg(ex), reps:ex.reps, note:"" });
      saveCurrentOrHistory(w); redraw();
    };
    const repBtn = foot.querySelector(".repeat");
    if (repBtn) repBtn.onclick = ()=>{
      // Copy last session's working weights/reps onto this session's working sets.
      const src = last.ex.sets.filter(s=>s.kind==="working");
      let i = 0;
      ex.sets.forEach(s=>{
        if (s.kind!=="working") return;
        const from = src[Math.min(i, src.length-1)];
        if (from){ s.weightKg = from.weightKg; if (from.reps) s.reps = from.reps; }
        i++;
      });
      saveCurrentOrHistory(w); toast("Filled from last session"); redraw();
    };
    const delBtn = foot.querySelector(".del");
    if (delBtn) delBtn.onclick = ()=>{
      for (let i=ex.sets.length-1; i>=0; i--){
        if (ex.sets[i].kind==="working"){ ex.sets.splice(i,1); break; }
      }
      saveCurrentOrHistory(w); redraw();
    };
    card.appendChild(foot);
  }

  return card;
}

/* Per-exercise options: skip, un-skip, reset. */
function openExerciseMenu(ex, w, redraw){
  openSheet(`
    <h3 class="sh-title">${esc(ex.name)}</h3>
    <p class="sh-sub">${esc(ex.group)} · ${ex.sets.filter(s=>s.kind==="working").length} × ${ex.reps}</p>
    <button class="btn" id="exHist" style="margin-bottom:10px">View history &amp; trend</button>
    <button class="btn" id="exSkip" style="margin-bottom:10px">${ex.skipped?"Un-skip exercise":"Skip this exercise"}</button>
    <button class="btn" id="exReset" style="margin-bottom:10px">Clear this exercise's sets</button>
    <button class="btn ghost" id="exClose">Close</button>`);
  $("#exHist").onclick = ()=>{ closeSheet(); setTimeout(()=>openExerciseDetail(ex.name), 260); };
  $("#exSkip").onclick = ()=>{
    ex.skipped = !ex.skipped;
    if (ex.skipped) ex.sets.forEach(s=> s.done=false);
    saveCurrentOrHistory(w); closeSheet(); redraw();
    toast(ex.skipped ? "Exercise skipped" : "Exercise restored");
  };
  $("#exReset").onclick = ()=>{
    ex.sets.forEach(s=>{ s.done=false; s.note=""; });
    saveCurrentOrHistory(w); closeSheet(); redraw(); toast("Cleared");
  };
  $("#exClose").onclick = closeSheet;
}

// Persist to whichever store the workout belongs to.
function saveCurrentOrHistory(w){
  if (history[w.date] === w){ saveHistory(); }
  else if (current === w){ saveCurrent(); if (w.endedAt){ history[w.date]=w; saveHistory(); } }
  else if (w.date && history[w.date]){ history[w.date]=w; saveHistory(); }
}

function updateProgress(w){
  const t = totals(w);
  const bar = $("#progBar"), pct = $("#progPct"), fin = $("#finishBtn");
  if (bar) bar.style.width = t.pct + "%";
  if (pct) pct.textContent = t.pct + "%";
  if (fin && !w.endedAt) fin.classList.toggle("ready", t.done===t.total && t.total>0);
}

/* ---------- Finish ---------- */
function finishWorkout(w){
  const t = totals(w);
  if (!w.endedAt){
    if (t.done === 0){ toast("Complete a set first"); return; }
    if (!w.startedAt) w.startedAt = Date.now();
    w.endedAt = Date.now();
    history[w.date] = w;
    saveHistory(); saveCurrent();
    if (settings.vibrate && navigator.vibrate) navigator.vibrate([40,60,40]);
  }
  showSummary(w);
  renderToday();
}

function showSummary(w){
  const t = totals(w);
  const durSec = Math.max(0, Math.round(((w.endedAt||Date.now()) - (w.startedAt||w.endedAt||Date.now()))/1000));
  const mm = Math.floor(durSec/60), ss = durSec%60;
  const cal = workoutCalories(w);
  openSheet(`
    <div class="summary">
      <div class="celebrate">
        <div class="em">🎉</div>
        <h2>Workout Complete</h2>
        <p>${w.type} · ${new Date(w.date).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</p>
      </div>
      <div class="sum-grid">
        <div class="sum-cell accent"><div class="n">${t.done}</div><div class="l">Sets Completed</div></div>
        <div class="sum-cell"><div class="n">${mm}<small style="font-size:15px">m</small> ${ss}<small style="font-size:15px">s</small></div><div class="l">Duration</div></div>
        <div class="sum-cell"><div class="n">${t.pct}%</div><div class="l">Completion</div></div>
        <div class="sum-cell"><div class="n">${cal}</div><div class="l">Calories (est.)</div></div>
      </div>
      <button class="btn primary" id="sumDone" style="margin-top:16px">Done</button>
    </div>`);
  $("#sumDone").onclick = closeSheet;
}

/* ============================================================
   NUMERIC KEYPAD
   Weight/reps entry never uses a real <input>, so iOS never opens its
   keyboard and never builds a typing-undo stack — which is what makes
   "Undo Typing" pop up when the phone is shaken mid-workout.
   ============================================================ */
let kp = null; // { buf, decimals, onCommit, fresh }

function openKeypad(opts){
  kp = { buf: String(opts.value==null?"":opts.value), decimals:!!opts.decimals, onCommit:opts.onCommit, fresh:true };
  $("#kpLabel").textContent = opts.title || "";
  $("#kpUnit").textContent = opts.unit || "";
  const steps = opts.decimals ? [-5,-2.5,2.5,5] : [-2,-1,1,2];
  $("#kpQuick").innerHTML = steps.map(s=>`<button data-adj="${s}">${s>0?"+":"−"}${Math.abs(s)}</button>`).join("");
  const keys = ["1","2","3","4","5","6","7","8","9", opts.decimals?".":"C", "0", "⌫"];
  $("#kpGrid").innerHTML = keys.map(k=>`<button data-k="${k}">${k}</button>`).join("");
  $("#kpQuick").querySelectorAll("button").forEach(b=> b.onclick = ()=> kpAdjust(parseFloat(b.dataset.adj)));
  $("#kpGrid").querySelectorAll("button").forEach(b=> b.onclick = ()=> kpKey(b.dataset.k));
  kpRender();
  $("#kpOverlay").classList.add("show");
}
function kpRender(){
  const v = kp.buf === "" ? "0" : kp.buf;
  $("#kpValue").textContent = v;
}
function kpKey(k){
  if (!kp) return;
  if (k === "⌫"){ kp.buf = kp.buf.slice(0,-1); }
  else if (k === "C"){ kp.buf = ""; }
  else if (k === "."){
    if (kp.fresh){ kp.buf = "0"; kp.fresh = false; }
    if (!kp.buf.includes(".")) kp.buf = (kp.buf===""?"0":kp.buf) + ".";
  } else {
    // First digit replaces the pre-filled value rather than appending to it.
    if (kp.fresh){ kp.buf = ""; kp.fresh = false; }
    if (kp.buf.replace(".","").length < 6) kp.buf += k;
  }
  kp.fresh = false;
  kpRender();
}
function kpAdjust(delta){
  if (!kp) return;
  const cur = parseFloat(kp.buf || "0") || 0;
  let next = cur + delta;
  if (next < 0) next = 0;
  if (!kp.decimals) next = Math.round(next);
  kp.buf = String(+(Math.round(next*100)/100));
  kp.fresh = false;
  kpRender();
}
function closeKeypad(commit){
  if (kp && commit && kp.onCommit){
    const raw = kp.buf.replace(/\.$/,"");
    kp.onCommit(raw === "" ? "" : String(+raw));
  }
  kp = null;
  $("#kpOverlay").classList.remove("show");
}
$("#kpDone").onclick = ()=> closeKeypad(true);
$("#kpOverlay").addEventListener("click", e=>{ if (e.target.id === "kpOverlay") closeKeypad(true); });

/* ============================================================
   REST TIMER
   ============================================================ */
/* The countdown is driven off wall-clock time (endAt), not by counting
   interval ticks — mobile browsers throttle or freeze timers when the screen
   locks or the app is backgrounded, which would otherwise stall the count. */
const timer = { total:0, remaining:0, endAt:0, running:false, iv:null, to:null, exercise:"", finished:false };
const RT_CIRC = 2 * Math.PI * 34; // 213.6

// Working sets always rest; warm-ups and plyometrics follow their settings.
function shouldRest(ex, set){
  if (set.kind === "warmup") return !!settings.restAfterWarmup;
  if (ex.plyo) return !!settings.restAfterPlyo;
  return true;
}

function startRest(exerciseName){
  timer.total = settings.restSec;
  timer.remaining = settings.restSec;
  timer.endAt = Date.now() + timer.total*1000;
  timer.exercise = exerciseName || "";
  timer.running = true;
  timer.finished = false;
  $("#rtSub").textContent = exerciseName ? `After ${exerciseName}` : "Recovering…";
  $("#restTimer").classList.add("show");
  $("#rtPause").textContent = "Pause";
  tickRender();
  startLoop();
  persistTimer();
  acquireWake();
}
function startLoop(){
  clearInterval(timer.iv);
  // 250ms so the display re-syncs quickly after the tab wakes back up.
  timer.iv = setInterval(tick, 250);
  // A timeout aimed at the exact finish moment, in case the interval is
  // throttled while the app sits in the background.
  clearTimeout(timer.to);
  if (timer.running) timer.to = setTimeout(tick, Math.max(0, timer.endAt - Date.now()) + 60);
}
function stopLoop(){ clearInterval(timer.iv); timer.iv = null; clearTimeout(timer.to); timer.to = null; }

/* The countdown is stored so that closing the app — or the OS discarding the
   page — doesn't lose it. On reopen we recompute from the saved end time. */
function persistTimer(){
  if (timer.running || (timer.remaining > 0 && !timer.finished)){
    LS.set(K_TIMER, { total:timer.total, endAt:timer.endAt, remaining:timer.remaining,
                      running:timer.running, exercise:timer.exercise });
  } else {
    try{ localStorage.removeItem(K_TIMER); }catch(e){}
  }
}
function restoreTimer(){
  const s = LS.get(K_TIMER, null);
  if (!s) return;
  timer.total = s.total || settings.restSec;
  timer.exercise = s.exercise || "";
  timer.finished = false;
  $("#rtSub").textContent = timer.exercise ? `After ${timer.exercise}` : "Recovering…";
  if (s.running){
    const rem = Math.round((s.endAt - Date.now())/1000);
    if (rem <= 0){ try{ localStorage.removeItem(K_TIMER); }catch(e){} return; } // elapsed while away
    timer.endAt = s.endAt; timer.remaining = rem; timer.running = true;
    $("#rtPause").textContent = "Pause";
    $("#restTimer").classList.add("show");
    tickRender(); startLoop(); acquireWake();
  } else {
    timer.remaining = s.remaining || 0;
    if (timer.remaining <= 0) return;
    timer.running = false;
    $("#rtPause").textContent = "Resume";
    $("#restTimer").classList.add("show");
    tickRender();
  }
}

/* Keep the screen on while resting so the phone doesn't sleep mid-countdown. */
let wakeLock = null;
async function acquireWake(){
  try{
    if ("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if (wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }

function notifyRestDone(){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const body = timer.exercise ? `Rest done after ${timer.exercise} — next set 💥` : "Rest complete — next set 💥";
  try{
    if (navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification("IronLog", { body, icon:"icon-192.png", badge:"icon-192.png", tag:"ironlog-rest", renotify:true, vibrate:[120,80,120] }))
        .catch(()=>{ try{ new Notification("IronLog", { body, icon:"icon-192.png" }); }catch(e){} });
    } else {
      new Notification("IronLog", { body, icon:"icon-192.png" });
    }
  }catch(e){}
}
function tick(){
  if (!timer.running) return;
  const rem = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
  if (rem === timer.remaining) return;
  timer.remaining = rem;
  tickRender();
  // Short cue on the last three seconds so you can be set before it ends.
  if (rem > 0 && rem <= 3){
    cue();
    if (settings.vibrate && navigator.vibrate) navigator.vibrate(35);
  }
  if (rem <= 0) finishRest();
}
function tickRender(){
  const m = Math.floor(timer.remaining/60), s = timer.remaining%60;
  $("#rtTime").textContent = `${m}:${String(s).padStart(2,"0")}`;
  const frac = timer.total ? timer.remaining/timer.total : 0;
  $("#rtArc").style.strokeDashoffset = (RT_CIRC * (1 - frac)).toFixed(1);
}
function finishRest(){
  stopLoop();
  timer.running = false;
  timer.finished = true;
  timer.remaining = 0;
  tickRender();
  persistTimer();
  beep();
  if (settings.vibrate && navigator.vibrate) navigator.vibrate([120,80,120,80,200]);
  if (document.hidden) notifyRestDone();
  releaseWake();
  $("#rtSub").textContent = "Rest complete 💥";
  setTimeout(()=>{ if (timer.finished) hideRest(); }, 1500);
}
function hideRest(){
  $("#restTimer").classList.remove("show");
  stopLoop();
  timer.running = false;
  timer.remaining = 0;
  persistTimer();
  releaseWake();
}
function pauseRest(){
  if (timer.remaining<=0) return;
  if (timer.running){
    timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now())/1000));
    timer.running = false;
    stopLoop();
  } else {
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    startLoop();
  }
  $("#rtPause").textContent = timer.running ? "Pause" : "Resume";
  tickRender();
  persistTimer();
  if (timer.running) acquireWake(); else releaseWake();
}
function restartRest(){
  timer.remaining = timer.total;
  timer.endAt = Date.now() + timer.total*1000;
  timer.running = true;
  timer.finished = false;
  $("#rtPause").textContent = "Pause";
  $("#rtSub").textContent = timer.exercise ? `After ${timer.exercise}` : "Recovering…";
  tickRender();
  startLoop();
  persistTimer();
  acquireWake();
}
function adjustRest(delta){
  timer.remaining = Math.max(5, timer.remaining + delta);
  timer.total = Math.max(timer.total, timer.remaining);
  timer.finished = false;
  if (timer.running){ timer.endAt = Date.now() + timer.remaining*1000; startLoop(); }
  else $("#rtPause").textContent = "Resume";
  tickRender();
  persistTimer();
}
// Re-sync the moment the app comes back to the foreground.
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){ persistTimer(); return; }
  if (timer.running){ tick(); startLoop(); acquireWake(); }
});
window.addEventListener("pagehide", persistTimer);

$("#rtSkip").onclick = hideRest;
$("#rtRestart").onclick = restartRest;
$("#rtPlus").onclick = ()=>adjustRest(15);
$("#rtMinus").onclick = ()=>adjustRest(-15);

$("#manualTimer").onclick = ()=> startRest("");

/* Beep via WebAudio (no asset needed). */
let audioCtx = null;
// Single short tick for the 3-2-1 countdown.
function cue(){
  if (!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==="suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type="sine"; o.frequency.value=660;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.18, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0+0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0+0.14);
  }catch(e){}
}
function beep(){
  if (!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==="suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    [880, 1174, 1568].forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0 = now + i*0.16;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.3, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+0.24);
    });
  }catch(e){}
}

// Inline SVG sparkline; no chart library, stays offline-safe.
function sparkline(values, w, h){
  if (values.length < 2) return "";
  const max = Math.max(...values), min = Math.min(...values);
  const span = (max-min) || 1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=>[i*step, h - ((v-min)/span)*(h-6) - 3]);
  const d = pts.map((p,i)=> `${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${d} L${w},${h} L0,${h} Z`;
  const lastPt = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" class="spark">
    <path d="${area}" fill="var(--accent-ghost)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3" fill="var(--accent)"/>
  </svg>`;
}

function isRestDate(ds){ return new Date(ds+"T00:00:00").getDay()===6; }
function workoutDone(w){ return totals(w).done > 0; }

function computeStreaks(){
  const done = new Set(Object.keys(history).filter(k=> workoutDone(history[k])));
  // Current streak: walk backwards from today; rest days are neutral bridges.
  let cur = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  if (!done.has(todayISO()) && new Date().getDay()!==6) d.setDate(d.getDate()-1); // today not done yet → don't penalise
  for (let guard=0; guard<3650; guard++){
    const ds = isoDate(d);
    if (d.getDay()===6){ d.setDate(d.getDate()-1); continue; }
    if (done.has(ds)){ cur++; d.setDate(d.getDate()-1); }
    else break;
  }
  // Longest streak: scan forward across the full logged range.
  const keys = Object.keys(history).filter(k=>workoutDone(history[k])).sort();
  let longest = cur ? cur : 0;
  if (keys.length){
    let run = 0;
    const start = new Date(keys[0]+"T00:00:00");
    const end = new Date(); end.setHours(0,0,0,0);
    for (let dd=new Date(start); dd<=end; dd.setDate(dd.getDate()+1)){
      const ds = isoDate(dd);
      if (dd.getDay()===6) continue;             // rest = neutral
      if (done.has(ds)) run++;
      else if (isoDate(dd)===todayISO()) continue; // today pending
      else run = 0;
      if (run>longest) longest = run;
    }
  }
  return { current: cur, longest };
}

/* Ranked by estimated 1RM rather than raw weight, so a heavier-but-shorter set
   doesn't displace a genuinely stronger one. Heaviest weight is kept alongside. */
function computePRs(){
  const pr = {}; // name -> { e1rm, kg, reps, group, topKg, date }
  Object.values(history).forEach(w=>{
    w.exercises.forEach(e=>{
      if (e.plyo) return;
      e.sets.forEach(s=>{
        if (!(s.done && s.kind==="working" && s.weightKg!=null)) return;
        const est = e1rm(s.weightKg, s.reps);
        const cur = pr[e.name];
        if (!cur){
          pr[e.name] = { e1rm:est, kg:s.weightKg, reps:s.reps, group:e.group, topKg:s.weightKg, date:w.date };
          return;
        }
        if (s.weightKg > cur.topKg) cur.topKg = s.weightKg;
        if (est!=null && (cur.e1rm==null || est > cur.e1rm)){
          cur.e1rm = est; cur.kg = s.weightKg; cur.reps = s.reps; cur.date = w.date;
        }
      });
    });
  });
  return pr;
}

function renderStats(){
  const view = $("#view-stats");
  const all = Object.values(history);
  const streaks = computeStreaks();
  const totalWorkouts = all.filter(workoutDone).length;
  let doneSets=0, allSets=0;
  all.forEach(w=>{ const t=totals(w); doneSets+=t.done; allSets+=t.total; });
  const rate = allSets? Math.round(doneSets/allSets*100):0;
  const prs = computePRs();
  const prList = Object.entries(prs).sort((a,b)=> (b[1].e1rm||b[1].kg)-(a[1].e1rm||a[1].kg));
  const totalVol = all.reduce((v,w)=> v + workoutVolume(w), 0);

  // This week vs last, so the numbers mean something in context.
  const wk = weekStats(0), lastWk = weekStats(1);
  // No comparison until the week is actually underway — a fresh Monday would
  // otherwise always read "down 100%".
  const started = wk.workouts > 0;
  const delta = (a,b)=>{
    if (!started || !b) return "";
    const pct = Math.round((a-b)/b*100);
    if (!isFinite(pct) || pct===0) return `<span class="dl flat">even</span>`;
    return `<span class="dl ${pct>0?"up":"down"}">${pct>0?"▲":"▼"}${Math.abs(pct)}%</span>`;
  };

  const groups = groupVolumes();
  const gMax = Math.max(1, ...Object.values(groups));
  const gRows = Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`
    <div class="bal-row">
      <div class="bal-top"><span>${esc(g)}</span><b>${fmtVolume(v)}</b></div>
      <div class="bal-bar"><span style="width:${Math.round(v/gMax*100)}%"></span></div>
    </div>`).join("");

  view.innerHTML = `
    <div class="today-hero"><div class="k">Your progress</div><div class="v">Statistics</div></div>

    <div class="week-card">
      <div class="week-head">This week <span>${wk.start.toLocaleDateString(undefined,{day:"numeric",month:"short"})} –</span></div>
      <div class="week-grid">
        <div><div class="n">${wk.workouts}</div><div class="l">workouts</div><div class="d">${delta(wk.workouts,lastWk.workouts)}</div></div>
        <div><div class="n">${wk.sets}</div><div class="l">sets</div><div class="d">${delta(wk.sets,lastWk.sets)}</div></div>
        <div><div class="n">${fmtVolume(wk.volume)}</div><div class="l">volume</div><div class="d">${delta(wk.volume,lastWk.volume)}</div></div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat accent"><div class="n">${streaks.current}<small> 🔥</small></div><div class="l">Current streak</div></div>
      <div class="stat"><div class="n">${streaks.longest}</div><div class="l">Longest streak</div></div>
      <div class="stat"><div class="n">${totalWorkouts}</div><div class="l">Workouts completed</div></div>
      <div class="stat"><div class="n">${doneSets}</div><div class="l">Total sets</div></div>
      <div class="stat"><div class="n">${rate}<small>%</small></div><div class="l">Completion rate</div></div>
      <div class="stat"><div class="n">${fmtVolume(totalVol)}</div><div class="l">Total volume</div></div>
    </div>

    ${gRows ? `<div class="section-title">Muscle group balance</div><div class="bal-card">${gRows}</div>` : ""}

    <div class="section-title">Personal Records <span class="hint-inline">by est. 1RM</span></div>
    <div id="prList"></div>`;

  const host = $("#prList");
  if (!prList.length){
    host.innerHTML = `<div class="empty"><span class="em">🏆</span>Log some weighted sets to start setting records.</div>`;
    return;
  }
  prList.forEach(([name, r])=>{
    const row = document.createElement("button");
    row.className = "pr-row";
    row.innerHTML = `<div><div class="nm">${esc(name)}</div>

      <div class="val">${toDisplay(r.e1rm||r.kg)}<small> ${unitLabel()}</small></div>`;
    row.onclick = ()=> openExerciseDetail(name);

  });
}

  $("#warmSw").onclick = ()=>{ settings.restAfterWarmup=!settings.restAfterWarmup; saveSettings(); renderSettings(); };
  // Units
  $("#unitSeg").querySelectorAll("button").forEach(b=> b.onclick=()=>{ settings.units=b.dataset.u; saveSettings(); renderSettings(); if(activeTab==="today")renderToday(); });
  // Bodyweight (steps in display unit)
  $("#bwDown").onclick = ()=>{ settings.bodyKg=Math.max(30, +(settings.bodyKg - (settings.units==="kg"?1:KG_PER_LB)).toFixed(3)); saveSettings(); renderSettings(); };
  $("#bwUp").onclick   = ()=>{ settings.bodyKg=Math.min(250, +(settings.bodyKg + (settings.units==="kg"?1:KG_PER_LB)).toFixed(3)); saveSettings(); renderSettings(); };
  // Accent
  $("#swatches").querySelectorAll(".swatch").forEach(b=> b.onclick=()=>{ settings.accent=b.dataset.acc; saveSettings(); applyTheme(); renderSettings(); });
  // Switches
  $("#amoledSw").onclick = ()=>{ settings.amoled=!settings.amoled; saveSettings(); applyTheme(); renderSettings(); };
  $("#soundSw").onclick  = ()=>{ settings.sound=!settings.sound; saveSettings(); renderSettings(); if(settings.sound) beep(); };
  $("#vibSw").onclick    = ()=>{ settings.vibrate=!settings.vibrate; saveSettings(); renderSettings(); if(settings.vibrate&&navigator.vibrate)navigator.vibrate(40); };
  $("#remSw").onclick    = toggleReminders;
  // Data
  $("#exportRow").onclick = exportData;
  $("#csvRow").onclick = exportCSV;
  $("#importRow").onclick = ()=> $("#importFile").click();
  $("#importFile").onchange = importData;
  $("#resetRow").onclick = ()=>{
    openSheet(`<h3 class="sh-title">Reset everything?</h3><p class="sh-sub">This permanently deletes your workout history and settings on this device.</p>
      <button class="btn" style="background:var(--danger);border-color:var(--danger);color:#fff;margin-bottom:10px" id="resetYes">Delete all data</button>
      <button class="btn ghost" id="resetNo">Cancel</button>`);
    $("#resetYes").onclick = ()=>{ hideRest(); localStorage.removeItem(K_HIST); localStorage.removeItem(K_CUR); localStorage.removeItem(K_SET); localStorage.removeItem(K_TIMER);
      settings=Object.assign({},DEFAULT_SETTINGS); history={}; current=null; applyTheme(); closeSheet(); go("today"); toast("All data cleared"); };
    $("#resetNo").onclick = closeSheet;
  };
}

async function toggleReminders(){
  if (settings.reminders){ settings.reminders=false; saveSettings(); renderSettings(); return; }
  if (!("Notification" in window)){ toast("Notifications not supported"); return; }
  let perm = Notification.permission;
  if (perm==="default") perm = await Notification.requestPermission();
  if (perm!=="granted"){ toast("Notification permission denied"); renderSettings(); return; }
  settings.reminders = true; saveSettings(); renderSettings();
  scheduleReminder();
  const type = todayType();
  new Notification("IronLog", { body: type==="Rest" ? "Rest day — recovery is part of progress. 💪" : `Today is ${type} day. Let's train. 💪`, icon:"icon-192.png" });
}
let reminderTimer = null;
function scheduleReminder(){
  // Best-effort: fires at ~09:00 while the app/tab stays alive.
  clearTimeout(reminderTimer);
  if (!settings.reminders || Notification.permission!=="granted") return;
  const now = new Date();
  const next = new Date(); next.setHours(9,0,0,0);
  if (next <= now) next.setDate(next.getDate()+1);
  reminderTimer = setTimeout(()=>{
    const type = todayType();
    try{ new Notification("IronLog", { body: type==="Rest"?"Rest day — recover well. 💪":`Today is ${type} day. Time to train. 💪`, icon:"icon-192.png" }); }catch(e){}
    scheduleReminder();
  }, Math.min(next-now, 2147483000));
}

function exportData(){
  const blob = new Blob([JSON.stringify({ settings, history, exportedAt:new Date().toISOString() }, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ironlog-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast("Backup exported");
}
// One row per set, so the log opens cleanly in Sheets/Excel.
function exportCSV(){
  const esc = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows = [["date","workout","group","exercise","set","kind","weight_kg","reps","volume_kg","completed","note"]];
  Object.values(history).sort((a,b)=> a.date<b.date?-1:1).forEach(w=>{
    w.exercises.forEach(ex=>{
      let n=0;
      ex.sets.forEach(s=>{
        if (s.kind==="working") n++;
        rows.push([ w.date, w.type, ex.group, ex.name, s.kind==="working"?n:0, s.kind,
                    s.weightKg==null?"":s.weightKg, s.reps==null?"":s.reps,
                    (s.done && s.weightKg!=null && s.reps) ? s.weightKg*s.reps : 0,
                    s.done?"yes":"no", s.note||"" ]);
      });
    });
  });
  const csv = rows.map(r=>r.map(esc).join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ironlog-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast(rows.length>1 ? "CSV exported" : "Nothing logged yet");
}

function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if (data.history) history = data.history;
      if (data.settings) settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
      saveHistory(); saveSettings();
      current = history[todayISO()] || null; saveCurrent();
      applyTheme(); toast("Backup imported"); go("today");
    }catch(err){ toast("Could not read that file"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ============================================================
   THEME / NAV / SHELL
   ============================================================ */
function applyTheme(){
  const acc = ACCENTS[settings.accent] || ACCENTS.green;
  const r = document.documentElement;
  r.style.setProperty("--accent", acc.a);
  r.style.setProperty("--accent-dim", acc.d);
  r.style.setProperty("--accent-ghost", acc.g);
  r.setAttribute("data-amoled", settings.amoled ? "1" : "0");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", settings.amoled ? "#000000" : "#0a0b0f");
}

function go(tab){
  activeTab = tab;
  document.querySelectorAll(".view").forEach(v=> v.hidden = true);
  $("#view-"+tab).hidden = false;
  document.querySelectorAll(".nav button").forEach(b=> b.classList.toggle("active", b.dataset.tab===tab));
  window.scrollTo(0,0);
  if (tab==="today") renderToday();
  else if (tab==="history") renderHistory();
  else if (tab==="stats") renderStats();
  else if (tab==="settings") renderSettings();
}
document.querySelectorAll(".nav button").forEach(b=> b.onclick = ()=> go(b.dataset.tab));

/* Sheet / overlay */
function openSheet(html, big){
  $("#sheet").innerHTML = html;
  $("#sheet").style.maxHeight = big ? "88vh" : "";
  $("#overlay").classList.add("show");
}
function closeSheet(){ $("#overlay").classList.remove("show"); }
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeSheet(); });

/* Toast */
let toastTimer=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 2000);
}

/* Header date */
function renderHeader(){
  const now = new Date();
  $("#topDay").textContent = DAYS[now.getDay()];
  $("#topDate").textContent = now.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

/* ---------- Boot ---------- */
function boot(){
  applyTheme();
  renderHeader();
  // If a stored "current" is stale (different day), drop it so today rebuilds.
  if (current && current.date !== todayISO()) current = null;
  go("today");
  restoreTimer();
  if (settings.reminders) scheduleReminder();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
}
boot();
</script>
